name: Mac uygulaması

# mac-app/ değişince Mac uygulamasını (Apple Silicon + Intel, tek paket) derler ve
# GitHub Releases'a "mac-vN" olarak koyar: GunTeknik-Mac.dmg (kurulum) + GunTeknik-Mac.app.tar.gz (kendi kendine güncelleme).
# Masaüstü araçları (mac-app/widget, WidgetKit) xcodegen + xcodebuild ile derlenir, .app/Contents/PlugIns içine konur.
# "latest" işaretlenmez; Android uygulamasının güncelleme denetimi (releases/latest) etkilenmez.
# Elle çalıştırmak için: Actions → Mac uygulaması → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'mac-app/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:
    inputs:
      notlar:
        description: 'Sürüm notu (isteğe bağlı)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: false

jobs:
  derle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust (Apple Silicon + Intel)
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac-app/src-tauri

      - name: Bağımlılıklar ve simgeler
        working-directory: mac-app
        run: |
          npm install --no-audit --no-fund
          npx tauri icon ../icon-1024.png -o src-tauri/icons

      - name: Sürüm numarası
        working-directory: mac-app/src-tauri
        run: |
          node -e "const f='tauri.conf.json';const j=require('./'+f);j.version='1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2));"
          sed -i '' -E 's/^version = "1\.0\.0"/version = "1.0.${{ github.run_number }}"/' Cargo.toml

      - name: Masaüstü araçlarını derle (WidgetKit)
        working-directory: mac-app/widget
        run: |
          # xcodegen yeni (Xcode 16) proje biçimi üretiyor; en yeni Xcode 16'yı seç
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          sed -i '' -E 's/MARKETING_VERSION: "1\.0\.0"/MARKETING_VERSION: "1.0.${{ github.run_number }}"/; s/CURRENT_PROJECT_VERSION: "1"/CURRENT_PROJECT_VERSION: "${{ github.run_number }}"/' project.yml
          xcodegen generate --spec project.yml
          xcodebuild build -project GunTeknikWidget.xcodeproj -target GunTeknikWidget -configuration Release \
            SYMROOT="$PWD/build" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO > xb.log 2>&1 \
            || { grep -E "error:" xb.log | head -60; tail -40 xb.log; exit 1; }
          grep -E "warning:" xb.log | grep -v "xcodebuild" | head -30 || true
          tail -5 xb.log
          ls -la build/Release/GunTeknikWidget.appex/Contents/MacOS
          lipo -info build/Release/GunTeknikWidget.appex/Contents/MacOS/GunTeknikWidget

      - name: Derle
        working-directory: mac-app
        run: |
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          npx tauri build --target universal-apple-darwin

      - name: Araçları pakete koy ve imzala
        run: |
          APP="mac-app/src-tauri/target/universal-apple-darwin/release/bundle/macos/GunTeknik.app"
          mkdir -p "$APP/Contents/PlugIns"
          rm -rf "$APP/Contents/PlugIns/GunTeknikWidget.appex"
          cp -R mac-app/widget/build/Release/GunTeknikWidget.appex "$APP/Contents/PlugIns/"
          codesign --force --sign - --options runtime --entitlements mac-app/widget/GunTeknikWidget.entitlements "$APP/Contents/PlugIns/GunTeknikWidget.appex"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP/Contents/PlugIns/GunTeknikWidget.appex"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$APP/Contents/Info.plist"

      - name: Paketle
        run: |
          B="mac-app/src-tauri/target/universal-apple-darwin/release/bundle"
          ls -R "$B" | head -40
          APP="$B/macos/GunTeknik.app"
          tar -czf GunTeknik-Mac.app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Gün Teknik" -srcfolder dmg -ov -format UDZO GunTeknik-Mac.dmg
          ls -la GunTeknik-Mac.*

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Gün Teknik Mac 1.0.${{ github.run_number }}
          body: ${{ github.event.inputs.notlar || github.event.head_commit.message || 'Yeni sürüm' }}
          files: |
            GunTeknik-Mac.dmg
            GunTeknik-Mac.app.tar.gz
          make_latest: false
