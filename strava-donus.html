<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gün Teknik · Strava bağlantısı</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e0e;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box;}
  .k{max-width:420px;width:100%;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:16px;padding:26px 22px;text-align:center;}
  .s{font-size:44px;margin-bottom:8px;}
  h1{font-size:19px;margin:6px 0 10px;}
  p{color:#b0b0b0;font-size:14px;line-height:1.5;margin:6px 0;}
  .u{color:#FFAB00;}
  .p{margin-top:16px;font-size:11px;color:#FC4C02;font-weight:600;}
</style>
</head>
<body>
<div class="k"><div class="s" id="s">⏳</div><h1 id="b">Strava bağlanıyor…</h1><p id="m">Lütfen bekle.</p><div class="p">Powered by Strava</div></div>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const yaz=(s,b,m,u)=>{document.getElementById('s').textContent=s;document.getElementById('b').textContent=b;document.getElementById('m').innerHTML=m+(u?'<br><span class="u">'+u+'</span>':'');};
  if(q.get('error')){yaz('⚠️','Bağlantı yapılmadı','Strava izni verilmedi ('+q.get('error')+'). Sağlık sayfasından yeniden deneyebilirsin.');return;}
  const kod=q.get('code'),durum=q.get('state'),kapsam=q.get('scope')||'';
  if(!kod||!durum){yaz('⚠️','Eksik bilgi','Bu sayfayı Sağlık sayfasındaki "Strava\'ya bağlan" düğmesiyle aç.');return;}
  history.replaceState(null,'',location.pathname);
  try{
    const r=await fetch('https://zfflnrerdevnflchscqe.supabase.co/functions/v1/strava',{method:'POST',headers:{'Content-Type':'application/json','apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZmxucmVyZGV2bmZsY2hzY3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzQ3MjUsImV4cCI6MjA5NjQxMDcyNX0.uby8MidaKpnsceel5E_zTJm3LTYwoMrbKUryr5ZszcI'},body:JSON.stringify({islem:'kod',kod,durum,kapsam})});
    const j=await r.json().catch(()=>({}));
    if(j.ok){const n=j.sonuc&&j.sonuc.toplam;yaz('✅','Strava bağlandı',(j.ad?'<b>'+String(j.ad).replace(/[<>&"']/g,'')+'</b> ':'')+'Sağlık sayfasına bağlandı'+(n!=null?'; son 90 günden '+n+' aktivite alındı':'')+'. Yeni aktiviteler kendiliğinden gelecek.<br><br>Bu pencereyi kapatıp uygulamaya dönebilirsin.');}
    else yaz('⚠️','Bağlantı tamamlanamadı',(j.mesaj||j.hata||('HTTP '+r.status)));
  }catch(e){yaz('⚠️','Bağlantı hatası',String(e.message||e));}
})();
</script>
</body>
</html>
