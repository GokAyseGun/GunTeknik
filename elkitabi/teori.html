konu({id:'neden_3faz', kat:'ucfaz', ikon:'🔺', sv:1, ad:'Neden Üç Faz?', ozet:'Aynı bakırla daha çok güç, motorlar için döner alan, sürekli güç akışı.', etiket:['üç faz','trifaze','3 faz','l1 l2 l3','monofaze','neden üç faz'],
  tanim:'<p>Üç fazlı sistemde üç ayrı sinüs gerilimi, aralarında 120° (6,67 ms) fark olacak şekilde gelir: L1, L2, L3. Bu dizilimin üç büyük avantajı vardır:</p><ul><li><b>Daha az bakırla daha çok güç</b> taşınır.</li><li>Üç faz bir motorda kendiliğinden <b>döner manyetik alan</b> oluşturur: üç fazlı motor kondansatörsüz kalkar, sade ve sağlamdır.</li><li>Toplam güç her an sabittir; tek fazdaki gibi 100 kez sıfıra inip çıkmaz, motorlar daha sessiz ve titreşimsiz çalışır.</li></ul><p>Konutlar genellikle bir fazdan beslenir; yönetmeliğe göre tek faz bağlantı gücü 5 kW ile sınırlıdır, üstü üç faz bağlanır.</p>',
  cizim:'ucfaz',
  uygulama:['Apartman binası üç faz alır; daireler fazlara dengeli dağıtılır.','Hidrofor, asansör, büyük klima, ocak gibi cihazlar üç faz çalışabilir.','Atölye ve sanayide motorların neredeyse tamamı üç fazlıdır.'],
  ilgili:['faz_hat','uc_faz_guc','faz_sirasi_teori','yonetmelik_maddeler']
});
konu({id:'faz_hat', kat:'ucfaz', ikon:'📏', sv:1, ad:'Faz ve Hat Gerilimi (230 / 400 V, √3)', ozet:'Faz–nötr 230 V, faz–faz 400 V. Aradaki çarpan √3 ≈ 1,73.', etiket:['230 400','√3','kök 3','faz gerilimi','hat gerilimi','fazlar arası','1.73'],
  tanim:'<p>Üç fazlı alçak gerilim şebekesinde iki gerilim vardır:</p><ul><li><b>Faz gerilimi</b> (U<sub>f</sub>): faz ile nötr arası, <b>230 V</b>.</li><li><b>Hat gerilimi</b> (U<sub>h</sub>): iki faz arası, <b>400 V</b>.</li></ul><p>İki faz arasındaki gerilim 230 + 230 = 460 V değildir, çünkü fazlar aynı anda tepe yapmaz (120° kayıktır). Vektörel fark 230 × √3 ≈ 400 V’tur.</p>',
  cizim:'ucfaz',
  formul:[['U<sub>h</sub> = √3 × U<sub>f</sub>', '400 = 1,732 × 230'], ['U<sub>f</sub> = U<sub>h</sub> / √3', '230 = 400 / 1,732']],
  uygulama:['Ölçüm: L1–N 230 V, L1–L2 400 V, L1–L2–L3 arası üçü de ≈ 400 V olmalı.','230 V’luk bir cihaz iki faz arasına bağlanırsa 400 V alır ve yanar.','Eski şebekelerde 220/380 V anılır; 2000’lerden beri anma değeri 230/400 V’tur.'],
  dikkat:['Nötr koparsa faz–nötr cihazlar 230 V yerine 400 V’a kadar gerilim görebilir (bkz. Nötr kopması).'],
  ilgili:['yildiz_ucgen_iliski','notr_kopmasi']
});
konu({id:'yildiz_ucgen_iliski', kat:'ucfaz', ikon:'⭐', sv:2, ad:'Yıldız (Y) ve Üçgen (Δ) Bağlantı', ozet:'Yıldızda sargıya 230 V, üçgende 400 V düşer. Akım ilişkileri ve motor bağlantısı.', etiket:['yıldız','üçgen','y','delta','δ','motor bağlantısı','sargı gerilimi','hat akımı'],
  tanim:'<p><b>Yıldız (Y)</b>: üç sargının birer ucu ortak bir noktada (yıldız noktası) birleşir, diğer uçlar fazlara gider. Her sargıya <b>faz gerilimi</b> (230 V) düşer; hat akımı sargı akımına eşittir. Yıldız noktası nötr olarak dışarı alınabilir.</p><p><b>Üçgen (Δ)</b>: sargılar uç uca bağlanıp kapalı bir üçgen oluşturur; köşeler fazlara gider. Her sargıya <b>hat gerilimi</b> (400 V) düşer; hat akımı sargı akımının √3 katıdır. Nötr yoktur.</p><p>Aynı motor üçgende yıldıza göre 3 kat güç (ve akım) çeker. Yıldız-üçgen yol vermenin mantığı budur.</p>',
  cizim:'yd',
  formul:[['Y: U<sub>sargı</sub> = U<sub>h</sub> / √3 · I<sub>h</sub> = I<sub>sargı</sub>', 'Yıldız'], ['Δ: U<sub>sargı</sub> = U<sub>h</sub> · I<sub>h</sub> = √3 × I<sub>sargı</sub>', 'Üçgen'], ['P<sub>Δ</sub> = 3 × P<sub>Y</sub>', 'Aynı sargılar için']],
  uygulama:['Motor etiketi 230/400 V Δ/Y ise 400 V şebekede yıldız bağlanır.','Etiket 400/690 V Δ/Y ise 400 V şebekede üçgen bağlanır ve yıldız-üçgen yol verilebilir.','Dağıtım trafolarının sekonderi yıldızdır ve yıldız noktası topraklanarak nötr elde edilir.'],
  ornek:{s:'Üç adet 230 V / 2 kW ısıtıcı 400 V üç faz şebekeye nasıl bağlanır?', a:['Her ısıtıcının 230 V görmesi gerekir.','Yıldız bağlanırsa her biri L–N arasına gelir: 230 V ✓','Üçgen bağlanırsa her biri 400 V görür ve yanar ✗'], c:'Yıldız (nötrlü) bağlanmalı; toplam 6 kW, faz akımı ≈ 8,7 A.'},
  sema:['yildiz_ucgen','klemens'], ilgili:['faz_hat','yol_verme','motor_etiketi']
});
konu({id:'uc_faz_guc', kat:'ucfaz', ikon:'🧮', sv:1, ad:'Üç Fazlı Güç ve Akım Hesabı', ozet:'P = √3 × U × I × cos φ. Üç faz motorun akımını sahada hızlıca bulmak.', etiket:['üç faz güç','trifaze akım','√3','kw başına amper','motor akımı','400 v akım'],
  tanim:'<p>Dengeli üç fazlı yükte toplam güç, hat gerilimi (400 V) ve hat akımı ile hesaplanır. Formüldeki √3, fazlar arası ilişkiden gelir.</p><p><b>Pratik kural</b>: 400 V’ta üç fazlı motor kW başına yaklaşık <b>2 A</b> çeker (cos φ ≈ 0,85, verim ≈ %87). Isıtıcıda (cos φ = 1) kW başına ≈ 1,45 A.</p>',
  formul:[['P = √3 × U<sub>h</sub> × I × cos φ', 'U<sub>h</sub> = 400 V'], ['I = P / (√3 × U<sub>h</sub> × cos φ × η)', 'Motor için: P etiketteki mil gücü, η verim'], ['P = 3 × U<sub>f</sub> × I × cos φ', 'Faz gerilimiyle aynı sonuç (3 × 230 = √3 × 400)']],
  dene:{g:[['P', 'Güç', 'kW', 7.5], ['c', 'cos φ', '', 0.85], ['n', 'Verim (ısıtıcıda 1)', '', 0.88]], h:v => { const I = v.P * 1000 / (Math.sqrt(3) * 400 * v.c * v.n); return [['Hat akımı', f(I, 1) + ' A', 'v'], ['kW başına', f(I / v.P, 2) + ' A/kW'], ['Görünür güç', f(Math.sqrt(3) * 400 * I / 1000, 2) + ' kVA']]; }},
  uygulama:['Motor koruma şalteri ve termik etiket akımına göre ayarlanır, hesapla bulduğun değer kontrol içindir.','Üç fazlı ısıtıcıda her fazdan aynı akım geçer; pensle üç fazı ölçüp karşılaştır.'],
  ornek:{s:'11 kW, cos φ 0,86, verim %90 motorun akımı?', a:['I = 11000 / (1,732 × 400 × 0,86 × 0,90)','I = 11000 / 536 = 20,5 A'], c:'≈ 20,5 A (etiketle karşılaştır).'},
  hesap:['motor','guc'], ilgili:['faz_hat','motor_etiketi','dengesiz_yuk']
});
konu({id:'dengesiz_yuk', kat:'ucfaz', ikon:'⚖️', sv:2, ad:'Dengesiz Yük ve Nötr Akımı', ozet:'Fazlar eşit yüklenmezse nötrden akım geçer. Daireler fazlara dengeli dağıtılmalı.', etiket:['dengesiz yük','nötr akımı','faz dengesi','yük dağıtımı','asimetri'],
  tanim:'<p>Üç fazlı sistemde fazlar <b>eşit yüklenirse</b> nötr akımı sıfırdır (akımlar 120° kayık olduğu için toplamları sıfırdır). Fazlar farklı yüklenirse aradaki fark nötrden döner.</p><p>Örneğin L1’de 20 A, L2 ve L3’te 0 A varsa nötrden 20 A geçer. L1 20 A, L2 20 A, L3 0 A ise nötr akımı yine 20 A’dir (25 A değil): vektörel toplam.</p>',
  formul:[['I<sub>N</sub> = √(I₁² + I₂² + I₃² − I₁I₂ − I₂I₃ − I₃I₁)', 'Omik yükler için nötr akımı']],
  dene:{g:[['a', 'L1 akımı', 'A', 20], ['b', 'L2 akımı', 'A', 12], ['c', 'L3 akımı', 'A', 5]], h:v => { const In = Math.sqrt(Math.max(0, v.a * v.a + v.b * v.b + v.c * v.c - v.a * v.b - v.b * v.c - v.c * v.a)), m = Math.max(v.a, v.b, v.c), o = (v.a + v.b + v.c) / 3; return [['Nötr akımı', f(In, 1) + ' A', 'v'], ['Dengesizlik', '%' + f(o ? (m - o) / o * 100 : 0, 0)]]; }},
  uygulama:['Apartman panosunda daireleri L1–L2–L3’e sırayla dağıt.','Pens ile her fazı ölçüp en yüklü fazdaki büyük cihazı başka faza al.','Harmonikli yüklerde (LED, bilgisayar) nötr akımı dengeli yükte bile yüksek olabilir.'],
  ilgili:['notr_kopmasi','harmonik','esz_talep']
});
konu({id:'notr_kopmasi', kat:'ucfaz', ikon:'✂️', sv:2, ad:'Nötr Kopması — Evde 400 V Tehlikesi', ozet:'Üç fazlı beslemede nötr koparsa az yüklü fazdaki cihazlar yanar. Arızanın mantığı ve belirtileri.', etiket:['nötr kopması','nötr kaçağı','400 v','cihaz yanması','yüksek gerilim','yıldız noktası kayması'],
  tanim:'<p>Üç fazlı beslenen bir binada ortak nötr koparsa, fazlara bağlı yükler artık nötre değil <b>birbirine seri</b> bağlı kalır. Yıldız noktası “kayar”: <b>az yüklü fazdaki</b> cihazlar 230 V yerine 300–400 V görür ve yanar, <b>çok yüklü fazdakiler</b> düşük gerilimde kalır (lambalar sönük, buzdolabı çalışmaz).</p><p>Tipik belirti: bir dairede lambalar aşırı parlak ve cihazlar yanıyor, diğer dairede lambalar sönük. Gevşek nötr klemensinde de benzer dalgalanmalar görülür.</p>',
  cizim:'notr',
  uygulama:['Kofre ve ana pano nötr bağlantılarını periyodik olarak sık ve termal kamerayla kontrol et.','Nötre asla sigorta konmaz; ana şalterlerde nötr fazlarla birlikte (dört kutuplu) açılır.','Gerilim koruma rölesi (aşırı/düşük gerilim) cihazları bu arızaya karşı korur.'],
  ornek:{s:'Ölçümde L1–N 340 V, L2–N 120 V, L3–N 260 V görüyorsun. Sebep?', a:['Faz–faz gerilimleri (400 V) normal mi? Evet ise fazlar sağlam.','Faz–nötr gerilimleri dengesiz ve toplamı mantıksız: nötr bağlantısı yok veya çok yüksek dirençli.'], c:'Nötr kopuk/gevşek: hemen enerjiyi kes, nötrü kofreden itibaren takip et.'},
  dikkat:['Nötr kopmasında N iletkeni de tehlikeli gerilim taşıyabilir: “nötr = güvenli” varsayma.','TN-C-S sistemde PEN kopması, tüm topraklı gövdelere gerilim taşır.'],
  sema:['gerilim_koruma','pano_3f'], ilgili:['dengesiz_yuk','faz_hat','sistem_turleri']
});
konu({id:'faz_sirasi_teori', kat:'ucfaz', ikon:'🔁', sv:2, ad:'Faz Sırası ve Döner Alan', ozet:'L1-L2-L3 sırası motorun dönüş yönünü belirler; iki faz yer değiştirince yön döner.', etiket:['faz sırası','döner alan','sağ dönüş','motor yönü','faz sırası rölesi'],
  tanim:'<p>Üç faz, şebekede belli bir sırayla tepe yapar: L1 → L2 → L3. Bu sıra, üç fazlı motorun sargılarında dönen bir manyetik alan oluşturur. Motorun rotoru bu alanı takip eder.</p><p><b>Herhangi iki faz</b> yer değiştirilirse sıra L1 → L3 → L2 olur ve alan (dolayısıyla motor) ters döner. Üç fazı birden kaydırmak (L1→L2, L2→L3, L3→L1) sırayı değiştirmez.</p>',
  cizim:'ucfaz',
  uygulama:['Pompa, kompresör ve fanlarda ters dönüş hasar verir: ilk çalıştırmada yön kontrol edilir.','Seyyar trifaze prizlerde (CEE) faz sırası prizden prize değişebilir; makine fişinde faz değiştirici olabilir.','Kritik makinelerde faz sırası/faz kaybı rölesi konur.'],
  sema:['faz_sirasi','ileri_geri','faz_kontrol'], ilgili:['asenkron_motor','neden_3faz']
});

const IZ_TABLO = '<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kesit (mm²)</th><th>B2 · 2 yüklü</th><th>B2 · 3 yüklü</th><th>C · 2 yüklü</th><th>Tipik sigorta (konut)</th></tr>' +
  [['1,5', 16.5, 15, 19.5, 'B10 (aydınlatma)'], ['2,5', 23, 20, 27, 'B16 (priz)'], ['4', 30, 27, 36, 'B20–B25'], ['6', 38, 34, 46, 'B25–B32'], ['10', 52, 46, 63, '40 A'], ['16', 69, 62, 85, '50–63 A'], ['25', 90, 80, 112, '63–80 A'], ['35', 111, 99, 138, '80–100 A']].map(r => `<tr><td>${r[0]}</td><td>${f(r[1], 1)} A</td><td>${r[2]} A</td><td>${f(r[3], 1)} A</td><td>${r[4]}</td></tr>`).join('') +
  '</table></div><div class="ek-not">IEC 60364-5-52 · bakır, PVC yalıtım, 30 °C ortam. B2: boru/kanal içinde çok damarlı kablo (NYM), C: duvara kroşeli. “2 yüklü” tek faz (L+N), “3 yüklü” üç faz.</div>';
konu({id:'kablo_kapasite', kat:'tesisat', ikon:'📏', sv:1, ad:'Kablo Akım Taşıma Kapasitesi', ozet:'Bir kablo ne kadar akım taşır? Döşeme şekli, sıcaklık ve yan yana kablo sayısı belirler.', etiket:['akım taşıma','iz','kablo kesiti','düzeltme katsayısı','gruplama','ortam sıcaklığı','kesit tablosu','mm2 amper'],
  tanim:'<p>Kablonun taşıyabileceği akım (I<sub>z</sub>), kablonun ısınıp izolasyonun bozulmadan dayanabileceği sıcaklığa (PVC için 70 °C) göre belirlenir. Aynı kablo havada daha iyi soğur, boru içinde ve ısı yalıtımlı duvarda daha az soğur.</p><p>Tablodaki değer şu durumlarda <b>düzeltme katsayılarıyla</b> azaltılır:</p><ul><li><b>Ortam sıcaklığı</b> 30 °C’nin üzerindeyse (çatı arası, kazan dairesi).</li><li><b>Gruplama</b>: aynı boru/kanalda birden fazla yüklü devre varsa birbirlerini ısıtırlar.</li></ul>',
  ek:IZ_TABLO + '<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Ortam °C (PVC)</th><th>30</th><th>35</th><th>40</th><th>45</th><th>50</th></tr><tr><td>Katsayı</td><td>1,00</td><td>0,94</td><td>0,87</td><td>0,79</td><td>0,71</td></tr><tr><th>Aynı kanalda devre</th><th>1</th><th>2</th><th>3</th><th>4</th><th>6</th></tr><tr><td>Katsayı (boru/kanal)</td><td>1,00</td><td>0,80</td><td>0,70</td><td>0,65</td><td>0,57</td></tr></table></div>',
  formul:[['I<sub>z</sub> = I<sub>z0</sub> × k<sub>sıcaklık</sub> × k<sub>grup</sub>', 'Gerçek taşıma kapasitesi']],
  dene:{g:[['S', 'Kesit', '', 2.5, [[1.5, '1,5 mm²'], [2.5, '2,5 mm²'], [4, '4 mm²'], [6, '6 mm²'], [10, '10 mm²'], [16, '16 mm²']]], ['t', 'Ortam sıcaklığı', '°C', 35], ['n', 'Aynı kanalda devre', 'adet', 3]], h:v => { const T = {1.5:16.5, 2.5:23, 4:30, 6:38, 10:52, 16:69}[v.S], kt = v.t <= 30 ? 1 : v.t <= 35 ? 1 - (v.t - 30) / 5 * .06 : v.t <= 40 ? .94 - (v.t - 35) / 5 * .07 : v.t <= 45 ? .87 - (v.t - 40) / 5 * .08 : .79 - Math.min(5, v.t - 45) / 5 * .08, kg = [1, 1, .8, .7, .65, .6, .57, .54, .52, .5][Math.min(9, Math.max(1, Math.round(v.n)))]; const Iz = T * kt * kg; return [['Tablo değeri (B2)', f(T, 1) + ' A'], ['Katsayılar', f(kt, 2) + ' × ' + f(kg, 2)], ['Gerçek I<sub>z</sub>', f(Iz, 1) + ' A', 'v'], ['Uygun en büyük MCB', ([6, 10, 13, 16, 20, 25, 32, 40, 50, 63].filter(x => x <= Iz).pop() || '—') + ' A']]; }},
  uygulama:['Kofreden panoya, panodan linyelere kesit bu tabloyla seçilir; uzun hatlarda ayrıca gerilim düşümüne bakılır.','Bir boruya 4–5 linye doldurmak her birinin kapasitesini %35’e kadar düşürür.','Çatı arasından geçen klima hattında 45–50 °C ortam sıcaklığı hesaba katılmalı.'],
  dikkat:['Kesit sadece akıma göre değil, gerilim düşümü ve kısa devre koşuluna göre de kontrol edilir.','Esnek (TTR) kordonların kapasitesi sabit tesisat kablosundan farklıdır.'],
  hesap:['kablo','kesit'], ilgili:['sigorta_kosulu','gerilim_dusumu','joule','kablo_turleri']
});
konu({id:'gerilim_dusumu', kat:'tesisat', ikon:'📉', sv:2, ad:'Gerilim Düşümü', ozet:'Uzun ve ince kabloda gerilim kaybolur. Sınır: aydınlatma/priz %1,5, motor %3.', etiket:['gerilim düşümü','%1,5','%3','uzun hat','kesit hesabı','k=56'],
  tanim:'<p>Kablonun da direnci olduğu için akım geçerken kablonun kendisinde bir miktar gerilim düşer (Ohm kanunu). Cihaza ulaşan gerilim, panodaki gerilimden bu kadar azdır. Uzun hat + yüksek akım + ince kablo = büyük düşüm.</p><p><b>Elektrik İç Tesisleri Yönetmeliği Madde 57</b>’ye göre yapı bağlantı kutusu ile tüketiciler arasında gerilim düşümü <b>aydınlatma ve priz devreleri için %1,5</b>, <b>motor devreleri için %3</b>’ü geçmemelidir. Yapı kendi trafosundan besleniyorsa trafo çıkışı ile bağlantı kutusu arası için %5 sınırı vardır.</p>',
  formul:[['%e = 200 × P × L / (k × S × U²)', 'Tek faz · P: W · L: m · k: bakır 56, alüminyum 35 · S: mm² · U: 230 V'], ['%e = 100 × P × L / (k × S × U²)', 'Üç faz · U: 400 V'], ['ΔU = 2 × I × L × cos φ / (k × S)', 'Tek faz, volt cinsinden']],
  dene:{g:[['P', 'Yük gücü', 'W', 3000], ['L', 'Hat uzunluğu (tek yön)', 'm', 40], ['S', 'Kesit', 'mm²', 2.5], ['t', 'Sistem', '', 1, [[1, 'Tek faz 230 V'], [3, 'Üç faz 400 V']]], ['k', 'İletken', '', 56, [[56, 'Bakır'], [35, 'Alüminyum']]]], h:v => { const U = v.t === 3 ? 400 : 230, e = (v.t === 3 ? 100 : 200) * v.P * v.L / (v.k * v.S * U * U); return [['Gerilim düşümü', '%' + f(e, 2), 'v'], ['Volt olarak', f(e / 100 * U, 1) + ' V'], ['Aydınlatma/priz (%1,5)', e <= 1.5 ? 'uygun' : 'AŞIYOR', e <= 1.5 ? '' : 'uy'], ['Motor (%3)', e <= 3 ? 'uygun' : 'AŞIYOR', e <= 3 ? '' : 'uy']]; }},
  uygulama:['Bahçe, ahır, depo, kuyu pompası gibi uzak yüklerde genellikle kesiti belirleyen gerilim düşümüdür, akım değil.','Motor kalkışında akım 6–8 kat olduğu için anlık düşüm çok büyük olabilir: motor kalkamaz, kontaktör bırakır.','Düşük gerilim LED şeritlerde (12 V) birkaç metrede belirgin düşüm olur.'],
  ornek:{s:'Ahıra 80 m mesafede 2 kW tek fazlı yük var. 2,5 mm² yeterli mi?', a:['%e = 200 × 2000 × 80 / (56 × 2,5 × 230²)','%e = 32.000.000 / 7.406.000 = %4,3'], c:'Yetersiz. %1,5 için ≈ 8 mm² → 10 mm² seçilir (veya yük motor ise %3 için 6 mm²).'},
  dikkat:['Yönetmelik sınırı toplamdır: kolon hattı + linye düşümleri birlikte değerlendirilir.','Pratik hesaplarda k = 56 (20 °C bakır) kullanılır; sıcak kabloda direnç artar, gerçek düşüm biraz daha fazladır.'],
  hesap:['gd','kablo'], ilgili:['kablo_kapasite','direnc','yonetmelik_maddeler']
});
konu({id:'dongu_empedansi', kat:'tesisat', ikon:'🔁', sv:3, ad:'Kısa Devre Akımı ve Döngü Empedansı (Zs)', ozet:'Arıza anında sigortanın 0,4 saniyede atması için hat empedansı yeterince küçük olmalı.', etiket:['döngü empedansı','zs','kısa devre akımı','0,4 s','açma süresi','otomatik kesme','tn sistemi'],
  tanim:'<p>TN sistemde faz iletkeni gövdeye değdiğinde arıza akımı; trafo sargısı, faz iletkeni ve koruma iletkeni (PE) üzerinden döner. Bu yolun toplam empedansına <b>döngü empedansı</b> (Z<sub>s</sub>) denir.</p><p>Koruma koşulu: arıza akımı, sigortanın <b>manyetik (anlık)</b> açma akımından büyük olmalıdır. Böylece 32 A’e kadar son devrelerde 230 V’ta en geç <b>0,4 saniyede</b> açma sağlanır (HD 60364-4-41). Uzun ve ince hatlarda Z<sub>s</sub> büyür, arıza akımı küçülür ve sigorta atmaz; kablo ısınır, gövde gerilimde kalır.</p>',
  formul:[['Z<sub>s</sub> × I<sub>a</sub> ≤ U<sub>0</sub>', 'U<sub>0</sub> = 230 V · I<sub>a</sub>: 0,4 s’de açtıran akım'], ['I<sub>a</sub>: B = 5 × I<sub>n</sub> · C = 10 × I<sub>n</sub> · D = 20 × I<sub>n</sub>', 'MCB anlık açma akımları (üst sınırlar)'], ['Z<sub>s,maks</sub> = 230 / I<sub>a</sub>', 'Örn. B16: 230 / 80 = 2,87 Ω · C16: 1,44 Ω']],
  dene:{g:[['In', 'Sigorta', 'A', 16], ['e', 'Eğri', '', 5, [[5, 'B'], [10, 'C'], [20, 'D']]], ['Zs', 'Ölçülen Zs', 'Ω', 1.2]], h:v => { const Ia = v.e * v.In, zm = 230 / Ia, Ik = 230 / v.Zs; return [['Gereken I<sub>a</sub>', f(Ia, 0) + ' A'], ['Z<sub>s</sub> sınırı', f(zm, 2) + ' Ω (pratikte ×0,8 = ' + f(zm * .8, 2) + ')'], ['Arıza akımı', f(Ik, 0) + ' A', 'v'], ['Sonuç', Ik >= Ia ? 'anlık açar ✓' : 'AÇMAZ — KAR veya kesit gerekli', Ik >= Ia ? '' : 'uy']]; }},
  uygulama:['Tesisat muayenesinde döngü empedansı ölçer ile her priz/son noktada Z<sub>s</sub> ölçülür.','Koşul sağlanmıyorsa: kesit büyütülür, sigorta küçültülür/B eğrisi seçilir veya 30 mA KAR ile koruma sağlanır.','TT sistemde Z<sub>s</sub> büyük olduğundan koruma KAR ile yapılır.'],
  ornek:{s:'C16 sigortalı, 60 m uzaklıktaki bir atölye prizinde Z<sub>s</sub> = 1,9 Ω ölçüldü. Uygun mu?', a:['C16 için I<sub>a</sub> = 160 A → Z<sub>s,maks</sub> = 1,44 Ω','Arıza akımı = 230 / 1,9 = 121 A < 160 A'], c:'Uygun değil: B16’ya geç (sınır 2,87 Ω) veya 30 mA KAR ekle.'},
  dikkat:['Kısa devre akımının çok büyük olması da sorundur: sigortanın kesme kapasitesi (6 kA, 10 kA) aşılmamalı.'],
  hesap:['kisadevre','kablo'], ilgili:['mcb_egri','kisa_devre','sistem_turleri','sigorta_kosulu']
});
konu({id:'sigorta_kosulu', kat:'tesisat', ikon:'🧷', sv:2, ad:'Sigorta–Kablo Uyumu (I<sub>b</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub>)', ozet:'Sigorta kabloyu korur, cihazı değil. Yük akımı, sigorta ve kablo kapasitesi arasındaki altın kural.', etiket:['ib in iz','sigorta seçimi','kablo koruma','1,45','aşırı yük koruması'],
  tanim:'<p>Sigortanın asıl görevi <b>kabloyu korumaktır</b>. Doğru seçim için üç akım sıralanır:</p><ul><li><b>I<sub>b</sub></b>: devrenin çektiği (hesap) akım,</li><li><b>I<sub>n</sub></b>: sigortanın anma akımı,</li><li><b>I<sub>z</sub></b>: kablonun (düzeltilmiş) taşıma kapasitesi.</li></ul><p>Kural: <b>I<sub>b</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub></b>. Ek koşul: sigortanın 1 saatte kesin açtığı akım I<sub>2</sub> ≤ 1,45 × I<sub>z</sub> olmalıdır; MCB’lerde I<sub>2</sub> = 1,45 × I<sub>n</sub> olduğu için I<sub>n</sub> ≤ I<sub>z</sub> yeterlidir.</p>',
  formul:[['I<sub>b</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub>', 'Aşırı yük koruması'], ['I<sub>2</sub> ≤ 1,45 × I<sub>z</sub>', 'gG buşon sigortalarda I<sub>2</sub> ≈ 1,6 × I<sub>n</sub>; bu yüzden buşonda I<sub>n</sub> ≤ 0,9 × I<sub>z</sub> alınır']],
  dene:{g:[['Ib', 'Yük akımı', 'A', 13], ['In', 'Sigorta', 'A', 16], ['Iz', 'Kablo kapasitesi (düzeltilmiş)', 'A', 20]], h:v => [['I<sub>b</sub> ≤ I<sub>n</sub>', v.Ib <= v.In ? '✓' : '✗ sigorta yükü taşımaz', v.Ib <= v.In ? '' : 'uy'], ['I<sub>n</sub> ≤ I<sub>z</sub>', v.In <= v.Iz ? '✓' : '✗ KABLO KORUNMUYOR', v.In <= v.Iz ? '' : 'uy'], ['Sonuç', v.Ib <= v.In && v.In <= v.Iz ? 'Uygun' : 'Uygun değil', 'v']]},
  uygulama:['2,5 mm² priz linyesine 25 A sigorta takmak: cihaz çalışır ama kablo 25 A’de aşırı ısınır, sigorta atmaz.','Sigorta sürekli atıyorsa çözüm büyük sigorta değil; yükü bölmek veya kesiti büyütmektir.'],
  ornek:{s:'Mutfakta 2,5 mm² NYM (B2, 3 devre aynı kanalda → I<sub>z</sub> ≈ 16 A). Fırın 2,8 kW (I<sub>b</sub> = 12,2 A). Hangi sigorta?', a:['I<sub>b</sub> = 12,2 A ≤ I<sub>n</sub>','I<sub>n</sub> ≤ I<sub>z</sub> = 16 A'], c:'B16 uygun (16 ≤ 16). B20 olmaz.'},
  hesap:['kablo','kesit'], ilgili:['kablo_kapasite','mcb_egri','selektivite']
});
konu({id:'selektivite', kat:'tesisat', ikon:'🪜', sv:3, ad:'Seçicilik (Selektivite)', ozet:'Arızada sadece arızalı devrenin sigortası atmalı, ana şalter değil.', etiket:['selektivite','seçicilik','kademelendirme','ana şalter','s tipi kar','ardışık koruma'],
  tanim:'<p><b>Seçicilik</b>: arıza olduğunda yalnızca arızaya en yakın koruma cihazının açmasıdır. Mutfakta kısa devre olunca yalnız mutfak linyesi kesilmeli, tüm ev karanlıkta kalmamalı.</p><p>Bunun için üstteki cihaz (kofre, ana şalter) alttakinden <b>büyük ve daha yavaş</b> olmalıdır. Buşon sigortalarda anma akımları oranı genellikle en az 1,6 kabul edilir; MCB’lerde tam seçicilik için üretici tabloları gerekir. Kaçak akımda üstte <b>S (seçici, gecikmeli) tip 300 mA</b>, altta 30 mA kullanılır.</p>',
  uygulama:['Kofre: 63 A NH/buşon → ana şalter 40 A → linyeler B10/B16: kademeli dizilim.','Ana panoda 300 mA S tipi KAR + tali/linyelerde 30 mA KAR.','Aynı değerde iki KAR seri konursa hangisinin atacağı belli olmaz.'],
  dikkat:['Kısa devre akımları çok büyükse iki MCB aynı anda atabilir: bu yüzden ana şalter olarak daha büyük ve D/C eğrili veya buşon kullanılır.'],
  ilgili:['sigorta_kosulu','kar_tipleri','pano_duzeni']
});
konu({id:'esz_talep', kat:'tesisat', ikon:'🏢', sv:2, ad:'Kurulu Güç, Eşzamanlılık ve Talep Gücü', ozet:'Evdeki her cihaz aynı anda çalışmaz. Ana sigorta ve kolon hattı talep gücüne göre seçilir.', etiket:['eşzamanlılık','talep gücü','kurulu güç','%60','%40','8 kw','apartman hesabı','kolon hattı'],
  tanim:'<p><b>Kurulu güç</b>: tesisata bağlı tüm cihaz ve prizlerin güçleri toplamı. <b>Talep (eşzamanlı) güç</b>: aynı anda çalışması beklenen gerçek güç. Aradaki orana <b>eşzamanlılık katsayısı</b> denir.</p><p><b>Elektrik İç Tesisleri Yönetmeliği Madde 57</b>’ye göre bir konutta kurulu gücün <b>ilk 8 kW’ı için %60</b>, <b>kalan kısmı için %40</b> eşzamanlılık uygulanır. Birden fazla daireyi besleyen kolon ve bina bağlantı hatlarında daire sayısı arttıkça katsayı yönetmelikteki tabloya göre düşer.</p>',
  formul:[['P<sub>talep</sub> = 8 × 0,6 + (P<sub>kurulu</sub> − 8) × 0,4', 'Konut, kW (P<sub>kurulu</sub> > 8 kW ise)'], ['P<sub>talep</sub> = P<sub>kurulu</sub> × 0,6', 'P<sub>kurulu</sub> ≤ 8 kW ise'], ['I = P<sub>talep</sub> / U', 'Ana sigorta / kolon akımı (tek faz)']],
  dene:{g:[['P', 'Kurulu güç', 'kW', 14]], h:v => { const t = v.P <= 8 ? v.P * .6 : 4.8 + (v.P - 8) * .4; return [['Talep gücü', f(t, 2) + ' kW', 'v'], ['Tek faz akım', f(t * 1000 / 230, 1) + ' A'], ['Bağlantı', t <= 5 ? 'tek faz olabilir (≤ 5 kW)' : 'ÜÇ FAZ (> 5 kW, Madde 22)', t <= 5 ? '' : 'uy']]; }},
  uygulama:['Daire panosu ana sigortası ve sayaç–pano kablosu talep gücüne göre seçilir.','Klima, ocak gibi büyük yükler eklendikçe kurulu güç ve talep yeniden hesaplanır.','Sanayi ve ticarette eşzamanlılık gerçek kullanım senaryosuna göre belirlenir.'],
  ornek:{s:'Bir dairede 18 adet lamba (toplam 0,6 kW), 15 priz (her biri 0,3 kW sayılırsa 4,5 kW), ankastre ocak 7 kW, klima 1,5 kW var. Talep gücü?', a:['Kurulu = 0,6 + 4,5 + 7 + 1,5 = 13,6 kW','Talep = 8 × 0,6 + 5,6 × 0,4 = 4,8 + 2,24 = 7,04 kW'], c:'≈ 7 kW → 5 kW’ı aştığı için trifaze bağlantı gerekir.'},
  dikkat:['Proje hesabında priz başına alınacak güç ve özel yükler proje kurallarına göre belirlenir; kesin değerler için güncel yönetmelik metnini kontrol et.'],
  hesap:['yuk','proje'], ilgili:['yonetmelik_maddeler','dengesiz_yuk','kablo_kapasite']
});
konu({id:'bakir_al', kat:'tesisat', ikon:'🟫', sv:2, ad:'Bakır ve Alüminyum İletken', ozet:'Alüminyum ucuz ve hafif ama daha büyük kesit ve özel bağlantı ister.', etiket:['bakır','alüminyum','al','cu','bimetal','oksit','kesit karşılığı'],
  tanim:'<p><b>Bakır</b> (Cu) en yaygın iletkendir: düşük dirençli, esnek, bağlantısı kolay. <b>Alüminyum</b> (Al) bakırın ≈ 1,6 katı özdirence sahiptir; aynı akım için yaklaşık iki kademe büyük kesit gerekir (ör. 16 mm² Cu ≈ 25 mm² Al). Hafif ve ucuz olduğu için havai hatlarda ve büyük kesitli beslemelerde kullanılır.</p><p>Alüminyum yüzeyi hızla <b>oksitlenir</b> ve oksit tabakası yalıtkandır; ayrıca vida altında zamanla “akar” (gevşer). Bu yüzden özel klemens, oksit önleyici gres ve periyodik sıkma gerekir.</p>',
  formul:[['S<sub>Al</sub> ≈ 1,6 × S<sub>Cu</sub>', 'Aynı direnç için kesit karşılığı (yaklaşık)']],
  uygulama:['Al–Cu birleşiminde <b>bimetal</b> pabuç/klemens kullanılır; doğrudan birleştirilirse galvanik korozyon olur.','Al kablo pabuçları hidrolik pres ile sıkılır, uçlar fırçalanıp gres sürülür.','Konut iç tesisatında küçük kesitlerde alüminyum kullanılmaz.'],
  dikkat:['Eski binalardaki alüminyum tesisatta gevşek bağlantı yangınlarına sık rastlanır.'],
  hesap:['kablo','gd'], ilgili:['direnc','kablo_turleri','baglanti']
});
konu({id:'kablo_turleri', kat:'tesisat', ikon:'🧵', sv:1, ad:'Kablo Türleri ve Kodları', ozet:'NYA, NYM, NYY, TTR, H07RN-F, NHXMH… Hangi kablo nerede kullanılır?', etiket:['nya','nym','nyy','ttr','h05vv-f','h07rn-f','nhxmh','halojensiz','solar kablo','kablo kodu'],
  tanim:'<p>Kablo kodları kablonun yapısını anlatır. Alman (VDE) kodlarında <b>N</b> norm kablo, <b>Y</b> PVC, <b>2X</b> XLPE, <b>H</b> halojensiz anlamına gelir. Avrupa uyumlu (HAR) kodlarda ilk kısım gerilim sınıfını (H05 = 300/500 V, H07 = 450/750 V), sonraki harfler yalıtım ve yapıyı gösterir (V: PVC, R: kauçuk, -U: tek tel, -K/-F: çok telli/esnek).</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kablo</th><th>Yapı</th><th>Nerede</th></tr><tr><td>NYA (H07V-U)</td><td>Tek damar, som bakır, PVC</td><td>Boru/spiral içinde sıva altı tesisat</td></tr><tr><td>NYAF (H07V-K)</td><td>Tek damar, çok telli</td><td>Pano içi, dar kıvrımlar</td></tr><tr><td>NYM</td><td>Çok damarlı, PVC kılıflı</td><td>Kuru/nemli iç mekân, sıva altı/üstü</td></tr><tr><td>TTR (H05VV-F)</td><td>Esnek kordon</td><td>Ev aletleri, uzatma, seyyar</td></tr><tr><td>NYY</td><td>Kalın PVC kılıflı</td><td>Toprak altı, dış mekân, besleme</td></tr><tr><td>H07RN-F</td><td>Kauçuk, esnek, ağır hizmet</td><td>Şantiye, dış seyyar, dalgıç pompa</td></tr><tr><td>NHXMH / N2XH</td><td>Halojensiz, az duman</td><td>Kamu binaları, kaçış yolları, otopark</td></tr><tr><td>H1Z2Z2-K</td><td>Solar kablo, UV/ısı dayanımlı</td><td>Güneş paneli DC hatları</td></tr></table></div>',
  uygulama:['Toprak altına NYM gömülmez; NYY veya boru içinde uygun kablo kullanılır.','Seyyar ve hareketli uygulamada som telli kablo kırılır: esnek kablo kullan.','Yangın yönetmeliğine tabi binalarda halojensiz kablo istenir.'],
  ilgili:['kablo_kapasite','renk_kodlari','bakir_al']
});
konu({id:'baglanti', kat:'tesisat', ikon:'🔩', sv:1, ad:'Kablo Bağlantı Yöntemleri', ozet:'Klemens, yaylı klemens, pabuç, yüksük… Sağlam bağlantı = soğuk bağlantı.', etiket:['klemens','yaylı klemens','wago','pabuç','yüksük','ek','buat','tork','bağlantı'],
  tanim:'<p>Tesisattaki yangınların önemli kısmı <b>gevşek bağlantı</b> kaynaklıdır: temas direnci artar, ısınır, oksitlenir, daha da ısınır. İyi bağlantı; doğru klemens, doğru soyma boyu, doğru sıkma torku demektir.</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Yöntem</th><th>Artı</th><th>Dikkat</th></tr><tr><td>Vidalı klemens</td><td>Sağlam, sökülebilir</td><td>Titreşimde gevşer; torkla sık, periyodik kontrol</td></tr><tr><td>Yaylı (itmeli/kollu) klemens</td><td>Hızlı, gevşemez</td><td>Kesit ve akım değerine uy, soyma boyu çizgisine dikkat</td></tr><tr><td>Pabuç (presli)</td><td>Büyük kesitlerde güvenli</td><td>Doğru kalıp ve pense ile sık</td></tr><tr><td>Yüksük</td><td>Çok telli ucu toparlar</td><td>Vidalı klemense çok telli kablo yüksüksüz bağlanmaz</td></tr><tr><td>Ek manşonu + makaron</td><td>Kablo uzatma</td><td>Mümkünse buatta klemensle ek yap</td></tr></table></div>',
  uygulama:['Ekler her zaman erişilebilir buat veya pano içinde yapılır; sıva içine ek gömülmez.','Bant ile sarılmış büküm ek kalıcı tesisatta kabul edilmez.','Klemens kesiti ve akım değeri kabloya uygun seçilir; Al–Cu için uygun klemens kullanılır.'],
  dikkat:['Kablo ucunu fazla soyup klemensten bakır taşırmak kısa devre ve elektrik çarpması riskidir.','Çok telli kabloyu kalaylayıp vida altına sıkmak zamanla gevşer.'],
  ilgili:['joule','bakir_al','pano_duzeni']
});
konu({id:'pano_duzeni', kat:'tesisat', ikon:'🗃️', sv:2, ad:'Dağıtım Panosu Düzeni', ozet:'Kofre → sayaç → ana şalter → parafudr → KAR → linye sigortaları. N ve PE baraları, etiketleme.', etiket:['pano','sigorta kutusu','dağıtım panosu','bara','etiket','ana şalter','pano düzeni'],
  tanim:'<p>Konut beslemesinde akış genellikle şöyledir: <b>kofre</b> (bina giriş sigortaları) → <b>sayaç</b> → daire panosunda <b>ana şalter</b> → <b>parafudr</b> (Tip 2) → <b>kaçak akım röleleri</b> → <b>linye sigortaları</b>. Panoda ayrı bir <b>N barası</b> ve <b>PE barası</b> bulunur.</p><p>TN-C-S sistemde PEN iletkeni binanın ana panosunda PE barasına bağlanır, buradan köprüyle N barasına geçilir; bu noktadan sonra N ve PE <b>asla</b> birleştirilmez. Bir KAR’ın arkasındaki linyelerin nötrleri başka KAR’ın nötrleriyle karıştırılmaz.</p>',
  uygulama:['Her sigortayı etiketle (ör. “L3 – mutfak prizleri”); pano kapağına linye listesi koy.','Yangın koruması için ana girişte 300 mA, priz ve ıslak hacim linyelerinde 30 mA KAR kullan.','Panoda %20 boş modül yeri bırak; tarak bara ile dağıtım yap.','Pano metal ise gövdesini PE’ye bağla.'],
  dikkat:['PE iletkeni hiçbir anahtar veya sigortadan geçirilmez.','Nötrü sigortadan geçirip fazı doğrudan bağlamak: sigorta atınca cihaz hâlâ gerilimli kalır.'],
  sema:['pano_1f','pano_3f','baralar','kofre'], ilgili:['selektivite','kar_tipleri','spd','sistem_turleri']
});

konu({id:'vucut_etkisi', kat:'guvenlik', ikon:'🫀', sv:1, ad:'Akımın İnsan Vücuduna Etkisi', ozet:'Öldüren gerilim değil, vücuttan geçen akım ve süresidir. 30 mA KAR’ın neden 30 mA olduğu.', etiket:['elektrik çarpması','vücut direnci','fibrilasyon','30 ma','bırakamama','iec 60479','çarpılma'],
  tanim:'<p>Elektrik çarpmasında tehlikeyi belirleyen; vücuttan geçen <b>akımın büyüklüğü</b>, <b>süresi</b> ve <b>yoludur</b> (el–el, el–ayak: kalpten geçen yol en tehlikelisi). Vücut direnci kuru deride birkaç kΩ olabilir, ıslak deride ve yüksek gerilimde 1 kΩ’un altına iner.</p><p>IEC 60479-1 etkileri bölgelere ayırır: <b>AC-1</b> hissedilmez (≈ 0,5 mA altı), <b>AC-2</b> hissedilir ama bırakılabilir, <b>AC-3</b> kas kasılması ve bırakamama (≈ 10 mA üstü), <b>AC-4</b> kalp fibrilasyonu riski. Süre uzadıkça daha küçük akım bile AC-4’e girer.</p><p>30 mA kaçak akım rölesi, akım fibrilasyon bölgesine girmeden (≈ 30 mA’de 300 ms’den kısa sürede, tipik 20–40 ms) devreyi keser.</p>',
  cizim:'vucut',
  formul:[['I<sub>vücut</sub> = U<sub>dokunma</sub> / R<sub>vücut</sub>', 'Örn. 230 V / 1.000 Ω = 230 mA → ölümcül']],
  dene:{g:[['U', 'Dokunma gerilimi', 'V', 230], ['R', 'Vücut direnci (ıslak ≈ 1000)', 'Ω', 1000]], h:v => { const I = v.U / v.R * 1000; return [['Vücut akımı', f(I, 0) + ' mA', 'v'], ['Bölge (1 s)', I < 0.5 ? 'AC-1' : I < 10 ? 'AC-2' : I < 50 ? 'AC-3' : 'AC-4 — ÖLÜMCÜL', I >= 50 ? 'uy' : '']]; }},
  uygulama:['Islak ortam (banyo, havuz, şantiye) vücut direncini düşürür: bu yerlerde 30 mA KAR ve düşük gerilim (SELV) kullanılır.','50 V AC üzeri dokunma gerilimi genel olarak tehlikeli kabul edilir (nemli yerlerde 25 V).','Çarpılan birine çıplak elle dokunma: önce enerjiyi kes.'],
  dikkat:['Çarpılan kişi iyi görünse de kalp ritim bozukluğu saatler sonra ortaya çıkabilir: sağlık kontrolü şart.','Çarpılan kişiyi kurtarırken enerjiyi kesemiyorsan kuru, yalıtkan bir nesneyle ayır.'],
  hesap:['kacak'], sema:['kar_prensip','priz'], ilgili:['temas','kar_tipleri','bes_kural']
});
konu({id:'temas', kat:'guvenlik', ikon:'✋', sv:2, ad:'Doğrudan ve Dolaylı Temas', ozet:'Çıplak faza dokunmak doğrudan, arızalı gövdeye dokunmak dolaylı temastır. Korunma yöntemleri farklıdır.', etiket:['doğrudan temas','dolaylı temas','temel koruma','hata koruması','gövde kaçağı','ek koruma'],
  tanim:'<p><b>Doğrudan temas</b>: normalde gerilimli olan bir parçaya (çıplak kablo, açık klemens) dokunmak. Korunma: yalıtım, kapak, muhafaza, mesafe (<b>temel koruma</b>).</p><p><b>Dolaylı temas</b>: normalde gerilimsiz olan ama bir arıza nedeniyle gerilim kazanmış metal gövdeye (çamaşır makinesi kasası) dokunmak. Korunma: koruma topraklaması + otomatik kesme (sigorta veya KAR) (<b>hata koruması</b>).</p><p>30 mA KAR, her ikisine karşı <b>ek koruma</b> sağlar; ama temel ve hata korumasının yerini tutmaz.</p>',
  uygulama:['Pano kapağı, buat kapağı ve priz kapağı temel korumadır: eksik bırakma.','Metal gövdeli cihazların PE bağlantısı hata korumasıdır.','Sınıf II (çift yalıtımlı) cihazlarda PE gerekmez.'],
  sema:['priz','tncs','tt'], ilgili:['vucut_etkisi','dokunma_gerilimi','koruma_sinifi']
});
konu({id:'dokunma_gerilimi', kat:'guvenlik', ikon:'🦶', sv:3, ad:'Dokunma ve Adım Gerilimi', ozet:'Arızalı gövde ile yer arasındaki fark dokunma, iki ayak arasındaki fark adım gerilimidir.', etiket:['dokunma gerilimi','adım gerilimi','50 v','25 v','ul','yer potansiyeli'],
  tanim:'<p><b>Dokunma gerilimi</b>: arıza anında, elle dokunulan gövde ile ayağın bastığı yer arasındaki gerilim farkı. Sürekli izin verilen sınır genelde <b>50 V AC</b> (ıslak/özel yerlerde 25 V) kabul edilir.</p><p><b>Adım gerilimi</b>: toprağa akım akarken yerin potansiyeli merkezden uzaklaştıkça azalır; iki ayak arasındaki fark tehlikelidir. Kopmuş bir havai hattın yanında küçük adımlarla (ayakları ayırmadan) uzaklaşılır. Yıldırım ve topraklayıcı yakınında da önemlidir.</p>',
  formul:[['R<sub>A</sub> × I<sub>Δn</sub> ≤ 50 V', 'TT sistemde koşul: topraklama direnci × KAR açma akımı'], ['U<sub>dokunma</sub> = I<sub>arıza</sub> × R<sub>PE</sub>', 'TN sistemde gövde gerilimi yaklaşık PE iletkenindeki düşüm']],
  dene:{g:[['RA', 'Topraklama direnci R<sub>A</sub>', 'Ω', 80], ['I', 'KAR I<sub>Δn</sub>', 'mA', 30]], h:v => { const U = v.RA * v.I / 1000; return [['Dokunma gerilimi', f(U, 1) + ' V', 'v'], ['50 V koşulu', U <= 50 ? 'sağlanıyor' : 'SAĞLANMIYOR', U <= 50 ? '' : 'uy'], ['30 mA için izin verilen R<sub>A</sub>', f(50 / 0.03, 0) + ' Ω']]; }},
  uygulama:['Eşpotansiyel bağlantı, aynı mekandaki metaller arasındaki dokunma gerilimini sıfıra yaklaştırır.','Trafo ve direk topraklamalarında adım gerilimi için halka topraklama yapılır.'],
  ilgili:['esp_teori','topraklama_direnci','sistem_turleri']
});
konu({id:'koruma_sinifi', kat:'guvenlik', ikon:'🏷️', sv:1, ad:'Cihaz Koruma Sınıfları (Sınıf 0, I, II, III)', ozet:'Topraklı fiş mi, çift yalıtım mı, düşük gerilim mi? Cihazın etiketindeki semboller.', etiket:['sınıf 1','sınıf 2','sınıf 3','çift yalıtım','selv','koruma sınıfı','kare içinde kare'],
  tanim:'<ul><li><b>Sınıf 0</b>: sadece temel yalıtım, topraksız. Türkiye’de satışı yoktur.</li><li><b>Sınıf I</b>: metal gövde + <b>PE bağlantısı</b> (topraklı fiş). Buzdolabı, çamaşır makinesi, fırın. Sembol: ⏚</li><li><b>Sınıf II</b>: <b>çift veya güçlendirilmiş yalıtım</b>, PE yok. Saç kurutma, şarj aletleri, birçok el aleti. Sembol: iç içe iki kare ⧈</li><li><b>Sınıf III</b>: <b>SELV</b> çok düşük güvenlik gerilimiyle (≤ 50 V AC / 120 V DC) çalışır. Sembol: kare içinde III. Banyo bölge 0 cihazları, 12 V aydınlatma.</li></ul>',
  uygulama:['Sınıf II cihazın fişinde toprak pimi olmayabilir; PE bağlanmaması arıza değildir.','Sınıf I cihaz topraksız prize takılırsa koruması ortadan kalkar.','SELV trafosu güvenlik (izolasyon) trafosu olmalıdır; ototrafo SELV sağlamaz.'],
  ilgili:['temas','ip_ik','banyo_bolge']
});
konu({id:'bes_kural', kat:'guvenlik', ikon:'5️⃣', sv:1, ad:'Beş Güvenlik Kuralı', ozet:'Kes – kilitle – ölç – topraklayıp kısa devre et – çevredekileri kapat. Her işten önce.', etiket:['5 güvenlik kuralı','kilitle etiketle','loto','enerji yokluğu','ölçerek kontrol','iş güvenliği'],
  tanim:'<p>Elektrik tesisatında enerjisiz çalışmanın evrensel sırası (EN 50110):</p><ol><li><b>Enerjiyi kes</b> (tüm kaynaklar: şebeke, jeneratör, güneş/akü, UPS).</li><li><b>Tekrar açılmaya karşı emniyete al</b>: kilitle, etiketle (“Çalışma var, açmayın”), sigortayı yanına al.</li><li><b>Enerji olmadığını ölçerek doğrula</b>: iki kutuplu gerilim test cihazıyla, tüm iletkenler arasında. Önce aleti bilinen kaynakta dene.</li><li><b>Topraklayıp kısa devre et</b> (OG ve gereken AG tesislerde).</li><li><b>Yakındaki gerilimli bölümleri kapat/yalıt</b>.</li></ol>',
  uygulama:['Panoda tek bir sigortayı kapatmak yetmeyebilir: aynı buata başka linye girebilir, vavien dönüşleri farklı sigortadan gelebilir.','Güneş sisteminde panel gündüz her zaman gerilim üretir: DC tarafı ayrıca ayrılır.','Kondansatörlü sistemlerde (kompanzasyon, sürücü) deşarj süresi beklenir.'],
  dikkat:['Kontrol kalemi tek başına “enerji yok” kanıtı değildir: nötr kopukken veya kalemin pili/lambası bozukken yanılırsın.','“Ben kapattım” güvenlik değildir: kilitlemeyen biri açabilir.'],
  ilgili:['cat_sinifi','olcum_sirasi','vucut_etkisi']
});
konu({id:'cat_sinifi', kat:'guvenlik', ikon:'📛', sv:2, ad:'Ölçü Aletlerinde CAT Sınıfları', ozet:'CAT II priz, CAT III pano, CAT IV kofre-sayaç. Yanlış sınıf alet arkla patlayabilir.', etiket:['cat iii','cat iv','ölçüm kategorisi','multimetre güvenliği','iec 61010','ark'],
  tanim:'<p>Ölçü aletlerinin dayanabileceği <b>geçici aşırı gerilim</b> (yıldırım, anahtarlama darbeleri) kaynağa yaklaştıkça artar. IEC 61010 ölçüm yerlerini kategorilere ayırır:</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kategori</th><th>Nerede</th></tr><tr><td>CAT II</td><td>Prize takılan cihazlar, priz ölçümü</td></tr><tr><td>CAT III</td><td>Dağıtım panosu, sabit tesisat, motorlar, buatlar</td></tr><tr><td>CAT IV</td><td>Bina girişi: kofre, sayaç, havai hat, toprak altı besleme</td></tr></table></div><p>Aletin üzerinde “CAT III 600 V” yazması, o kategoride 600 V’a kadar güvenle kullanılabileceği anlamına gelir.</p>',
  uygulama:['Elektrikçi için en az CAT III 600 V (tercihen CAT IV 600 V) multimetre ve problar.','Probların da CAT değeri vardır; koruma kapaklarını kofre/pano ölçümünde takılı tut.'],
  dikkat:['Akım girişindeki dahili sigortası yerine tel bağlanmış veya ucuz alet, kısa devrede ark patlamasına yol açabilir.'],
  sema:['multimetre'], ilgili:['bes_kural','olcum_sirasi','ark']
});
konu({id:'ip_ik', kat:'guvenlik', ikon:'💦', sv:1, ad:'IP ve IK Koruma Dereceleri', ozet:'IP: toz ve suya karşı, IK: darbeye karşı dayanım. Banyoya IPX4, dışarıya IP65.', etiket:['ip65','ip44','ip67','ip20','ik08','toz','su','darbe','iec 60529','etanj'],
  tanim:'<p><b>IP kodu</b> (IEC 60529) iki rakamdır: <b>1. rakam</b> katı cisim/toz (0–6), <b>2. rakam</b> su (0–8). “X” o özelliğin test edilmediğini gösterir (IPX4).</p><p><b>IK kodu</b> (IEC 62262) darbe dayanımıdır: IK00–IK10. IK08 ≈ 5 J, IK10 ≈ 20 J (vandalizme dayanıklı armatür, kamera).</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>1. rakam</th><th>Koruma</th><th>2. rakam</th><th>Koruma</th></tr><tr><td>2</td><td>Parmak (12,5 mm)</td><td>1</td><td>Dikey damla</td></tr><tr><td>4</td><td>Tel (1 mm)</td><td>3</td><td>Yağmur (60°’ye kadar)</td></tr><tr><td>5</td><td>Toza karşı korumalı</td><td>4</td><td>Her yönden sıçrama</td></tr><tr><td>6</td><td>Toz geçirmez</td><td>5</td><td>Su jeti</td></tr><tr><td></td><td></td><td>6</td><td>Güçlü su jeti</td></tr><tr><td></td><td></td><td>7</td><td>1 m’ye kadar geçici daldırma</td></tr><tr><td></td><td></td><td>8</td><td>Sürekli daldırma (üretici şartı)</td></tr></table></div><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Yer</th><th>Önerilen</th></tr><tr><td>Kuru iç mekan</td><td>IP20</td></tr><tr><td>Banyo bölge 1–2, balkon</td><td>IPX4 / IP44</td></tr><tr><td>Bahçe, dış cephe</td><td>IP65</td></tr><tr><td>Toprağa gömme, havuz kenarı</td><td>IP67 / IP68</td></tr><tr><td>Otopark, sokak (darbe)</td><td>IP65 + IK08 ve üstü</td></tr></table></div>',
  uygulama:['Etanj (kapaklı) priz kapağı kapalıyken IP44 sağlar; fiş takılıyken sağlamayabilir.','Kablo girişleri rakorla yapılmazsa armatürün IP değeri anlamsızlaşır.'],
  sema:['etanj','banyo'], ilgili:['banyo_bolge','koruma_sinifi']
});
konu({id:'ark', kat:'guvenlik', ikon:'🔥', sv:2, ad:'Ark ve Ark Parlaması', ozet:'Kısa devre anında oluşan ark, binlerce derece sıcaklık ve basınç dalgası üretir.', etiket:['ark','ark parlaması','arc flash','yanık','koruyucu ekipman','afdd'],
  tanim:'<p><b>Ark</b>, havanın iyonlaşarak akım taşımasıdır. Kısa devrede, gevşek bağlantıda veya yük altında kontak açılırken oluşur. Ark sıcaklığı binlerce °C’ye ulaşır; metal buharlaşır, basınç dalgası ve UV ışık oluşur. Ana pano ve kofre gibi kısa devre akımı yüksek yerlerde ağır yanıklara neden olabilir.</p><p><b>Seri ark</b> (gevşek klemens, ezik kablo) akımı artırmadığı için sigortayı attırmaz ama yangın çıkarır; buna karşı <b>ark hatası algılama cihazı (AFDD)</b> geliştirilmiştir.</p>',
  uygulama:['Kofre ve ana panoda çalışırken yüz siperi, ark dayanımlı giysi ve yalıtkan eldiven kullanılır.','Yük altındaki şalteri değil, önce yükü kapat; DC devrelerde yük altında konnektör sökme (MC4) ark yapar.'],
  dikkat:['Sentetik kıyafet arkta erir ve deriye yapışır: pamuklu veya ark dayanımlı giysi tercih et.'],
  ilgili:['kisa_devre','cat_sinifi','bes_kural']
});

konu({id:'mcb_egri', kat:'koruma', ikon:'🔲', sv:1, ad:'Otomatik Sigorta (MCB) ve B, C, D Eğrileri', ozet:'Isıl kısım aşırı yükü, manyetik kısım kısa devreyi keser. Eğri harfi, kalkış akımına ne kadar tolerans olduğunu söyler.', etiket:['mcb','otomatik sigorta','b16','c16','d eğrisi','açma eğrisi','kesme kapasitesi','6 ka','termik manyetik'],
  tanim:'<p>Otomatik sigortada iki açma mekanizması vardır:</p><ul><li><b>Isıl (bimetal)</b>: aşırı yükte yavaş açar. 1,13 × I<sub>n</sub>’de 1 saatte açmaz, 1,45 × I<sub>n</sub>’de 1 saat içinde açar; akım arttıkça süre kısalır.</li><li><b>Manyetik (bobin)</b>: kısa devrede anında (&lt; 0,1 s) açar. Hangi akımda anlık açacağını <b>eğri harfi</b> belirler.</li></ul><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Eğri</th><th>Anlık açma</th><th>Kullanım</th></tr><tr><td>B</td><td>3–5 × I<sub>n</sub></td><td>Konut aydınlatma ve priz, uzun hatlar</td></tr><tr><td>C</td><td>5–10 × I<sub>n</sub></td><td>Genel amaçlı, küçük motorlar, klima, LED armatür grupları</td></tr><tr><td>D</td><td>10–20 × I<sub>n</sub></td><td>Yüksek kalkış akımlı: trafo, büyük motor, kaynak makinesi</td></tr></table></div><p><b>Kesme kapasitesi</b> (ör. 6 kA, 10 kA), sigortanın güvenle kesebileceği en büyük kısa devre akımıdır.</p>',
  cizim:'mcb',
  formul:[['I<sub>anlık</sub>: B ≤ 5 I<sub>n</sub> · C ≤ 10 I<sub>n</sub> · D ≤ 20 I<sub>n</sub>', 'Güvenli açma için arıza akımı bu değerin üzerinde olmalı']],
  uygulama:['LED armatür ve trafo grupları açılışta yüksek akım çeker: B yerine C seçmek gerekebilir.','Uzun hatlarda arıza akımı düşük kalır: B eğrisi daha güvenlidir.','Pano üstündeki “4500” veya “6000” rakamı kesme kapasitesidir (A).'],
  dikkat:['Sigorta kolu kalkmıyorsa zorlanmaz; arıza giderilmeden kaldırılan sigorta ark yapar.','Atan sigortayı daha büyüğüyle değiştirmek kabloyu korumasız bırakır.'],
  hesap:['kablo','kisadevre'], sema:['pano_1f'], ilgili:['sigorta_kosulu','dongu_empedansi','selektivite','sigorta_turleri']
});
konu({id:'kar_tipleri', kat:'koruma', ikon:'🛡️', sv:1, ad:'Kaçak Akım Rölesi (KAR / RCD) ve Tipleri', ozet:'Faz ile nötr akımı arasındaki farkı ölçer. 30 mA hayat, 300 mA yangın koruması. AC, A, F, B tipi farkı.', etiket:['kaçak akım rölesi','kar','rcd','rccb','30 ma','300 ma','tip a','tip ac','tip b','tip f','s tipi','test butonu'],
  tanim:'<p>KAR, faz ve nötrü aynı toroid çekirdekten geçirir. Giden ve dönen akım eşitse manyetik alanlar birbirini götürür. Akımın bir kısmı başka yoldan (insan, gövde, toprak) dönerse fark oluşur ve röle açar. <b>Kısa devre ve aşırı yüke karşı koruma yapmaz</b>; önünde/arkasında sigorta gerekir.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Hassasiyet</th><th>Amaç</th></tr><tr><td>10 mA</td><td>Özel tıbbi/hassas yerler</td></tr><tr><td>30 mA</td><td>Hayat koruması: priz, banyo, dış mekan, ıslak alan linyeleri</td></tr><tr><td>100–300 mA</td><td>Yangın koruması (ana giriş), S (gecikmeli) tip ile seçicilik</td></tr></table></div><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tip</th><th>Algıladığı kaçak</th><th>Nerede</th></tr><tr><td>AC</td><td>Sadece saf sinüs AC</td><td>Basit dirençli yükler (giderek terk ediliyor)</td></tr><tr><td>A</td><td>AC + darbeli DC</td><td>Konut genel, elektronikli cihazlar (çamaşır, bulaşık makinesi)</td></tr><tr><td>F</td><td>A + karışık frekanslı</td><td>Tek fazlı inverter klima, ısı pompası, tek faz sürücülü cihazlar</td></tr><tr><td>B</td><td>F + düz DC kaçak</td><td>Üç fazlı sürücüler, elektrikli araç şarjı (6 mA DC algılamalı değilse), güneş inverterinde üretici isterse</td></tr></table></div>',
  formul:[['I<sub>Δ</sub> = I<sub>L</sub> − I<sub>N</sub>', 'Algılanan fark akımı'], ['Açma: 0,5 × I<sub>Δn</sub> &lt; I &lt; I<sub>Δn</sub>', '30 mA röle 15–30 mA arasında açar; 30 mA’de en geç 300 ms (genel tip)']],
  uygulama:['Ayda bir test (T) butonuna basılmalı.','Sık atan KAR’da: önce tüm yükler sökülür, sonra linyeler tek tek eklenir; megger ile izolasyon ölçülür.','KAR’dan sonra N ile PE birleştirilirse röle hemen atar (veya kaçağı göremez).','Birden fazla KAR’lı panoda her KAR’ın nötrü yalnız kendi linyelerine gider.'],
  dikkat:['KAR, faz–nötr arasına giren insanı korumaz (akım fark oluşturmaz).','Tip AC röle, elektronikli cihazlardaki DC kaçakta doyuma girip hiç açmayabilir.'],
  hesap:['kacak'], sema:['kar_prensip','priz','baralar','tt'], ilgili:['rcbo','vucut_etkisi','selektivite','sistem_turleri']
});
konu({id:'rcbo', kat:'koruma', ikon:'🧩', sv:2, ad:'Kombine Sigorta (RCBO)', ozet:'Kaçak akım + aşırı akım koruması tek cihazda. Her linyenin kendi KAR’ı olur.', etiket:['rcbo','kombine sigorta','kaçak akımlı sigorta','diferansiyel otomatik'],
  tanim:'<p><b>RCBO</b>, kaçak akım rölesi (RCD) ile otomatik sigortayı (MCB) tek gövdede birleştirir. Her linye kendi RCBO’suyla korunduğunda bir linyedeki kaçak yalnız o linyeyi keser; ev karanlıkta kalmaz ve arızalı linye hemen belli olur.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th></th><th>KAR + MCB grubu</th><th>Her linyede RCBO</th></tr><tr><td>Kaçakta kesilen</td><td>KAR arkasındaki tüm linyeler</td><td>Sadece arızalı linye</td></tr><tr><td>Arıza bulma</td><td>Linyeleri tek tek denemek gerekir</td><td>Hemen belli</td></tr><tr><td>Maliyet</td><td>Düşük</td><td>Yüksek</td></tr><tr><td>Toplam kaçak birikmesi</td><td>Çok linye → normal sızıntılar toplanıp atabilir</td><td>Yok</td></tr></table></div>',
  uygulama:['Kritik linyeler (buzdolabı, kombi, modem/kamera) için ayrı RCBO kesintisizliği artırır.','Tek modüllü RCBO’larda nötr ucu için ayrı kablo (beyaz/mavi pigtail) olabilir; N barasına bağlanır.'],
  ilgili:['kar_tipleri','mcb_egri','selektivite']
});
konu({id:'termik_mks', kat:'koruma', ikon:'🌡️', sv:2, ad:'Termik Röle ve Motor Koruma Şalteri', ozet:'Motorun aşırı yük ve faz kaybına karşı korunması. Termik motor etiket akımına ayarlanır.', etiket:['termik','termik röle','motor koruma şalteri','mks','95-96','97-98','faz kaybı','aşırı yük'],
  tanim:'<p>Motor kalkışta 6–8 kat akım çeker; normal sigorta buna izin verecek kadar büyük seçildiği için motorun yavaş yavaş aşırı yüklenmesini göremez. <b>Termik röle</b>, motor akımına ayarlanır ve aşırı akım süreklileşince açar. Kontaktörün altına takılır; kendi kontaklarıyla (95-96 NC, 97-98 NO) kontaktör bobinini düşürür.</p><p><b>Motor koruma şalteri (MKŞ)</b> termik + manyetik + şalteri tek cihazda birleştirir; küçük ve orta motorlar için ideal. İkisi de bir fazın kopmasını (faz kaybı) algılayarak açabilir.</p>',
  formul:[['I<sub>ayar</sub> = I<sub>etiket</sub>', 'Termik motor etiket akımına ayarlanır (yıldız-üçgende 0,58 × I<sub>etiket</sub>)']],
  uygulama:['Termik sıcak ortamda erken, soğukta geç açabilir; kompanzasyonlu termik tercih edilir.','Termik attıktan sonra “manuel/otomatik reset” ayarı vardır; pompalarda otomatik reset tehlikeli olabilir.','Termik sık atıyorsa: gerilim düşük mü, faz eksik mi, motor/pompa sıkışıyor mu, ayar doğru mu?'],
  dikkat:['Termik ayarını “atmasın diye” yükseltmek motoru yakar.'],
  hesap:['motor'], sema:['dol','yildiz_ucgen'], ilgili:['kontaktor','motor_etiketi','yol_verme']
});
konu({id:'sigorta_turleri', kat:'koruma', ikon:'🧯', sv:2, ad:'Eriyen Telli Sigortalar (Buşon, NH, gG, aM)', ozet:'Kofrede NH bıçaklı, eski panolarda buşon. gG kablo, aM motor koruması.', etiket:['buşon','nh sigorta','bıçaklı sigorta','gg','am','diazed','neozed','cam sigorta','kofre'],
  tanim:'<p>Eriyen telli sigortada aşırı akım teli eritir ve devre kalıcı olarak açılır; yenisiyle değiştirilir. Çok yüksek kısa devre akımlarını (50–120 kA) güvenle kesebildikleri için bina girişlerinde (kofre) kullanılırlar.</p><ul><li><b>gG</b>: tam aralık, genel amaçlı; kablo/hat koruması.</li><li><b>aM</b>: kısmi aralık; sadece kısa devre koruması, motor devrelerinde termikle birlikte.</li><li><b>gR/aR</b>: yarı iletken (ultra hızlı) koruma.</li></ul><p>Fiziksel tipler: <b>D tipi (Diazed/buşon)</b> ve <b>D0 (Neozed)</b> 2–63 A; <b>NH bıçaklı</b> 6–1250 A (kofre, ana dağıtım); <b>cam/seramik tüp</b> cihaz içi.</p>',
  uygulama:['Buşonun alt kısmındaki renkli gösterge atınca düşer; renk anma akımını gösterir (16 A gri, 20 A mavi, 25 A sarı, 35 A siyah, 50 A beyaz, 63 A bakır).','NH sigortalar yük altında sökülmez; özel sap ve koruyucu ekipmanla değiştirilir.','Buşon gövdesindeki “kalibre (göz) parçası” daha büyük sigorta takılmasını engeller; çıkarılmamalıdır.'],
  dikkat:['Sigortayı tel ile “köprülemek” yangın ve ölüm sebebidir.'],
  sema:['kofre'], ilgili:['mcb_egri','selektivite']
});
konu({id:'spd', kat:'koruma', ikon:'⚡', sv:2, ad:'Parafudr (Aşırı Gerilim Koruma, SPD)', ozet:'Yıldırım ve anahtarlama darbelerini toprağa saptırır. Tip 1 bina girişi, Tip 2 dağıtım panosu, Tip 3 cihaz yanı.', etiket:['parafudr','spd','aşırı gerilim','yıldırım','tip 1','tip 2','tip 3','varistör','up'],
  tanim:'<p>Yıldırım düşmesi veya büyük yüklerin anahtarlanması mikrosaniyelik binlerce voltluk darbeler oluşturur. <b>Parafudr</b>, normal gerilimde yalıtkandır; darbe geldiğinde iletken olup akımı PE’ye saptırır ve gerilimi cihazların dayanabileceği seviyeye (koruma seviyesi U<sub>p</sub>) sınırlar.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tip</th><th>Nerede</th><th>Ne zaman şart</th></tr><tr><td>Tip 1 (I<sub>imp</sub>)</td><td>Ana giriş panosu</td><td>Paratoneri olan veya havai hattan beslenen bina</td></tr><tr><td>Tip 2 (I<sub>max</sub>)</td><td>Daire/tali pano</td><td>Genel koruma, en yaygın</td></tr><tr><td>Tip 3</td><td>Cihazın yakını (priz tipi)</td><td>Hassas elektronik, panodan > 10 m uzak</td></tr></table></div>',
  uygulama:['Parafudr kablosu mümkün olduğunca kısa (toplam &lt; 50 cm) ve düz olmalı; uzun kablo koruma seviyesini bozar.','Önünde üreticinin önerdiği sigorta bulunur.','Durum göstergesi kırmızı olan modül değiştirilir.','Köy ve kırsalda havai hat beslemesi + kuyu pompası gibi yerlerde parafudr çok fark yaratır.'],
  dikkat:['Parafudr topraklama olmadan çalışmaz.','Megger ölçümünden önce parafudr devreden ayrılır.'],
  sema:['spd','paratoner'], ilgili:['yildirim','pano_duzeni','esp_teori']
});
konu({id:'gerilim_rolesi', kat:'koruma', ikon:'📊', sv:2, ad:'Gerilim Koruma ve Faz Kontrol Röleleri', ozet:'Aşırı/düşük gerilim, faz kaybı, faz sırası ve asimetriye karşı cihazları korur.', etiket:['gerilim koruma rölesi','faz kontrol rölesi','faz kaybı','aşırı gerilim','düşük gerilim','asimetri','bekleme süresi'],
  tanim:'<p><b>Gerilim koruma rölesi</b> (tek faz) gerilim belirlenen sınırların dışına çıkınca çıkışı keser, normale dönünce ayarlanan <b>bekleme süresinden</b> sonra tekrar verir. Buzdolabı ve klima kompresörlerini kesinti dönüşü ani kalkıştan korumak için bu bekleme önemlidir.</p><p><b>Faz kontrol rölesi</b> (üç faz) faz kaybı, faz sırası hatası, asimetri ve düşük/yüksek gerilimi izler; kontağıyla kontaktör bobinini keser.</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Fonksiyon</th><th>Tipik ayar</th></tr><tr><td>Aşırı gerilim</td><td>≈ 250–260 V</td></tr><tr><td>Düşük gerilim</td><td>≈ 180–200 V</td></tr><tr><td>Bekleme (dönüş)</td><td>buzdolabı/klima için 3–5 dk</td></tr><tr><td>Asimetri</td><td>%5–10</td></tr></table></div>',
  uygulama:['Nötr kopması riskine karşı dairelerde gerilim koruma rölesi etkili bir sigortadır.','Hidrofor ve kuyu pompalarında faz kontrol rölesi motoru tek fazda çalışmaktan korur.'],
  sema:['gerilim_koruma','faz_kontrol'], ilgili:['notr_kopmasi','faz_sirasi_teori','termik_mks']
});
konu({id:'kontaktor', kat:'koruma', ikon:'🔌', sv:1, ad:'Kontaktör ve Röle', ozet:'Küçük bir kumanda akımıyla büyük yükleri açıp kapatan elektromanyetik anahtar. NO/NC, AC-1/AC-3.', etiket:['kontaktör','röle','bobin','a1 a2','no','nc','13-14','ac-3','ac-1','mühürleme'],
  tanim:'<p><b>Kontaktör</b>, bobinine (A1–A2) gerilim verilince ana kontaklarını (1-3-5 → 2-4-6) kapatan güç anahtarıdır. <b>Yardımcı kontaklar</b> kumanda için kullanılır: <b>NO</b> (normalde açık, 13-14) ve <b>NC</b> (normalde kapalı, 21-22). <b>Röle</b> aynı ilkeyle çalışan, daha küçük akımlar için yapılmış anahtardır.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kategori</th><th>Yük</th></tr><tr><td>AC-1</td><td>Omik, az endüktif (ısıtıcı, rezistans)</td></tr><tr><td>AC-3</td><td>Kafes rotorlu motor kalkış ve durdurma (en yaygın)</td></tr><tr><td>AC-4</td><td>Kesik kesik çalıştırma, ani ters çevirme</td></tr><tr><td>AC-5a/5b</td><td>Deşarj lambaları / akkor lambalar</td></tr></table></div>',
  uygulama:['Bobin gerilimi etikette yazar (ör. 230 V AC, 24 V DC); yanlış gerilim bobini yakar veya çekmez.','Mühürleme: START butonuna paralel 13-14 kontağı, butonu bırakınca kontaktörü tutar.','Kilitleme: ileri-geri devrede karşı kontaktörün NC kontağı seri bağlanır.','LED aydınlatma gruplarında kalkış akımı yüksek olduğu için kontaktör akımı büyük seçilir veya “AC-5” değerine bakılır.'],
  dikkat:['Kontaktör vınlıyorsa: düşük bobin gerilimi, kirli nüve yüzeyi veya kırık kısa devre halkası.'],
  sema:['dol','ileri_geri','kontaktor_yuk'], ilgili:['termik_mks','yol_verme','manyetizma']
});

konu({id:'sistem_turleri', kat:'topraklama', ikon:'🌍', sv:2, ad:'Topraklama Sistemleri: TN-C, TN-S, TN-C-S, TT, IT', ozet:'Harfler neyi anlatır, Türkiye’de hangisi yaygındır, koruma nasıl sağlanır?', etiket:['tn-c-s','tn-s','tn-c','tt','it','pen','topraklama sistemi','sıfırlama'],
  tanim:'<p><b>1. harf</b> kaynağın (trafo yıldız noktası) durumunu: <b>T</b> doğrudan topraklı, <b>I</b> yalıtılmış. <b>2. harf</b> cihaz gövdelerinin bağlantısını: <b>N</b> gövdeler kaynağın topraklı noktasına (nötre) iletkenle bağlı, <b>T</b> gövdeler kendi ayrı topraklayıcısına bağlı. Ek harfler: <b>C</b> nötr ve koruma iletkeni birleşik (PEN), <b>S</b> ayrı.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Sistem</th><th>Yapı</th><th>Koruma nasıl?</th><th>Nerede</th></tr><tr><td>TN-C</td><td>PEN tek iletken</td><td>Sigorta (KAR kullanılamaz)</td><td>Eski binalar (sıfırlama)</td></tr><tr><td>TN-S</td><td>N ve PE baştan ayrı</td><td>Sigorta + KAR</td><td>Kendi trafosu olan tesis</td></tr><tr><td>TN-C-S</td><td>Binaya PEN gelir, girişte N+PE’ye ayrılır</td><td>Sigorta + KAR</td><td>Şehir şebekelerinin çoğu</td></tr><tr><td>TT</td><td>Binanın kendi topraklama kazığı</td><td>KAR şart (sigorta atmaz)</td><td>Kırsal, havai hatlı köyler</td></tr><tr><td>IT</td><td>Kaynak yalıtılmış/empedanslı</td><td>Yalıtım izleme</td><td>Ameliyathane, kritik süreç</td></tr></table></div>',
  uygulama:['Hangi sistemde olduğunu dağıtım şirketinden öğren; TT ise topraklama direnci ve KAR hesabı belirleyicidir.','TN-C-S’de PEN ayrımı yalnız bir kez, ana girişte yapılır; sonra N ile PE birleştirilmez.','Eski binalarda prizde nötr ile toprak klemensinin köprülenmesi (“sıfırlama”) PEN koparsa gövdeleri gerilimlendirir: yeni tesisatta yapılmaz.'],
  dikkat:['TN-C bölümünde KAR kullanılmaz: PEN, KAR’ın içinden geçerse çalışmaz veya sürekli atar.'],
  sema:['tncs','tt','tns'], ilgili:['topraklama_direnci','kar_tipleri','dongu_empedansi','notr_kopmasi']
});
konu({id:'topraklama_direnci', kat:'topraklama', ikon:'🪨', sv:2, ad:'Toprak Özdirenci ve Kazık Hesabı', ozet:'Topraklama direnci toprağın cinsine, kazık boyuna ve sayısına bağlıdır. Paralel kazıklar direnci düşürür.', etiket:['topraklama direnci','kazık','toprak özdirenci','ra','çubuk topraklayıcı','paralel kazık','şerit topraklama'],
  tanim:'<p>Bir topraklayıcının direnci, büyük ölçüde etrafındaki toprağın <b>özdirencine</b> (ρ, Ω·m) bağlıdır. Nemli bataklık toprağı ≈ 30 Ω·m, killi toprak ≈ 100 Ω·m, kumlu/kuru toprak 500–1.000 Ω·m, kayalık zemin binlerce Ω·m olabilir. Yazın kuruyan toprakta direnç artar.</p><p>Tek düşey kazığın direnci yaklaşık ρ / L’dir (L: kazık boyu, m). Kazıklar paralel bağlanınca direnç düşer ama tam bölünmez; kazıklar arası mesafe en az kazık boyu kadar olmalıdır.</p>',
  formul:[['R ≈ ρ / L', 'Düşey kazık için pratik yaklaşım (Ω)'], ['R ≈ 2ρ / L', 'Yatay şerit (L: şerit boyu) için yaklaşım'], ['R<sub>n</sub> ≈ R₁ / (n × η)', 'n kazık paralel; η ≈ 0,6–0,8 (etkileşim)']],
  dene:{g:[['r', 'Toprak özdirenci', 'Ω·m', 100, [[30, 'Bataklık ≈ 30'], [100, 'Killi ≈ 100'], [200, 'Tarla/bahçe ≈ 200'], [500, 'Kumlu ≈ 500'], [1000, 'Çakıllı/kuru ≈ 1000']]], ['L', 'Kazık boyu', 'm', 2], ['n', 'Kazık sayısı', 'adet', 1]], h:v => { const R1 = v.r / v.L, eta = v.n <= 1 ? 1 : v.n <= 2 ? .85 : v.n <= 4 ? .75 : .65, R = R1 / (v.n * eta); return [['Tek kazık', f(R1, 0) + ' Ω'], ['Toplam', f(R, 1) + ' Ω', 'v'], ['TT + 30 mA KAR (≤ 1666 Ω)', R <= 1666 ? 'uygun' : 'uygun değil'], ['Paratoner hedefi (≤ 10 Ω)', R <= 10 ? 'sağlanıyor' : 'sağlanmıyor', R <= 10 ? '' : 'uy']]; }},
  uygulama:['Hedef yoksa pratik değer: TT konutta ≤ 100 Ω iyi, paratoner ve trafo topraklamasında ≤ 10 Ω (proje şartına göre).','Kayalık zeminde kazık yerine yatay şerit veya halka topraklama yapılır.','Kazık başları muayene kutusu ile ölçülebilir bırakılır.'],
  ornek:{s:'Bahçe toprağında (ρ ≈ 200 Ω·m) 1,5 m kazık ile ne elde edilir? 10 Ω için kaç kazık gerekir?', a:['Tek kazık: 200 / 1,5 ≈ 133 Ω','10 Ω için: 133 / (n × 0,65) ≤ 10 → n ≈ 21'], c:'Tek kazık TT konut için yeterli, ama 10 Ω için kazık yerine temel topraklaması/şerit gerekir.'},
  hesap:['topraklama'], sema:['toprak_olcum','tt'], ilgili:['sistem_turleri','temel_topraklama','dokunma_gerilimi']
});
konu({id:'temel_topraklama', kat:'topraklama', ikon:'🏗️', sv:2, ad:'Temel Topraklaması', ozet:'Bina temelindeki betonun içine döşenen şerit: en iyi ve en kalıcı topraklayıcı.', etiket:['temel topraklaması','şerit','30x3,5','halka topraklayıcı','beton','filiz'],
  tanim:'<p><b>Temel topraklaması</b>, bina temeline (genellikle grobeton veya temel betonunun içine) halka şeklinde döşenen galvanizli çelik şerittir (tipik 30 × 3,5 mm). Beton nemi tuttuğu ve geniş alana yayıldığı için düşük ve kalıcı direnç sağlar.</p><p>Şeritten ana eşpotansiyel baraya ve gerekirse paratoner iniş noktalarına <b>filiz</b> (bağlantı ucu) çıkarılır. Şerit, temel demirlerine belirli aralıklarla bağlanır.</p>',
  uygulama:['Bina inşaatı sırasında yapılmazsa sonradan eklemek çok zordur: proje aşamasında hatırlat.','Şerit betonun içinde her yönden en az ≈ 5 cm betonla örtülmelidir.','Filizler toprak üstüne çıkan kısımda korozyona karşı korunmalı veya paslanmaz/bakır olmalı.'],
  sema:['esp','tncs'], ilgili:['topraklama_direnci','esp_teori','yildirim']
});
konu({id:'esp_teori', kat:'topraklama', ikon:'🟰', sv:2, ad:'Eşpotansiyel Bağlantı', ozet:'Binaya giren tüm metaller aynı baraya bağlanır; aralarında tehlikeli gerilim farkı kalmaz.', etiket:['eşpotansiyel','potansiyel dengeleme','ana eşpotansiyel bara','tamamlayıcı eşpotansiyel','banyo topraklama','su borusu'],
  tanim:'<p><b>Ana eşpotansiyel bağlantı</b>: binaya giren metal sistemler (su, gaz, kalorifer boruları, yapı çeliği, paratoner, anten, haberleşme kablolarının blendajı) ve pano PE barası, ana eşpotansiyel barada birleştirilip temel topraklamasına bağlanır.</p><p><b>Tamamlayıcı (yerel) eşpotansiyel</b>: banyo gibi tehlikeli yerlerde, aynı anda dokunulabilen metal kısımlar (metal küvet, borular, radyatör) birbirine ve PE’ye bağlanır.</p><p>Amaç: arıza veya yıldırım anında metaller arasında dokunma gerilimi oluşmasını engellemek.</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Bağlantı</th><th>Tipik en küçük kesit (Cu)</th></tr><tr><td>Ana eşpotansiyel iletkenleri</td><td>6 mm² (genelde 10–16 mm²)</td></tr><tr><td>Tamamlayıcı eşpotansiyel (korumalı)</td><td>2,5 mm²</td></tr><tr><td>Tamamlayıcı eşpotansiyel (korumasız)</td><td>4 mm²</td></tr></table></div>',
  uygulama:['Doğalgaz bağlantısı gaz şirketinin kurallarına göre yalıtım parçasının bina tarafından yapılır.','Plastik boru ile ayrılmış kısa metal parçalar bağlanmayabilir; metal sistem bütünlüğüne bak.','Kelepçe boyalı yüzeye değil, temizlenmiş metale takılır.'],
  sema:['esp','banyo'], ilgili:['banyo_bolge','dokunma_gerilimi','temel_topraklama']
});
konu({id:'banyo_bolge', kat:'topraklama', ikon:'🛁', sv:1, ad:'Banyo ve Islak Hacim Kuralları', ozet:'Bölge 0-1-2, IP değerleri, 30 mA KAR ve priz yasakları.', etiket:['banyo','ıslak hacim','bölge 0','bölge 1','bölge 2','ip44','tıraş prizi','hd 60364-7-701'],
  tanim:'<p>Banyoda vücut ıslak, deri direnci çok düşüktür. HD 60364-7-701 banyoyu bölgelere ayırır:</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Bölge</th><th>Sınır</th><th>İzin verilen</th></tr><tr><td>0</td><td>Küvet/duş teknesinin içi</td><td>Sadece SELV ≤ 12 V AC / 30 V DC, IPX7</td></tr><tr><td>1</td><td>Küvetin üstü, 2,25 m yüksekliğe kadar</td><td>Sabit cihazlar (termosifon, duş pompası), SELV aydınlatma; IPX4 (jet varsa IPX5). Priz ve anahtar yok</td></tr><tr><td>2</td><td>Bölge 1’in 60 cm dışı</td><td>Armatür, aspiratör, havlupan IPX4; priz yok (izolasyon trafolu tıraş prizi hariç)</td></tr><tr><td>Dışı</td><td>Bölgeler dışında</td><td>Priz olabilir (30 mA KAR, tercihen IP44 kapaklı)</td></tr></table></div><p>Banyodaki <b>tüm devreler 30 mA KAR</b> ile korunur. Anahtarlar banyo dışına veya bölgeler dışına konur.</p>',
  uygulama:['Çamaşır makinesi banyodaysa prizi bölgeler dışında, kapaklı ve 30 mA korumalı olmalı.','Duşakabinli banyoda bölge 1 duşun alanı + yüksekliği boyunca hesaplanır.','Elektrikli havlupan sabit bağlantıyla bölge 2’de olabilir.'],
  dikkat:['Lavabonun hemen altındaki normal priz en sık görülen hatadır.'],
  hesap:['kacak'], sema:['banyo','etanj','termosifon'], ilgili:['esp_teori','ip_ik','kar_tipleri']

konu({id:'yildirim', kat:'topraklama', ikon:'🌩️', sv:2, ad:'Yıldırımdan Korunma', ozet:'Dış koruma (paratoner) yıldırımı toprağa indirir; iç koruma (parafudr + eşpotansiyel) cihazları korur.', etiket:['yıldırım','paratoner','yakalama ucu','iniş iletkeni','lpl','lps','en 62305','aktif paratoner'],

konu({id:'trafo', kat:'makine', ikon:'🔃', sv:1, ad:'Transformatör (Trafo)', ozet:'AC gerilimi sarım oranına göre düşürür veya yükseltir. Zil trafosu, kumanda trafosu, izolasyon trafosu.', etiket:['trafo','transformatör','sarım oranı','primer','sekonder','izolasyon trafosu','ototrafo','zil trafosu','va'],
  tanim:'<p>Trafo, ortak bir demir çekirdek üzerine sarılmış iki sargıdan oluşur. Primer sargıdaki AC akım çekirdekte değişen bir manyetik akı oluşturur; bu akı sekonder sargıda gerilim indükler. Gerilimler <b>sarım sayılarıyla orantılıdır</b>. Trafo <b>DC’de çalışmaz</b>.</p><p>Güç (kayıplar hariç) iki tarafta aynıdır: gerilim düşürülürse akım artar. Trafolar <b>VA/kVA</b> ile anılır.</p>',
  cizim:'trafo',
  formul:[['U₁ / U₂ = N₁ / N₂ = I₂ / I₁', 'U: gerilim · N: sarım · I: akım'], ['S = U₂ × I₂', 'Sekonder gücü (VA)'], ['η = P<sub>çıkış</sub> / P<sub>giriş</sub>', 'Büyük dağıtım trafolarında %98–99, küçük trafolarda %80–90']],
  dene:{g:[['U1', 'Primer', 'V', 230], ['U2', 'Sekonder', 'V', 12], ['P', 'Yük', 'W', 60]], h:v => [['Sarım oranı', f(v.U1 / v.U2, 2) + ' : 1'], ['Sekonder akım', f(v.P / v.U2, 2) + ' A', 'v'], ['Primer akım (≈)', f(v.P / v.U1 / .85, 2) + ' A'], ['Önerilen trafo', Math.ceil(v.P * 1.25 / 10) * 10 + ' VA']]},
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tür</th><th>Kullanım</th></tr><tr><td>Zil/kumanda trafosu</td><td>8–24 V; zil, kilit, kontaktör kumanda</td></tr><tr><td>İzolasyon (güvenlik) trafosu</td><td>Galvanik ayrım; SELV, tıraş prizi, tıbbi alan</td></tr><tr><td>Ototrafo (varyak)</td><td>Ortak sargı; küçük gerilim değişimi; izolasyon YOK</td></tr><tr><td>Akım trafosu</td><td>Büyük akımı ölçüm için küçültür (ör. 200/5 A); sekonderi açık bırakılmaz</td></tr><tr><td>Dağıtım trafosu</td><td>34,5 kV → 400 V</td></tr></table></div>',
  uygulama:['LED spot/12 V halojen “elektronik trafolar” aslında anahtarlamalı güç kaynağıdır; minimum yük ve dimmer uyumuna dikkat.','Trafoyu %20–30 pay bırakarak seç; sürekli tam yükte ısınır.','Akım trafosunun sekonderini yük altında açık bırakmak tehlikeli yüksek gerilim üretir.'],
  dikkat:['Ototrafo ile yapılan düşük gerilim SELV değildir.'],
  sema:['zil2','kilit'], ilgili:['manyetizma','koruma_sinifi','smps']
});
konu({id:'jenerator', kat:'makine', ikon:'⛽', sv:2, ad:'Jeneratör (Alternatör)', ozet:'Devir ve kutup sayısı frekansı belirler. kVA, cos φ, motor kalkışı ve şebeke ile asla paralel bağlamamak.', etiket:['jeneratör','alternatör','kva','1500 devir','3000 devir','avr','transfer şalteri','komütatör','ats'],
  tanim:'<p>Jeneratör, dizel/benzinli bir motorun döndürdüğü alternatörle elektrik üretir. Üretilen frekans devirle orantılıdır: 4 kutuplu alternatör <b>1.500 d/d</b>’da, 2 kutuplu <b>3.000 d/d</b>’da 50 Hz üretir. 1.500 devirli jeneratörler daha sessiz ve uzun ömürlüdür.</p><p>Gücü <b>kVA</b> ile anılır; cos φ = 0,8 kabulüyle kW = kVA × 0,8. <b>AVR</b> (otomatik gerilim regülatörü) çıkış gerilimini sabit tutar. Motorlar kalkışta 3–7 kat akım çektiği için jeneratör seçimini çoğu zaman en büyük motorun kalkışı belirler.</p>',
  formul:[['f = p × n / 120', 'p: kutup sayısı · n: d/d'], ['P<sub>kW</sub> = S<sub>kVA</sub> × cos φ', 'cos φ genelde 0,8'], ['S<sub>gerekli</sub> ≈ (ΣP / 0,8) × 1,25', 'Basit seçim, motorlar ayrıca kontrol edilir']],
  dene:{g:[['P', 'Toplam yük', 'kW', 6], ['m', 'En büyük motor', 'kW', 1.5], ['k', 'Motor kalkış katsayısı', '', 3, [[3, 'Hidrofor/fan (≈ 3)'], [5, 'Kompresör/yüklü (≈ 5)'], [2, 'Sürücülü (≈ 2)']]]], h:v => { const s1 = v.P / 0.8 * 1.25, s2 = (v.P - v.m) / 0.8 + v.m * v.k / 0.8 * 0.6; const S = Math.max(s1, s2); return [['Sürekli yük için', f(s1, 1) + ' kVA'], ['Motor kalkışı için', f(s2, 1) + ' kVA'], ['Önerilen', '≥ ' + f(Math.ceil(S), 0) + ' kVA', 'v']]; }},
  uygulama:['Jeneratör ev tesisatına <b>komütatör (1-0-2)</b> veya ATS ile bağlanır; şebeke ve jeneratör asla aynı anda bağlı olmaz.','Taşınabilir jeneratörün gövdesi topraklanır; TT mantığıyla KAR kullanılır.','İnverterli jeneratörler elektronik cihazlar için daha temiz sinüs verir.'],
  dikkat:['Jeneratörü prizden “geri besleme” ile eve bağlamak: şebekeye gerilim verir, hattaki teknisyeni öldürebilir.'],
  hesap:['jenerator'], sema:['komutator_jen','ats'], ilgili:['guc_turleri','asenkron_motor','ups']
});
konu({id:'asenkron_motor', kat:'makine', ikon:'⚙️', sv:1, ad:'Asenkron (Endüksiyon) Motor', ozet:'Sanayinin beygiri: döner alan, kayma, kalkış akımı ve tork.', etiket:['asenkron motor','endüksiyon motoru','kafes rotor','kayma','senkron devir','kalkış akımı','tork','1450 devir'],
  tanim:'<p>Statordaki üç fazlı sargılar <b>döner manyetik alan</b> oluşturur. Bu alan, rotorun kafes çubuklarında akım indükler ve rotor alanı takip ederek döner. Rotor alanla tam aynı hızda dönemez (dönerse indüksiyon olmaz): aradaki farka <b>kayma</b> denir, tam yükte genellikle %2–6’dır. Bu yüzden 4 kutuplu bir motor 1.500 değil ≈ 1.450 d/d döner.</p><p>Kalkış anında motor durduğu için kayma %100’dür ve motor anma akımının <b>5–8 katı</b> akım çeker. Bu akım gerilim düşümüne ve sigorta seçimine etki eder.</p>',
  cizim:'kayma',
  formul:[['n<sub>s</sub> = 120 × f / p', 'Senkron devir (d/d); p: kutup sayısı'], ['s = (n<sub>s</sub> − n) / n<sub>s</sub>', 'Kayma'], ['T = 9550 × P / n', 'Tork (N·m); P: kW · n: d/d']],
  dene:{g:[['P', 'Motor gücü', 'kW', 5.5], ['n', 'Etiket devri', 'd/d', 1450]], h:v => { const ns = [3000, 1500, 1000, 750].find(x => x > v.n) || 3000, s = (ns - v.n) / ns; return [['Senkron devir', ns + ' d/d (' + (6000 / ns) + ' kutup)'], ['Kayma', '%' + f(s * 100, 1)], ['Tork', f(9550 * v.P / v.n, 1) + ' N·m', 'v']]; }},
  uygulama:['Motor yükü arttıkça devir biraz düşer, akım artar.','Kalkış akımını azaltmak için yıldız-üçgen, yumuşak yolverici veya frekans sürücüsü kullanılır.','Motor gövdesi mutlaka topraklanır.'],
  hesap:['motor'], sema:['dol','vfd'], ilgili:['motor_etiketi','yol_verme','faz_sirasi_teori','vfd_teori']
});
konu({id:'motor_etiketi', kat:'makine', ikon:'🏷️', sv:1, ad:'Motor Etiketi Okuma', ozet:'kW, V, A, cos φ, d/d, IP, izolasyon sınıfı, IE verimi… Etikette ne yazar, ne anlama gelir?', etiket:['motor etiketi','plaka','230/400','400/690','izolasyon sınıfı','f sınıfı','s1','ie3','servis faktörü'],
  tanim:'<p>Motor etiketi bağlantı ve korumanın anahtarıdır:</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Etiket</th><th>Anlamı</th></tr><tr><td>5,5 kW</td><td>Milden alınan mekanik güç</td></tr><tr><td>Δ/Y 230/400 V</td><td>230 V şebekede üçgen, 400 V şebekede yıldız bağlanır</td></tr><tr><td>Δ/Y 400/690 V</td><td>400 V şebekede üçgen; yıldız-üçgen yol vermeye uygun</td></tr><tr><td>19,5 / 11,3 A</td><td>Üçgen / yıldız bağlantıdaki anma akımları</td></tr><tr><td>cos φ 0,84</td><td>Tam yükteki güç faktörü</td></tr><tr><td>1450 min⁻¹</td><td>Tam yükte devir</td></tr><tr><td>IP55</td><td>Toz/su koruması</td></tr><tr><td>Iso. Cl. F</td><td>İzolasyon sınıfı (F: 155 °C)</td></tr><tr><td>S1</td><td>Sürekli çalışma rejimi</td></tr><tr><td>IE3</td><td>Verim sınıfı (IE1 &lt; IE2 &lt; IE3 &lt; IE4)</td></tr></table></div>',
  uygulama:['Termik ayarı etiketteki, şebekeye uygun bağlantının akımına göre yapılır.','Etiket okunmuyorsa: kW başına ≈ 2 A (400 V) kaba tahmin, sargı direnci ve devir ile motor sınıflanır.'],
  sema:['klemens','yildiz_ucgen'], ilgili:['yildiz_ucgen_iliski','termik_mks','asenkron_motor']
});
konu({id:'yol_verme', kat:'makine', ikon:'🚦', sv:2, ad:'Yol Verme Yöntemleri', ozet:'Direkt, yıldız-üçgen, yumuşak yolverici ve frekans sürücüsü: kalkış akımı ve tork karşılaştırması.', etiket:['yol verme','direkt yol verme','yıldız üçgen','soft starter','yumuşak yol verici','sürücü','kalkış akımı'],
  tanim:'<p>Motor kalkış akımı şebekede gerilim düşümüne, jeneratörü zorlamaya ve mekanik darbeye yol açar. Yol verme yöntemleri bu akımı azaltır:</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Yöntem</th><th>Kalkış akımı</th><th>Kalkış torku</th><th>Not</th></tr><tr><td>Direkt (DOL)</td><td>5–8 × I<sub>n</sub></td><td>Tam</td><td>Basit; küçük motorlar (≈ 4–5,5 kW’a kadar yaygın)</td></tr><tr><td>Yıldız-üçgen</td><td>≈ 1/3’ü</td><td>≈ 1/3’ü</td><td>400/690 V motor gerekir; yüksüz kalkış</td></tr><tr><td>Yumuşak yolverici</td><td>2–4 × I<sub>n</sub> (ayarlı)</td><td>Azaltılmış</td><td>Pompa ve fanlarda darbesiz kalkış</td></tr><tr><td>Frekans sürücüsü</td><td>≈ 1–1,5 × I<sub>n</sub></td><td>Tama yakın</td><td>Hız kontrolü + enerji tasarrufu</td></tr></table></div>',
  uygulama:['Hidroforda ve dalgıç pompada su darbesi ve kalkış akımı için yumuşak yolverici veya sürücü tercih edilir.','Jeneratörle beslenen motorlarda yol verme yöntemi jeneratör boyutunu doğrudan düşürür.'],
  sema:['dol','yildiz_ucgen','vfd'], ilgili:['asenkron_motor','vfd_teori','kontaktor']
});
konu({id:'tek_faz_motor', kat:'makine', ikon:'🌀', sv:2, ad:'Tek Fazlı Motorlar ve Kondansatör', ozet:'Tek faz döner alan üretmez; yardımcı sargı ve kondansatör gerekir. Kalkış ve daimi kondansatör farkı.', etiket:['tek faz motor','monofaze motor','kondansatör','yardımcı sargı','merkezkaç anahtar','kalkış kondansatörü','µf'],
  tanim:'<p>Tek faz akım sargıda sadece “nabız atan” bir alan oluşturur; motor kendiliğinden kalkmaz. Bu yüzden <b>yardımcı sargı</b> ve ona seri <b>kondansatör</b> eklenir; akım ≈ 90° kaydırılarak döner alan elde edilir.</p><ul><li><b>Daimi (çalışma) kondansatörü</b>: sürekli devrede; µF küçük, gerilimi 400–450 V AC.</li><li><b>Kalkış kondansatörü</b>: büyük µF, sadece kalkışta devrede; merkezkaç anahtar veya röle ile devreden çıkar.</li></ul><p>Yön değiştirmek için yalnız yardımcı sargının (veya yalnız ana sargının) uçları değiştirilir.</p>',
  uygulama:['Kondansatör bozulunca motor vınlar, elle çevrilince döner: ilk şüpheli kondansatördür.','Değiştirirken aynı µF ve en az aynı gerilim değeri kullanılır.','Klima dış ünitesinde kompresör ve fan kondansatörleri (çift kondansatör) sık arızalanır.'],
  dikkat:['Kondansatör enerji kesildikten sonra yüklü olabilir; kısa devre ederek deşarj et (direnç üzerinden).'],
  hesap:['motor','enerji'], sema:['mot1f','steinmetz'], ilgili:['kondansator','steinmetz_teori','asenkron_motor']
});
konu({id:'steinmetz_teori', kat:'makine', ikon:'🧪', sv:3, ad:'Üç Fazlı Motoru Tek Fazda Çalıştırma (Steinmetz)', ozet:'230/400 V motor üçgen bağlanıp bir kondansatörle 230 V’ta döndürülür. Güç %60–70’e düşer.', etiket:['steinmetz','kondansatörlü bağlantı','tek fazda üç faz motor','70 µf/kw'],
  tanim:'<p>Sadece tek faz şebeke olan yerlerde küçük (≈ 2,2 kW’a kadar) üç fazlı motorlar <b>Steinmetz bağlantısıyla</b> çalıştırılabilir. Motor üçgen bağlanır (etiket 230/400 V olmalı); iki köşe L–N’ye, üçüncü köşe kondansatör üzerinden köşelerden birine bağlanır.</p><p>Pratik kondansatör değeri 230 V’ta <b>≈ 70 µF/kW</b> (daimi). Ağır kalkışta bunun 2–3 katı kalkış kondansatörü kısa süre eklenir. Motor etiket gücünün ≈ %60–70’ini verebilir.</p>',
  formul:[['C ≈ 70 × P<sub>kW</sub>', 'µF, 230 V, daimi kondansatör'], ['P<sub>alınabilir</sub> ≈ 0,6–0,7 × P<sub>etiket</sub>', '']],
  dene:{g:[['P', 'Motor gücü', 'kW', 1.1]], h:v => [['Daimi kondansatör', '≈ ' + f(70 * v.P, 0) + ' µF / 450 V', 'v'], ['Kalkış kondansatörü (gerekirse)', '≈ ' + f(140 * v.P, 0) + '–' + f(200 * v.P, 0) + ' µF'], ['Alınabilecek güç', '≈ ' + f(v.P * 0.65, 2) + ' kW']]},
  dikkat:['400/690 V etiketli motor 230 V’ta Steinmetz ile verimsiz çalışır.','2,2 kW üstünde tek faz girişli frekans sürücüsü daha doğru çözümdür.'],
  sema:['steinmetz','klemens'], ilgili:['tek_faz_motor','vfd_teori']
});
konu({id:'vfd_teori', kat:'makine', ikon:'📶', sv:2, ad:'Frekans Sürücüsü (Inverter Sürücü)', ozet:'Frekansı değiştirerek motor hızını ayarlar. Pompada ve fanda büyük enerji tasarrufu.', etiket:['frekans sürücüsü','vfd','inverter sürücü','hız kontrol','v/f','pid','emc','enerji tasarrufu'],
  tanim:'<p>Sürücü, şebeke AC’sini önce DC’ye çevirir (doğrultucu + kondansatör), sonra transistörlerle istenen frekans ve gerilimde yeni bir 3 faz üretir. Motor devri frekansla orantılı değişir; gerilim de frekansla birlikte ayarlanır (V/f).</p><p>Pompa ve fanlarda güç devrin <b>kübüyle</b> değişir: devri %20 düşürmek gücü ≈ %50 azaltır. Hidroforda sürücü + basınç sensörü (PID) ile sabit basınç sağlanır.</p>',
  formul:[['n ≈ n<sub>anma</sub> × f / 50', 'Devir'], ['P₂ / P₁ = (n₂ / n₁)³', 'Pompa/fan güç-devir ilişkisi (afinite yasası)']],
  dene:{g:[['f', 'Çalışma frekansı', 'Hz', 40], ['P', 'Pompanın 50 Hz gücü', 'kW', 4]], h:v => { const r = v.f / 50; return [['Devir oranı', '%' + f(r * 100, 0)], ['Çekilen güç', f(v.P * r * r * r, 2) + ' kW', 'v'], ['Tasarruf', '%' + f((1 - r * r * r) * 100, 0)]]; }},
  uygulama:['Motor kablosu ekranlı olmalı, ekran iki uçta EMC rakorla topraklanmalı.','Tek faz girişli sürücü 3×230 V üretir: motor üçgen (230 V) bağlanır.','Sürücülü devrede KAR tipi F veya B olmalı.'],
  dikkat:['Sürücü çıkışına kondansatör, parafudr veya kontaktör (çalışırken açılan) konulmaz.','Sürücü kapatıldıktan sonra DC bara kondansatörleri birkaç dakika gerilimli kalır.'],
  hesap:['motor','pompa'], sema:['vfd','hidrofor'], ilgili:['yol_verme','asenkron_motor','pompa_egrisi','kar_tipleri']
});

/* I · AYDINLATMA */
konu({id:'lumen_luks', kat:'aydinlatma', ikon:'☀️', sv:1, ad:'Lümen, Lüks ve Candela', ozet:'Lamba ne kadar ışık verir (lm), masaya ne kadar ışık düşer (lx), ışık hangi yöne yoğun (cd)?', etiket:['lümen','lüks','candela','ışık akısı','aydınlık düzeyi','lux','en 12464','oda aydınlatması'],
  tanim:'<ul><li><b>Lümen (lm)</b>: kaynaktan çıkan toplam ışık miktarı (ışık akısı).</li><li><b>Lüks (lx)</b>: bir yüzeye düşen ışık; 1 lx = 1 lm/m².</li><li><b>Candela (cd)</b>: belli bir yöndeki ışık şiddeti; spotlarda önemlidir.</li></ul><p>Bir odanın yeterince aydınlık olup olmadığını <b>lüks</b> söyler. Gereken lümen; oda alanı, istenen lüks ve kayıplar (duvar rengi, armatür verimi, tavan yüksekliği) ile hesaplanır.</p>',
  formul:[['E = Φ / A', 'E: lx · Φ: lm · A: m²'], ['Φ<sub>gerekli</sub> = E × A / (η × MF)', 'η: kullanım faktörü (≈ 0,5–0,7) · MF: bakım faktörü (≈ 0,8)'], ['E = I / d²', 'Noktasal kaynakta d metre uzaktaki yüzeye dik düşen ışık']],
  dene:{g:[['E', 'İstenen aydınlık', 'lx', 300], ['A', 'Oda alanı', 'm²', 16], ['l', 'Bir lambanın akısı', 'lm', 1000]], h:v => { const F = v.E * v.A / (0.6 * 0.8); return [['Gereken toplam akı', f(F, 0) + ' lm', 'v'], ['Lamba sayısı', Math.ceil(F / v.l) + ' adet']]; }},
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Mekân</th><th>Önerilen (EN 12464-1 ve genel uygulama)</th></tr><tr><td>Koridor, merdiven</td><td>100 lx</td></tr><tr><td>Oturma odası (genel)</td><td>150–200 lx</td></tr><tr><td>Mutfak tezgâhı, banyo aynası</td><td>300–500 lx</td></tr><tr><td>Ofis masası</td><td>500 lx</td></tr><tr><td>Atölye, hassas işler</td><td>750–1000 lx</td></tr></table></div>',
