<style>
.tk-temel{--kr:var(--amber);--kr-lt:var(--amber-lt);--kr-md:var(--amber-md);}
.tk-ac,.tk-ucfaz,.tk-tesisat{--kr:var(--mg);--kr-lt:var(--mg-lt);--kr-md:var(--mg-md);}
.tk-guvenlik,.tk-koruma{--kr:var(--red);--kr-lt:var(--red-lt);--kr-md:var(--red-md);}
.tk-topraklama,.tk-gunes{--kr:var(--green);--kr-lt:var(--green-lt);--kr-md:var(--green-md);}
.tk-makine,.tk-klima,.tk-pompa{--kr:var(--cy);--kr-lt:var(--cy-lt);--kr-md:var(--cy-md);}
.tk-aydinlatma,.tk-elektronik{--kr:var(--amber);--kr-lt:var(--amber-lt);--kr-md:var(--amber-md);}
.tk-zayif{--kr:var(--purple);--kr-lt:var(--purple-lt);--kr-md:var(--purple-md);}
.tk-olcum,.tk-mevzuat,.tk-sozluk{--kr:var(--text2);--kr-lt:var(--surface2);--kr-md:var(--border2);}
.t-filtre{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.t-filtre .ek-cip{padding:5px 10px;font-size:11.5px;}
.t-liste{display:flex;flex-direction:column;gap:8px;}
.t-konu{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:border-color .3s var(--ease);}
.t-konu[open]{border-color:var(--kr-md,var(--border2));}
.t-konu>summary{display:flex;gap:12px;align-items:center;padding:12px 13px;cursor:pointer;list-style:none;}
.t-konu>summary::-webkit-details-marker{display:none;}
.t-konu>summary .ek-arac-ikon{width:38px;height:38px;font-size:18px;}
.t-konu>summary .t-ok{margin-left:auto;color:var(--text3);font-size:13px;transition:transform .3s var(--ease);flex-shrink:0;}
.t-konu[open]>summary .t-ok{transform:rotate(90deg);}
.t-sv{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;letter-spacing:.3px;}
.t-sv.s1{background:var(--green-lt);color:var(--green);} .t-sv.s2{background:var(--amber-lt);color:var(--amber);} .t-sv.s3{background:var(--red-lt);color:var(--red);}
.t-govde{padding:2px 14px 16px;border-top:1px solid var(--border);}
.t-bolum{margin-top:14px;}
.t-bolum>h4{font-size:11px;font-weight:700;color:var(--kr,var(--mg));text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.t-metin{font-size:13.8px;color:var(--text2);line-height:1.7;}
.t-metin b{color:var(--text);font-weight:600;}
.t-metin p+p{margin-top:8px;}
.t-metin ul,.t-metin ol{padding-left:20px;display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.t-benzetme{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--kr-lt,var(--mg-lt));border:1px solid var(--kr-md,var(--mg-md));font-size:13px;color:var(--text);line-height:1.6;}
.t-benzetme::before{content:'💭 ';}
.t-formuller{display:flex;flex-direction:column;gap:8px;}
.t-formul{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;}
.t-formul .f{font-family:var(--fm);font-size:16px;color:var(--text);font-weight:700;letter-spacing:.2px;}
.t-formul .f sub,.t-formul .f sup{font-size:.7em;}
.t-formul .a{font-size:12px;color:var(--text3);margin-top:5px;line-height:1.55;}
.t-dene{margin-top:10px;border:1px dashed var(--kr-md,var(--mg-md));border-radius:var(--r-md);padding:12px;background:var(--bg2);}
.t-dene>.b{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;}
.t-dene .ek-form{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
.t-dene .ek-giris input,.t-dene .ek-giris select{padding:9px 10px;font-size:14px;}
.t-dene .ek-giris.bvar input{padding-right:46px;}
.t-sonuc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.t-sonuc span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border2);color:var(--text2);}
.t-sonuc span b{font-family:var(--fm);color:var(--text);}
.t-sonuc span.v{border-color:var(--kr-md,var(--mg-md));background:var(--kr-lt,var(--mg-lt));}
.t-sonuc span.uy{border-color:var(--amber-md);background:var(--amber-lt);}
.t-ornek{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;font-size:13px;color:var(--text2);line-height:1.6;}
.t-ornek+.t-ornek{margin-top:8px;}
.t-ornek .s{color:var(--text);font-weight:600;}
.t-ornek ol{padding-left:20px;margin-top:6px;font-family:var(--fm);font-size:12px;line-height:1.8;}
.t-ornek .c{margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--green-lt);border:1px solid var(--green-md);color:var(--text);font-weight:600;font-size:12.5px;display:inline-block;}
.t-dikkat li{list-style:none;position:relative;padding-left:22px;}
.t-dikkat li::before{content:'⚠️';position:absolute;left:0;font-size:12px;top:1px;}
.t-bag{display:flex;flex-wrap:wrap;gap:6px;}
.t-bag a{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);text-decoration:none;font-weight:600;}
.t-bag a:hover{border-color:var(--mg-md);color:var(--text);}
.t-bag a.h{border-color:var(--cy-md);} .t-bag a.s{border-color:var(--green-md);} .t-bag a.k{border-color:var(--amber-md);}
.t-cz{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;}
.t-cz .cz-svg{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.t-cz svg{display:block;width:100%;min-width:480px;max-width:660px;margin:0 auto;height:auto;font-family:Inter,system-ui,sans-serif;}
.t-cz .kt{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px;margin-top:8px;}
.t-cz label{font-size:11.5px;color:var(--text2);display:flex;flex-direction:column;gap:3px;}
.t-cz label b{font-family:var(--fm);color:var(--text);}
.t-cz input[type=range]{width:100%;accent-color:var(--mg);}
.t-cz .cz-not{font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.5;}
.t-cz .cz-btn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.cz-y{fill:var(--text2);font-size:11px;} .cz-k{fill:var(--text);font-weight:700;font-size:12px;} .cz-c{stroke:var(--text3);fill:none;stroke-width:1.2;} .cz-g{stroke:var(--border2);stroke-width:1;}
@keyframes czAkis{to{stroke-dashoffset:-24;}}
.cz-akis{stroke-dasharray:6 6;animation:czAkis .8s linear infinite;}
@keyframes czDon{to{transform:rotate(360deg);}}
.cz-don{animation:czDon 4s linear infinite;transform-box:view-box;}
.t-tablo-w{margin-top:10px;overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);}
.t-tablo-w .ek-tablo td{white-space:normal;min-width:70px;}
.t-ust-btn{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;}
/* test */
.t-test-kart{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--kr-md,var(--border2));border-radius:var(--r-md);padding:11px 13px;margin-top:2px;}
.t-test-kart .a{font-size:12.5px;color:var(--text2);} .t-test-kart .a b{color:var(--text);}
.t-soru{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;background:var(--bg2);}
.t-soru+.t-soru{margin-top:10px;}
.t-soru .s{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:8px;}
.t-soru button{display:block;width:100%;text-align:left;padding:9px 11px;margin-top:6px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:13px;line-height:1.4;}
.t-soru button.d{border-color:var(--green-md);background:var(--green-lt);color:var(--text);}
.t-soru button.y{border-color:var(--red-md);background:var(--red-lt);color:var(--text);}
.t-soru .ac{display:none;margin-top:8px;font-size:12.5px;color:var(--text2);line-height:1.55;padding:8px 10px;border-left:3px solid var(--cy);background:var(--cy-lt);border-radius:0 8px 8px 0;}
.t-soru.cevap .ac{display:block;}
.t-puan{margin-top:12px;font-size:14px;font-weight:700;text-align:center;}
/* sözlük */
.t-szk{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}
.t-szk div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--text2);line-height:1.5;}
.t-szk div b{color:var(--text);display:block;font-size:13.5px;margin-bottom:2px;}
.t-szk a{color:var(--cy);font-size:11.5px;text-decoration:none;font-weight:600;}
.t-harf{font-size:12px;font-weight:800;color:var(--mg);margin:14px 2px 6px;}
mark{background:var(--amber-md);color:inherit;border-radius:3px;padding:0 1px;}
</style>
</head>

<script>
const SEMA_AD = {"tekli": "Tekli Anahtar", "komutator": "Komütatör (İkili) Anahtar", "vavien": "Vavien Anahtar", "capraz": "Vavien + Ara (Çapraz) Anahtar", "cok_nokta": "Dört Noktadan Kontrol (2 Ara Anahtar)", "impuls": "Darbe (İmpuls) Rölesi", "merdiven4": "Merdiven Otomatiği", "merdiven3": "Merdiven Otomatiği", "pir": "Hareket Sensörü (PIR) + Elle Köprüleme", "foto": "Foto Röle + Zaman Saati", "dimmer": "Dimmer (Işık Ayarı)", "led_serit": "LED Şerit + Sürücü (İki Uçtan Besleme)", "isikli": "Işıklı Anahtar ve Kontrol Lambalı Anahtar", "akilli": "Akıllı Anahtar", "led_tup": "Floresandan LED Tüpe Dönüşüm", "zil": "Kapı Zili (230 V)", "zil2": "Trafolu Zil (8–12 V)", "kilit": "Elektrikli Kapı Kilidi (2 noktadan açma)", "bahce": "Bahçe + Bina Kapısı (2 panel, 2 kilit)", "interkom": "İnterkom (Daireler/Odalar Arası Konuşma)", "offgrid": "Off-Grid Güneş Sistemi (Bağ Evi)", "aku_baglama": "Akü Bağlama", "ongrid": "On-Grid (Şebeke Bağlı) Güneş Sistemi", "hibrit": "Hibrit İnverter (Şebeke + Akü + Panel)", "panel_dizi": "Panel Dizisi", "klima": "Split Klima", "klima_dis": "Split Klima", "kombi": "Kombi + Kablolu Oda Termostatı", "kombi_rf": "Kombi + Kablosuz (RF) Oda Termostatı", "isi_pompasi": "Isı Pompası", "zon_vana": "İki Bölgeli Isıtma", "dol": "Direkt Yol Verme", "iki_yer": "Motoru İki Yerden Kumanda", "ileri_geri": "İleri-Geri Çalıştırma (Elektriksel Kilitlemeli)", "yildiz_ucgen": "Yıldız-Üçgen Yol Verme (Zaman Rölesiyle)", "klemens": "Motor Klemens Kutusu", "mot1f": "Tek Fazlı Kondansatörlü Motor", "steinmetz": "Steinmetz", "vfd": "Frekans Sürücüsü (VFD) ile Motor Kontrolü", "hidrofor": "Hidrofor", "dalgic": "Dalgıç Pompa", "depo": "Depo Doldurma", "depo_hidrofor": "Depo + Hidrofor", "multimetre": "Multimetre Kullanımı", "pens": "Pens Ampermetre ile Akım Ölçme", "megger": "İzolasyon Direnci Ölçümü (Megger)", "toprak_olcum": "Topraklama Direnci Ölçümü (3 Kazık / %62)", "faz_sirasi": "Faz Sırası Ölçümü", "semboller": "Elektrik Tesisat Sembolleri", "plan_sembol": "Proje Okuma", "pano_1f": "Tek Fazlı Konut Panosu (Sigorta Kutusu)", "pano_3f": "Üç Fazlı Konut Panosu (Faz Dağıtımı)", "kofre": "Kofre → Sayaç → Pano (PEN Ayrımı)", "sayac": "Tek Fazlı Sayaç Bağlantısı (1-3 / 4-6)", "baralar": "Nötr ve Toprak Barası Düzeni", "spd": "Parafudr (Aşırı Gerilim Koruma, Tip 2)", "gerilim_koruma": "Gerilim Koruma Rölesi (Düşük / Yüksek Gerilim)", "faz_kontrol": "Faz Sırası ve Faz Kontrol Rölesi", "komutator_jen": "Elle Şebeke-Jeneratör Komütatörü (1-0-2)", "ats": "ATS", "ups_bypass": "UPS + Bakım Bypass Şalteri", "zaman_saati": "Zaman Saati ile Kontaktör Kontrolü", "kontaktor_yuk": "Termostat + Kontaktörlü Elektrikli Isıtıcı (3 Faz)", "priz": "Topraklı (Schuko) Priz", "priz_paralel": "Prizden Prize Paralel Geçiş (Linye)", "anahtarli_priz": "Anahtarlı Priz", "priz_anahtar": "Aynı Kutuda Priz + Anahtar (Kombine)", "usb_priz": "USB’li Priz", "cee": "3 Fazlı CEE Priz (16/32 A, 5 Pin)", "etanj": "Dış Mekan (Etanj) Priz + 30 mA KAR", "termosifon": "Termosifon + Zaman Saati + Çift Kutuplu Anahtar", "renk": "Kablo Renk Kodları", "tncs": "TN-C-S Sistemi", "tt": "TT Sistemi", "tns": "TN-S Sistemi", "esp": "Ana Eşpotansiyel Bara (AEB)", "banyo": "Banyo Bölgeleri ve Tamamlayıcı Eşpotansiyel", "kar_prensip": "Kaçak Akım Rölesi Nasıl Çalışır?", "paratoner": "Paratoner (Yıldırımdan Korunma)", "lnb_tek": "Uydu Çanağı", "lnb_twin": "Twin LNB", "diseqc": "DiSEqC", "multiswitch": "Multiswitch", "birlestirici": "Uydu + Karasal Tek Kabloda (Birleştirici)", "anten_amp": "Karasal Anten", "rj45": "RJ45 Dizilimi", "ag_topoloji": "Ev / Ofis Ağ Topolojisi", "kamera": "IP Kamera Sistemi", "fiber_ont": "Fiber İnternet (FTTH)", "diafon_tek": "Diafon", "diafon_apt": "Diafon", "diafon_2tel": "2 Telli Dijital Diafon (Bus)", "goruntulu": "Görüntülü Diafon (2 telli)"};
/* ============================================================
   GÜN TEKNİK · EL KİTABI — TEORİ MOTORU
   Konu: {id, kat, ad, ikon, sv(1-3), ozet, etiket[], tanim, benzetme, cizim, ek,
          formul:[[f, açıklama]], dene:{g:[[k, etiket, birim, varsayılan, seçenek?]], h:v=>[[ad, değer, sınıf?]]},
          uygulama[], ornek:[{s, a[], c}], dikkat[], hesap[], sema[], ilgili[]}
   ============================================================ */
const TK = [
  {id:'temel', ad:'Temel Elektrik', ikon:'⚡'}, {id:'ac', ad:'Alternatif Akım', ikon:'〰️'}, {id:'ucfaz', ad:'Üç Fazlı Sistemler', ikon:'🔺'},
  {id:'tesisat', ad:'Tesisat Hesap Teorisi', ikon:'📐'}, {id:'guvenlik', ad:'Güvenlik', ikon:'🦺'}, {id:'koruma', ad:'Koruma Cihazları', ikon:'🛡️'},
  {id:'topraklama', ad:'Topraklama', ikon:'🌍'}, {id:'makine', ad:'Makineler', ikon:'⚙️'}, {id:'aydinlatma', ad:'Aydınlatma', ikon:'💡'},
  {id:'elektronik', ad:'Elektronik ve Akü', ikon:'🔋'}, {id:'gunes', ad:'Güneş Enerjisi', ikon:'☀️'}, {id:'klima', ad:'Klima ve Soğutma', ikon:'❄️'},
  {id:'pompa', ad:'Pompa ve Su', ikon:'💧'}, {id:'zayif', ad:'Zayıf Akım ve Haberleşme', ikon:'📡'}, {id:'olcum', ad:'Ölçme', ikon:'📏'},
  {id:'mevzuat', ad:'Yönetmelik ve Standartlar', ikon:'📜'}
];
const T = {konular:[], harita:{}, test:{}, sozluk:[], kat:'hepsi', sv:0, ara:'', cz:{}};
const CZ = {};
function konu(o){ if(T.harita[o.id]) console.warn('çift konu', o.id); T.konular.push(o); T.harita[o.id] = o; }
function test(kat, L){ T.test[kat] = L; }
function sozluk(L){ T.sozluk = T.sozluk.concat(L); }
const $t = id => document.getElementById(id);
const nrm = s => String(s).toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
const duz = h => String(h || '').replace(/<[^>]+>/g, ' ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const SVA = {1:'TEMEL', 2:'ORTA', 3:'İLERİ'};
const HESAP_ADI = {kablo:'Kablo kesiti ve sigorta', gd:'Gerilim düşümü', kisadevre:'Kısa devre', kacak:'Kaçak akım rölesi', topraklama:'Topraklama', yuk:'Toplam güç', proje:'Proje modu', jenerator:'Jeneratör', ups:'UPS / akü', gunes:'Güneş sistemi', klima_btu:'Klima BTU', klima_tesisat:'Klima montaj', pompa:'Pompa', motor:'Motor akımı', uydu:'Uydu sinyali', fiber:'Fiber kayıp', ag:'Ağ / PoE', aydinlatma:'Aydınlatma', boru:'Boru doluluk', ev:'Araç şarjı', kompanzasyon:'Kompanzasyon', kesit:'Kesit doğrulama', maliyet:'Elektrik maliyeti', enerji:'Enerji / kondansatör', guc:'Güç hesabı', hizli:'Hızlı hesap', cevirici:'Birim çevirici', renk:'Direnç renk kodu'};

/* ── Konu gövdesi ── */
function konuGovde(k){
  let h = '';
  const bol = (ikon, ad, ic) => `<div class="t-bolum"><h4>${ikon} ${ad}</h4>${ic}</div>`;
  h += bol('📖', 'Tanım', `<div class="t-metin">${k.tanim || ''}</div>` + (k.benzetme ? `<div class="t-benzetme">${k.benzetme}</div>` : '') + (k.cizim && CZ[k.cizim] ? `<div class="t-cz" data-czk="${k.id}" data-cz="${k.cizim}"></div>` : '') + (k.ek ? `<div class="t-metin" style="margin-top:10px">${k.ek}</div>` : ''));
  if(k.formul && k.formul.length || k.dene) h += bol('🧮', 'Formül', (k.formul ? `<div class="t-formuller">${k.formul.map(([f, a]) => `<div class="t-formul"><div class="f">${f}</div>${a ? `<div class="a">${a}</div>` : ''}</div>`).join('')}</div>` : '') + (k.dene ? deneHtml(k) : ''));
  if(k.uygulama) h += bol('🔧', 'Uygulamada', `<div class="t-metin">${Array.isArray(k.uygulama) ? '<ul>' + k.uygulama.map(x => `<li>${x}</li>`).join('') + '</ul>' : k.uygulama}</div>`);
  if(k.ornek) h += bol('✍️', 'Örnek', (Array.isArray(k.ornek) ? k.ornek : [k.ornek]).map(o => `<div class="t-ornek"><div class="s">${o.s}</div>${o.a ? `<ol>${o.a.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}${o.c ? `<div class="c">✅ ${o.c}</div>` : ''}</div>`).join(''));
  if(k.dikkat && k.dikkat.length) h += bol('⚠️', 'Dikkat', `<div class="t-metin"><ul class="t-dikkat">${k.dikkat.map(x => `<li>${x}</li>`).join('')}</ul></div>`);
  const bag = (k.hesap || []).map(x => `<a class="h" href="hesap.html#${x}">🔢 Hesapla: ${HESAP_ADI[x.split('?')[0]] || x} →</a>`)

      const terim = x => `<div><b>${x[0]}</b>${x[1]}${x[2] && T.harita[x[2]] ? ` <a href="#${x[2]}" onclick="return konuGit('${x[2]}')">→ ${T.harita[x[2]].ad}</a>` : ''}</div>`;
      Object.keys(grup).forEach(hr => { h += (hr ? `<div class="t-harf">${hr}</div>` : '') + `<div class="t-szk">${grup[hr].map(terim).join('')}</div>`; });

  $t('t-filtre').innerHTML = T.kat === 'sozluk' ? '' : [[0, 'Tüm seviyeler'], [1, '🟢 Temel'], [2, '🟡 Orta'], [3, '🔴 İleri']].map(([v, a]) => `<button class="ek-cip${T.sv === v ? ' aktif' : ''}" onclick="T.sv=${v};tListe()">${a}</button>`).join('');

/* ============================================================
   TEORİ — ETKİLEŞİMLİ ÇİZİMLER (CZ)
   CZ[id] = {k:[[anahtar, etiket, min, max, adım, varsayılan, biçim]], btn:[[id, ad]], ilk, tik(st,b), ciz(st) → svg | {svg, not}}

const SVGB = (w, h, ic) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${ic}</svg>`;
const yol = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');

/* 1 · Su benzetmesi (Ohm) */
CZ.su = {k:[['U', 'Gerilim (su basıncı)', 1, 24, 1, 12, v => v + ' V'], ['R', 'Direnç (boru darlığı)', 1, 20, 1, 6, v => v + ' Ω']],
  ciz:st => { const I = st.U / st.R, h = 20 + st.U * 6.5, dar = Math.max(4, 30 - st.R * 1.3), hiz = Math.max(.15, 2.4 / Math.max(.2, I));
    return {svg:SVGB(600, 230, `<rect x="40" y="40" width="110" height="170" rx="6" fill="none" stroke="var(--text3)" stroke-width="2"/><rect x="42" y="${208 - h}" width="106" height="${h}" fill="var(--cy-md)"/>` + cy(95, 30, 'Depo yüksekliği = gerilim', {s:11}) +
      `<rect x="150" y="${190 - 15}" width="140" height="30" fill="var(--cy-md)" stroke="var(--text3)"/><rect x="290" y="${190 - dar / 2}" width="120" height="${dar}" fill="var(--cy-md)" stroke="var(--amber)" stroke-width="2"/><rect x="410" y="175" width="150" height="30" fill="var(--cy-md)" stroke="var(--text3)"/>` +
      cy(350, 160 - dar / 2, 'dar boru = direnç', {s:11, r:RENK.am}) + `<line x1="160" y1="190" x2="550" y2="190" stroke="var(--cy)" stroke-width="3" class="cz-akis" style="animation-duration:${hiz.toFixed(2)}s"/>` +
      cy(480, 140, `Akış = akım ≈ ${f(I, 2)} A`, {c:'cz-k', s:15})), not:`I = U / R = ${st.U} / ${st.R} = <b>${f(I, 2)} A</b>. Basıncı artır → akış artar; boruyu daralt → akış azalır.`}; }};

/* 2 · Sinüs ve efektif değer */
CZ.sinus = {k:[['f', 'Frekans', 10, 60, 1, 50, v => v + ' Hz'], ['U', 'Efektif gerilim', 12, 400, 1, 230, v => v + ' V']],
  ciz:st => { const Up = st.U * Math.SQRT2, T = 1000 / st.f, W = 520, x0 = 50, y0 = 130, A = 95, sure = 40; const pts = [];
    for(let i = 0; i <= 300; i++){ const t = i / 300 * sure; pts.push([x0 + i / 300 * W, y0 - A * Math.sin(2 * Math.PI * st.f * t / 1000)]); }
    const yr = A / Math.SQRT2;
    return {svg:SVGB(600, 260, `<line x1="${x0}" y1="${y0}" x2="${x0 + W}" y2="${y0}" class="cz-g"/><line x1="${x0}" y1="25" x2="${x0}" y2="235" class="cz-g"/>` +
      `<line x1="${x0}" y1="${y0 - yr}" x2="${x0 + W}" y2="${y0 - yr}" stroke="var(--green)" stroke-dasharray="6 5"/><line x1="${x0}" y1="${y0 - A}" x2="${x0 + W}" y2="${y0 - A}" stroke="var(--red)" stroke-dasharray="3 5"/>` +
      `<path d="${yol(pts)}" fill="none" stroke="var(--mg)" stroke-width="2.6"/>` + cy(x0 + W - 4, y0 - A - 6, `tepe ${f(Up, 0)} V`, {a:'end', r:RENK.rd}) + cy(x0 + W - 4, y0 - yr - 6, `efektif ${st.U} V`, {a:'end', r:RENK.gr}) +
      cy(x0 + W, y0 + 18, '0–40 ms', {a:'end'}) + (T <= sure ? `<line x1="${x0}" y1="${y0 + 108}" x2="${x0 + T / sure * W}" y2="${y0 + 108}" stroke="var(--cy)" stroke-width="2"/>` + cy(x0 + T / sure * W / 2, y0 + 102, `T = ${f(T, 1)} ms`, {r:RENK.cy}) : '')),
      not:`Tepe değer = efektif × √2 = ${st.U} × 1,414 = <b>${f(Up, 0)} V</b>. Periyot T = 1/f = <b>${f(T, 1)} ms</b>; saniyede ${st.f} tam dalga.`}; }};

/* 3 · Faz farkı (gerilim–akım) */
CZ.faz = {k:[['p', 'Faz açısı φ', -90, 90, 1, 30, v => (v > 0 ? '+' : '') + v + '°']],
  ciz:st => { const W = 520, x0 = 50, y0 = 120, sure = 30, g = [], a = [];
    for(let i = 0; i <= 260; i++){ const t = i / 260 * sure, w = 2 * Math.PI * 50 * t / 1000; g.push([x0 + i / 260 * W, y0 - 85 * Math.sin(w)]); a.push([x0 + i / 260 * W, y0 - 55 * Math.sin(w - st.p * Math.PI / 180)]); }
    const c = Math.cos(st.p * Math.PI / 180), tip = st.p > 2 ? 'endüktif (akım geride: motor, bobin, balast)' : st.p < -2 ? 'kapasitif (akım ileride: kondansatör, uzun kablo boşta)' : 'omik (direnç: ısıtıcı, akkor lamba)';
    return {svg:SVGB(600, 240, `<line x1="${x0}" y1="${y0}" x2="${x0 + W}" y2="${y0}" class="cz-g"/><path d="${yol(g)}" fill="none" stroke="var(--mg)" stroke-width="2.6"/><path d="${yol(a)}" fill="none" stroke="var(--cy)" stroke-width="2.6"/>` +
      cy(70, 26, '— gerilim u', {a:'start', r:RENK.mg}) + cy(190, 26, '— akım i', {a:'start', r:RENK.cy}) + cy(560, 226, `cos φ = ${f(c, 2)}`, {a:'end', c:'cz-k', s:15})), not:`Yük ${tip}. cos φ = <b>${f(c, 2)}</b>: çekilen akımın ${f(c * 100, 0)}%’i iş yapar.`}; }};

/* 4 · Güç üçgeni ve kompanzasyon */
CZ.guc = {k:[['P', 'Aktif güç P', 1, 50, 1, 10, v => v + ' kW'], ['c', 'cos φ', 50, 100, 1, 75, v => (v / 100).toFixed(2).replace('.', ',')]],
  ciz:st => { const c = st.c / 100, P = st.P, phi = Math.acos(c), Q = P * Math.tan(phi), S = P / c, Qh = P * Math.tan(Math.acos(.95)), Qc = Math.max(0, Q - Qh);
    const k = 360 / Math.max(P, S, 1), x0 = 90, y0 = 210, px = x0 + P * k, qy = y0 - Q * k;
    return {svg:SVGB(600, 240, `<line x1="${x0}" y1="${y0}" x2="${px}" y2="${y0}" stroke="var(--green)" stroke-width="4"/><line x1="${px}" y1="${y0}" x2="${px}" y2="${Math.max(10, qy)}" stroke="var(--amber)" stroke-width="4"/><line x1="${x0}" y1="${y0}" x2="${px}" y2="${Math.max(10, qy)}" stroke="var(--mg)" stroke-width="4"/>` +
      (Qc > 0 ? `<line x1="${x0}" y1="${y0}" x2="${px}" y2="${y0 - Qh * k}" stroke="var(--cy)" stroke-width="2" stroke-dasharray="6 5"/>` : '') +
      cy((x0 + px) / 2, y0 + 20, `P = ${f(P, 1)} kW`, {r:RENK.gr, c:'cz-k'}) + cy(px + 8, (y0 + qy) / 2, `Q = ${f(Q, 1)} kVAr`, {a:'start', r:RENK.am, c:'cz-k'}) + cy((x0 + px) / 2 - 30, (y0 + qy) / 2 - 10, `S = ${f(S, 1)} kVA`, {r:RENK.mg, c:'cz-k', a:'end'}) +
      `<path d="M${x0 + 40} ${y0} A40 40 0 0 0 ${x0 + 40 * c} ${y0 - 40 * Math.sin(phi)}" fill="none" stroke="var(--text3)"/>` + cy(x0 + 50, y0 - 8, 'φ', {a:'start'})),
      not:`Akım S ile orantılıdır: aynı ${P} kW iş için cos φ = ${f(c, 2)} iken ${f(S, 1)} kVA çekilir. cos φ’yi 0,95’e çıkarmak için ≈ <b>${f(Qc, 1)} kVAr</b> kondansatör gerekir (mavi kesik çizgi).`}; }};

/* 5 · Üç faz */
CZ.ucfaz = {k:[['t', 'Zaman', 0, 20, 0.5, 2.5, v => f(v, 1) + ' ms']],
  ciz:st => { const W = 360, x0 = 30, y0 = 120, A = 80, R = ['var(--c-l1,#B8682E)', '#888', 'var(--cy)'], ad = ['L1', 'L2', 'L3']; let s = `<line x1="${x0}" y1="${y0}" x2="${x0 + W}" y2="${y0}" class="cz-g"/>`;
    for(let p = 0; p < 3; p++){ const pts = []; for(let i = 0; i <= 200; i++){ const t = i / 200 * 20; pts.push([x0 + i / 200 * W, y0 - A * Math.sin(2 * Math.PI * 50 * t / 1000 - p * 2 * Math.PI / 3)]); } s += `<path d="${yol(pts)}" fill="none" stroke="${R[p]}" stroke-width="2.4"/>`; }
    const xt = x0 + st.t / 20 * W; s += `<line x1="${xt}" y1="30" x2="${xt}" y2="210" stroke="var(--mg)" stroke-dasharray="4 4"/>`;
    const cx = 500, cyy = 120, v = [];
    for(let p = 0; p < 3; p++){ const a = 2 * Math.PI * 50 * st.t / 1000 - p * 2 * Math.PI / 3; v.push(Math.sin(a)); s += `<line x1="${cx}" y1="${cyy}" x2="${cx + 75 * Math.cos(a)}" y2="${cyy - 75 * Math.sin(a)}" stroke="${R[p]}" stroke-width="3.5"/>` + cy(cx + 90 * Math.cos(a), cyy - 90 * Math.sin(a) + 4, ad[p], {c:'cz-k'}); }
    s += `<circle cx="${cx}" cy="${cyy}" r="75" fill="none" class="cz-g"/>`;
    return {svg:SVGB(600, 230, s), not:`Bu anda anlık değerler: L1 ${f(325 * v[0], 0)} V · L2 ${f(325 * v[1], 0)} V · L3 ${f(325 * v[2], 0)} V. Toplamları her an <b>0</b>’dır — dengeli yükte nötrden akım geçmemesinin sebebi budur.`}; }};

/* 6 · Yıldız / üçgen */
CZ.yd = {ilk:() => ({m:'Y'}), btn:[['Y', '⭐ Yıldız (Y)'], ['D', '🔺 Üçgen (Δ)']], tik:(st, b) => { st.m = b; },
  ciz:st => { let s = '';
    if(st.m === 'Y'){ const c = [300, 130], u = [[300, 40], [222, 175], [378, 175]];
      u.forEach((p, i) => { s += `<line x1="${c[0]}" y1="${c[1]}" x2="${p[0]}" y2="${p[1]}" stroke="var(--mg)" stroke-width="5"/>` + cy(p[0] + (i === 1 ? -26 : i === 2 ? 26 : 0), p[1] + (i ? 10 : -10), ['U', 'V', 'W'][i], {c:'cz-k'}); });
      s += `<circle cx="300" cy="130" r="6" fill="var(--cy)"/>` + cy(330, 134, 'yıldız noktası (N)', {a:'start', r:RENK.cy}) + cy(120, 60, 'Sargı gerilimi = 230 V', {r:RENK.mg, c:'cz-k'}) + cy(120, 80, 'Hat gerilimi = 400 V', {}) + cy(120, 100, 'Hat akımı = sargı akımı', {}); }
    else { const u = [[300, 40], [210, 195], [390, 195]]; for(let i = 0; i < 3; i++){ const a = u[i], b = u[(i + 1) % 3]; s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--mg)" stroke-width="5"/>`; s += cy(a[0] + (i === 1 ? -20 : i === 2 ? 20 : 0), a[1] + (i ? 14 : -10), ['U', 'V', 'W'][i], {c:'cz-k'}); }
      s += cy(120, 60, 'Sargı gerilimi = 400 V', {r:RENK.mg, c:'cz-k'}) + cy(120, 80, 'Hat akımı = √3 × sargı akımı', {}) + cy(120, 100, 'Nötr yok', {}); }
    return {svg:SVGB(600, 220, s), not:st.m === 'Y' ? 'Yıldızda her sargıya faz-nötr gerilimi (230 V) düşer. 400 V = 230 V × √3.' : 'Üçgende her sargı iki faz arasına bağlıdır: sargıya 400 V düşer, hattan sargı akımının 1,73 katı çekilir.'}; }};

/* 7 · Nötr kopması */
CZ.notr = {ilk:() => ({kop:false}), k:[['a', 'L1 yükü', 0, 3000, 50, 2000, v => v + ' W'], ['b', 'L2 yükü', 0, 3000, 50, 300, v => v + ' W'], ['c', 'L3 yükü', 0, 3000, 50, 1000, v => v + ' W']], btn:[['kop', '✂️ Nötrü kopar / bağla']], tik:st => { st.kop = !st.kop; },
  ciz:st => { const P = [st.a, st.b, st.c], Y = P.map(p => p / 230 / 230), ang = [0, -2 * Math.PI / 3, 2 * Math.PI / 3];
    const V = ang.map(a => [230 * Math.cos(a), 230 * Math.sin(a)]); let vn = [0, 0];
    if(st.kop){ const sy = Y.reduce((a, b) => a + b, 0); if(sy > 0) vn = [V.reduce((t, v, i) => t + v[0] * Y[i], 0) / sy, V.reduce((t, v, i) => t + v[1] * Y[i], 0) / sy]; }
    const U = V.map((v, i) => P[i] ? Math.hypot(v[0] - vn[0], v[1] - vn[1]) : null);
    let s = ''; U.forEach((u, i) => { const x = 90 + i * 170, iyi = u == null || (u > 207 && u < 253), r = u == null ? 'var(--text3)' : iyi ? 'var(--green)' : u > 253 ? 'var(--red)' : 'var(--amber)';
      s += `<rect x="${x - 60}" y="40" width="120" height="110" rx="10" fill="none" stroke="${r}" stroke-width="2.5"/>` + cy(x, 66, 'L' + (i + 1) + ' · ' + P[i] + ' W', {c:'cz-k'}) + cy(x, 108, u == null ? '—' : f(u, 0) + ' V', {s:24, r}) + cy(x, 136, u == null ? 'yük yok' : iyi ? 'normal' : u > 253 ? 'AŞIRI GERİLİM!' : 'düşük gerilim', {r}); });
    s += cy(300, 190, st.kop ? '⚠ NÖTR KOPUK: yıldız noktası kaydı' : 'Nötr bağlı: her yük 230 V', {c:'cz-k', r:st.kop ? RENK.rd : RENK.gr});
    return {svg:SVGB(600, 210, s), not:st.kop ? 'Nötr kopunca az yüklü fazdaki cihazlar 400 V’a yaklaşan gerilim alır ve yanar; çok yüklü fazdakiler düşük gerilimde kalır. Yükleri değiştirip dene.' : 'Nötr sağlamken her faz kendi 230 V’unu görür, yükler birbirini etkilemez.'}; }};

/* 8 · Akımın vücuda etkisi (IEC 60479-1, basitleştirilmiş bölgeler) */
CZ.vucut = {k:[['i', 'Akım (log ölçek)', 0, 100, 1, 55, v => f(czmA(v), czmA(v) < 1 ? 1 : 0) + ' mA'], ['t', 'Süre', 10, 2000, 10, 500, v => v + ' ms']],
  ciz:st => { const I = czmA(st.i), b = czBolge(I, st.t), X = v => 60 + (Math.log10(v) + 1) / 4 * 500, Yt = t => 200 - (Math.log10(t) - 1) / (Math.log10(5000) - 1) * 170;
    const egri = (fn) => { const p = []; for(let t = 10; t <= 5000; t *= 1.15) p.push([X(fn(t)), Yt(t)]); return yol(p); };
    let s = `<rect x="60" y="30" width="500" height="170" fill="var(--bg)"/>` + `<line x1="${X(.5)}" y1="30" x2="${X(.5)}" y2="200" stroke="var(--green)" stroke-width="1.5"/>` +
      `<path d="${egri(czB)}" fill="none" stroke="var(--amber)" stroke-width="2"/><path d="${egri(czC)}" fill="none" stroke="var(--red)" stroke-width="2"/>` +
      `<line x1="${X(30)}" y1="30" x2="${X(30)}" y2="200" stroke="var(--cy)" stroke-dasharray="4 4"/>` + cy(X(30) + 4, 42, '30 mA KAR', {a:'start', r:RENK.cy, s:10}) +
      cy(X(.15), 120, 'AC-1', {s:10}) + cy(X(3), 120, 'AC-2', {s:10}) + cy(X(22), Yt(1500), 'AC-3', {s:10}) + cy(X(400), Yt(1500), 'AC-4', {s:10, r:RENK.rd}) +
      `<circle cx="${X(Math.max(.1, Math.min(1000, I)))}" cy="${Yt(st.t)}" r="7" fill="var(--mg)" stroke="#fff" stroke-width="2"/>`;
    [0.1, 1, 10, 100, 1000].forEach(v => { s += cy(X(v), 216, v + ' mA', {s:9.5}); }); [10, 100, 1000].forEach(t => { s += cy(54, Yt(t) + 4, t + ' ms', {a:'end', s:9.5}); });
    return {svg:SVGB(600, 225, s), not:`<b>${b[0]}</b> — ${b[1]}`}; }};
function czmA(v){ return Math.pow(10, -1 + v / 100 * 4); }
function czB(t){ return t >= 200 ? 10 : 10 + (200 - t) / 190 * 190; }
function czC(t){ return t >= 1000 ? 50 : t <= 10 ? 500 : Math.pow(10, Math.log10(500) - (Math.log10(t) - 1) / 2 * (Math.log10(500) - Math.log10(50))); }
function czBolge(I, t){
  if(I < 0.5) return ['AC-1 · hissedilmez', 'genellikle hiçbir tepki yok.'];
  if(I < czB(t)) return ['AC-2 · hissedilir, bırakılabilir', 'karıncalanma, ağrı; zararlı fizyolojik etki genellikle yok.'];
  if(I < czC(t)) return ['AC-3 · bırakamama, kas kasılması', 'nefes darlığı, kas kasılması; kalıcı hasar genellikle yok ama süre uzarsa tehlikeli.'];
  return ['AC-4 · KALP FİBRİLASYONU RİSKİ', 'ölümcül olabilir: kalp durması, solunum durması, ağır yanık. 30 mA KAR’ın amacı buraya ulaşmadan kesmektir.'];
}

/* 9 · Sigorta (MCB) açma bölgeleri */
CZ.mcb = {ilk:() => ({e:'C'}), btn:[['B', 'B eğrisi'], ['C', 'C eğrisi'], ['D', 'D eğrisi']], tik:(st, b) => { st.e = b; },
  k:[['x', 'Akım / anma akımı (I / In)', 0, 100, 1, 30, v => '× ' + f(czX(v), 2)]],
  ciz:st => { const x = czX(st.x), M = {B:[3, 5], C:[5, 10], D:[10, 20]}[st.e], X = v => 40 + Math.log10(v) / Math.log10(30) * 520;
    let durum, r;
    if(x < 1.13) durum = ['Atmaz', 'Anma akımına kadar sürekli çalışır (1,13 × In’de 1 saat içinde açmaz).'], r = RENK.gr;
    else if(x < 1.45) durum = ['Belki çok uzun sürede atar', '1,13–1,45 × In arası: ısıl bölge, bir saate kadar sürebilir. Kablo ısınır!'], r = RENK.am;
    else if(x < M[0]) durum = ['Isıl açma (saniyeler–dakikalar)', 'Bimetal ısınarak açar. Akım arttıkça süre kısalır (aşırı yük).'], r = RENK.am;
    else if(x < M[1]) durum = ['Manyetik bölge — belirsiz', `${st.e} eğrisinde ${M[0]}–${M[1]} × In arasında anlık açma garantisi yok (üretici toleransı).`], r = RENK.am;
    else durum = ['ANLIK AÇAR (< 0,1 s)', 'Manyetik bobin kontağı hemen ayırır: kısa devre koruması.'], r = RENK.rd;
    let s = `<rect x="40" y="40" width="520" height="90" fill="var(--bg)"/><rect x="${X(1.13)}" y="40" width="${X(M[0]) - X(1.13)}" height="90" fill="var(--amber-lt)"/><rect x="${X(M[0])}" y="40" width="${X(M[1]) - X(M[0])}" height="90" fill="var(--amber-md)"/><rect x="${X(M[1])}" y="40" width="${560 - X(M[1])}" height="90" fill="var(--red-lt)"/>`;
    [1, 1.45, 2, 3, 5, 10, 20, 30].forEach(v => { s += `<line x1="${X(v)}" y1="130" x2="${X(v)}" y2="136" class="cz-g"/>` + cy(X(v), 150, '×' + f(v, 2), {s:9.5}); });
    s += cy(X(1.3), 60, 'ısıl', {s:10}) + cy((X(M[0]) + X(M[1])) / 2, 60, 'manyetik?', {s:10}) + cy((X(M[1]) + 560) / 2, 60, 'anlık', {s:10, r:RENK.rd}) + `<line x1="${X(x)}" y1="34" x2="${X(x)}" y2="136" stroke="var(--mg)" stroke-width="3"/>` + cy(300, 185, durum[0], {c:'cz-k', s:15, r});
    return {svg:SVGB(600, 200, s), not:durum[1] + ` (${st.e} eğrisi anlık açma: ${M[0]}–${M[1]} × In)`}; }};
function czX(v){ return Math.pow(10, Math.log10(30) * v / 100); }

/* 10 · Soğutma çevrimi */
CZ.sogutma = {ilk:() => ({m:'s'}), btn:[['s', '❄️ Soğutma'], ['i', '🔥 Isıtma (ısı pompası)']], tik:(st, b) => { st.m = b; },

    return {svg:SVGB(600, 225, s), not:sg ? 'Soğutucu akışkan iç ünitede buharlaşırken odadan ısı çeker; kompresör sıkıştırır; dış ünitede yoğuşarak ısıyı dışarı atar; genleşme elemanında basıncı düşer.' : 'Isıtmada 4 yollu vana kompresör çıkışını iç üniteye yönlendirir: iç ünite kondenser, dış ünite evaporatör olur. Klima dış havadaki ısıyı içeri “pompalar”.'}; }};

/* 11 · Pompa ve sistem eğrisi */
CZ.pompa = {k:[['h', 'Statik yükseklik', 0, 40, 1, 15, v => v + ' m'], ['k', 'Boru kaybı (ince/uzun boru →)', 1, 10, 1, 3, v => v]],
  ciz:st => { const H0 = 50, Qm = 6, X = q => 60 + q / Qm * 480, Y = h => 200 - h / 60 * 170, pc = q => H0 * (1 - Math.pow(q / Qm, 2)), sc = q => st.h + st.k * q * q;
    let lo = 0, hi = Qm; for(let i = 0; i < 40; i++){ const m = (lo + hi) / 2; if(pc(m) > sc(m)) lo = m; else hi = m; } const q = lo, h = pc(q);
    const p1 = [], p2 = []; for(let i = 0; i <= 60; i++){ const x = i / 60 * Qm; p1.push([X(x), Y(pc(x))]); if(sc(x) < 60) p2.push([X(x), Y(sc(x))]); }
    let s = `<line x1="60" y1="200" x2="545" y2="200" class="cz-g"/><line x1="60" y1="25" x2="60" y2="200" class="cz-g"/><path d="${yol(p1)}" fill="none" stroke="var(--mg)" stroke-width="3"/><path d="${yol(p2)}" fill="none" stroke="var(--cy)" stroke-width="3"/>` +
      (st.h < H0 ? `<circle cx="${X(q)}" cy="${Y(h)}" r="7" fill="var(--green)"/>` : '') + cy(70, 40, 'H (m)', {a:'start'}) + cy(540, 218, 'Q (m³/h)', {a:'end'}) + cy(200, 16, '— pompa eğrisi', {r:RENK.mg, a:'start'}) + cy(330, 16, '— tesisat (sistem) eğrisi', {r:RENK.cy, a:'start'});
    return {svg:SVGB(600, 225, s), not:st.h >= H0 ? 'Statik yükseklik pompanın kapalı vana basıncını aşıyor: su hiç çıkmaz!' : `Çalışma noktası: <b>${f(q, 1)} m³/h</b> debi, <b>${f(h, 1)} m</b> (≈ ${f(h / 10.2, 1)} bar) basma yüksekliği. Yükseklik veya boru kaybı arttıkça debi düşer.`}; }};

/* 12 · Desibel */
CZ.db = {k:[['d', 'Kazanç / kayıp', -30, 30, 1, -3, v => (v > 0 ? '+' : '') + v + ' dB']],
  ciz:st => { const pg = Math.pow(10, st.d / 10), gg = Math.pow(10, st.d / 20), W = 400;
    const bar = (y, ad, oran, r) => `<rect x="150" y="${y}" width="${W}" height="22" rx="5" fill="var(--bg)"/><rect x="150" y="${y}" width="${Math.min(W, W * oran / 4)}" height="22" rx="5" fill="${r}"/>` + cy(140, y + 15, ad, {a:'end'});
    return {svg:SVGB(600, 150, bar(20, 'giriş gücü', 1, 'var(--text3)') + bar(60, 'çıkış gücü', pg, 'var(--mg)') + bar(100, 'çıkış gerilimi', gg, 'var(--cy)') + cy(150 + W / 4, 14, '1×', {s:9.5})),
      not:`${st.d} dB → güç <b>× ${f(pg, pg < 0.1 ? 3 : 2)}</b>, gerilim <b>× ${f(gg, gg < 0.1 ? 3 : 2)}</b>. Kural: ±3 dB ≈ güç 2 katı/yarısı, ±10 dB = güç 10 katı/onda biri, ±6 dB ≈ gerilim 2 katı/yarısı.`}; }};

/* 13 · Güneş paneli I-V eğrisi */
CZ.iv = {k:[['T', 'Hücre sıcaklığı', -10, 75, 1, 25, v => v + ' °C'], ['G', 'Işınım', 100, 1000, 50, 1000, v => v + ' W/m²']],
  ciz:st => { const isc = 13.9 * st.G / 1000 * (1 + 0.0005 * (st.T - 25)), voc = Math.max(1, 49.5 * (1 - 0.0028 * (st.T - 25)) + 1.2 * Math.log(st.G / 1000)), a = voc * 0.055;
    const I = v => Math.max(0, isc * (1 - Math.exp((v - voc) / a))), X = v => 60 + v / 60 * 480, Y = i => 200 - i / 15 * 170; const pts = []; let mp = [0, 0, 0];
    for(let i = 0; i <= 200; i++){ const v = i / 200 * voc; const c = I(v); pts.push([X(v), Y(c)]); if(v * c > mp[2]) mp = [v, c, v * c]; }
    return {svg:SVGB(600, 225, `<line x1="60" y1="200" x2="545" y2="200" class="cz-g"/><line x1="60" y1="25" x2="60" y2="200" class="cz-g"/><path d="${yol(pts)}" fill="none" stroke="var(--amber)" stroke-width="3"/><circle cx="${X(mp[0])}" cy="${Y(mp[1])}" r="6" fill="var(--green)"/>` +
      cy(X(mp[0]) + 8, Y(mp[1]) - 8, 'MPP', {a:'start', r:RENK.gr}) + cy(70, 40, 'I (A)', {a:'start'}) + cy(540, 218, 'V (V)', {a:'end'})),
      not:`Voc ≈ <b>${f(voc, 1)} V</b> · Isc ≈ ${f(isc, 1)} A · en yüksek güç ≈ <b>${f(mp[2], 0)} W</b> (${f(mp[0], 1)} V’ta). Soğukta gerilim artar, sıcakta güç düşer; ışınım akımı belirler.`}; }};

/* 14 · Trafo */
CZ.trafo = {k:[['n1', 'Primer sarım N1', 100, 2000, 10, 1150, v => v], ['n2', 'Sekonder sarım N2', 10, 500, 5, 60, v => v], ['p', 'Yük gücü', 5, 200, 5, 60, v => v + ' VA']],
  ciz:st => { const u2 = 230 * st.n2 / st.n1, i2 = st.p / u2, i1 = st.p / 230; const sar = (x, n, r) => { let d = ''; const k = Math.min(14, Math.max(3, Math.round(n / 80))); for(let i = 0; i < k; i++) d += `<ellipse cx="${x}" cy="${60 + i * (110 / k)}" rx="22" ry="${55 / k}" fill="none" stroke="${r}" stroke-width="2.5"/>`; return d; };

      not:`U2 = U1 × N2/N1 = 230 × ${st.n2}/${st.n1} = <b>${f(u2, 1)} V</b>. Güç (kayıplar hariç) iki tarafta aynıdır: gerilim düşerken akım artar.`}; }};

/* 15 · Motor devri ve kayma */
CZ.kayma = {k:[['p', 'Kutup sayısı', 2, 8, 2, 4, v => v + ' kutup'], ['s', 'Kayma', 0, 10, 0.5, 5, v => '%' + f(v, 1)], ['fr', 'Frekans (sürücü)', 10, 60, 1, 50, v => v + ' Hz']],

    return {svg:SVGB(600, 200, `<circle cx="160" cy="100" r="70" fill="none" stroke="var(--text3)" stroke-width="3"/><g class="cz-don" style="transform-origin:160px 100px;animation-duration:${sure.toFixed(2)}s"><path d="M160 40 L170 100 L160 160 L150 100 Z" fill="var(--mg)"/></g>` +
      cy(330, 80, `Senkron devir ns = ${f(ns, 0)} d/d`, {a:'start', c:'cz-k'}) + cy(330, 110, `Rotor devri n = ${f(n, 0)} d/d`, {a:'start', c:'cz-k', r:RENK.mg}) + cy(330, 140, `Kayma farkı = ${f(ns - n, 0)} d/d`, {a:'start'})),
      not:`ns = 120 × f / p = 120 × ${st.fr} / ${st.p}. Asenkron motor hiçbir zaman tam senkron devre ulaşmaz; yük arttıkça kayma artar.`}; }};

/* A · TEMEL ELEKTRİK */
konu({id:'elektrik_nedir', kat:'temel', ikon:'⚛️', sv:1, ad:'Elektrik Nedir?', ozet:'Atom, elektron, iletken ve yalıtkan: her şeyin başladığı yer.', etiket:['elektron','atom','iletken','yalıtkan','yarı iletken','elektrik yükü','coulomb'],
  tanim:'<p>Her madde atomlardan oluşur. Atomun çekirdeği etrafında dönen <b>elektronlar</b> eksi (−) yüklüdür. Bakır gibi metallerde en dıştaki elektronlar atoma gevşek bağlıdır ve atomdan atoma kolayca geçebilir: bunlara <b>serbest elektron</b> denir.</p><p><b>Elektrik</b>, bu yüklerin bir yerden bir yere hareket etmesiyle oluşan enerji taşıma biçimidir. Elektronu kolayca geçiren maddelere <b>iletken</b> (bakır, alüminyum, gümüş), geçirmeyenlere <b>yalıtkan</b> (PVC, kauçuk, porselen, cam), ikisinin arasında kalanlara <b>yarı iletken</b> (silisyum: diyot, transistör, güneş paneli) denir.</p><p>Elektrik yükünün birimi <b>Coulomb</b>’dur (C). 1 C ≈ 6,24 × 10<sup>18</sup> elektronun yüküdür.</p>',
  benzetme:'Bir boruyu düşün: boru = iletken kablo, borunun içindeki su = serbest elektronlar. Suyu itecek bir pompa (gerilim) olmadan su akmaz; pompa çalışınca akış (akım) başlar.',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Sınıf</th><th>Örnek</th><th>Tesisatta nerede?</th></tr><tr><td>İletken</td><td>Bakır, alüminyum, pirinç</td><td>Kablo damarı, bara, klemens</td></tr><tr><td>Yalıtkan</td><td>PVC, XLPE, kauçuk, porselen</td><td>Kablo kılıfı, izolatör, priz gövdesi</td></tr><tr><td>Yarı iletken</td><td>Silisyum</td><td>Diyot, LED, transistör, panel hücresi</td></tr></table></div>',
  uygulama:['Kablo seçerken iletken (bakır/alüminyum) ve yalıtkan (PVC/XLPE) birlikte seçilir: biri akımı taşır, diğeri bizi korur.','Islak tahta, nemli beton ve insan vücudu “iyi yalıtkan” değildir: nem iletkenliği artırır.','Saf su zayıf iletkendir ama içindeki tuz ve mineraller onu iletken yapar: banyo ve havuzlarda tehlike bu yüzden büyüktür.'],
  dikkat:['“Yalıtkan” sandığın malzeme (ahşap merdiven, eldiven) ıslakken veya kirliyken akım geçirebilir.','Yalıtkan da belli bir gerilime kadar dayanır; aşılırsa delinir (izolasyon delinmesi).'],
  ilgili:['gerilim','akim','direnc']
});
konu({id:'gerilim', kat:'temel', ikon:'🔋', sv:1, ad:'Gerilim (Volt)', ozet:'Elektronları iten basınç: iki nokta arasındaki potansiyel farkı.', etiket:['gerilim','voltaj','volt','potansiyel farkı','230 v','400 v','u'],
  tanim:'<p><b>Gerilim</b> (U veya V), iki nokta arasındaki elektriksel “itme gücü” farkıdır. Birimi <b>Volt</b>’tur (V). Gerilim her zaman <b>iki nokta arasında</b> ölçülür: “bu kabloda 230 V var” derken aslında “bu kablo ile nötr/toprak arasında 230 V var” demiş oluruz.</p><p>Gerilim tek başına akım demek değildir: devre kapalı değilse gerilim olur ama akım olmaz (prizde gerilim vardır, fiş takılmadıkça akım yoktur).</p>',
  benzetme:'Su deposunun yüksekliği gibi: depo ne kadar yüksekse musluktan su o kadar güçlü akar. Gerilim, elektronları iten “basınçtır”.',
  cizim:'su',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kaynak</th><th>Gerilim</th></tr><tr><td>Kalem pil</td><td>1,5 V DC</td></tr><tr><td>Araç / güneş aküsü</td><td>12 V DC (12,7 V dolu)</td></tr><tr><td>Diafon, kamera beslemesi</td><td>12–24 V DC</td></tr><tr><td>Ev prizi (faz–nötr)</td><td>230 V AC</td></tr><tr><td>Üç fazda fazlar arası</td><td>400 V AC</td></tr><tr><td>Mahalle trafosu girişi (OG)</td><td>34,5 kV veya 15,8 kV</td></tr></table></div>',
  formul:[['U = W / Q', 'U: gerilim (V) · W: iş/enerji (J) · Q: yük (C). 1 V = 1 coulomb yükü taşımak için 1 joule enerji.'], ['U = I × R', 'Ohm kanunuyla: akım × direnç (bkz. Ohm Kanunu).']],
  uygulama:['Şebekede gerilim 230 V ±%10 (207–253 V) aralığında kabul edilir.','Kontrol kalemi fazı, yani toprağa göre gerilimi olan iletkeni gösterir; nötrde yanmaz.','Gerilim ölçerken multimetre devreye <b>paralel</b> bağlanır.'],
  ornek:{s:'Prizde L–N arası 231 V, L–PE arası 229 V, N–PE arası 2 V ölçtün. Ne anlama gelir?', a:['L–N ≈ L–PE: faz sağlam, topraklama bağlı.','N–PE 2 V: nötr ile toprak arasında küçük fark normaldir (nötr hattında yük akımından dolayı gerilim düşümü).','N–PE 10 V’un üzerine çıkarsa nötr bağlantısı zayıf veya yük çok dengesizdir.'], c:'Tesisat normal.'},
  dikkat:['“Düşük gerilim” (AG) yönetmelikte 1000 V’a kadardır; 230 V düşük gerilimdir ama öldürücüdür.','Gerilim yokluğunu ölçmeden önce aleti bilinen bir kaynakta dene.'],
  hesap:['gd','cevirici'], ilgili:['akim','ohm','olcum_sirasi']
});
konu({id:'akim', kat:'temel', ikon:'⚡', sv:1, ad:'Akım (Amper)', ozet:'Kablodan saniyede geçen elektrik yükü miktarı.', etiket:['akım','amper','a','ma','akım yönü','yük akımı'],
  tanim:'<p><b>Akım</b> (I), bir iletkenin kesitinden 1 saniyede geçen elektrik yükü miktarıdır. Birimi <b>Amper</b>’dir (A). Küçük akımlar miliamper (1 mA = 0,001 A) ile ifade edilir.</p><p>Akım sadece <b>kapalı devrede</b> akar: kaynaktan çıkar, yükten geçer, kaynağa geri döner. Tek fazlı devrede fazdan giden akım nötrden geri gelir. Bu iki akım arasındaki fark “kaçak akım”dır.</p><p>Kabloları ısıtan, sigortayı attıran, kesiti belirleyen şey <b>akımdır</b>.</p>',
  benzetme:'Borudan saniyede geçen su miktarı (litre/saniye) gibidir. Basınç (gerilim) aynıyken boru kalınlaşırsa daha çok su akar.',
  formul:[['I = Q / t', 'I: akım (A) · Q: yük (C) · t: süre (s)'], ['I = P / (U × cos φ)', 'Tek fazlı bir cihazın akımı (P watt, U volt). Isıtıcıda cos φ = 1.']],
  dene:{g:[['P', 'Cihaz gücü', 'W', 2000], ['U', 'Gerilim', 'V', 230], ['c', 'cos φ', '', 1]], h:v => { const I = v.P / (v.U * v.c); return [['Akım', f(I, 2) + ' A', 'v'], ['Uygun sigorta (en az)', ([6, 10, 16, 20, 25, 32, 40, 50, 63].find(x => x >= I) || '>63') + ' A']]; }},
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Cihaz</th><th>Güç</th><th>Akım (230 V)</th></tr><tr><td>LED lamba</td><td>10 W</td><td>≈ 0,05 A</td></tr><tr><td>Buzdolabı (çalışırken)</td><td>150 W</td><td>≈ 0,8 A</td></tr><tr><td>Çamaşır makinesi (ısıtırken)</td><td>2.200 W</td><td>≈ 9,6 A</td></tr><tr><td>Termosifon</td><td>3.000 W</td><td>≈ 13 A</td></tr><tr><td>12.000 BTU klima</td><td>≈ 1.100 W</td><td>≈ 5 A</td></tr></table></div>',
  uygulama:['Pens ampermetre ile akım, devreyi açmadan tek iletken etrafından ölçülür.','Linyedeki toplam akım sigorta değerini geçerse sigorta atar.','Akım arttıkça kablodaki ısı karesiyle artar (Joule).'],
  ornek:{s:'2.000 W ısıtıcı ve 1.500 W su ısıtıcısı aynı priz linyesinde çalışıyor. Toplam akım?', a:['I₁ = 2000 / 230 = 8,7 A','I₂ = 1500 / 230 = 6,5 A','Paralel bağlı oldukları için akımlar toplanır: 8,7 + 6,5 = 15,2 A'], c:'15,2 A → 16 A sigorta sınırda; üçüncü bir cihaz eklenirse atar.'},
  dikkat:['Vücuttan geçen 30 mA bile tehlikelidir (bkz. Akımın vücuda etkisi).','Akım ölçerken multimetre <b>seri</b> bağlanır; gerilim prizine A modunda prob sokmak kısa devredir.'],
  hesap:['guc','kablo'], ilgili:['gerilim','ohm','vucut_etkisi']
});
konu({id:'direnc', kat:'temel', ikon:'〰️', sv:1, ad:'Direnç ve Özdirenç', ozet:'Akıma karşı koyma. Kablo uzadıkça ve inceldikçe direnç artar.', etiket:['direnç','ohm','özdirenç','rho','kablo direnci','iletkenlik','sıcaklık katsayısı'],
  tanim:'<p><b>Direnç</b> (R), bir malzemenin akımın geçişine karşı koymasıdır. Birimi <b>Ohm</b>’dur (Ω). Isıtıcı teli, lamba filamanı bilerek yüksek dirençli yapılır; kablolar ise mümkün olduğunca düşük dirençli olmalıdır.</p><p>Bir kablonun direnci üç şeye bağlıdır: <b>malzeme</b> (özdirenç ρ), <b>uzunluk</b> (uzadıkça artar) ve <b>kesit</b> (kalınlaştıkça azalır). Metallerin direnci sıcaklıkla artar: bakır her 10 °C’de yaklaşık %4 artar.</p>',
  benzetme:'Uzun ve ince bir hortumdan su zor akar; kısa ve kalın hortumdan kolay akar.',
  formul:[['R = ρ × L / S', 'ρ: özdirenç (Ω·mm²/m) · L: uzunluk (m) · S: kesit (mm²). Bakır 20 °C’de ρ = 0,0178; alüminyum 0,0286.'], ['R<sub>hat</sub> = 2 × ρ × L / S', 'Tek fazlı hatta akım gidip döner: kablo boyu iki kez sayılır.'], ['G = 1 / R', 'İletkenlik, Siemens (S).']],
  dene:{g:[['L', 'Kablo boyu (tek yön)', 'm', 30], ['S', 'Kesit', 'mm²', 2.5], ['m', 'Malzeme', '', 0.0178, [[0.0178, 'Bakır'], [0.0286, 'Alüminyum']]]], h:v => { const r1 = v.m * v.L / v.S; return [['Bir damarın direnci', f(r1, 3) + ' Ω'], ['Gidiş-dönüş (L+N)', f(2 * r1, 3) + ' Ω', 'v'], ['16 A’de gerilim düşümü', f(2 * r1 * 16, 1) + ' V (%' + f(2 * r1 * 16 / 230 * 100, 1) + ')']]; }},
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Malzeme</th><th>ρ (20 °C) Ω·mm²/m</th><th>Kullanım</th></tr><tr><td>Gümüş</td><td>0,016</td><td>Kontak kaplaması</td></tr><tr><td>Bakır</td><td>0,0178</td><td>Kablo, bara</td></tr><tr><td>Alüminyum</td><td>0,0286</td><td>Havai hat, büyük kesitli besleme</td></tr><tr><td>Demir/çelik</td><td>≈ 0,10–0,14</td><td>Topraklama şeridi (galvaniz)</td></tr><tr><td>Krom-nikel</td><td>≈ 1,1</td><td>Isıtıcı rezistans teli</td></tr></table></div>',
  uygulama:['Uzun hatlarda kesit büyütülür; yoksa gerilim düşer ve kablo ısınır.','Gevşek klemens = yüksek temas direnci = ısınma ve yangın. Bağlantıyı sık!','Sargı dirençleri ölçülerek motor arızası anlaşılır (üç sargı eşit olmalı).'],
  ornek:{s:'Bahçe aydınlatması için 60 m, 1,5 mm² bakır kablo çekilecek. Hat direnci?', a:['R = 2 × 0,0178 × 60 / 1,5','R = 1,42 Ω','5 A çekilirse düşüm: 5 × 1,42 = 7,1 V (%3,1)'], c:'Aydınlatma için %1,5 sınırı aşılıyor → 2,5 mm² kullan.'},
  dikkat:['Direnç ölçümü sadece enerjisiz devrede yapılır.','Çalışma sıcaklığında (70 °C) bakır direnci 20 °C değerinden ≈ %20 fazladır; hesaplarda bu yüzden ρ ≈ 0,0225 alınır.'],
  hesap:['gd','renk'], ilgili:['ohm','gerilim_dusumu','joule']
});
konu({id:'ohm', kat:'temel', ikon:'📐', sv:1, ad:'Ohm Kanunu', ozet:'U = I × R: gerilim, akım ve direncin temel ilişkisi.', etiket:['ohm kanunu','u=ir','v=ir','temel formül','akım hesabı'],
  tanim:'<p><b>Ohm Kanunu</b>: bir dirençten geçen akım, uçlarındaki gerilimle doğru, dirençle ters orantılıdır. Gerilimi iki katına çıkarırsan akım iki katına çıkar; direnci iki katına çıkarırsan akım yarıya iner.</p><p>Elektrikte hesapların büyük kısmı bu basit ilişkinin üzerine kuruludur.</p>',
  benzetme:'Basınç (U) ne kadar yüksek ve boru (R) ne kadar genişse, akış (I) o kadar büyük olur.',
  cizim:'su',
  formul:[['U = I × R', 'Gerilim (V) = akım (A) × direnç (Ω)'], ['I = U / R', 'Akım bulmak için'], ['R = U / I', 'Direnç bulmak için'], ['P = U × I = I² × R = U² / R', 'Güç ile birleşik hâli']],
  dene:{g:[['U', 'Gerilim', 'V', 230], ['R', 'Direnç', 'Ω', 26.45]], h:v => { const I = v.U / v.R; return [['Akım', f(I, 3) + ' A', 'v'], ['Güç', f(v.U * I, 1) + ' W']]; }},
  uygulama:['Isıtıcının direncini ölçüp gücünü bulabilirsin: R = 26 Ω → P = 230² / 26 ≈ 2.000 W.','Kısa devre akımını tahmin etmek: hat direnci 0,5 Ω ise I ≈ 230 / 0,5 = 460 A.','Toprak direnci ve kaçak akım ilişkisi: 30 mA × 100 Ω = 3 V dokunma gerilimi.'],
  ornek:[{s:'Termosifon rezistansının uçlarında 18 Ω ölçtün. Gücü kaç W?', a:['P = U² / R = 230² / 18','P = 52.900 / 18 = 2.939 W'], c:'≈ 3 kW rezistans, akımı ≈ 12,8 A.'}, {s:'12 V’luk LED şerite 5 A akıyor. Şeridin eşdeğer direnci?', a:['R = U / I = 12 / 5'], c:'2,4 Ω'}],
  dikkat:['Ohm kanunu sabit dirençler içindir; LED, motor, kompresör gibi yüklerde akım gerilimle doğrusal değişmez.','Soğuk akkor lamba filamanının direnci, sıcakken olanın ≈ 1/10’udur: açılış anında çok yüksek akım çeker.'],
  hesap:['guc','hizli'], ilgili:['gerilim','akim','direnc','guc_enerji']
});
konu({id:'guc_enerji', kat:'temel', ikon:'💪', sv:1, ad:'Güç (Watt)', ozet:'Saniyede yapılan iş: cihazın ne kadar “güçlü” olduğu.', etiket:['güç','watt','kw','beygir','hp','p=ui','verim'],
  tanim:'<p><b>Güç</b> (P), birim zamanda harcanan veya üretilen enerjidir. Birimi <b>Watt</b>’tır (W); 1.000 W = 1 kW. Doğru akımda ve ısıtıcı gibi saf dirençli yüklerde güç, gerilim ile akımın çarpımıdır.</p><p>Motorlarda etikette yazan güç <b>milden alınan mekanik güçtür</b>; şebekeden çekilen elektrik gücü verim yüzünden daha fazladır. Eski motorlarda beygir (HP) kullanılır: 1 HP ≈ 0,746 kW, 1 PS (metrik beygir) ≈ 0,736 kW.</p><p><b>Verim</b> (η) = çıkış gücü / giriş gücü. Hiçbir cihaz %100 verimli değildir; kayıp genellikle ısıya dönüşür.</p>',
  benzetme:'Aynı yüksekliğe merdivenden yavaş çıkmak da koşarak çıkmak da aynı işi yapar ama koşan daha fazla güç harcar. Güç = işin ne kadar hızlı yapıldığı.',
  formul:[['P = U × I', 'DC ve omik (ısıtıcı) yüklerde, W'], ['P = U × I × cos φ', 'Tek fazlı AC (motor, klima vb.)'], ['P = √3 × U × I × cos φ', 'Üç fazlı, U = 400 V fazlar arası'], ['η = P<sub>çıkış</sub> / P<sub>giriş</sub>', 'Verim; motorda P<sub>giriş</sub> = P<sub>etiket</sub> / η']],
  dene:{g:[['U', 'Gerilim', 'V', 230], ['I', 'Akım', 'A', 10], ['c', 'cos φ', '', 1]], h:v => [['Güç', f(v.U * v.I * v.c, 0) + ' W', 'v'], ['kW', f(v.U * v.I * v.c / 1000, 2) + ' kW'], ['Beygir (HP)', f(v.U * v.I * v.c / 746, 2)]]},
  uygulama:['Cihaz etiketindeki W değeri ile kablo/sigorta seçimi başlar.','Motor etiketinde 5,5 kW yazıyorsa ve verim %88 ise şebekeden ≈ 6,25 kW çeker.','Eş zamanlı çalışmayan cihazların gücü basitçe toplanmaz (bkz. Eşzamanlılık).'],
  ornek:{s:'Etiketi 1,5 kW, verimi %80, cos φ = 0,8 olan tek fazlı pompa motorunun şebeke akımı?', a:['P<sub>giriş</sub> = 1500 / 0,80 = 1875 W','I = 1875 / (230 × 0,8) = 10,2 A'], c:'≈ 10,2 A → 16 A C tipi sigorta, 2,5 mm² kablo.'},
  dikkat:['Isıtıcıda W = VA’dır; motorda değildir (reaktif güç, bkz. Aktif-reaktif-görünür güç).'],
  hesap:['guc','yuk','motor'], ilgili:['enerji_fatura','guc_turleri','ohm']
});
konu({id:'enerji_fatura', kat:'temel', ikon:'🧾', sv:1, ad:'Enerji (kWh) ve Fatura Hesabı', ozet:'Güç × süre = enerji. Faturada ödenen kilovatsaattir.', etiket:['kwh','kilovatsaat','enerji','fatura','tüketim','sayaç','joule'],
  tanim:'<p><b>Enerji</b>, gücün zamanla çarpımıdır. Elektrikte birimi <b>kilovatsaat</b>’tir (kWh): 1 kW gücündeki bir cihazın 1 saat çalışmasıyla harcanan enerji. Sayaç kWh sayar, fatura kWh üzerinden kesilir.</p><p>Gücü yüksek ama kısa çalışan cihaz (saç kurutma makinesi) az, gücü düşük ama sürekli çalışan cihaz (buzdolabı, modem, bekleme modları) toplamda çok tüketebilir.</p>',
  benzetme:'Güç, musluktan akan suyun hızı; enerji, kovada biriken toplam su gibidir.',
  formul:[['E = P × t', 'E: enerji (kWh) · P: güç (kW) · t: süre (saat)'], ['Tutar = E × birim fiyat', 'Birim fiyata vergiler ve dağıtım bedeli dahil edilmelidir.'], ['1 kWh = 3,6 MJ = 860 kcal', 'Isı hesaplarıyla karşılaştırmak için']],
  dene:{g:[['P', 'Cihaz gücü', 'W', 2000], ['h', 'Günlük çalışma', 'saat', 3], ['g', 'Ayda gün', 'gün', 30], ['fy', 'Birim fiyat', '₺/kWh', 3]], h:v => { const kwh = v.P / 1000 * v.h * v.g; return [['Aylık tüketim', f(kwh, 1) + ' kWh', 'v'], ['Aylık tutar', EK.tl(kwh * v.fy)], ['Yıllık', EK.tl(kwh * v.fy * 12)]]; }},
  uygulama:['Bekleme modundaki cihazlar (TV, uydu alıcısı, adaptörler) toplamda ayda onlarca kWh tutabilir.','Klima ve ısı pompasında harcanan kWh ile elde edilen ısı farklıdır (COP).','Güneş paneli hesaplarında da kWh üretimi esas alınır.'],
  ornek:{s:'Termosifon (3 kW) günde 2 saat, buzdolabı (ortalama 40 W sürekli) — aylık tüketimleri?', a:['Termosifon: 3 × 2 × 30 = 180 kWh','Buzdolabı: 0,04 × 24 × 30 = 28,8 kWh'], c:'Termosifon ≈ 6 kat daha fazla tüketir.'},
  dikkat:['Klimanın etiketteki soğutma kapasitesi (kW veya BTU) elektrik tüketimi değildir.'],
  hesap:['maliyet','yuk'], ilgili:['guc_enerji','cop_eer']
});
konu({id:'seri_paralel', kat:'temel', ikon:'🔗', sv:1, ad:'Seri ve Paralel Bağlantı', ozet:'Evdeki her şey paraleldir; anahtar ve sigorta ise seri.', etiket:['seri','paralel','eşdeğer direnç','seri bağlantı','paralel bağlantı'],
  tanim:'<p><b>Seri bağlantıda</b> elemanlar arka arkaya bağlanır: hepsinden <b>aynı akım</b> geçer, gerilim aralarında paylaşılır. Biri koparsa hepsi söner (eski yılbaşı ampulleri).</p><p><b>Paralel bağlantıda</b> elemanlar aynı iki noktaya bağlanır: hepsine <b>aynı gerilim</b> gelir, akımlar toplanır. Biri bozulsa diğerleri çalışmaya devam eder. Evdeki tüm priz ve lambalar paraleldir.</p><p>Anahtar, sigorta ve buton ise kontrol ettikleri yüke <b>seri</b> bağlanır.</p>',
  formul:[['R<sub>seri</sub> = R₁ + R₂ + …', 'Seri eşdeğer direnç'], ['1/R<sub>par</sub> = 1/R₁ + 1/R₂ + …', 'Paralel eşdeğer direnç; iki direnç için R = R₁·R₂ / (R₁+R₂)'], ['I<sub>toplam</sub> = I₁ + I₂ + … (paralel)', 'Linyedeki cihaz akımları toplanır']],
  dene:{g:[['a', 'R₁', 'Ω', 100], ['b', 'R₂', 'Ω', 50], ['c', 'R₃ (yoksa 0)', 'Ω', 0]], h:v => { const L = [v.a, v.b, v.c].filter(x => x > 0); return [['Seri', f(L.reduce((t, x) => t + x, 0), 2) + ' Ω', 'v'], ['Paralel', f(1 / L.reduce((t, x) => t + 1 / x, 0), 2) + ' Ω', 'v']]; }},
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th></th><th>Seri</th><th>Paralel</th></tr><tr><td>Akım</td><td>Her yerde aynı</td><td>Kollara bölünür, toplanır</td></tr><tr><td>Gerilim</td><td>Paylaşılır</td><td>Hepsinde aynı</td></tr><tr><td>Toplam direnç</td><td>Artar</td><td>En küçüğünden de küçük</td></tr><tr><td>Biri koparsa</td><td>Hepsi durur</td><td>Diğerleri çalışır</td></tr></table></div>',
  uygulama:['Akü bankasında seri bağlantı gerilimi, paralel bağlantı Ah’i artırır.','Güneş panellerinde seri dizi gerilimi, paralel diziler akımı artırır.','12 V iki lambayı 24 V’a seri bağlamak işe yarar ama biri yanarsa diğeri de söner.'],
  ornek:{s:'230 V’a seri bağlı iki adet 230 V / 100 W akkor lamba nasıl yanar?', a:['Her lambanın direnci R = 230² / 100 = 529 Ω','Seri toplam 1058 Ω → I = 230 / 1058 = 0,217 A','Her lambanın gücü P = 0,217² × 529 = 25 W'], c:'İkisi de dörtte bir güçle, sönük yanar.'},
  dikkat:['Paralel bağlı yük arttıkça linye akımı artar: “bir priz daha” eklemek sigortanın görevi değil, linye hesabının konusudur.'],
  sema:['priz_paralel','aku_baglama','panel_dizi'], ilgili:['ohm','kirchhoff']
});
konu({id:'kirchhoff', kat:'temel', ikon:'🔄', sv:2, ad:'Kirchhoff Kanunları', ozet:'Düğüme giren akım çıkan akıma eşittir; kapalı çevrede gerilimlerin toplamı sıfırdır.', etiket:['kirchhoff','düğüm','çevre','kak','kgk','akım kanunu','gerilim kanunu'],
  tanim:'<p><b>1. Kanun (akım):</b> Bir bağlantı noktasına (düğüme) giren akımların toplamı, çıkan akımların toplamına eşittir. Elektrik birikmez, kaybolmaz.</p><p><b>2. Kanun (gerilim):</b> Kapalı bir devrede, kaynağın verdiği gerilim yükler ve kablolar üzerindeki gerilim düşümlerinin toplamına eşittir.</p><p>Bu iki kanun; buatta akımların dağılmasını, nötr akımını, kaçak akım rölesinin çalışmasını ve gerilim düşümü hesabını açıklar.</p>',
  formul:[['ΣI<sub>giren</sub> = ΣI<sub>çıkan</sub>', 'Akım kanunu'], ['U<sub>kaynak</sub> = ΣU<sub>düşüm</sub>', 'Gerilim kanunu: U = U<sub>kablo</sub> + U<sub>yük</sub>']],
  uygulama:['Kaçak akım rölesi 1. kanunu kullanır: fazdan giren akım nötrden dönmüyorsa fark başka yoldan (insan, toprak) gidiyordur.','Gerilim düşümü 2. kanundur: kabloda düşen gerilim yüke ulaşamaz.','Pano barasına giren akım = çıkan linyelerin akımları toplamı.'],
  ornek:{s:'Prizde cihaz 228 V alıyor, panoda 232 V var. Kablodaki düşüm ve kabloda ısıya dönen güç (akım 10 A)?', a:['U<sub>kablo</sub> = 232 − 228 = 4 V (gidiş + dönüş toplamı)','P<sub>kayıp</sub> = 4 × 10 = 40 W'], c:'Kablolar 40 W ısı üretiyor; düşüm %1,7 (sınır %1,5 → kesit artırılmalı).'},
  ilgili:['seri_paralel','kar_tipleri','gerilim_dusumu']
});
konu({id:'joule', kat:'temel', ikon:'🌡️', sv:1, ad:'Joule Isınması (I²R)', ozet:'Akım iki katına çıkarsa ısı dört katına çıkar. Kablo ve klemens yangınlarının fiziği.', etiket:['joule','ısınma','i2r','kablo kaybı','temas direnci','yangın'],
  tanim:'<p>Bir iletkenden akım geçtiğinde direnci yüzünden ısı açığa çıkar. Bu ısı, akımın <b>karesiyle</b> artar. Isıtıcı, ocak, ütü bu prensiple çalışır; kablolarda ise istenmeyen kayıptır.</p><p>Gevşek bir klemenste temas direnci birkaç miliohm’dan onlarca miliohm’a çıkar. 16 A’de 0,05 Ω temas direnci bile 13 W ısı demektir: bu, küçük bir havya kadardır ve plastik klemensi eritir.</p>',
  formul:[['Q = I² × R × t', 'Q: ısı (J) · I: akım (A) · R: direnç (Ω) · t: süre (s)'], ['P<sub>kayıp</sub> = I² × R', 'Kabloda ısıya dönen güç (W)']],
  dene:{g:[['I', 'Akım', 'A', 16], ['R', 'Direnç (kablo veya temas)', 'Ω', 0.05]], h:v => [['Isı gücü', f(v.I * v.I * v.R, 1) + ' W', 'v'], ['1 saatte', f(v.I * v.I * v.R / 1000, 3) + ' kWh']]},
  uygulama:['Kablo kesiti, kablonun bu ısıyı izolasyonu bozmadan atabileceği akıma göre seçilir.','Termal kamera ile pano taramasında sıcak noktalar gevşek bağlantıları gösterir.','Uzatma kablosu makarası sarılı kullanılırsa ısıyı atamaz ve erir.'],
  ornek:{s:'25 m, 2,5 mm² kablodan 20 A geçiyor. Kablo kaybı?', a:['R = 2 × 0,0178 × 25 / 2,5 = 0,356 Ω','P = 20² × 0,356 = 142 W'], c:'Kablo boyunca 142 W ısı: sigorta da 20 A ise kablo sınırda çalışır.'},
  dikkat:['Sigortayı büyütmek kabloyu korumaz, aksine ısınmasına izin verir.','Alüminyum–bakır doğrudan birleşiminde korozyon temas direncini artırır: bimetal klemens kullan.'],
  hesap:['kablo','kesit'], ilgili:['direnc','kablo_kapasite']
});
konu({id:'dc_ac', kat:'temel', ikon:'🔀', sv:1, ad:'Doğru Akım (DC) ve Alternatif Akım (AC)', ozet:'Akü DC verir, şebeke AC. Farkları ve neden şebekede AC kullanıldığı.', etiket:['dc','ac','doğru akım','alternatif akım','50 hz','sinüs'],
  tanim:'<p><b>Doğru akım (DC)</b> hep aynı yönde akar: pil, akü, güneş paneli, adaptör çıkışı. Artı (+) ve eksi (−) kutup vardır.</p><p><b>Alternatif akım (AC)</b> saniyede 50 kez yön değiştirir (Türkiye’de 50 Hz). Şebeke, jeneratör ve inverter çıkışı AC’dir.</p><p>Şebekede AC kullanılmasının nedeni, gerilimin <b>trafoyla</b> kolayca yükseltilip düşürülebilmesidir: uzak mesafeye yüksek gerilimle az kayıpla taşınır, evde düşük gerilime indirilir.</p>',
  cizim:'sinus',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th></th><th>DC</th><th>AC</th></tr><tr><td>Kaynak</td><td>Pil, akü, panel, adaptör</td><td>Şebeke, jeneratör, inverter</td></tr><tr><td>Kutup</td><td>+ ve − (ters bağlanırsa cihaz bozulabilir)</td><td>Faz ve nötr</td></tr><tr><td>Trafo</td><td>Çalışmaz</td><td>Çalışır</td></tr><tr><td>Ark söndürme</td><td>Zor (DC sigorta/şalter gerekir)</td><td>Akım her yarım periyotta sıfırdan geçer, kolay</td></tr></table></div>',
  uygulama:['Güneş sisteminde panel–akü tarafı DC, ev tarafı AC’dir; DC tarafta <b>DC etiketli</b> sigorta/şalter şarttır.','LED sürücüleri ve adaptörler AC’yi DC’ye çevirir.','DC’de kutup ters bağlanırsa elektronik zarar görebilir; AC’de faz–nötr yer değişimi çoğu cihazda çalışır ama anahtarlar nötrü keserse tehlikelidir.'],
  dikkat:['AC sigortası DC’de kullanılamaz: DC arkı sönmeyebilir ve yangın çıkarır.','Akü DC’dir ama yüksek akım verir: kısa devre ettiğinde anahtar/yüzük eriyebilir.'],
  ilgili:['sinus_rms','akim','mppt_inverter']
});
konu({id:'kisa_devre', kat:'temel', ikon:'💥', sv:1, ad:'Kısa Devre, Açık Devre, Kaçak', ozet:'Üç temel arıza: akım yolunun kısalması, kopması ve kaçması.', etiket:['kısa devre','açık devre','kaçak','arıza','toprak kaçağı','kopukluk'],
  tanim:'<p><b>Kısa devre</b>: faz ile nötr (veya faz ile faz, faz ile toprak) arasında yük olmadan doğrudan temas. Direnç neredeyse sıfır olduğu için akım yüzlerce/binlerce ampere çıkar. Sigortanın manyetik kısmı bunu anında keser.</p><p><b>Açık devre</b>: akım yolunun kopması (kopuk kablo, gevşek klemens, yanık sigorta). Akım akmaz; cihaz çalışmaz ama kopuk noktanın öncesinde gerilim vardır.</p><p><b>Kaçak (toprak kaçağı)</b>: akımın bir kısmının izolasyon hatası nedeniyle gövdeye, toprağa veya insana akması. Küçük olabilir ve sigortayı attırmaz; <b>kaçak akım rölesi</b> algılar.</p>',
  formul:[['I<sub>k</sub> = U / Z<sub>döngü</sub>', 'Kısa devre akımı; Z: kaynaktan arıza noktasına gidiş-dönüş empedansı'], ['I<sub>kaçak</sub> = I<sub>faz</sub> − I<sub>nötr</sub>', 'Kaçak akım rölesinin ölçtüğü fark']],
  dene:{g:[['Z', 'Döngü empedansı', 'Ω', 0.8]], h:v => { const I = 230 / v.Z; return [['Kısa devre akımı', f(I, 0) + ' A', 'v'], ['B16 anlık açar mı? (≥80 A)', I >= 80 ? 'evet' : 'HAYIR', I >= 80 ? '' : 'uy'], ['C16 anlık açar mı? (≥160 A)', I >= 160 ? 'evet' : 'HAYIR', I >= 160 ? '' : 'uy']]; }},
  uygulama:['Sigorta hemen atıyorsa (kaldırınca anında): kısa devre. Bir süre çalışıp atıyorsa: aşırı yük.','Kaçak akım rölesi atıyorsa: izolasyon hatası, nem, nötr–toprak karışması.','Açık devreyi bulmak: enerjisizken süreklilik (bip) ölçümü, enerjiliyken kalemle faz takibi.'],
  ornek:{s:'Mutfak priz linyesinde sigorta (B16) kaldırır kaldırmaz atıyor. Nasıl ilerlersin?', a:['Tüm cihazları prizlerden çıkar, sigortayı kaldır.','Atmıyorsa: cihazlardan biri arızalı; tek tek tak.','Yine atıyorsa: enerjiyi kes, linyeyi buatlarda ayır ve L–N, L–PE arası direnç/izolasyon ölç.'], c:'Arızalı parça ayrılarak bulunur.'},
  dikkat:['Kısa devre akımı çok düşükse (uzun, ince hat) sigorta anlık açmaz: kablo yanar. Bu yüzden döngü empedansı kontrol edilir.','Atan sigortayı “büyüğüyle” değiştirmek arızayı gizler, yangını davet eder.'],
  hesap:['kisadevre','kacak'], sema:['priz','tncs'], ilgili:['dongu_empedansi','mcb_egri','kar_tipleri']
});
konu({id:'manyetizma', kat:'temel', ikon:'🧲', sv:2, ad:'Elektromanyetizma ve Endüksiyon', ozet:'Akım manyetik alan yaratır; değişen manyetik alan gerilim üretir. Motor, trafo, röle bu ikiliyle çalışır.', etiket:['manyetik alan','elektromıknatıs','endüksiyon','faraday','lenz','fleming','sağ el kuralı','sol el kuralı'],
  tanim:'<p>Bir iletkenden akım geçince etrafında <b>manyetik alan</b> oluşur. İletken bobin şeklinde sarılır ve içine demir çekirdek konursa güçlü bir <b>elektromıknatıs</b> olur: röle, kontaktör, kilit dili, zil bu şekilde çalışır.</p><p>Tersi de geçerlidir: bir bobinin içindeki manyetik alan <b>değişirse</b> bobinde gerilim indüklenir (Faraday). Trafo, jeneratör ve pens ampermetre bu ilkeyle çalışır. İndüklenen akım, kendisini oluşturan değişime karşı koyar (Lenz); bobinin anahtar açılınca kıvılcım çıkarması bu yüzdendir.</p><p><b>Sol el kuralı (motor):</b> işaret parmağı manyetik alan, orta parmak akım yönünde tutulursa başparmak kuvvet yönünü gösterir. <b>Sağ el kuralı (jeneratör):</b> işaret parmağı alan, başparmak hareket yönündeyse orta parmak indüklenen akımı gösterir.</p>',
  formul:[['e = −N × ΔΦ / Δt', 'İndüklenen gerilim: sarım sayısı × akı değişim hızı'], ['F = B × I × L', 'Manyetik alandaki iletkene etki eden kuvvet (motorun dönme sebebi)']],
  uygulama:['Kontaktör bobini AC ile çalışır; DC bobinli kontaktöre AC verilirse çekmez veya titreşir, tersi yanar.','Röle ve kontaktör bobinlerine paralel “söndürme” elemanı (RC, varistör, diyot) anahtarlama kıvılcımını azaltır.','Pens ampermetre, iletkenin manyetik alanını ölçerek akımı bulur.'],
  dikkat:['Endüktif yük (motor, balast, kontaktör bobini) kesilirken yüksek gerilim darbesi oluşur; elektronik anahtarlarla sürerken koruma gerekir.'],
  ilgili:['trafo','asenkron_motor','bobin']
});

konu({id:'sinus_rms', kat:'ac', ikon:'〰️', sv:1, ad:'Sinüs, Frekans ve Efektif (RMS) Değer', ozet:'Şebeke 230 V derken efektif değer kastedilir; tepe değer 325 V’tur.', etiket:['sinüs','frekans','periyot','50 hz','efektif değer','rms','tepe değer','325 v'],
  tanim:'<p>Şebeke gerilimi sinüs dalgası şeklinde sürekli değişir: sıfırdan +325 V’a çıkar, sıfıra iner, −325 V’a gider, geri gelir. Bu bir tam turun süresine <b>periyot</b> (T), saniyedeki tur sayısına <b>frekans</b> (f) denir. Türkiye ve Avrupa’da f = 50 Hz, T = 20 ms’dir.</p><p>Sürekli değişen bir gerilimi tek sayıyla ifade etmek için <b>efektif (RMS) değer</b> kullanılır: aynı direnci aynı ölçüde ısıtan DC gerilimin değeri. “230 V” efektif değerdir. Ölçü aletleri de efektif değer gösterir.</p>',
  cizim:'sinus',
  formul:[['f = 1 / T', 'f: frekans (Hz) · T: periyot (s). 50 Hz → T = 20 ms'], ['U<sub>tepe</sub> = U<sub>ef</sub> × √2', '230 V × 1,414 ≈ 325 V'], ['U<sub>tepe-tepe</sub> = 2 × U<sub>tepe</sub>', '≈ 650 V'], ['U<sub>ort</sub> ≈ 0,637 × U<sub>tepe</sub>', 'Yarım dalga ortalaması (doğrultucu hesaplarında)']],
  dene:{g:[['U', 'Efektif gerilim', 'V', 230], ['f', 'Frekans', 'Hz', 50]], h:v => [['Tepe', f(v.U * Math.SQRT2, 1) + ' V', 'v'], ['Tepe-tepe', f(2 * v.U * Math.SQRT2, 0) + ' V'], ['Periyot', f(1000 / v.f, 2) + ' ms']]},
  uygulama:['Kondansatör ve elektronik elemanların gerilim değeri tepe değere göre seçilir: 230 V devrede en az 400 V’luk kondansatör kullanılır.','Osiloskopla bakınca 230 V şebekenin tepe değeri ≈ 325 V görünür.','Ucuz multimetreler sadece saf sinüste doğru efektif değer gösterir (bkz. Gerçek RMS).'],
  ornek:{s:'24 V AC trafo çıkışı doğrultulup kondansatörle filtrelendi. Boşta DC gerilim yaklaşık?', a:['Tepe = 24 × 1,414 = 33,9 V','Köprü diyotlarda ≈ 1,4 V düşüm'], c:'≈ 32,5 V DC (boşta). Kondansatör en az 50 V’luk olmalı.'},
  dikkat:['230 V’luk bir kondansatöre “250 V” yazıyorsa bu genellikle AC değerdir; DC kondansatörü (ör. elektrolitik) 230 V AC’ye bağlanmaz.'],
  hesap:['cevirici'], ilgili:['dc_ac','faz_farki','gercek_rms']
});
konu({id:'faz_farki', kat:'ac', ikon:'🔁', sv:2, ad:'Faz Farkı (Akım ile Gerilim Arasındaki Kayma)', ozet:'Motor ve bobinde akım gerilimden geride, kondansatörde ileridedir.', etiket:['faz farkı','faz açısı','fi','φ','endüktif','kapasitif','omik','geride','ileride'],
  tanim:'<p>Saf dirençte (ısıtıcı) akım ve gerilim aynı anda tepe yapar: <b>aynı fazdadır</b>. Bobinli yüklerde (motor, trafo, balast) akım gerilimden <b>geri</b> kalır: <b>endüktif yük</b>. Kondansatörde akım gerilimden <b>ileridedir</b>: <b>kapasitif yük</b>.</p><p>Aradaki kayma açısına <b>φ (fi)</b>, açının kosinüsüne <b>güç faktörü (cos φ)</b> denir. φ büyüdükçe çekilen akımın daha azı iş yapar, gerisi kaynak ile yük arasında gidip gelir (reaktif).</p>',
  cizim:'faz',
  formul:[['cos φ = P / S', 'Aktif güç / görünür güç'], ['φ = 0° → cos φ = 1', 'Omik yük'], ['φ = 90° → cos φ = 0', 'İdeal bobin veya kondansatör: hiç iş yapmaz']],
  uygulama:['Boşta çalışan motorun cos φ’si çok düşüktür (0,2–0,4): boşta çalıştırmak reaktif enerjiyi artırır.','Kompanzasyon, endüktif yüklerin geride kalan akımını kondansatörün ileri akımıyla dengeler.','Uzun kablolar ve fazla kompanzasyon kapasitif etki yaratır (kapasitif ceza).'],
  ilgili:['guc_turleri','cosfi','bobin','kondansator']
});
konu({id:'bobin', kat:'ac', ikon:'🌀', sv:2, ad:'Bobin, Endüktans ve Endüktif Reaktans', ozet:'Bobin akımdaki değişime karşı koyar; frekans arttıkça daha çok zorlar.', etiket:['bobin','endüktans','henry','reaktans','xl','şok bobini','balast','endüktif'],
  tanim:'<p><b>Bobin</b>, sarılmış iletkendir. İçinden geçen akım değişince manyetik alanı değişir ve bu değişime karşı koyan bir gerilim üretir. Bu özelliğe <b>endüktans</b> (L) denir, birimi <b>Henry</b>’dir (H).</p><p>AC’de bobin akımı sınırlar; bu sınırlamaya <b>endüktif reaktans</b> (X<sub>L</sub>) denir. Direnç gibi Ω ile ölçülür ama ısı üretmez, enerjiyi manyetik alanda depolayıp geri verir. DC’de bobin (kararlı durumda) sadece tel direnci gösterir.</p>',
  formul:[['X<sub>L</sub> = 2π × f × L', 'X<sub>L</sub>: Ω · f: Hz · L: H. Frekans artarsa reaktans artar.']],
  dene:{g:[['L', 'Endüktans', 'mH', 100], ['f', 'Frekans', 'Hz', 50]], h:v => { const X = 2 * Math.PI * v.f * v.L / 1000; return [['X<sub>L</sub>', f(X, 2) + ' Ω', 'v'], ['230 V’ta akım', f(230 / X, 2) + ' A']]; }},
  uygulama:['Eski floresanlarda balast (şok bobini) lamba akımını sınırlar.','Motor ve trafo sargıları bobindir: düşük cos φ’nin kaynağı.','Harmonik filtrelerinde ve frekans sürücüsü girişinde şok bobini kullanılır.'],
  dikkat:['Bobinli devreyi açarken (röle, kontaktör, anahtar) yüksek gerilim darbesi ve kıvılcım oluşur.'],
  ilgili:['kondansator','empedans','faz_farki','manyetizma']
});
konu({id:'kondansator', kat:'ac', ikon:'🔋', sv:2, ad:'Kondansatör, Kapasitans ve Kapasitif Reaktans', ozet:'Kondansatör yük depolar; AC’de akım geçirir, DC’yi keser.', etiket:['kondansatör','kapasitans','farad','mikrofarad','µf','xc','kapasitif','motor kondansatörü'],
  tanim:'<p><b>Kondansatör</b>, iki iletken plaka ve arasındaki yalıtkandan oluşur; elektrik yükü depolar. Kapasitans (C) birimi <b>Farad</b>’dır; pratikte mikrofarad (µF) kullanılır.</p><p>DC’de kondansatör dolduktan sonra akım geçirmez. AC’de sürekli dolup boşaldığı için akım geçirir; bu akımı sınırlayan büyüklüğe <b>kapasitif reaktans</b> (X<sub>C</sub>) denir. Frekans arttıkça X<sub>C</sub> azalır.</p>',
  formul:[['X<sub>C</sub> = 1 / (2π × f × C)', 'X<sub>C</sub>: Ω · C: F'], ['I<sub>C</sub> = U × 2π × f × C', 'Kondansatör akımı'], ['Q<sub>C</sub> = U² × 2π × f × C', 'Kondansatörün reaktif gücü (VAr)']],
  dene:{g:[['C', 'Kapasitans', 'µF', 50], ['U', 'Gerilim', 'V', 400], ['f', 'Frekans', 'Hz', 50]], h:v => { const w = 2 * Math.PI * v.f, C = v.C * 1e-6; return [['X<sub>C</sub>', f(1 / (w * C), 1) + ' Ω'], ['Akım', f(v.U * w * C, 2) + ' A'], ['Reaktif güç', f(v.U * v.U * w * C / 1000, 2) + ' kVAr', 'v']]; }},
  uygulama:['Tek fazlı motorlarda yardımcı sargıya seri kondansatör döner alan oluşturur.','Kompanzasyon panolarında kondansatörler endüktif reaktif gücü dengeler.','Adaptörlerde DC filtreleme ve parazit bastırmada kullanılır.'],
  dikkat:['Kondansatör enerji kesildikten sonra da yüklü kalabilir: kompanzasyon ve sürücü kondansatörlerini deşarj etmeden dokunma.','Elektrolitik kondansatörün kutbu terse bağlanırsa patlar.','Kondansatör gerilim değeri, devrenin tepe gerilimine göre seçilir.'],
  hesap:['enerji','kompanzasyon'], sema:['mot1f','steinmetz'], ilgili:['bobin','cosfi','tek_faz_motor']
});
konu({id:'empedans', kat:'ac', ikon:'🧮', sv:3, ad:'Empedans (Z)', ozet:'AC’de direnç ve reaktansın birleşik etkisi: akımı sınırlayan toplam “engel”.', etiket:['empedans','z','reaktans','direnç','döngü empedansı','vektör'],
  tanim:'<p>AC devrede akıma karşı koyan iki şey vardır: <b>direnç</b> (R, ısı üretir) ve <b>reaktans</b> (X, enerji depolayıp geri verir). İkisinin bileşkesine <b>empedans</b> (Z) denir, birimi Ω’dur. Reaktans ile direnç aynı fazda olmadığı için düz toplanmaz; dik üçgen gibi (vektörel) toplanır.</p>',
  formul:[['Z = √(R² + X²)', 'X = X<sub>L</sub> − X<sub>C</sub>'], ['I = U / Z', 'AC Ohm kanunu'], ['cos φ = R / Z', 'Güç faktörü']],
  dene:{g:[['R', 'Direnç', 'Ω', 30], ['X', 'Reaktans (X<sub>L</sub>−X<sub>C</sub>)', 'Ω', 40]], h:v => { const Z = Math.hypot(v.R, v.X); return [['Z', f(Z, 2) + ' Ω', 'v'], ['cos φ', f(v.R / Z, 3)], ['230 V’ta akım', f(230 / Z, 2) + ' A']]; }},
  uygulama:['Kısa devre ve sigorta hesabında “döngü empedansı” (Z<sub>s</sub>) kullanılır.','Hoparlör ve anten sistemlerinde empedans uyumu (8 Ω, 75 Ω, 50 Ω) sinyal kaybını önler.'],
  ilgili:['bobin','kondansator','dongu_empedansi']
});
konu({id:'guc_turleri', kat:'ac', ikon:'📊', sv:2, ad:'Aktif, Reaktif ve Görünür Güç', ozet:'W, VAr ve VA: neden jeneratör kVA, motor kW ile anılır?', etiket:['aktif güç','reaktif güç','görünür güç','kw','kvar','kva','güç üçgeni'],
  tanim:'<p><b>Aktif güç (P, W/kW)</b>: işe dönüşen güç (ısı, ışık, mekanik). Faturada kWh olarak ödenir.</p><p><b>Reaktif güç (Q, VAr/kVAr)</b>: bobin ve kondansatörlerin alan oluşturmak için kaynakla yük arasında gidip getirdiği güç. İş yapmaz ama kabloları ve trafoyu yükler.</p><p><b>Görünür güç (S, VA/kVA)</b>: ikisinin bileşkesi; kablo, sigorta, trafo, jeneratör ve UPS bu değere göre seçilir, çünkü akım S ile orantılıdır.</p>',
  cizim:'guc',
  formul:[['S = √(P² + Q²)', 'Güç üçgeni'], ['P = S × cos φ', 'Aktif güç'], ['Q = S × sin φ = P × tan φ', 'Reaktif güç'], ['S = U × I (1 faz) · S = √3 × U × I (3 faz)', 'Görünür güç ve akım ilişkisi']],
  dene:{g:[['P', 'Aktif güç', 'kW', 10], ['c', 'cos φ', '', 0.8]], h:v => { const S = v.P / v.c, Q = Math.sqrt(S * S - v.P * v.P); return [['S', f(S, 2) + ' kVA', 'v'], ['Q', f(Q, 2) + ' kVAr'], ['3 faz akım', f(S * 1000 / (Math.sqrt(3) * 400), 1) + ' A']]; }},
  uygulama:['Jeneratör ve UPS kVA ile satılır: 10 kVA jeneratör cos φ = 0,8’de 8 kW verir.','Motor etiketinde kW (mekanik) yazar; şebekeden çekilen kVA daha büyüktür.','Trafo kapasitesi kVA ile ifade edilir.'],
  ornek:{s:'8 kW, cos φ = 0,8 olan bir atölye yükü için en az kaç kVA jeneratör gerekir?', a:['S = P / cos φ = 8 / 0,8 = 10 kVA','Motor kalkışları ve pay için ≈ %25 ekle'], c:'≈ 12,5 kVA jeneratör'},
  hesap:['guc','jenerator','kompanzasyon'], ilgili:['cosfi','faz_farki','guc_enerji']
});
konu({id:'cosfi', kat:'ac', ikon:'⚖️', sv:2, ad:'Güç Faktörü (cos φ) ve Kompanzasyon', ozet:'Düşük cos φ = gereksiz akım, ısınan kablo, reaktif ceza. Çözüm: kondansatör.', etiket:['kompanzasyon','cosfi','güç faktörü','reaktif ceza','kondansatör','reaktif güç rölesi','kvar'],
  tanim:'<p><b>Güç faktörü</b> (cos φ), çekilen akımın ne kadarının iş yaptığını gösterir. cos φ = 1 idealdir. Motorlar, trafolar, eski balastlar cos φ’yi düşürür.</p><p>Düşük cos φ aynı iş için daha fazla akım demektir: kablolar ısınır, gerilim düşer, trafo dolar. Bu yüzden dağıtım şirketleri belli bir sınırı aşan <b>reaktif enerjiyi</b> faturaya yansıtır.</p><p><b>Kompanzasyon</b>: yükün yanına (veya ana panoya) kondansatör bağlayarak endüktif reaktif gücü yerinde karşılamaktır. Ana panoda <b>reaktif güç rölesi</b>, yük değiştikçe kondansatör kademelerini devreye alıp çıkarır.</p>',
  cizim:'guc',
  formul:[['Q<sub>C</sub> = P × (tan φ₁ − tan φ₂)', 'Gereken kondansatör gücü (kVAr); φ₁ mevcut, φ₂ hedef'], ['Endüktif oran = kVArh<sub>end</sub> / kWh', 'Faturadaki ceza kontrolü'], ['I<sub>yeni</sub> = I<sub>eski</sub> × cos φ₁ / cos φ₂', 'Kompanzasyon sonrası akım']],
  dene:{g:[['P', 'Aktif güç', 'kW', 30], ['c1', 'Mevcut cos φ', '', 0.75], ['c2', 'Hedef cos φ', '', 0.97]], h:v => { const t = c => Math.tan(Math.acos(c)), Q = v.P * (t(v.c1) - t(v.c2)); return [['Gerekli kondansatör', f(Q, 1) + ' kVAr', 'v'], ['Akım azalması', '%' + f((1 - v.c1 / v.c2) * 100, 0)]]; }},
  ek:'<div class="ek-not">Reaktif bedel konut, aydınlatma, tek fazlı ve 15 kW’a kadar abonelere uygulanmaz. Kurulu gücü 50 kVA altında endüktif/aktif %33, kapasitif/aktif %20; 50 kVA ve üstünde %20 ve %15 aşılınca ücretlenir. Güncel oranları dağıtım şirketi tarifesinden teyit et.</div>',
  uygulama:['Kompanzasyon panosunda röle, kademeli kondansatörler, kondansatör kontaktörleri ve sigortaları bulunur.','Aşırı kompanzasyon (gece yük yokken kondansatör devrede) kapasitif cezaya yol açar.','Harmonik çok olan tesislerde (sürücü, UPS) harmonik filtreli (şoklu) kompanzasyon gerekir.'],
  ornek:{s:'Faturada 4.000 kWh aktif, 1.600 kVArh endüktif var (kurulu güç 40 kVA). Ceza var mı?', a:['Oran = 1600 / 4000 = %40','50 kVA altı sınır %33'], c:'%40 > %33 → reaktif bedel ödenir; kompanzasyon kontrol edilmeli.'},
  dikkat:['Kondansatör deşarj dirençleri olmadan sökülürse tehlikeli yük taşır.','Kondansatörü harmonikli şebekede şoksuz kullanmak rezonansa ve kondansatör patlamasına yol açabilir.'],
  hesap:['kompanzasyon','guc'], ilgili:['guc_turleri','harmonik','rezonans']
});
konu({id:'harmonik', kat:'ac', ikon:'📈', sv:3, ad:'Harmonikler', ozet:'Elektronik yükler sinüsü bozar: nötr ısınır, KAR ve kompanzasyon şaşırır.', etiket:['harmonik','thd','3. harmonik','nötr ısınması','bozuk sinüs','smps','led sürücü'],
  tanim:'<p>Şebeke 50 Hz sinüs gerilimi verir ama LED sürücüleri, adaptörler, bilgisayarlar, inverter klimalar ve frekans sürücüleri akımı “parça parça” çeker. Bu bozuk akım; 50 Hz ana dalga ile 150 Hz (3.), 250 Hz (5.), 350 Hz (7.) gibi katlarının toplamı gibi davranır: bunlara <b>harmonik</b> denir. Bozulmanın ölçüsü <b>THD</b>’dir (toplam harmonik bozulma, %).</p><p>Üç fazlı sistemde ana dalga akımları nötrde birbirini götürür, ama <b>3. harmonik ve katları nötrde toplanır</b>: dengeli yükte bile nötr akımı faz akımından büyük olabilir.</p>',
  formul:[['f<sub>n</sub> = n × 50 Hz', 'n. harmonik frekansı'], ['THD = √(I₂² + I₃² + …) / I₁', 'Toplam harmonik bozulma'], ['I<sub>N</sub> ≈ 3 × I<sub>3. harmonik</sub>', 'Nötrde toplanan 3. harmonik akım (dengeli 3 faz)']],
  uygulama:['Ofis ve LED ağırlıklı binalarda nötr kesiti fazdan küçültülmez, gerekirse büyütülür.','Kompanzasyon kondansatörleri harmonik akımla aşırı ısınır: şoklu (detuned) sistem kullanılır.','Frekans sürücülerinin girişine şok bobini veya filtre konur.'],
  dikkat:['Ucuz multimetre bozuk dalgada yanlış okur: gerçek RMS ölçü aleti kullan.','Harmonikli tesiste nötrün gevşek bağlantısı hızla yanar.'],
  ilgili:['gercek_rms','cosfi','dengesiz_yuk']
});
konu({id:'rezonans', kat:'ac', ikon:'🎵', sv:3, ad:'Rezonans', ozet:'Bobin ve kondansatör belli bir frekansta birbirini tamamlar; akım veya gerilim aşırı büyür.', etiket:['rezonans','rezonans frekansı','lc devresi','kompanzasyon rezonansı','detuned'],
  tanim:'<p>Bir devrede X<sub>L</sub> = X<sub>C</sub> olduğunda bobin ve kondansatörün reaktansları birbirini sıfırlar: buna <b>rezonans</b> denir. Seri rezonansta akım, paralel rezonansta gerilim çok büyüyebilir.</p><p>Tesisatta tehlikeli örnek: kompanzasyon kondansatörleri ile trafonun endüktansı, harmonik frekanslarından birine (ör. 250 Hz) yakın rezonans yaparsa o harmonik büyür; kondansatörler şişer, sigortalar atar.</p>',
  formul:[['f<sub>r</sub> = 1 / (2π √(L × C))', 'Rezonans frekansı']],
  dene:{g:[['L', 'Endüktans', 'mH', 1], ['C', 'Kapasitans', 'µF', 400]], h:v => [['Rezonans frekansı', f(1 / (2 * Math.PI * Math.sqrt(v.L / 1000 * v.C * 1e-6)), 0) + ' Hz', 'v'], ['Harmonik sırası', f(1 / (2 * Math.PI * Math.sqrt(v.L / 1000 * v.C * 1e-6)) / 50, 1)]]},
  uygulama:['Şoklu kompanzasyonda kondansatöre seri şok bobini konur; rezonans frekansı 189 Hz (%7 şok) gibi güvenli bir değere çekilir.','Radyo, TV ayar devreleri ve anten filtreleri rezonans ilkesiyle çalışır.'],
  ilgili:['harmonik','cosfi']
});
test('ac', [
  {s:'230 V şebekenin tepe değeri yaklaşık kaçtır?', c:['230 V', '280 V', '325 V', '400 V'], d:2, a:'U<sub>tepe</sub> = 230 × √2 ≈ 325 V.'},
  {s:'50 Hz şebekede bir periyot kaç milisaniyedir?', c:['5 ms', '10 ms', '20 ms', '50 ms'], d:2, a:'T = 1/f = 1/50 s = 20 ms.'},
  {s:'Endüktif bir yükte akım gerilime göre nasıldır?', c:['İleride', 'Geride', 'Aynı fazda', 'Ters yönde'], d:1, a:'Bobinli yüklerde akım gerilimden geri kalır.'},
  {s:'10 kVA jeneratör cos φ = 0,8’de en fazla kaç kW aktif güç verir?', c:['6 kW', '8 kW', '10 kW', '12,5 kW'], d:1, a:'P = S × cos φ = 10 × 0,8 = 8 kW.'},
  {s:'Dengeli bir üç fazlı sistemde nötrde toplanan harmonik hangisidir?', c:['2.', '3.', '5.', '7.'], d:1, a:'3. harmonik ve katları üç fazda aynı fazda olduğu için nötrde toplanır.'}
]);
