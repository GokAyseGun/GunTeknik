konu({id:'led_verim', kat:'aydinlatma', ikon:'💡', sv:1, ad:'Işık Verimi (lm/W) ve Lamba Teknolojileri', ozet:'Akkor ≈ 12 lm/W, floresan ≈ 60–90, LED ≈ 100–200 lm/W.', etiket:['lm/w','verim','led','akkor','halojen','floresan','kompakt floresan','tasarruf'],
  tanim:'<p><b>Işık verimi</b>, harcanan her watt başına üretilen lümendir. Ne kadar yüksekse o kadar az enerjiyle aynı ışık elde edilir.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Teknoloji</th><th>lm/W (yaklaşık)</th><th>Ömür</th></tr><tr><td>Akkor</td><td>10–15</td><td>1.000 saat</td></tr><tr><td>Halojen</td><td>15–25</td><td>2.000–4.000 saat</td></tr><tr><td>Floresan (T8/T5)</td><td>60–100</td><td>10.000–20.000 saat</td></tr><tr><td>LED</td><td>90–200</td><td>25.000–50.000 saat (L70)</td></tr></table></div>',
  formul:[['η = Φ / P', 'lm/W'], ['Tasarruf = (P<sub>eski</sub> − P<sub>yeni</sub>) × saat × fiyat', '']],
  dene:{g:[['a', 'Eski lamba gücü', 'W', 60], ['b', 'Yeni LED gücü', 'W', 8], ['n', 'Lamba sayısı', 'adet', 10], ['h', 'Günlük kullanım', 'saat', 5], ['fy', 'Birim fiyat', '₺/kWh', 3]], h:v => { const kwh = (v.a - v.b) * v.n * v.h * 365 / 1000; return [['Yıllık tasarruf', f(kwh, 0) + ' kWh', 'v'], ['Tutar', EK.tl(kwh * v.fy)]]; }},
  uygulama:['LED ömrü büyük ölçüde sürücü ve soğutmaya bağlıdır; kapalı, sıcak armatürde ömür kısalır.','“L70” ömür: ışığın %70’e düştüğü süre.'],
  ilgili:['lumen_luks','led_surucu']
});
konu({id:'renk_sicakligi', kat:'aydinlatma', ikon:'🌡️', sv:1, ad:'Renk Sıcaklığı (K) ve Renksel Geri Verim (CRI)', ozet:'2700 K sıcak, 4000 K nötr, 6500 K soğuk beyaz. CRI renklerin doğru görünmesi.', etiket:['kelvin','renk sıcaklığı','gün ışığı','sıcak beyaz','cri','ra','3000k','4000k','6500k'],
  tanim:'<p><b>Renk sıcaklığı</b> ışığın tonunu anlatır: düşük K sarımsı/sıcak, yüksek K mavimsi/soğuk.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>K</th><th>Ton</th><th>Kullanım</th></tr><tr><td>2700–3000</td><td>Sıcak beyaz</td><td>Yatak ve oturma odası, restoran</td></tr><tr><td>4000</td><td>Nötr/doğal beyaz</td><td>Mutfak, banyo, ofis</td></tr><tr><td>5000–6500</td><td>Soğuk/gün ışığı</td><td>Atölye, depo, dış mekan</td></tr></table></div><p><b>CRI (Ra)</b>: ışığın renkleri ne kadar doğru gösterdiği (0–100). Ev ve ofiste ≥ 80, mağaza, kuaför, mutfak tezgâhında ≥ 90 önerilir.</p>',
  uygulama:['Aynı mekânda farklı K lambaları karıştırmak kötü görünür.','Akşam saatlerinde düşük K daha dinlendiricidir.'],
  ilgili:['lumen_luks','led_verim']
});
konu({id:'led_surucu', kat:'aydinlatma', ikon:'🔌', sv:2, ad:'LED Sürücü: Sabit Akım ve Sabit Gerilim', ozet:'Panel ve spotlar sabit akım (mA), şerit LED sabit gerilim (12/24 V) ister. Karıştırmak LED’i yakar.', etiket:['led sürücü','driver','sabit akım','sabit gerilim','cc','cv','mA','12v adaptör','24v'],
  tanim:'<p>LED akımla kontrol edilen bir elemandır: gerilimdeki küçük bir artış akımı çok artırır. Bu yüzden iki tip besleme kullanılır:</p><ul><li><b>Sabit akım (CC)</b> sürücü: çıkış akımı sabittir (ör. 300 mA, 700 mA); gerilim LED sayısına göre ayarlanır (ör. 24–42 V). Panel LED, COB spot ve armatür modülleri bununla beslenir. LED’ler <b>seri</b> bağlanır.</li><li><b>Sabit gerilim (CV)</b> sürücü/adaptör: çıkış 12 V veya 24 V sabittir; akımı yük belirler. Şerit LED bununla beslenir; şeritler <b>paralel</b> bağlanır.</li></ul>',
  formul:[['P<sub>sürücü</sub> ≥ 1,2 × P<sub>LED</sub>', 'Sabit gerilim sürücüde %20 pay'], ['U<sub>çıkış</sub> = n × U<sub>f</sub>', 'Sabit akımda seri LED sayısı × LED ileri gerilimi']],
  uygulama:['Panel LED arızasında genellikle sürücü değiştirilir: aynı mA ve gerilim aralığında olmalı.','Dış mekân sürücüsü IP67 ve parafudr korumalı seçilir.'],
  dikkat:['Sabit akım sürücüyü boşta (LED takmadan) çalıştırmak bazı modellerde sürücüyü bozar.','Şerit LED’i sabit akım sürücüye veya panel LED’i 12 V adaptöre bağlamak LED’i yakar ya da çalıştırmaz.'],
  sema:['led_serit','led_tup'], ilgili:['led_serit_teori','smps','dimmer_titreme']
});
konu({id:'led_serit_teori', kat:'aydinlatma', ikon:'🌈', sv:1, ad:'Şerit LED Hesabı ve Montajı', ozet:'W/m × metre = güç. 12 V’ta uzun şeritte uç kararır: 24 V veya iki uçtan besleme.', etiket:['şerit led','led bant','12v','24v','w/m','gerilim düşümü','alüminyum profil','smd 2835','cob şerit'],
  tanim:'<p>Şerit LED belli aralıklarla kesilebilen, sabit gerilimle (12 V veya 24 V) çalışan esnek devredir. Güç metre başına verilir (ör. 9,6 W/m, 14,4 W/m). Şeridin kendi bakır yolu ince olduğu için uzun şeritte sona doğru gerilim düşer ve ışık kararır/renk değişir: 12 V’ta ≈ 5 m, 24 V’ta ≈ 10 m tek uçtan besleme sınırıdır.</p>',
  formul:[['P = L × W/m', 'Toplam güç'], ['P<sub>adaptör</sub> ≥ P × 1,2', 'Adaptör gücü'], ['I = P / U', 'Kablo seçimi için akım']],
  dene:{g:[['L', 'Şerit uzunluğu', 'm', 8], ['w', 'Güç', 'W/m', 14.4], ['U', 'Gerilim', '', 24, [[12, '12 V'], [24, '24 V']]]], h:v => { const P = v.L * v.w; return [['Toplam güç', f(P, 1) + ' W'], ['Adaptör (en az)', f(Math.ceil(P * 1.2 / 10) * 10, 0) + ' W', 'v'], ['Akım', f(P / v.U, 2) + ' A'], ['Tek uçtan besleme', v.L <= (v.U === 12 ? 5 : 10) ? 'uygun' : 'iki uçtan veya ortadan besle', v.L <= (v.U === 12 ? 5 : 10) ? '' : 'uy']]; }},
  uygulama:['Şeridi alüminyum profile yapıştır: ısıyı atar, ömrü uzar.','Adaptörü havalanan, ulaşılabilir yere koy (asma tavanın içinde kapalı kutuya değil).','Mutfak tezgâh altı ve banyoda IP65 şerit + uygun profil kullan.'],
  hesap:['aydinlatma','gd'], sema:['led_serit'], ilgili:['led_surucu','gerilim_dusumu']
});
konu({id:'duy_tipleri', kat:'aydinlatma', ikon:'🔩', sv:1, ad:'Duy ve Soket Tipleri', ozet:'E27, E14, GU10, MR16/GU5.3, G13, G9, R7s, B22.', etiket:['duy','e27','e14','gu10','mr16','gu5.3','g13','g9','r7s','b22','soket'],
  tanim:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tip</th><th>Yapı</th><th>Kullanım</th></tr><tr><td>E27</td><td>27 mm vidalı</td><td>Standart lamba</td></tr><tr><td>E14</td><td>14 mm vidalı (mum duy)</td><td>Avize, aplik, gece lambası</td></tr><tr><td>GU10</td><td>Döndürmeli 2 pim, 230 V</td><td>Spot</td></tr><tr><td>GU5.3 (MR16)</td><td>2 pim, 12 V</td><td>Düşük gerilim spot (trafo/sürücü ister)</td></tr><tr><td>G9</td><td>Halka pimli, 230 V</td><td>Küçük avize/aplik</td></tr><tr><td>G13</td><td>13 mm pim aralıklı</td><td>T8 floresan / LED tüp</td></tr><tr><td>R7s</td><td>İki uçlu çubuk</td><td>Halojen projektör</td></tr><tr><td>B22</td><td>Bayonet (İngiliz)</td><td>İthal armatürler</td></tr></table></div><p>Vidalı duyda <b>faz orta kontağa (dip), nötr vida kısmına</b> bağlanır: lamba değiştirirken vida kısmına dokunulsa bile tehlike azalır.</p>',
  uygulama:['MR16 halojen yerine LED takarken eski elektronik trafo minimum yük nedeniyle titreşime yol açabilir.','Floresan armatürü LED tüpe çevirirken starter/balast bağlantısı LED tüp tipine göre değiştirilir.'],

konu({id:'dimmer_titreme', kat:'aydinlatma', ikon:'🎚️', sv:2, ad:'Dimmer Uyumu ve Titreme (Flicker)', ozet:'Her LED kısılamaz. Faz kesmeli dimmer, dim edilebilir LED, minimum yük ve titreme sebepleri.', etiket:['dimmer','dim','kısılabilir led','faz kesme','leading edge','trailing edge','titreme','flicker','minimum yük','0-10v','dali'],
  tanim:'<p>Klasik dimmer, sinüsün bir kısmını keserek lambaya giden ortalama gücü azaltır (faz kesme). Akkor lambada sorunsuzdur. LED ise içindeki sürücü yüzünden bu kesik dalgaya uyumlu olmalıdır: kutusunda <b>“dimmable / kısılabilir”</b> yazmalı.</p><ul><li><b>Önden kesmeli (leading edge, R-L)</b>: akkor, halojen, sargılı trafo.</li><li><b>Arkadan kesmeli (trailing edge, R-C)</b>: LED ve elektronik trafolar için genelde daha uygun.</li></ul><p>Dimmerin <b>minimum yükü</b> vardır; az sayıda LED bağlanırsa titreme, açılıp kapanma veya tamamen kısılamama olur. Profesyonel sistemlerde 0–10 V, DALI veya akıllı (Wi-Fi/Zigbee) kontrol kullanılır.</p>',
  uygulama:['Kısılamaz LED’i dimmere bağlamak hem LED’i hem dimmeri bozabilir.','Kapalıyken hafif yanan/yanıp sönen LED: anahtar nötrü kesiyor olabilir, ışıklı anahtar akımı veya kablolar arası kapasitif kaçak. Çözüm: fazı kesmek, ışıksız anahtar, gerekiyorsa yük direnci/kondansatörü.'],
  sema:['dimmer','isikli'], ilgili:['led_surucu','harmonik']
});

konu({id:'diyot', kat:'elektronik', ikon:'▶️', sv:2, ad:'Diyot, LED ve Doğrultma', ozet:'Diyot akımı tek yönde geçirir. Köprü diyot AC’yi DC’ye çevirir.', etiket:['diyot','köprü diyot','doğrultucu','led','ileri gerilim','0,7 v','serbest geçiş diyodu','1n4007'],
  tanim:'<p><b>Diyot</b> akımı yalnızca bir yönde (anottan katoda) geçirir; ters yönde keser. İleri yönde üzerinde ≈ 0,7 V (silisyum) düşer. <b>LED</b> ışık yayan diyottur; ileri gerilimi renge göre ≈ 2–3,3 V’tur ve mutlaka akım sınırlamasıyla çalışır.</p><p><b>Köprü doğrultucu</b> (4 diyot), AC’nin her iki yarısını aynı yöne çevirir; ardından kondansatör ile dalgalanma yumuşatılır.</p>',
  formul:[['U<sub>DC</sub> ≈ U<sub>AC</sub> × √2 − 1,4 V', 'Köprü + kondansatör, boşta'], ['R = (U − U<sub>f</sub>) / I<sub>LED</sub>', 'LED ön direnci']],
  dene:{g:[['U', 'Besleme', 'V', 12], ['uf', 'LED ileri gerilimi', 'V', 3], ['i', 'LED akımı', 'mA', 20]], h:v => { const R = (v.U - v.uf) / (v.i / 1000), P = (v.U - v.uf) * v.i / 1000; return [['Ön direnç', f(R, 0) + ' Ω', 'v'], ['Direnç gücü', f(P, 3) + ' W (≥ ' + (P < 0.2 ? '¼' : P < 0.4 ? '½' : '1') + ' W seç)']]; }},
  uygulama:['DC röle/kontaktör bobinine ters paralel diyot (serbest geçiş diyodu) kapanma darbesini söndürür.','Kilit gibi DC yüklerde AC kullanılacaksa köprü diyot eklenir.','Güneş panellerinde bypass diyotları gölgelenen hücreyi devre dışı bırakır.'],
  ilgili:['smps','kondansator','role_transistor']
});
konu({id:'role_transistor', kat:'elektronik', ikon:'🔀', sv:2, ad:'Röle, Transistör, SSR ve Triyak', ozet:'Küçük sinyalle büyük yükü anahtarlamanın yolları: mekanik röle mi, katı hal rölesi mi?', etiket:['röle','transistör','mosfet','ssr','katı hal rölesi','triyak','optokuplör','kuru kontak'],
  tanim:'<p><b>Mekanik röle</b>: bobin enerjilenince kontak kapanır; giriş ve çıkış tamamen ayrıdır (<b>kuru kontak</b>). Basit, ucuz; ama kontak aşınır ve tıklar.</p><p><b>Transistör / MOSFET</b>: DC yükleri sessiz ve hızlı anahtarlar (LED şerit dimmer, PWM).</p><p><b>Triyak</b> ve <b>SSR (katı hal rölesi)</b>: AC yükleri kontaksız anahtarlar; sessiz, ömürlü, ama ısınır (soğutucu gerekir) ve kapalıyken küçük bir kaçak akım geçirir.</p>',
  uygulama:['Kombi TA girişi, kapı otomasyonu ve alarm çıkışları için “kuru kontak” röle kullanılır.','Akıllı anahtarlar genellikle küçük röle veya triyak içerir; nötrsüz modeller lambadan küçük akım çekerek beslenir (LED titreyebilir).','SSR kapalıyken çıkışta gerilim ölçülebilir: kaçak akımdan, arıza değildir.'],
  sema:['kombi_rf','akilli'], ilgili:['kontaktor','diyot']
});
konu({id:'smps', kat:'elektronik', ikon:'🔌', sv:2, ad:'Adaptör ve Anahtarlamalı Güç Kaynağı (SMPS)', ozet:'Hafif, verimli, geniş giriş aralıklı. Ray tipi 24 V kaynaklar, kamera adaptörleri, LED sürücüler.', etiket:['adaptör','smps','güç kaynağı','24v kaynak','ray tipi','meanwell','switching','dc besleme'],
  tanim:'<p>Eski trafolu adaptörler ağır ve verimsizdir. <b>Anahtarlamalı güç kaynağı</b> (SMPS) şebekeyi önce doğrultur, sonra on binlerce Hz’de anahtarlayarak küçük bir yüksek frekans trafosundan geçirir. Sonuç: küçük, hafif, %85–95 verimli, genellikle 100–240 V giriş kabul eden kaynak.</p>',
  formul:[['P<sub>kaynak</sub> ≥ 1,2–1,3 × ΣP<sub>yük</sub>', 'Pay bırak'], ['I<sub>çıkış</sub> = P / U', 'Kablo kesiti çıkış akımına göre seçilir']],
  dene:{g:[['n', 'Kamera/cihaz sayısı', 'adet', 8], ['w', 'Bir cihaz (gece maks.)', 'W', 6], ['U', 'Çıkış', 'V', 12]], h:v => { const P = v.n * v.w; return [['Toplam yük', f(P, 0) + ' W'], ['Kaynak (en az)', f(Math.ceil(P * 1.3 / 10) * 10, 0) + ' W', 'v'], ['Çıkış akımı', f(P / v.U, 1) + ' A']]; }},
  uygulama:['Kamera sistemlerinde 12 V düşük gerilimde uzun kabloda düşüm büyüktür; mümkünse PoE veya her kameraya yakın besleme.','Ray tipi kaynaklarda çıkış gerilimi ince ayar potu (V adj) ile hat kaybı telafi edilebilir.','Çok sayıda SMPS harmonik üretir (bkz. Harmonikler).'],
  dikkat:['Ucuz adaptörlerde giriş-çıkış yalıtımı zayıf olabilir: SELV gereken yerde (banyo, havuz) sertifikalı güvenlik kaynağı kullan.'],
  ilgili:['led_surucu','harmonik','poe']
});
konu({id:'sensorler', kat:'elektronik', ikon:'📡', sv:1, ad:'Sensörler: PIR, LDR, NTC, Mikrodalga', ozet:'Hareket, ışık ve sıcaklık algılayan elemanlar; montaj yeri performansı belirler.', etiket:['pir','hareket sensörü','ldr','fotosel','ntc','ptc','termistör','mikrodalga sensör','alacakaranlık'],
  tanim:'<ul><li><b>PIR</b> (pasif kızılötesi): ısı yayan cismin <b>hareketini</b> algılar; önünden yan geçişi, doğrudan yaklaşmaktan daha iyi görür. Cam arkasını görmez.</li><li><b>Mikrodalga</b> sensör: radar gibi çalışır; ince duvarların arkasını da algılayabilir, daha hassastır ama yanlış algılama yapabilir.</li><li><b>LDR / fotosel</b>: ışıkla direnci değişir; alacakaranlık şalterlerinde kullanılır.</li><li><b>NTC / PTC</b>: sıcaklıkla direnci azalan / artan dirençler; klima, kombi, şofben sensörleri.</li></ul>',
  uygulama:['Fotosel sokak lambasının ışığını görmeyecek şekilde kuzeye bakan yere konur.','PIR’ı kalorifer, klima üflemesi ve güneş alan pencerelere bakacak yere koyma: yanlış tetikler.','Klima ve kombi arızalarında NTC sensörün direnci tablodan kontrol edilir (25 °C’de tipik 5 kΩ, 10 kΩ, 15 kΩ).'],
  sema:['pir','foto'], ilgili:['role_transistor']
});
konu({id:'aku_turleri', kat:'elektronik', ikon:'🔋', sv:1, ad:'Akü Türleri ve Kapasite (Ah, Wh)', ozet:'Kurşun-asit, AGM, jel, LiFePO₄. Ah tek başına yetmez; Wh ve deşarj derinliği belirler.', etiket:['akü','ah','wh','agm','jel akü','lifepo4','lityum','dod','deşarj derinliği','döngü ömrü','c20'],
  tanim:'<p>Akü kapasitesi <b>Ah</b> (amper-saat) ile verilir: 100 Ah, teorik olarak 5 A’i 20 saat verebilir (C20). Gerçek enerji <b>Wh = V × Ah</b>’tir: 12 V 100 Ah = 1,2 kWh.</p><p>Her akü tamamen boşaltılamaz. <b>Deşarj derinliği</b> (DoD) ömrü belirler: kurşun-asit akülerde %50’nin altına inmek ömrü hızla kısaltır; LiFePO₄ %80–90 kullanılabilir.</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tür</th><th>Kullanılabilir DoD</th><th>Döngü (yaklaşık)</th><th>Not</th></tr><tr><td>Sulu kurşun-asit</td><td>%50</td><td>300–500</td><td>Bakım (su) ister, gaz çıkarır</td></tr><tr><td>AGM</td><td>%50</td><td>400–800</td><td>Bakımsız, UPS’lerde yaygın</td></tr><tr><td>Jel</td><td>%50–60</td><td>500–1.200</td><td>Derin döngüye daha dayanıklı</td></tr><tr><td>LiFePO₄</td><td>%80–90</td><td>3.000–6.000</td><td>BMS’li, hafif, yüksek ilk maliyet</td></tr></table></div>',
  formul:[['E = U × Ah', 'Wh'], ['t ≈ E × DoD × η / P', 'Çalışma süresi (saat); η inverter verimi ≈ 0,85–0,9'], ['Ah<sub>gerekli</sub> = P × t / (U × DoD × η)', '']],
  dene:{g:[['P', 'Yük', 'W', 300], ['t', 'İstenen süre', 'saat', 5], ['U', 'Akü bankası gerilimi', 'V', 24], ['d', 'Akü türü', '', 0.5, [[0.5, 'Kurşun-asit/AGM/Jel (%50)'], [0.85, 'LiFePO₄ (%85)']]]], h:v => { const Ah = v.P * v.t / (v.U * v.d * 0.88); return [['Gerekli kapasite', f(Ah, 0) + ' Ah @ ' + v.U + ' V', 'v'], ['Enerji', f(v.P * v.t / 1000, 2) + ' kWh kullanılır'], ['12 V 100 Ah akü', Math.ceil(Ah * v.U / 1200) + ' adet (eşdeğer)']]; }},
  uygulama:['Kurşun-asit aküler soğukta kapasite kaybeder ve kışın tam şarjlı tutulmalıdır.','Akü odası havalandırılmalı (kurşun-asitte hidrojen).','LiFePO₄’ü kurşun-asit şarj profiliyle şarj etme; şarj cihazını/MPPT’yi akü tipine ayarla.'],
  hesap:['ups','gunes'], sema:['aku_baglama','offgrid'], ilgili:['sarj_asamalari','ups','offgrid_teori']
});
konu({id:'sarj_asamalari', kat:'elektronik', ikon:'🔄', sv:2, ad:'Akü Şarj Aşamaları (Bulk, Absorption, Float)', ozet:'Akıllı şarj cihazının üç aşaması ve gerilim değerleri.', etiket:['şarj','bulk','absorption','float','14,4 v','13,6 v','akü şarj','eşitleme'],
  tanim:'<ol><li><b>Bulk (yığın)</b>: sabit akımla hızlı şarj; gerilim yükselir.</li><li><b>Absorption (emme)</b>: gerilim sabit tutulur (12 V kurşun-asitte ≈ 14,2–14,6 V), akım azalarak akü dolar.</li><li><b>Float (tutma)</b>: akü dolunca gerilim düşürülür (≈ 13,5–13,8 V); akü dolu tutulur, fazla şarj engellenir.</li></ol><p>Sulu akülerde ara sıra <b>eşitleme</b> şarjı yapılır. LiFePO₄ için gerilimler farklıdır (12,8 V nominal, ≈ 14,2–14,6 V şarj, float genelde düşük veya yok) ve BMS korur.</p>',
  ek:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>12 V kurşun-asit dinlenme gerilimi</th><th>Doluluk (yaklaşık)</th></tr><tr><td>12,7 V</td><td>%100</td></tr><tr><td>12,4 V</td><td>%75</td></tr><tr><td>12,2 V</td><td>%50</td></tr><tr><td>12,0 V</td><td>%25</td></tr><tr><td>11,8 V ve altı</td><td>boş — derhal şarj</td></tr></table></div>',
  uygulama:['Dinlenme gerilimi en az birkaç saat yüksüz kaldıktan sonra ölçülür.','Akü sıcaklığı yüksekse şarj gerilimi düşürülmelidir (sıcaklık kompanzasyonu).'],
  ilgili:['aku_turleri','mppt_inverter']
});
konu({id:'ups', kat:'elektronik', ikon:'🔋', sv:2, ad:'UPS (Kesintisiz Güç Kaynağı)', ozet:'Offline, line-interactive, online. VA/W farkı ve akü süresi.', etiket:['ups','kesintisiz güç kaynağı','online ups','line interactive','offline ups','bypass','va'],
  tanim:'<div class="t-tablo-w"><table class="ek-tablo"><tr><th>Tip</th><th>Çalışma</th><th>Nerede</th></tr><tr><td>Offline (standby)</td><td>Normalde şebeke geçer, kesintide aküye geçer (≈ 5–10 ms)</td><td>Ev bilgisayarı, modem</td></tr><tr><td>Line-interactive</td><td>Ek olarak gerilim regülasyonu (AVR)</td><td>Ofis, kamera kayıt cihazı</td></tr><tr><td>Online (çift dönüşüm)</td><td>Yük her zaman inverterden beslenir; geçiş süresi 0</td><td>Sunucu, tıbbi cihaz, kombi/ hassas yük</td></tr></table></div><p>UPS gücü VA ve W olarak verilir (ör. 1.000 VA / 600 W). Yük, <b>her ikisini de</b> aşmamalıdır.</p>',
  uygulama:['Kombi için UPS seçerken saf sinüs çıkışlı model gerekir; kombi faz–nötr duyarlıysa çıkış yönü önemlidir.','Lazer yazıcı, ısıtıcı gibi yüksek akımlı cihazlar UPS’e bağlanmaz.','Bakım bypass anahtarı, UPS’i sökerken yükü şebekeye aktarmayı sağlar.'],
  hesap:['ups'], sema:['ups_bypass'], ilgili:['aku_turleri','jenerator']
});

  {s:'Kesinti anında geçiş süresi sıfır olan UPS tipi hangisidir?', c:['Offline', 'Line-interactive', 'Online (çift dönüşüm)', 'Hepsi'], d:2, a:'Online UPS’te yük sürekli inverterden beslenir.'}

konu({id:'panel_karakteristik', kat:'gunes', ikon:'🔆', sv:2, ad:'Güneş Paneli Karakteristiği (Voc, Isc, MPP)', ozet:'Işınım akımı, sıcaklık gerilimi belirler. Soğukta Voc yükselir, sıcakta güç düşer.', etiket:['güneş paneli','voc','isc','vmp','imp','mpp','sıcaklık katsayısı','stc','wp'],
  tanim:'<p>Panel etiketindeki değerler <b>STC</b> koşullarında (1.000 W/m² ışınım, 25 °C hücre sıcaklığı) ölçülür:</p><ul><li><b>Voc</b>: açık devre gerilimi (yük yokken).</li><li><b>Isc</b>: kısa devre akımı.</li><li><b>Vmp / Imp</b>: en yüksek güç noktasındaki (MPP) gerilim ve akım.</li><li><b>Pmax (Wp)</b>: tepe güç.</li></ul><p>Işınım azalınca akım (ve güç) orantılı düşer. Hücre ısındıkça gerilim düşer (≈ −%0,25 ile −%0,35 / °C); yazın çatıda hücre 60–70 °C olur ve güç %10–15 azalır. Kışın soğukta Voc yükselir: inverter giriş sınırı bu yüzden en soğuk güne göre kontrol edilir.</p>',
  cizim:'iv',
  formul:[['V<sub>oc</sub>(T) = V<sub>oc,STC</sub> × (1 + β × (T − 25))', 'β ≈ −0,0028 /°C (panel datasheet’ine bak)'], ['P ≈ P<sub>STC</sub> × G / 1000 × (1 + γ × (T − 25))', 'γ ≈ −0,0035 /°C']],
  dene:{g:[['v', 'Panel Voc (STC)', 'V', 49.5], ['n', 'Seri panel sayısı', 'adet', 10], ['T', 'En soğuk hücre sıcaklığı', '°C', -10], ['b', 'Voc sıcaklık katsayısı', '%/°C', -0.28]], h:v => { const V = v.n * v.v * (1 + v.b / 100 * (v.T - 25)); return [['Dizi Voc (25 °C)', f(v.n * v.v, 0) + ' V'], ['Dizi Voc (soğuk)', f(V, 0) + ' V', 'v'], ['1000 V inverter', V <= 1000 ? 'uygun' : 'AŞIYOR', V <= 1000 ? '' : 'uy'], ['600 V inverter', V <= 600 ? 'uygun' : 'AŞIYOR', V <= 600 ? '' : 'uy']]; }},
  uygulama:['Panel arkasında hava sirkülasyonu bırak; sıcak panel daha az üretir.','Gölge tek bir hücreye düşse bile seri dizide bütün akım düşer; bypass diyotları kaybı sınırlar.'],
  hesap:['gunes'], sema:['panel_dizi'], ilgili:['mppt_inverter','uretim_tahmini']
});
konu({id:'mppt_inverter', kat:'gunes', ikon:'🔄', sv:2, ad:'MPPT, PWM ve İnverter Türleri', ozet:'MPPT paneli en verimli noktada çalıştırır. On-grid, off-grid ve hibrit inverter farkı.', etiket:['mppt','pwm','inverter','on grid','off grid','hibrit inverter','şarj kontrol','ada koruması','saf sinüs'],
  tanim:'<p><b>Şarj kontrol cihazı</b> panel ile akü arasında durur. <b>PWM</b> tipi paneli akü gerilimine bağlar (panel gerilimi boşa gider); <b>MPPT</b> tipi panelin en yüksek güç noktasını sürekli arar ve fazla gerilimi akıma çevirir: özellikle soğukta ve yüksek gerilimli panellerde %15–30 daha fazla enerji.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>İnverter</th><th>Akü</th><th>Kesintide</th><th>Kullanım</th></tr><tr><td>On-grid</td><td>Yok</td><td>Durur (ada koruması)</td><td>Çatı GES, mahsuplaşma</td></tr><tr><td>Off-grid</td><td>Var</td><td>Aküden besler</td><td>Şebekesiz bağ evi, dağ evi</td></tr><tr><td>Hibrit</td><td>Var</td><td>Aküye geçer, şebekeyle de çalışır</td><td>Yedekli ev/işyeri</td></tr></table></div><p>Off-grid ve hibrit inverterlerde <b>saf sinüs</b> çıkış tercih edilir; modifiye sinüs motorlu cihazlarda ısınma ve gürültü yapar.</p>',
  uygulama:['MPPT’de panel girişi gerilim ve akım sınırları ile “maksimum PV gücü” birlikte kontrol edilir.','Off-grid inverterin sürekli gücü yanında anlık (surge) gücüne bak: buzdolabı/pompa kalkışı.'],
  hesap:['gunes'], sema:['offgrid','ongrid','hibrit'], ilgili:['panel_karakteristik','aku_turleri','offgrid_teori']
});
konu({id:'uretim_tahmini', kat:'gunes', ikon:'📅', sv:1, ad:'Güneş Üretim Tahmini', ozet:'1 kWp sistem Muğla’da yılda kabaca 1.400–1.600 kWh üretir. Yön, eğim ve gölge etkisi.', etiket:['üretim','kwp','kwh/kwp','yıllık üretim','eğim','yön','güney','pvgis','tepe güneş saati'],
  tanim:'<p>Üretim tahmini için en basit yol <b>özgül verim</b> (kWh/kWp·yıl) kullanmaktır. Türkiye’nin güneyinde, güneye bakan ve gölgesiz bir sistemde bu değer genellikle <b>1.400–1.600 kWh/kWp</b> civarındadır (kesin değer için PVGIS gibi araçlar kullanılır). Günlük ortalama, aya göre değişen “tepe güneş saati” ile hesaplanır: yazın 6–7, kışın 2–3 saat.</p><p>Yön: güney en iyisi; doğu/batı ≈ %10–20 kayıp. Eğim: yıllık üretim için enlem civarı (≈ 25–35°); off-grid’de kışı garantilemek için daha dik (≈ 45–60°).</p>',
  formul:[['E<sub>yıl</sub> ≈ P<sub>kWp</sub> × Y<sub>özgül</sub>', 'kWh/yıl'], ['E<sub>gün</sub> ≈ P<sub>kWp</sub> × TGS × PR', 'TGS: tepe güneş saati · PR (performans oranı) ≈ 0,75–0,85']],
  dene:{g:[['P', 'Kurulu güç', 'kWp', 5], ['y', 'Özgül verim', 'kWh/kWp', 1500], ['k', 'Yön/gölge kaybı', '%', 5]], h:v => { const E = v.P * v.y * (1 - v.k / 100); return [['Yıllık üretim', f(E, 0) + ' kWh', 'v'], ['Aylık ortalama', f(E / 12, 0) + ' kWh'], ['Kış günü (≈ 2,5 TGS)', f(v.P * 2.5 * 0.8, 1) + ' kWh/gün']]; }},
  uygulama:['Off-grid sistemi en kötü aya (aralık–ocak) göre boyutlandır.','Panelleri tozdan arındırmak (özellikle yaz sonu) üretimi birkaç yüzde artırır.'],
  hesap:['gunes'], ilgili:['panel_karakteristik','offgrid_teori']
});
konu({id:'offgrid_teori', kat:'gunes', ikon:'🏕️', sv:2, ad:'Off-Grid Sistem Boyutlandırma', ozet:'Günlük tüketim → akü → panel → inverter sırasıyla hesap.', etiket:['off grid hesap','akü hesabı','panel hesabı','günlük tüketim','özerklik','bağ evi solar'],
  tanim:'<ol><li><b>Günlük tüketim</b> (Wh/gün): her cihaz için güç × saat.</li><li><b>Akü</b>: günlük tüketim × özerklik günü / (gerilim × DoD × verim).</li><li><b>Panel</b>: günlük tüketim / (en kötü ay tepe güneş saati × PR).</li><li><b>İnverter</b>: aynı anda çalışan en yüksek güç × 1,25 + motor kalkış payı.</li><li><b>MPPT</b>: panel gücü / akü gerilimi = şarj akımı.</li></ol>',
  dene:{g:[['E', 'Günlük tüketim', 'Wh', 2500], ['g', 'Özerklik', 'gün', 1.5], ['U', 'Akü bankası', 'V', 24], ['d', 'DoD', '', 0.5, [[0.5, 'Kurşun-asit (%50)'], [0.85, 'LiFePO₄ (%85)']]], ['h', 'Kış tepe güneş saati', 'saat', 2.5]], h:v => { const Ah = v.E * v.g / (v.U * v.d * 0.9), Pp = v.E / (v.h * 0.75); return [['Akü', f(Ah, 0) + ' Ah @ ' + v.U + ' V', 'v'], ['Panel', f(Pp, 0) + ' Wp', 'v'], ['MPPT şarj akımı', f(Pp / v.U, 0) + ' A']]; }},
  uygulama:['Buzdolabı, pompa gibi motorlu cihazlar inverter seçiminde belirleyicidir.','12 V sistem küçük güçler (≈ 1 kW altı) için; büyüdükçe 24/48 V seç: akım ve kablo kesiti küçülür.'],
  hesap:['gunes','ups'], sema:['offgrid','aku_baglama'], ilgili:['aku_turleri','mppt_inverter','uretim_tahmini']
});
test('gunes', [
  {s:'Panel etiketindeki STC koşulu hangisidir?', c:['500 W/m², 25 °C', '1000 W/m², 25 °C', '1000 W/m², 45 °C', '800 W/m², 20 °C'], d:1, a:'STC: 1000 W/m² ışınım, 25 °C hücre sıcaklığı.'},
  {s:'Kışın soğukta panel açık devre gerilimi (Voc) ne olur?', c:['Düşer', 'Değişmez', 'Yükselir', 'Sıfır olur'], d:2, a:'Soğukta gerilim artar: inverter giriş sınırı en soğuk güne göre kontrol edilir.'},

  {s:'MPPT’nin PWM’e göre avantajı nedir?', c:['Daha ucuzdur', 'Panelin en yüksek güç noktasından enerji çeker', 'Akü gerektirmez', 'AC çıkış verir'], d:1, a:'MPPT fazla gerilimi akıma çevirir, %15–30 daha fazla enerji.'},
  {s:'5 kWp, 1500 kWh/kWp sistemin yıllık üretimi yaklaşık?', c:['750 kWh', '1500 kWh', '7500 kWh', '15000 kWh'], d:2, a:'5 × 1500 = 7500 kWh.'}
]);

konu({id:'sogutma_cevrimi', kat:'klima', ikon:'❄️', sv:1, ad:'Soğutma Çevrimi Nasıl Çalışır?', ozet:'Klima soğuk üretmez, ısıyı bir yerden alıp başka yere taşır. Dört ana parça ve gazın yolculuğu.', etiket:['soğutma çevrimi','kompresör','kondenser','evaporatör','kapiler','genleşme valfi','4 yollu vana','buharlaşma','yoğuşma'],
  tanim:'<p>Sıvı buharlaşırken çevresinden ısı çeker (kolonya elde serinlik verir). Klima bunu kapalı bir devrede sürekli yapar:</p><ol><li><b>Kompresör</b>: düşük basınçlı gazı sıkıştırır; gaz ısınır ve basıncı yükselir.</li><li><b>Kondenser</b>: sıcak gaz ısısını dış havaya verir ve yoğuşarak sıvılaşır.</li><li><b>Genleşme elemanı</b> (kapiler boru veya elektronik genleşme valfi): basıncı aniden düşürür; sıvı soğur.</li><li><b>Evaporatör</b>: soğuk sıvı odadan ısı çekerek buharlaşır; gaz tekrar kompresöre döner.</li></ol><p>Isıtmada <b>4 yollu vana</b> akış yönünü çevirir: iç ünite kondenser, dış ünite evaporatör olur.</p>',
  cizim:'sogutma',
  uygulama:['Kalın boru (emme) soğutmada soğuk ve terler; ince boru (sıvı) ılık olur.','Dış ünite fanı dönmüyorsa kondenserde ısı atılamaz: basınç yükselir, kompresör koruması devreye girer.','İç ünite buzlanıyorsa: gaz eksik, filtre tıkalı veya fan zayıf olabilir.'],
  sema:['klima','isi_pompasi'], ilgili:['btu_kw','cop_eer','gaz_basinc','isi_pompasi_teori']
});
konu({id:'btu_kw', kat:'klima', ikon:'🧮', sv:1, ad:'BTU, kW ve Kapasite Seçimi', ozet:'12.000 BTU/h ≈ 3,5 kW soğutma. Elektrik tüketimi ≈ bunun üçte biri.', etiket:['btu','kw','soğutma kapasitesi','9000 btu','12000 btu','18000 btu','24000 btu','frigori','ton'],
  tanim:'<p><b>BTU/h</b> (İngiliz ısı birimi/saat) klimanın ısı taşıma kapasitesidir, <b>elektrik tüketimi değildir</b>. 1 kW ≈ 3.412 BTU/h. 12.000 BTU/h ≈ 3,5 kW soğutma; inverter klimada elektrik tüketimi tipik olarak ≈ 0,8–1,2 kW’tır (EER’e bağlı). 1 “ton” soğutma = 12.000 BTU/h.</p><p>Oda için gereken kapasite; alan, tavan yüksekliği, cephe yönü, cam oranı, yalıtım, kişi ve cihaz sayısına bağlıdır. Kaba başlangıç: iyi yalıtımlı odada ≈ 400–600 BTU/h·m², güneşli ve yalıtımsız Ege yazında daha fazla.</p>',
  formul:[['1 kW = 3.412 BTU/h', ''], ['P<sub>elektrik</sub> = Q<sub>soğutma</sub> / EER', ''], ['1 kcal/h ≈ 3,97 BTU/h · 1 frigori = 1 kcal/h', 'Eski kataloglarda']],
  dene:{g:[['b', 'Klima kapasitesi', 'BTU/h', 12000], ['e', 'EER (soğutma verimi)', '', 3.2]], h:v => { const kw = v.b / 3412; return [['Soğutma', f(kw, 2) + ' kW'], ['Elektrik tüketimi', f(kw / v.e, 2) + ' kW', 'v'], ['230 V’ta akım', f(kw / v.e * 1000 / 230 / 0.95, 1) + ' A']]; }},
  uygulama:['Büyük klima küçük odada sürekli aç-kapa yapar (inverter olmayan modelde) ve nemi iyi alamaz.','Kablo ve sigorta, etiketteki maksimum akım ve güce göre seçilir; BTU’ya göre değil.'],
  hesap:['klima_btu','klima_tesisat'], ilgili:['cop_eer','sogutma_cevrimi']
});
konu({id:'cop_eer', kat:'klima', ikon:'📈', sv:2, ad:'EER, COP, SEER, SCOP', ozet:'1 kW elektrikle kaç kW soğutma/ısıtma? Mevsimsel değerler ve enerji etiketi.', etiket:['cop','eer','seer','scop','verim','enerji sınıfı','a+++','ısı pompası verimi'],
  tanim:'<ul><li><b>EER</b>: soğutma kapasitesi / elektrik gücü (belirli test koşulunda).</li><li><b>COP</b>: ısıtma kapasitesi / elektrik gücü.</li><li><b>SEER / SCOP</b>: mevsim boyunca farklı dış sıcaklıklar ve kısmi yüklerle hesaplanan ortalama değerler; enerji etiketindeki sınıfı bunlar belirler.</li></ul><p>COP = 4 demek, 1 kWh elektrikle 4 kWh ısı elde etmek demektir: ısının 3 kWh’ı dış havadan “bedava” çekilir. Dış hava soğudukça COP düşer.</p>',
  formul:[['EER = Q<sub>soğutma</sub> / P<sub>elektrik</sub>', ''], ['COP = Q<sub>ısıtma</sub> / P<sub>elektrik</sub>', ''], ['Maliyet<sub>ısı</sub> = fiyat<sub>kWh</sub> / COP', '1 kWh ısının maliyeti']],
  dene:{g:[['q', 'Isı ihtiyacı', 'kWh/ay', 1500], ['c', 'COP', '', 3.5], ['fy', 'Elektrik fiyatı', '₺/kWh', 3]], h:v => [['Elektrik tüketimi', f(v.q / v.c, 0) + ' kWh/ay', 'v'], ['Isı pompası maliyeti', EK.tl(v.q / v.c * v.fy)], ['Elektrikli ısıtıcı (COP 1)', EK.tl(v.q * v.fy)]]},
  uygulama:['Isıtmada klima, elektrikli ısıtıcıya göre 3–4 kat daha ucuza ısı üretir.','Dış ünite karlanma/buzlanma çözme (defrost) sırasında ısıtma kısa süre durur.'],
  hesap:['klima_btu','maliyet'], ilgili:['btu_kw','isi_pompasi_teori','enerji_fatura']
});
konu({id:'inverter_klima', kat:'klima', ikon:'🔁', sv:2, ad:'İnverter Klima ve Elektrik Tarafı', ozet:'Kompresör hızı değişir: daha az aç-kapa, daha az tüketim. Kart, sürücü ve KAR uyumu.', etiket:['inverter klima','dc inverter','kompresör hızı','klima kartı','iletişim hatası','hata kodu','tip f kar'],
  tanim:'<p>Klasik (on/off) klima kompresörü tam güçte çalışıp termostatla durur. <b>İnverter</b> klimada dış ünite kartı şebekeyi DC’ye çevirip kompresörü değişken frekansla sürer: oda sıcaklığına yaklaştıkça kompresör yavaşlar. Sonuç: daha sessiz, daha sabit sıcaklık, kalkış akımı yok, %20–40 daha az tüketim.</p><p>İç ve dış ünite <b>S hattı</b> üzerinden haberleşir; bağlantı hatası “iletişim hatası” kodu verir.</p>',
  uygulama:['İnverter klima linyesinde KAR tipi en az A, tercihen F (üretici önerisine bak).','Gerilim düşükse inverter kart koruma kodu verir; uzun hatta kesit büyüt.','Klima kartlarını yıldırım ve şebeke darbelerinden korumak için panoda parafudr önerilir.'],
  dikkat:['Dış ünite kartındaki büyük kondansatörler enerji kesildikten sonra da yüklüdür.'],
  sema:['klima','klima_dis'], ilgili:['kar_tipleri','harmonik','sogutma_cevrimi']
});
konu({id:'gaz_basinc', kat:'klima', ikon:'🧪', sv:3, ad:'Soğutucu Gazlar ve Basınç–Sıcaklık İlişkisi', ozet:'R32, R410A, R22, R290. Doymuş basınç tablosu ile emme/basma basıncı yorumu.', etiket:['r32','r410a','r22','r290','gaz basıncı','manometre','emme basıncı','kızgınlık','aşırı soğutma','gwp'],
  tanim:'<p>Soğutucu akışkan, belirli bir basınçta belirli bir sıcaklıkta kaynar. Manometredeki basınç bu yüzden “o noktadaki buharlaşma veya yoğuşma sıcaklığını” gösterir. Gaz tipi farklıysa aynı basınç farklı sıcaklık demektir: <b>manometrede doğru gaz skalasını</b> kullan.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Doyma sıcaklığı</th><th>R22</th><th>R410A</th><th>R32</th></tr><tr><td>0 °C</td><td>≈ 4,0 bar</td><td>≈ 7,0 bar</td><td>≈ 7,1 bar</td></tr><tr><td>5 °C</td><td>≈ 4,8 bar</td><td>≈ 8,3 bar</td><td>≈ 8,5 bar</td></tr><tr><td>10 °C</td><td>≈ 5,8 bar</td><td>≈ 9,8 bar</td><td>≈ 10,1 bar</td></tr><tr><td>40 °C</td><td>≈ 14,3 bar</td><td>≈ 23,2 bar</td><td>≈ 23,8 bar</td></tr><tr><td>45 °C</td><td>≈ 16,3 bar</td><td>≈ 26,3 bar</td><td>≈ 27,0 bar</td></tr><tr><td>50 °C</td><td>≈ 18,4 bar</td><td>≈ 29,6 bar</td><td>≈ 30,4 bar</td></tr></table></div><div class="ek-not">Gösterge (manometre) basıncı, yaklaşık değerler. Kesin değer için dijital manifoldun veya üreticinin P-T tablosunu kullan.</div><p><b>Kızgınlık</b> (superheat): emme hattı borusunun ölçülen sıcaklığı − emme basıncına karşılık gelen doyma sıcaklığı. <b>Aşırı soğutma</b> (subcooling): basma basıncı doyma sıcaklığı − sıvı hattı sıcaklığı. Gaz miktarını ve genleşme elemanını bu iki değerle yorumlamak, sadece basınca bakmaktan daha güvenilirdir.</p>',
  uygulama:['Soğutmada dış hava 30–35 °C iken R410A/R32 klimanın emme basıncı tipik olarak ≈ 8–10 bar civarındadır (oda ve dış sıcaklığa göre değişir).','R32 hafif yanıcıdır (A2L): kaynak ve kıvılcım öncesi gaz tamamen boşaltılır, havalandırma yapılır.','R22 artık yeni cihazlarda kullanılmaz; R22 cihaza R410A/R32 basılamaz.'],
  dikkat:['Çalışan cihazda gaz basıncı sadece kompresör çalışırken ve stabil olduktan sonra anlamlıdır.','Gazı atmosfere salmak hem yasaktır hem çevreye zararlıdır; geri kazanım cihazı kullan.'],
  hesap:['klima_tesisat'], ilgili:['vakum_sarj','sogutma_cevrimi']
});
konu({id:'vakum_sarj', kat:'klima', ikon:'🌀', sv:2, ad:'Vakum, Kaçak Testi ve Gaz Şarjı', ozet:'Boruda nem ve hava kalmamalı: azotla test, vakum (≤ 500 mikron), şarj ağırlıkla.', etiket:['vakum','mikron','azot testi','gaz şarjı','ek gaz','boru uzunluğu','flare','rakor','kaçak testi'],
  tanim:'<ol><li><b>Basınç (kaçak) testi</b>: montajdan sonra boru hattına kuru azot basılır (cihazın izin verdiği değerde) ve basınç düşüşü izlenir; köpükle rakorlar kontrol edilir.</li><li><b>Vakum</b>: azot boşaltılıp vakum pompasıyla hattaki hava ve nem çekilir. Hedef genellikle <b>≤ 500 mikron</b> (≈ 0,67 mbar) ve vakum kapatıldıktan sonra bu değerin korunması.</li><li><b>Gaz</b>: dış ünitedeki gaz vanaları açılır. Boru uzunluğu fabrika şarjını (genelde 5–7,5 m) aşıyorsa <b>ek gaz</b> metre başına üretici değeriyle <b>tartılarak</b> eklenir.</li></ol>',
  formul:[['m<sub>ek</sub> = (L − L<sub>fabrika</sub>) × g/m', 'Ek gaz; g/m değeri dış ünite etiketinde (tipik 15–30 g/m)']],
  dene:{g:[['L', 'Toplam boru boyu', 'm', 9], ['Lf', 'Fabrika şarjlı boy', 'm', 5], ['g', 'Ek gaz', 'g/m', 20]], h:v => [['Ek gaz', f(Math.max(0, (v.L - v.Lf) * v.g), 0) + ' g', 'v']]},
  uygulama:['Rakor (flare) ağızları doğru açılır, uygun torkla sıkılır; flare yüzeyine soğutma yağı sürülebilir.','Nemli hatta kalan su kapiler boruda donar ve asit oluşturarak kompresöre zarar verir.'],
  dikkat:['Oksijenle basınç testi yapılmaz (patlama). Sadece kuru azot.','R32 ve R410A sıvı fazda şarj edilir (karışım gazlarda bileşim bozulmasın diye R410A için şart).'],
  hesap:['klima_tesisat'], ilgili:['gaz_basinc']
});
konu({id:'isi_pompasi_teori', kat:'klima', ikon:'♨️', sv:2, ad:'Isı Pompası (Hava–Su)', ozet:'Klimayla aynı çevrim, ama ısıyı suya verir: yerden ısıtma, radyatör, sıcak su.', etiket:['ısı pompası','hava su ısı pompası','yerden ısıtma','monoblok','split ısı pompası','boyler','cop'],
  tanim:'<p>Hava–su ısı pompası dış havadaki ısıyı soğutucu akışkanla alır ve bir eşanjörle tesisat suyuna aktarır. Suyu ne kadar düşük sıcaklıkta ısıtırsa (yerden ısıtma 30–40 °C) COP o kadar yüksek olur; yüksek sıcaklıklı radyatör (60–70 °C) verimi düşürür.</p><p><b>Monoblok</b> modelde soğutucu devre dış ünitededir, eve su borusu girer; <b>split</b> modelde soğutucu boru iç modüle gelir.</p>',
  uygulama:['Elektrik beslemesi genelde kendi sigortası ve KAR’ıyla ayrı linyedir; varsa yedek elektrikli ısıtıcı ayrıca beslenir.','Oda termostatı veya kontrol paneli kuru kontakla “ısı iste” sinyali verir.','Donma koruması: monoblokta su hattı kışın donmaya karşı glikol veya koruma fonksiyonu ister.'],
  hesap:['klima_btu'], sema:['isi_pompasi','zon_vana'], ilgili:['cop_eer','sogutma_cevrimi']
});

konu({id:'debi_basinc', kat:'pompa', ikon:'💧', sv:1, ad:'Debi ve Basma Yüksekliği (m ↔ bar)', ozet:'Pompa etiketi: Q (m³/h) ve H (m). 10 metre su sütunu ≈ 1 bar.', etiket:['debi','basma yüksekliği','manometrik yükseklik','m3/h','l/dk','bar','mss','metre su sütunu'],
  tanim:'<p><b>Debi (Q)</b>: pompanın birim zamanda bastığı su miktarı (m³/h, l/dk). <b>Basma yüksekliği (H)</b>: pompanın suyu kaç metreye çıkarabileceği. Basınç ile yükseklik birbirine çevrilebilir: <b>10,2 m su sütunu ≈ 1 bar</b> (pratikte 10 m ≈ 1 bar).</p><p>Gereken basma yüksekliği = <b>statik yükseklik</b> (en üst musluk ile su seviyesi farkı) + <b>boru kayıpları</b> + <b>muslukta istenen basınç</b> (≈ 1,5–2 bar = 15–20 m).</p>',
  formul:[['1 bar ≈ 10,2 m', ''], ['H<sub>gerekli</sub> = H<sub>statik</sub> + H<sub>kayıp</sub> + H<sub>musluk</sub>', ''], ['P<sub>hidrolik</sub> = ρ × g × Q × H', 'W; ρ = 1000 kg/m³, g = 9,81, Q m³/s'], ['P<sub>motor</sub> = P<sub>hidrolik</sub> / η', 'η pompa verimi ≈ 0,4–0,7']],
  dene:{g:[['Q', 'Debi', 'm³/h', 3], ['H', 'Basma yüksekliği', 'm', 40], ['n', 'Pompa verimi', '', 0.5]], h:v => { const Ph = 1000 * 9.81 * (v.Q / 3600) * v.H; return [['Basınç karşılığı', f(v.H / 10.2, 2) + ' bar'], ['Hidrolik güç', f(Ph, 0) + ' W'], ['Gereken mil gücü', f(Ph / v.n / 1000, 2) + ' kW', 'v'], ['Debi', f(v.Q * 1000 / 60, 0) + ' l/dk']]; }},
  uygulama:['3 katlı bina (≈ 10 m) + 2 bar musluk basıncı + kayıplar ≈ 35 m basma yüksekliği.','Kuyu pompasında su seviyesinin derinliği (dinamik seviye) statik yüksekliğe eklenir.'],
  hesap:['pompa'], ilgili:['pompa_egrisi','hidrofor_tank']
});
konu({id:'pompa_egrisi', kat:'pompa', ikon:'📈', sv:2, ad:'Pompa Eğrisi ve Çalışma Noktası', ozet:'Pompa eğrisi ile tesisat eğrisinin kesiştiği yer gerçek debiyi verir.', etiket:['pompa eğrisi','sistem eğrisi','çalışma noktası','kapalı vana basıncı','afinite','pompa seçimi'],
  tanim:'<p>Pompa kataloğundaki eğri, pompanın farklı debilerde verebildiği basma yüksekliğini gösterir: debi arttıkça basma yüksekliği düşer. Tesisatın da bir eğrisi vardır: statik yükseklik + debinin karesiyle artan boru kayıpları. <b>İki eğrinin kesiştiği nokta</b> pompanın gerçekte çalışacağı noktadır.</p><p>Boru inceyse, dirsek ve vana çoksa tesisat eğrisi dikleşir ve debi düşer. Pompa en iyi verimini eğrisinin orta bölgesinde verir.</p>',
  cizim:'pompa',
  uygulama:['“Pompa yetmiyor” şikâyetinde önce boru çapı, filtre ve çekvalfi kontrol et.','Kapalı vanaya karşı uzun süre çalışan pompa ısınır.','Frekans sürücüsüyle devir düşürmek pompa eğrisini aşağı kaydırır.'],
  hesap:['pompa'], sema:['hidrofor','depo'], ilgili:['debi_basinc','vfd_teori','kavitasyon']
});
konu({id:'kavitasyon', kat:'pompa', ikon:'🫧', sv:2, ad:'Kavitasyon, Emme Derinliği ve Kuru Çalışma', ozet:'Yüzeysel pompa teoride 10 m’den, pratikte ≈ 7–8 m’den derinden su çekemez. Kuru çalışma pompayı yakar.', etiket:['kavitasyon','emme yüksekliği','npsh','8 metre','kuru çalışma','hava yapma','çekvalf','dip klapesi'],
  tanim:'<p>Yüzeysel (santrifüj/jet) pompa suyu <b>emerek</b> değil, atmosfer basıncının suyu boruya itmesiyle çeker. Atmosfer basıncı en fazla ≈ 10 m su sütununa eşittir; sürtünme ve buharlaşma nedeniyle pratikte <b>≈ 7–8 m</b> emme yüksekliği sınırdır. Daha derin kuyularda dalgıç pompa kullanılır.</p><p><b>Kavitasyon</b>: emme tarafında basınç çok düşerse su buharlaşır, kabarcıklar çarktaki yüksek basınçta çöker; “çakıl taşı” sesi çıkar, çark aşınır. <b>Kuru çalışma</b>: su olmadan dönen pompanın salmastra/mekanik keçesi ısınır ve dakikalar içinde bozulur.</p>',
  uygulama:['Emme borusu basma borusundan küçük olmamalı, mümkün olduğunca kısa ve dik çıkışlı olmalı.','Dip klapesi (çekvalf) emme hattının boşalmasını önler.','Kuru çalışmaya karşı flotör, seviye rölesi veya akış/basınç anahtarı kullanılır.'],
  hesap:['pompa'], sema:['dalgic','depo_hidrofor'], ilgili:['pompa_egrisi','debi_basinc']
});
konu({id:'hidrofor_tank', kat:'pompa', ikon:'🛢️', sv:2, ad:'Hidrofor Tankı ve Ön Basınç', ozet:'Tank ön basıncı devreye girme basıncının ≈ 0,2–0,3 bar altında olmalı. Yanlış ön basınç = sık aç-kapa.', etiket:['hidrofor','genleşme tankı','ön basınç','basınç şalteri','sık devreye girme','membran'],
  tanim:'<p>Hidrofor tankının içinde bir <b>membran</b> ve arkasında hava (ön basınç) vardır. Pompa suyu tanka basar, hava sıkışır; musluk açıldığında su önce tanktan gelir ve pompa her musluk açılışında hemen çalışmak zorunda kalmaz.</p><p>Doğru <b>ön basınç</b>: pompanın devreye girme basıncının ≈ 0,2–0,3 bar altı (ör. 2,0 bar’da devreye giriyorsa ≈ 1,7–1,8 bar). Ölçüm, tank <b>boşken</b> (su basıncı yokken) hava valfinden yapılır.</p>',
  formul:[['P<sub>ön</sub> ≈ P<sub>devreye giriş</sub> − 0,2…0,3 bar', ''], ['V<sub>su</sub> = V<sub>tank</sub> × (P<sub>ön</sub>/P<sub>giriş</sub> − P<sub>ön</sub>/P<sub>çıkış</sub>)', 'Mutlak basınçlarla (gösterge + 1 bar); pompa bir kez durduğunda tanktan alınabilecek su']],
  dene:{g:[['V', 'Tank hacmi', 'L', 50], ['a', 'Devreye girme', 'bar', 2], ['b', 'Devreden çıkma', 'bar', 3.5]], h:v => { const pa = v.a + 1, pb = v.b + 1, pp = v.a - 0.2 + 1, Vk = v.V * (pp / pa - pp / pb); return [['Önerilen ön basınç', f(v.a - 0.2, 1) + ' bar', 'v'], ['Kullanılabilir su', '≈ ' + f(Vk, 1) + ' L']]; }},
  uygulama:['Pompa her musluk açılışında hemen çalışıp kısa sürede duruyorsa: tank ön basıncı düşük veya membran patlamış.','Hava valfinden su geliyorsa membran yırtıktır.'],
  sema:['hidrofor','depo_hidrofor'], ilgili:['debi_basinc','pompa_egrisi']
});

  {s:'1 bar basınç yaklaşık kaç metre su sütununa eşittir?', c:['1 m', '10 m', '50 m', '100 m'], d:1, a:'≈ 10,2 m.'},
  {s:'Yüzeysel pompanın pratik emme derinliği sınırı yaklaşık kaçtır?', c:['2 m', '7–8 m', '20 m', 'Sınır yok'], d:1, a:'Atmosfer basıncı ≈ 10 m sınırlar; pratikte 7–8 m.'},

/* N · ZAYIF AKIM VE HABERLEŞME */
konu({id:'desibel', kat:'zayif', ikon:'🔊', sv:2, ad:'Desibel: dB, dBm, dBµV', ozet:'Kazanç ve kayıplar dB ile toplanıp çıkarılır. +3 dB güç iki kat, −10 dB onda bir.', etiket:['desibel','db','dbm','dbµv','dbuv','kazanç','kayıp','sinyal seviyesi','logaritma'],
  tanim:'<p>Sinyal seviyeleri çok geniş aralıkta değiştiği için oranlar <b>logaritmik</b> olarak, desibel ile ifade edilir. Kolaylığı: zincirdeki kazanç ve kayıplar <b>basitçe toplanır</b> (anten +20 dB yükselteç −8 dB bölücü −6 dB kablo = +6 dB).</p><ul><li><b>dB</b>: iki seviye arasındaki oran (kazanç/kayıp).</li><li><b>dBm</b>: 1 mW’a göre güç seviyesi (fiber, Wi-Fi, uydu ölçerler): 0 dBm = 1 mW, −30 dBm = 1 µW.</li><li><b>dBµV</b>: 1 µV’a göre gerilim seviyesi (anten/TV sinyali): 60 dBµV = 1 mV.</li></ul>',
  cizim:'db',
  formul:[['dB = 10 × log₁₀(P₂ / P₁)', 'Güç oranı'], ['dB = 20 × log₁₀(U₂ / U₁)', 'Gerilim oranı'], ['dBm = 10 × log₁₀(P / 1 mW)', ''], ['dBµV = 20 × log₁₀(U / 1 µV)', '75 Ω sistemde dBµV ≈ dBm + 108,75']],
  dene:{g:[['a', 'Giriş seviyesi', 'dBµV', 60], ['g', 'Yükselteç', 'dB', 20], ['b', 'Bölücü kaybı', 'dB', 8], ['k', 'Kablo kaybı', 'dB', 6]], h:v => { const o = v.a + v.g - v.b - v.k; return [['Çıkış', f(o, 1) + ' dBµV', 'v'], ['TV için (50–75)', o < 50 ? 'zayıf' : o > 80 ? 'aşırı' : 'uygun', o < 50 || o > 80 ? 'uy' : '']]; }},

konu({id:'koaksiyel', kat:'zayif', ikon:'🔘', sv:1, ad:'Koaksiyel Kablo ve Kayıp', ozet:'RG6 tesisatta standart. Frekans arttıkça kayıp artar: uydu (2 GHz) karasaldan (≈ 600 MHz) fazla kaybeder.', etiket:['koaksiyel','rg6','rg59','rg11','75 ohm','f konnektör','blendaj','kablo kaybı'],
  tanim:'<p>Koaksiyel kabloda merkez iletken, onu saran dielektrik, ekran (folyo + örgü) ve dış kılıf vardır. TV/uydu sistemleri <b>75 Ω</b> empedans kullanır. Kayıp frekansla artar ve kablo kalitesine (bakır iletken, ekran yoğunluğu) bağlıdır.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kablo</th><th>≈ 860 MHz</th><th>≈ 2150 MHz</th><th>Kullanım</th></tr><tr><td>RG59</td><td>≈ 25–30 dB/100 m</td><td>≈ 40–45 dB/100 m</td><td>Kısa, eski analog kamera</td></tr><tr><td>RG6</td><td>≈ 18–20 dB/100 m</td><td>≈ 28–32 dB/100 m</td><td>Standart TV/uydu tesisatı</td></tr><tr><td>RG11</td><td>≈ 12–14 dB/100 m</td><td>≈ 20–22 dB/100 m</td><td>Uzun hatlar, ana dağıtım</td></tr></table></div><div class="ek-not">Değerler tipik; markaya göre değişir, katalog esas alınır.</div>',
  dene:{g:[['L', 'Kablo uzunluğu', 'm', 40], ['d', 'Kayıp (katalog)', 'dB/100 m', 30]], h:v => [['Kablo kaybı', f(v.L * v.d / 100, 1) + ' dB', 'v']]},
  uygulama:['Bakır kaplı çelik (CCS) iç iletkenli ucuz kablo, LNB beslemesi (DC) için yüksek direnç gösterir.','F konnektörde blendaj telleri iç iletkene değerse LNB kısa devre olur.','Kabloyu keskin bükmek ve kelepçeyle ezmek empedansı bozar.'],
  hesap:['uydu'], sema:['lnb_tek','anten_amp'], ilgili:['desibel','uydu_bant']

konu({id:'uydu_bant', kat:'zayif', ikon:'🛰️', sv:2, ad:'Uydu Bantları, LNB ve Polarizasyon', ozet:'Ku bandı 10,7–12,75 GHz. LNB ile 950–2150 MHz’e iner. 13/18 V polarite, 22 kHz bant seçer.', etiket:['ku bandı','lnb','polarizasyon','yatay','dikey','13v','18v','22khz','lof','türksat 42e','diseqc'],
  tanim:'<p>Türksat ve Avrupa uyduları <b>Ku bandında</b> (10,7–12,75 GHz) yayın yapar. LNB bu sinyali yerel osilatör (LO) ile karıştırarak koaksiyelde taşınabilecek 950–2150 MHz’e indirir. Universal LNB’de iki LO vardır: <b>9,75 GHz</b> (alt bant 10,7–11,7) ve <b>10,6 GHz</b> (üst bant 11,7–12,75).</p><p>Yayınlar dikey (V) veya yatay (H) polarizedir. Alıcı LNB’ye <b>13 V → dikey</b>, <b>18 V → yatay</b> ve <b>22 kHz ton → üst bant</b> komutu gönderir. Böylece 4 kombinasyon oluşur; quattro LNB bu dördünü aynı anda verir.</p>',
  formul:[['f<sub>IF</sub> = f<sub>uydu</sub> − f<sub>LO</sub>', 'Örn. 11.096 MHz − 9.750 = 1.346 MHz']],
  dene:{g:[['f', 'Transponder frekansı', 'MHz', 11794]], h:v => { const ust = v.f >= 11700, LO = ust ? 10600 : 9750; return [['Bant', ust ? 'Üst (22 kHz açık)' : 'Alt (22 kHz kapalı)'], ['LO', LO + ' MHz'], ['Kablodaki frekans (IF)', (v.f - LO) + ' MHz', 'v']]; }},
  uygulama:['Türksat 42° Doğu; Muğla’dan bakışta çanak güneydoğuya, yaklaşık 40° yükseklik açısına yöneltilir (konuma göre değişir, uygulama ile doğrula).','Uydu bulucu ile ince ayar; LNB eğikliği (skew) yayın kalitesini etkiler.'],
  hesap:['uydu'], sema:['lnb_tek','lnb_twin','diseqc','multiswitch'], ilgili:['koaksiyel','desibel']
});
konu({id:'ethernet', kat:'zayif', ikon:'🌐', sv:1, ad:'Ethernet Kabloları: Cat5e, Cat6, Cat6A', ozet:'100 m kuralı, hız ve kategori. 10 Gbit için Cat6A.', etiket:['cat5e','cat6','cat6a','cat7','ethernet','utp','ftp','100 metre','gigabit','10 gigabit','rj45'],
  tanim:'<p>Ethernet kablosu 4 bükümlü çiftten oluşur. Bükümler parazitleri birbirine götürür; bu yüzden konnektöre kadar korunmalıdır. Standart link uzunluğu <b>100 m</b>’dir (90 m sabit tesisat + 10 m patch kablo).</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Kategori</th><th>Bant genişliği</th><th>Hız / mesafe</th></tr><tr><td>Cat5e</td><td>100 MHz</td><td>1 Gbit/s – 100 m</td></tr><tr><td>Cat6</td><td>250 MHz</td><td>1 Gbit/s – 100 m · 10 Gbit/s ≈ 55 m</td></tr><tr><td>Cat6A</td><td>500 MHz</td><td>10 Gbit/s – 100 m</td></tr></table></div><p><b>U/UTP</b> ekransız, <b>F/UTP</b> folyo ekranlı, <b>S/FTP</b> her çift folyolu + örgülü. Ekranlı kablo ancak ekran iki uçta doğru topraklanırsa fayda sağlar.</p>',
  uygulama:['Data kablosunu 230 V kablolarla aynı boruya koyma; paralel uzun gidişlerde mesafe bırak.','Dış mekânda UV dayanımlı (PE kılıflı) kablo kullan.','CCA (bakır kaplı alüminyum) kablo PoE’de ısınır ve standart dışıdır: saf bakır kullan.'],
  hesap:['ag'], sema:['rj45','ag_topoloji'], ilgili:['poe','fiber_teori']

konu({id:'poe', kat:'zayif', ikon:'⚡', sv:2, ad:'PoE (Ethernet Üzerinden Güç)', ozet:'Kamera, AP ve telefona veri kablosundan elektrik: 802.3af 15,4 W, at 30 W, bt 60/90 W.', etiket:['poe','poe+','poe++','802.3af','802.3at','802.3bt','poe bütçesi','pse','pd','48v'],
  tanim:'<p>PoE, veri kablosunun çiftleri üzerinden ≈ 44–57 V DC gönderir. Gücü veren cihaz <b>PSE</b> (switch, NVR, enjektör), alan cihaz <b>PD</b>’dir (kamera, erişim noktası). Uyumlu PSE önce cihazı tanır, sonra güç verir; uyumsuz cihaza güç vermez.</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Standart</th><th>PSE portu</th><th>Cihaza ulaşan (PD)</th></tr><tr><td>802.3af (PoE)</td><td>15,4 W</td><td>12,95 W</td></tr><tr><td>802.3at (PoE+)</td><td>30 W</td><td>25,5 W</td></tr><tr><td>802.3bt Tip 3</td><td>60 W</td><td>51 W</td></tr><tr><td>802.3bt Tip 4</td><td>90 W</td><td>71,3 W</td></tr></table></div><p>Port gücü yanında switch/NVR’ın <b>toplam PoE bütçesi</b> sınırdır.</p>',
  dene:{g:[['n', 'Kamera sayısı', 'adet', 8], ['w', 'Kamera gece maks.', 'W', 7], ['b', 'PoE bütçesi', 'W', 65]], h:v => { const T = v.n * v.w; return [['Toplam', f(T, 0) + ' W', 'v'], ['Bütçe', T <= v.b * 0.8 ? 'yeterli (%20 pay var)' : T <= v.b ? 'sınırda' : 'AŞIYOR', T <= v.b * 0.8 ? '' : 'uy']]; }},
  uygulama:['Kamera tüketimini datasheet’teki maksimum (IR açık, ısıtıcılı) değerden hesapla.','Pasif (standart dışı) 24 V PoE cihazlarını standart PoE switch’e bağlarken uyumu kontrol et.'],

  hesap:['ag','ups'], sema:['kamera','ag_topoloji'], ilgili:['ethernet','smps']

konu({id:'fiber_teori', kat:'zayif', ikon:'💡', sv:2, ad:'Fiber Optik: Türleri ve Kayıp Bütçesi', ozet:'Tek modlu (SM, sarı) uzun mesafe, çok modlu (MM, turuncu/turkuaz) bina içi. APC yeşil, UPC mavi.', etiket:['fiber','single mode','multimode','sm','mm','om3','os2','apc','upc','ftth','gpon','splice','kayıp bütçesi'],
  tanim:'<p>Fiberde veri ışıkla cam çekirdekte taşınır. <b>Tek modlu (SM, OS2)</b>: 9 µm çekirdek, sarı kılıf, kilometrelerce mesafe (FTTH, operatör hatları). <b>Çok modlu (MM, OM3/OM4)</b>: 50 µm çekirdek, turkuaz/aqua kılıf, bina ve veri merkezi içi kısa mesafe.</p><p>Konnektör yüzeyleri: <b>UPC</b> (mavi) düz cilalı, <b>APC</b> (yeşil) 8° açılı; FTTH’te genelde SC/APC. APC ile UPC birbirine takılmaz (yüksek kayıp, hasar).</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Eleman</th><th>Tipik kayıp</th></tr><tr><td>SM fiber 1310 nm</td><td>≈ 0,35 dB/km</td></tr><tr><td>SM fiber 1550 nm</td><td>≈ 0,25 dB/km</td></tr><tr><td>Konnektör çifti</td><td>0,3–0,5 dB</td></tr><tr><td>Füzyon ek</td><td>≈ 0,1 dB</td></tr><tr><td>Bölücü 1:8 / 1:16 / 1:32</td><td>≈ 10,5 / 13,5 / 17 dB</td></tr></table></div>',
  formul:[['Kayıp = L × α + n<sub>kon</sub> × 0,5 + n<sub>ek</sub> × 0,1 + bölücü', 'dB'], ['P<sub>ONT</sub> = P<sub>OLT</sub> − kayıp', 'dBm']],
  dene:{g:[['L', 'Mesafe', 'km', 3], ['k', 'Konnektör çifti', 'adet', 4], ['e', 'Füzyon ek', 'adet', 3], ['s', 'Bölücü', '', 17, [[0, 'Yok'], [10.5, '1:8'], [13.5, '1:16'], [17, '1:32'], [20.5, '1:64']]]], h:v => { const K = v.L * 0.35 + v.k * 0.5 + v.e * 0.1 + v.s; return [['Toplam kayıp', f(K, 1) + ' dB', 'v'], ['ONT’de (OLT +3 dBm)', f(3 - K, 1) + ' dBm'], ['Durum', 3 - K >= -27 ? 'çalışır' : 'LOS riski', 3 - K >= -27 ? '' : 'uy']]; }},
  uygulama:['Fiber, üreticinin izin verdiği en küçük bükülme yarıçapından (G.657 için ≈ 7,5–15 mm, kablo tipine göre) daha keskin bükülmez.','Konnektörü takmadan önce temizleme kalemiyle temizle.'],
  dikkat:['Lazer ışığına (görünmez) doğrudan bakma; açık fiber ucunu göze tutma.'],
  hesap:['fiber'], sema:['fiber_ont'], ilgili:['desibel','ethernet']
});

konu({id:'gercek_rms', kat:'olcum', ikon:'📟', sv:2, ad:'Gerçek RMS (True RMS) Ölçüm', ozet:'Bozuk dalga şeklinde ortalama okuyan ölçü aleti %30–40 yanlış gösterebilir.', etiket:['true rms','gerçek rms','ortalama değer','multimetre seçimi','pens','bozuk dalga','harmonik ölçüm'],
  tanim:'<p>Ucuz ölçü aletleri dalganın ortalamasını ölçüp saf sinüs varsayarak 1,11 ile çarpar. Dalga <b>saf sinüs değilse</b> (LED sürücüleri, adaptörler, frekans sürücüleri, dimmerler, inverterler) bu yöntem yanlış sonuç verir: genellikle akımı <b>olduğundan düşük</b> gösterir.</p><p><b>Gerçek RMS</b> aletler dalganın şeklinden bağımsız olarak doğru efektif değeri hesaplar. Elektrikçi için pens ampermetre ve multimetrede “True RMS” ibaresi aranmalıdır.</p>',
  uygulama:['Sürücülü motorun veya inverter klimanın akımını ölçerken gerçek RMS pens kullan.','Nötr akımını (harmonik etkisi) ölçerken gerçek RMS şart.','Frekans sürücüsü çıkışında ölçüm için “VFD/LowPass” fonksiyonlu alet gerekir.'],
  sema:['multimetre','pens'], ilgili:['harmonik','sinus_rms','olcum_sirasi']
});
konu({id:'olcum_sirasi', kat:'olcum', ikon:'✅', sv:1, ad:'Doğru Ölçüm Alışkanlıkları', ozet:'Ölç–test et–ölç. Doğru mod, doğru giriş, iki kutuplu gerilim dedektörü.', etiket:['ölçüm','ölç test et ölç','kontrol kalemi','gerilim dedektörü','iki kutuplu','prob','ölçüm hatası'],
  tanim:'<ol><li>Aleti ve probları kontrol et (kırık izolasyon, doğru CAT sınıfı).</li><li><b>Ölç–test et–ölç</b>: önce bilinen bir kaynakta (prizde) aleti dene, sonra ölçülecek noktayı ölç, sonra yine bilinen kaynakta aleti dene. Alet arada bozulduysa anlarsın.</li><li>Modu ve kademeyi bağlamadan önce seç.</li><li>Gerilim yokluğunu tüm iletkenler arasında ölç: L–N, L–PE, N–PE (üç fazda tüm kombinasyonlar).</li></ol><p><b>Kontrol kalemi</b> sadece faz araması içindir; enerji yokluğunu kanıtlamaz. <b>İki kutuplu gerilim dedektörü</b> (EN 61243-3) bu iş için yapılmıştır.</p>',
  uygulama:['Hayalet gerilim: kopuk bir kabloda, yanındaki enerjili kablodan kapasitif kuplajla dijital multimetre 50–150 V gösterebilir; yük altında (düşük empedanslı “LoZ” modunda) bu kaybolur.','Kontrol kalemi nötr kopukken nötrde de yanar.'],
  ilgili:['bes_kural','cat_sinifi','gercek_rms']
});
konu({id:'izolasyon_olcum', kat:'olcum', ikon:'🧪', sv:2, ad:'İzolasyon, Süreklilik ve Toprak Ölçümleri', ozet:'Megger 500 V ile ≥ 1 MΩ, PE sürekliliği düşük ohm, topraklama 3 kazık yöntemi.', etiket:['megger','izolasyon direnci','süreklilik','pe sürekliliği','toprak ölçümü','tesisat muayenesi','1 mω'],

  uygulama:['İzolasyon testinden önce elektronik cihazlar, LED sürücüleri ve parafudrlar ayrılır.','Sonuçları ölçüm raporuna (tarih, linye, değer) yaz.'],

konu({id:'yonetmelik_maddeler', kat:'mevzuat', ikon:'📜', sv:2, ad:'Elektrik İç Tesisleri Yönetmeliği: Sahada Lazım Olan Maddeler', ozet:'5 kW tek faz sınırı, gerilim düşümü, eşzamanlılık, linye başına sorti sayısı ve koruma düzenleri.', etiket:['iç tesisleri yönetmeliği','madde 22','madde 57','madde 52','madde 18','yönetmelik','5 kw','9 lamba 7 priz','eşzamanlılık','gerilim düşümü'],
  tanim:'<p>Konut ve iş yeri iç tesisatı temel olarak <b>Elektrik İç Tesisleri Yönetmeliği</b> ile <b>Elektrik İç Tesisleri Proje Hazırlama Yönetmeliği</b>’ne, topraklama için <b>Elektrik Tesislerinde Topraklamalar Yönetmeliği</b>’ne ve atıf yapılan TS/HD standartlarına tabidir. Sahada en sık başvurulan hükümler:</p><div class="t-tablo-w"><table class="ek-tablo"><tr><th>Madde</th><th>Konu</th><th>Hüküm (özet)</th></tr><tr><td>Madde 22</td><td>Tek faz bağlantı sınırı</td><td>Faz–nötr arasına bağlanacak yük en çok <b>5 kW</b>; üstü üç fazlı beslenir.</td></tr><tr><td>Madde 57</td><td>Gerilim düşümü</td><td>Yapı bağlantı kutusu ile tüketiciler arasında <b>aydınlatma ve priz %1,5</b>, <b>motor %3</b>; yapı kendi trafosundan besleniyorsa trafo–bağlantı kutusu arası <b>%5</b>.</td></tr><tr><td>Madde 57</td><td>Eşzamanlılık (konut)</td><td>Bir dairede kurulu gücün <b>ilk 8 kW’ı %60</b>, kalanı <b>%40</b>; çok daireli yapılarda daire sayısına göre tablo.</td></tr><tr><td>Madde 52</td><td>Linye başına sorti</td><td>Bir fazlı linyede <b>aydınlatma için en çok 9</b>, <b>priz için en çok 7</b> sorti.</td></tr><tr><td>Madde 18</td><td>Koruma düzenleri</td><td>Koruma cihazları arasında seçicilik; sayaç/kolon devrelerinde hayat koruma eşikli düzenek ile birlikte otomatik sigorta/termik-manyetik şalter.</td></tr></table></div><div class="ek-not">Madde numaraları ve ifadeler yönetmeliğin yürürlükteki metninden ve EMO yayınlarından derlenmiştir; yönetmelikte değişiklik yapılmış olabilir. Proje ve resmî işlerde Resmî Gazete/mevzuat.gov.tr’deki güncel metni esas al.</div>',
  uygulama:['Daire ana sigortası ve sayaç bağlantı tipi (mono/trifaze) talep gücü ve 5 kW sınırına göre belirlenir.','Linye planlamasında 9 lamba / 7 priz sınırı ile birlikte gerilim düşümü ve kesit kontrolü yapılır.','30 mA kaçak akım koruması TS HD 60364 serisi kapsamında priz ve ıslak hacim son devreleri için uygulanır; TT sistemde koruma KAR ile sağlanır.'],
  hesap:['yuk','proje','gd'], ilgili:['esz_talep','gerilim_dusumu','neden_3faz','standartlar']
});
