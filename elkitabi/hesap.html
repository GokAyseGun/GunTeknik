    {k:'bV', ad:'Akü blok gerilimi', t:'sayi', birim:'V', v:12.8, gizle:v => v.mod === 'on'},
    {k:'bAh', ad:'Akü blok kapasitesi', t:'sayi', birim:'Ah', v:200, gizle:v => v.mod === 'on'},
    {k:'oz', ad:'Özerklik (güneşsiz gün)', t:'sayi', birim:'gün', v:1.5, min:0.5, max:7, gizle:v => v.mod !== 'off'},
    {k:'mppt', ad:'Şarj cihazı/inverter MPPT en yüksek giriş', t:'sec', s:[['100','100 V'],['150','150 V'],['250','250 V'],['450','450 V'],['500','500 V'],['600','600 V (1 faz on-grid)'],['1000','1000 V (3 faz)'],['1100','1100 V']], v:'150', tam:true},
    {t:'baslik', ad:'Kablolar ve ekonomi'},
    {k:'Lp', ad:'Panel → şarj/inverter', t:'sayi', birim:'m', v:15},
    {k:'La', ad:'Akü → inverter', t:'sayi', birim:'m', v:2, gizle:v => v.mod === 'on'},
    {k:'fiyat', ad:'Elektrik fiyatı', t:'sayi', birim:'₺/kWh', bos:true, ph:'ops.', gizle:v => v.mod === 'off'},
    {k:'yatirim', ad:'Yatırım tutarı', t:'sayi', birim:'₺', bos:true, ph:'ops.', gizle:v => v.mod === 'off'}
  ],
  bilgi:'Işınım değerleri Muğla için 30–35° güneye bakan panel düzleminde yaklaşık aylık ortalamalardır (PVGIS verilerine dayalı, yıllık ≈2.040 kWh/m²). Akülü sistem en kötü aya göre boyutlanmalı: yıllık ortalamayla kurulan sistem kışın yetmez. Şebeke bağlı sistemlerde lisanssız üretim ve mahsuplaşma kuralları sık değişiyor; başvurudan önce dağıtım şirketinden güncel şartları al.',
  hesap(v){
    const yieldKwp = PSH_MUGLA.reduce((a, p, i) => a + p * AY_GUN[i], 0) * v.PR / 100; // kWh/kWp/yıl
    const VocS = v.Voc * (1 + v.kV / 100 * (-5 - 25)), VmpS = v.Vmp * (1 - 0.0035 * (70 - 25));
    const nsMax = Math.floor(+v.mppt / VocS);
    const ayrintiAy = (Pkw, ihtiyacGun) => AYLAR.map((a, i) => { const ur = Pkw * PSH_MUGLA[i] * v.PR / 100; return [a, fx(ur * (ihtiyacGun ? 1 : AY_GUN[i]), 1) + (ihtiyacGun ? ' kWh/gün' : ' kWh'), ihtiyacGun ? `<span class="${ur * 0.92 * (v.aku === 'li' ? 0.95 : 0.85) >= ihtiyacGun ? 'y' : 'k'}">${yuz(ur * 0.92 * (v.aku === 'li' ? 0.95 : 0.85) / ihtiyacGun * 100, 0)}</span>` : '']; });
    const uy = [];
    if(v.mod === 'off'){
      const satir = v.yuk.map(r => ({ad:r.ad || 'Cihaz', W:r.w * (isNaN(r.adet) ? 1 : r.adet), Wh:r.w * (isNaN(r.adet) ? 1 : r.adet) * r.saat, mot:r.mot === 'e'}));
      const E = satir.reduce((a, x) => a + x.Wh, 0), Pmax = satir.reduce((a, x) => a + x.W, 0);
      const surge = Pmax + Math.max(0, ...satir.filter(x => x.mot).map(x => x.W * 2));
      const Vs = v.Vs === 'oto' ? (Pmax * 1.25 <= 1000 ? 12 : Pmax * 1.25 <= 2500 ? 24 : 48) : +v.Vs;
      const etaI = 0.92, etaB = v.aku === 'li' ? 0.95 : 0.85, dod = v.aku === 'li' ? 0.9 : 0.5;
      const psh = v.ay === 'yil' ? PSH_MUGLA.reduce((a, b) => a + b, 0) / 12 : PSH_MUGLA[+v.ay];
      const Ppv = E / (etaI * etaB) / (psh * v.PR / 100);
      let nP = Math.max(1, Math.ceil(Ppv / v.pW - 1e-9));
      // Dizi düzeni
      const nsMin = Math.max(1, Math.ceil((Vs * 1.2 + 5) / VmpS));
      if(nsMin > nsMax) uy.push(['hata', `Panel dizisi için MPPT gerilimi yetersiz: en az ${nsMin} seri gerekir ama ${v.mppt} V’ta en çok ${nsMax} seri olur. Daha yüksek gerilimli MPPT seç.`]);
      let ns = Math.max(1, Math.min(nsMin, nsMax)), enIyi = Infinity;
      for(let s = Math.max(1, Math.min(nsMin, nsMax)); s <= Math.max(1, nsMax); s++){ const top = s * Math.ceil(nP / s); if(top < enIyi || (top === enIyi && s > ns)){ enIyi = top; ns = s; } }
      if(ns === 1 && nsMax >= 2 && nP >= 2 && nsMin <= 2) ns = 2; // düşük dizi gerilimi kalın DC kablo ister
      const np = Math.ceil(nP / ns); nP = ns * np;
      const PpvG = nP * v.pW;
      const Wh = E / (etaI * dod) * v.oz;
      const Ah = Wh / Vs;
      const seri = Math.max(1, Math.round(Vs / v.bV)), par = Math.ceil(Ah / v.bAh - 1e-9);
      const inv = INV_STD.find(x => x >= Pmax * 1.25 && x * 2 >= surge) || INV_STD[INV_STD.length - 1];
      const Ich = PpvG / (Vs * 1.15);   // şarj gerilimindeki akım
      const mppt = MPPT_STD.find(x => x >= Ich) || Ich;
      // DC kablolar
      const Istr = v.Isc * np * 1.25, Imp = v.Isc * 0.94 * np, Vstr = v.Vmp * ns;
      const Sp = ELK.KESIT.find(S => 2 * ELK.RHO.cu * v.Lp * Imp / S <= Vstr * 0.03 && S >= 4 && (ELK.iz({malz:'cu', yal:'xlpe', yontem:'C', yuklu:2, T:45, grup:1}, S) || {Iz:0}).Iz >= Istr);
      const Iinv = inv / (Vs * 0.9);
      const Sa = ELK.KESIT.find(S => 2 * ELK.RHO.cu * v.La * Iinv / S <= Vs * 0.01 && (ELK.iz({malz:'cu', yal:'xlpe', yontem:'C', yuklu:2, T:35, grup:1}, S) || {Iz:0}).Iz >= Iinv * 1.25);
      const sig = [40,60,80,100,125,150,200,250,300,400,500].find(x => x >= Iinv * 1.25);
      if(v.ay === 'yil') uy.push(['uyari', 'Yıllık ortalamaya göre boyutlandı: kış aylarında üretim yetmeyecek (aşağıdaki tabloya bak).']);
      if(v.aku === 'pb') uy.push(['bilgi', 'AGM/jel aküyü günlük %50’den fazla boşaltma; sıcak ortamda (Muğla yazı) ömür hızla düşer, aküyü serin ve havadar yerde tut.']);
      if(Vs === 12 && Pmax > 1200) uy.push(['uyari', '12 V sistemde 1,2 kW üstü inverter çok yüksek akım çeker; 24/48 V seç.']);
      if(par > 4) uy.push(['bilgi', `${par} paralel akü dizisi fazla; daha büyük kapasiteli blok veya 48 V seç.`]);
      return {
        ana:[{ad:'Panel', d:`${nP} × ${fx(v.pW)}`, b:'Wp', r:'amber', alt:`${fx(PpvG / 1000, 2)} kWp · ${ns} seri × ${np} paralel · ≈${fx(nP * v.pW / (1000 * v.pVer / 100), 1)} m²`},
             {ad:'Akü', d:`${seri * par} blok`, r:'cy', alt:`${seri} seri × ${par} paralel · ${fx(Vs)} V ${fx(v.bAh * par)} Ah · ${fx(Vs * v.bAh * par / 1000, 1)} kWh`},
             {ad:'İnverter', d:fx(inv), b:'W', r:'mg', alt:`saf sinüs · ${fx(Vs)} V DC · tepe ≥ ${fx(surge)} W`},
             {ad:'MPPT şarj', d:mppt, b:'A', r:'green', alt:`${v.mppt} V giriş · ${fx(Vs)} V akü`}],
        satir:[['Günlük tüketim', fx(E) + ' Wh'], ['Tasarım ışınımı', fx(psh, 1) + ' saat/gün (' + (v.ay === 'yil' ? 'yıllık ort.' : AYLAR[+v.ay]) + ')'], ['Dizi gerilimi (soğukta Voc)', fx(VocS * ns, 1) + ' V ≤ ' + v.mppt + ' V'],
          ['Panel → şarj kablosu', Sp ? `${tr(Sp)} mm² solar kablo (${fx(Imp, 1)} A çalışma, GD ≤ %3)` : '>240 mm²: hattı kısalt'], ['Akü → inverter kablosu', Sa ? `${tr(Sa)} mm² esnek (${fx(Iinv, 0)} A, %1)` : 'çok büyük: gerilimi yükselt'], ['Akü sigortası', sig ? `${sig} A (DC, ANL/NH)` : '—'], ['Dizi sigortası', np > 2 ? `${Math.ceil(v.Isc * 1.5)} A gPV her dizide` : 'iki diziye kadar gerekmez']],
        uyari:uy,
        tablo:{baslik:'Aylık üretim ve karşılama (inverter ve akü kayıpları dahil)', bas:['Ay','Üretim','Karşılama'], sat:ayrintiAy(PpvG / 1000, E / 1000), sag:[1, 2]},
        adim:[`Panel gücü = E / (ηinv × ηakü) / (PSH × PR) = ${fx(E)} / (${etaI} × ${etaB}) / (${fx(psh, 1)} × ${fx(v.PR / 100, 2)}) = ${fx(Ppv)} Wp`, `Akü = E × gün / (ηinv × DoD) = ${fx(E)} × ${fx(v.oz)} / (${etaI} × ${dod}) = ${fx(Wh)} Wh → ${fx(Ah)} Ah @ ${Vs} V`, `Soğukta Voc = ${fx(v.Voc)} × (1 + ${fx(v.kV)}% × (−5 − 25)) = ${fx(VocS, 2)} V → en çok ${nsMax} seri`]
      };
    }
    // On-grid / hibrit
    const yillik = v.aylik * 12 * v.karsila / 100;
    const kWp = yillik / yieldKwp;
    let nP = Math.max(1, Math.ceil(kWp * 1000 / v.pW - 1e-9));
    let ns = Math.max(1, Math.min(nsMax, nP));
    const nStr = Math.ceil(nP / ns); ns = Math.ceil(nP / nStr); nP = ns * nStr;
    const kWpG = nP * v.pW / 1000;
    const invK = ONG_INV.find(x => x >= kWpG / 1.15) || kWpG / 1.15;
    const uret = kWpG * yieldKwp;
    const faz = invK > 5 ? '3 faz' : '1 faz';
    if(invK > 5) uy.push(['bilgi', '5 kW üstü inverter üç fazlı bağlanır (İç Tesisler md. 22); abonelik üç fazlı olmalı.']);
    uy.push(['bilgi', 'Şebeke bağlı sistem kesintide güvenlik gereği durur; kesintide çalışması isteniyorsa hibrit sistem gerekir.']);
    let ek = [];
    if(!isNaN(v.fiyat)){ const kaz = uret * v.fiyat; ek.push(['Yıllık tasarruf (tam mahsup)', EK.tl(kaz)]); if(!isNaN(v.yatirim)) ek.push(['Geri ödeme', fx(v.yatirim / kaz, 1) + ' yıl', true]); }
    let akuT = null;
    if(v.mod === 'hib'){
      const dod = v.aku === 'li' ? 0.9 : 0.5, Wh = v.gece * 1000 / (0.92 * dod), Vs = v.Vs === 'oto' ? 48 : +v.Vs;
      const seri = Math.max(1, Math.round(Vs / v.bV)), par = Math.ceil(Wh / Vs / v.bAh - 1e-9);
      akuT = {ad:'Akü', d:`${seri * par} blok`, r:'cy', alt:`${seri} seri × ${par} paralel · ${fx(Vs * v.bAh * par / 1000, 1)} kWh`};
    }
    const Istr = v.Isc * 1.25, Sp = ELK.KESIT.find(S => S >= 4 && 2 * ELK.RHO.cu * v.Lp * Istr / S <= v.Vmp * ns * 0.01);
    return {
      ana:[{ad:'Kurulu güç', d:fx(kWpG, 2), b:'kWp', r:'amber', alt:`${nP} × ${fx(v.pW)} Wp · ${nStr} dizi × ${ns} seri`}, {ad:'Yıllık üretim', d:fx(uret, 0), b:'kWh', r:'green', alt:fx(yieldKwp, 0) + ' kWh/kWp'}, {ad:'İnverter', d:fx(invK), b:'kW', r:'mg', alt:faz + (v.mod === 'hib' ? ' hibrit' : ' on-grid')}].concat(akuT ? [akuT] : []),

  ],
  bilgi:'Basma yüksekliği Hm = statik yükseklik + basınç × 10,2 + boru sürtünme kayıpları (Hazen-Williams). Pompayı Hm ve debiye göre üreticinin eğrisinden seç; buradaki güç yaklaşık motor gücünü verir.',
  hesap(v){
    const Qm3h = v.qb === 'm3' ? v.Q : v.Q * 60 / 1000;

      if(v.Pmax <= v.Pmin) return {hata:'Çıkma basıncı, girme basıncından büyük olmalı.'};
      const Ppre = Math.max(0.5, v.Pmin - 0.2);

      const std = TANK.find(x => x >= V) || TANK[TANK.length - 1];

        uyari:[v.Pmax - v.Pmin < 0.8 ? ['uyari', 'Basınç farkı çok dar: pompa sık kalkar.'] : null, ['bilgi', 'Tank ön basıncını her yıl, sistem basınçsızken kontrol et; membran yırtılırsa pompa sürekli kalkıp durur.']],
        adim:[`V = 15 × Q(L/dk) × (Pmax+1)(Pmin+1) / (n × (Pmax−Pmin) × (Pön+1))`, `= 15 × ${fx(Qld, 1)} × ${fx(v.Pmax + 1, 1)} × ${fx(v.Pmin + 1, 1)} / (${v.n} × ${fx(v.Pmax - v.Pmin, 1)} × ${fx(Ppre + 1, 1)}) = ${fx(V, 1)} L`]
      };

    const Q = Qm3h / 3600, D = v.d / 1000;

    uy.push(['bilgi', 'Dalgıç pompada kuru çalışma koruması (seviye rölesi / elektrot) ve motor koruma şalteri şart; su içi kablo olarak H07RN-F kullan.']);
    return {
      ana:[{ad:'Basma yüksekliği', d:fx(Hm, 1), b:'mSS', r:'cy', alt:`statik ${fx(v.Hs)} + basınç ${fx(v.Pc * 10.2, 1)} + kayıp ${fx(hf, 1)}`}, {ad:'Motor gücü', d:fx(kW), b:'kW', r:'mg', alt:fx(kW / 0.7457, 2) + ' HP · mil ' + fx(Pmil / 1000, 2) + ' kW'}, {ad:'Motor akımı', d:fx(In, 1), b:'A', r:'amber', alt:'kalkışta ≈' + fx(In * 5, 0) + ' A'},
           R.sec ? {ad:'Kablo / koruma', d:`${tr(R.sec.S)} mm²`, r:'green', alt:`C${R.In} veya motor koruma ${fx(In * 0.9, 1)}–${fx(In * 1.2, 1)} A`} : {ad:'Kablo', d:'—', r:'red'}],

      aktar:[{ad:'Hidrofor tankı', arac:'pompa', v:{mod:'tank', Q:v.Q, qb:v.qb}}]

    if(v.cih.length) uy.push(top <= v.butce * 0.9 ? ['ok', `PoE ihtiyacı ${fx(top)} W ≤ bütçe ${fx(v.butce)} W.`] : top <= v.butce ? ['uyari', `PoE ihtiyacı ${fx(top)} W bütçenin %90’ını aşıyor; IR gece görüşü vb. tepe tüketimde kesinti olabilir.`] : ['hata', `PoE ihtiyacı ${fx(top)} W > bütçe ${fx(v.butce)} W: daha büyük bütçeli switch veya ek PoE enjektör.`]);
    return {
      ana:[{ad:'Mesafe sınırı', d:lim || '—', b:lim ? 'm' : '', r:v.L <= lim ? 'green' : 'red', alt:`Cat${v.kat.toUpperCase()} · ${v.hiz} Gbit/s`}, {ad:'PoE ihtiyacı', d:fx(top, 1), b:'W', r:top <= v.butce ? 'cy' : 'red', alt:`bütçe ${fx(v.butce)} W`}],
      uyari:uy,
      tablo:v.cih.length ? {bas:['Cihaz','Standart','Adet','Güç'], sat, sag:[2, 3]} : null
    };
  }
});

/* ============================================================
   MALİYET
   ============================================================ */
arac({
  id:'maliyet', kat:'diger', ikon:'💰', ad:'Elektrik Maliyeti ve Geri Ödeme',
  aciklama:'Cihazın aylık/yıllık tüketimi ve faturası; tek, kademeli veya üç zamanlı tarife; eski-yeni cihaz karşılaştırması ve geri ödeme süresi.',
  etiket:['maliyet','fatura','kwh fiyatı','tasarruf','geri ödeme','üç zamanlı','kademe','led dönüşüm','amortisman'],
  alanlar:[
    {k:'mod', ad:'Hesap', t:'seg', s:[['tek','Tek cihaz'],['kar','Eski ↔ yeni karşılaştır']], v:'tek'},
    {k:'P', ad:'Cihaz gücü', t:'sayi', birim:'W', v:2000, gizle:v => v.mod !== 'tek'},
    {k:'Pe', ad:'Eski cihaz', t:'sayi', birim:'W', v:60, gizle:v => v.mod !== 'kar'},
    {k:'Py', ad:'Yeni cihaz', t:'sayi', birim:'W', v:9, gizle:v => v.mod !== 'kar'},
    {k:'adet', ad:'Adet', t:'sayi', birim:'adet', v:1},
    {k:'saat', ad:'Günlük kullanım', t:'sayi', birim:'saat', v:4, max:24},
    {k:'gun', ad:'Ayda kullanılan gün', t:'sayi', birim:'gün', v:30, max:31},
    {k:'yuk', ad:'Ortalama yüklenme', t:'sayi', birim:'%', v:100, min:5, max:100, ipucu:'termostatlı cihaz ≈50'},
    {k:'tarife', ad:'Tarife', t:'seg', s:[['tek','Tek zamanlı'],['uc','Üç zamanlı']], v:'tek'},
    {k:'f', ad:'Birim fiyat (vergiler dahil)', t:'sayi', birim:'₺/kWh', v:3.5, gizle:v => v.tarife !== 'tek', ipucu:'faturadaki toplam / kWh'},
    {k:'fg', ad:'Gündüz (06–17)', t:'sayi', birim:'₺/kWh', v:3.5, gizle:v => v.tarife !== 'uc'},
    {k:'fp', ad:'Puant (17–22)', t:'sayi', birim:'₺/kWh', v:5.2, gizle:v => v.tarife !== 'uc'},
    {k:'fn', ad:'Gece (22–06)', t:'sayi', birim:'₺/kWh', v:2.1, gizle:v => v.tarife !== 'uc'},
    {k:'dg', ad:'Gündüz payı', t:'sayi', birim:'%', v:50, sifir:true, max:100, gizle:v => v.tarife !== 'uc'},
    {k:'dp', ad:'Puant payı', t:'sayi', birim:'%', v:30, sifir:true, max:100, gizle:v => v.tarife !== 'uc'},
    {k:'yeniFiyat', ad:'Yeni cihazların fiyatı (toplam)', t:'sayi', birim:'₺', bos:true, ph:'geri ödeme için', gizle:v => v.mod !== 'kar'}
  ],
  bilgi:'Birim fiyatı faturadan bul: “Ödenecek tutar ÷ tüketilen kWh” tüm vergi ve fonları içerir. Konut tarifesinde yıllık tüketim sınırını aşan aboneler daha yüksek kademeden ödeyebilir; güncel fiyatı faturandan al.',
  hesap(v){
    let f = v.f, fNot = '';
    if(v.tarife === 'uc'){
      const dn = 100 - v.dg - v.dp;
      if(dn < 0) return {hata:'Gündüz + puant payı %100’ü aşamaz.'};
      f = (v.fg * v.dg + v.fp * v.dp + v.fn * dn) / 100;
      fNot = `Ağırlıklı fiyat: %${tr(v.dg)} gündüz, %${tr(v.dp)} puant, %${tr(dn)} gece → ${fx(f, 3)} ₺/kWh`;
    }
    const ayK = W => W * v.adet * v.saat * v.gun * v.yuk / 100 / 1000;
    if(v.mod === 'tek'){
      const kwh = ayK(v.P), tl = kwh * f;
      return {ana:[{ad:'Aylık maliyet', d:EK.tl(tl), r:'mg', alt:fx(kwh, 1) + ' kWh/ay'}, {ad:'Yıllık maliyet', d:EK.tl(tl * 12), r:'amber', alt:fx(kwh * 12, 0) + ' kWh/yıl'}, {ad:'Saatlik', d:EK.tl(v.P * v.adet * v.yuk / 100 / 1000 * f), r:'cy'}],
        satir:[fNot ? ['Tarife', fNot] : null, ['Günlük', fx(kwh / v.gun, 2) + ' kWh · ' + EK.tl(tl / v.gun)]],
        uyari:[v.tarife === 'uc' ? ['bilgi', 'Termosifon, çamaşır ve bulaşık makinesi gibi zamanlanabilir yükleri gece dilimine kaydırmak üç zamanlı tarifede en hızlı tasarruftur.'] : null]};
    }
    const ke = ayK(v.Pe), ky = ayK(v.Py), tas = (ke - ky) * f;
    const ana = [{ad:'Aylık tasarruf', d:EK.tl(tas), r:tas >= 0 ? 'green' : 'red', alt:fx(ke - ky, 1) + ' kWh/ay'}, {ad:'Yıllık tasarruf', d:EK.tl(tas * 12), r:'mg'}];
    if(!isNaN(v.yeniFiyat) && tas > 0) ana.push({ad:'Geri ödeme', d:fx(v.yeniFiyat / tas, 1), b:'ay', r:'amber', alt:fx(v.yeniFiyat / tas / 12, 1) + ' yıl'});
    return {ana, satir:[['Eski cihaz', `${fx(ke, 1)} kWh · ${EK.tl(ke * f)} / ay`], ['Yeni cihaz', `${fx(ky, 1)} kWh · ${EK.tl(ky * f)} / ay`], ['Tasarruf oranı', yuz((1 - v.Py / v.Pe) * 100, 0)], fNot ? ['Tarife', fNot] : null]};
  }
});

baslat();
</script>
