<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="description" content="Gün Teknik El Kitabı: elektrik, klima, pompa, güneş ve uydu hesap araçları">
<title>Hesap Araçları · El Kitabı · Gün Teknik</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="ek-top">
  <button class="ek-ikon-btn" id="ek-geri" onclick="geri()" title="El Kitabı" aria-label="Geri">⬅️</button>
  <div class="ek-top-baslik"><h1 id="ek-top-h1">Hesap Araçları</h1><p id="ek-top-p"></p></div>
  <button class="ek-ikon-btn" onclick="gecmisAc()" title="Kayıtlı hesaplar" aria-label="Kayıtlı hesaplar">🕘</button>
  <button class="ek-ikon-btn" id="ek-tema-btn" onclick="EK.temaDegistir()" title="Tema" aria-label="Tema">☀️</button>
</header>
<main class="ek-icerik">
  <section id="ek-ana">
    <div class="ek-ara"><input id="ek-ara-in" type="search" placeholder="Ara: jeneratör, kesit, BTU, kaçak akım, hidrofor…" autocomplete="off" aria-label="Araç ara"></div>
    <div class="ek-cipler" id="ek-cipler"></div>
    <div id="ek-liste"></div>
  </section>
  <section id="ek-arac" style="display:none"></section>
</main>
<div class="ek-ozet-serit" id="ek-ozet-serit" role="button"></div>
<nav class="ek-nav" id="ek-nav"></nav>
<script>
/* ============================================================
   HESAP MOTORU — şema tabanlı form, anlık hesap, sonuç, geçmiş
   ============================================================ */
'use strict';
const H = {araclar:[], harita:{}, aktif:null, d:{}, zaman:0, sonR:null, sonV:null, ara:'', kat:'hepsi'};
const KATLAR = [
  {id:'temel',    ad:'Temel Hesaplar',        ikon:'⚡'},
  {id:'tesisat',  ad:'Tesisat & Pano',        ikon:'🔌'},
  {id:'kaynak',   ad:'Enerji Kaynakları',     ikon:'🔋'},
  {id:'mekanik',  ad:'Klima · Pompa · Motor', ikon:'❄️'},
  {id:'iletisim', ad:'Uydu & Ağ',             ikon:'📡'},
  {id:'diger',    ad:'Maliyet & Diğer',       ikon:'🧰'}
];
function arac(t){ H.araclar.push(t); H.harita[t.id] = t; }
const $ = id => document.getElementById(id);
const esc = EK.esc, tr = EK.tr;
const fx = (n, o) => tr(n, o);                // kısa yazım
const yuz = (n, o) => '%' + tr(n, o == null ? 2 : o);
const ANA_SIG = [16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630];
const anaSigorta = I => ANA_SIG.find(x => x >= I - 1e-9) || null;

/* ── Ortak alan kalıpları ── */
function sisEtki(alan){ return d => { if(d.sis === '3f' && (!d[alan] || d[alan] === '230' || d[alan] === '12' || d[alan] === '24')) d[alan] = '400';
  else if(d.sis === '1f' && (!d[alan] || d[alan] === '400' || d[alan] === '12' || d[alan] === '24')) d[alan] = '230';
  else if(d.sis === 'dc' && (!d[alan] || d[alan] === '230' || d[alan] === '400')) d[alan] = '12'; }; }
const SIS2 = [['1f','Tek faz · 230 V'],['3f','Üç faz · 400 V']];
const SIS3 = [['dc','DC'],['1f','Tek faz'],['3f','Üç faz']];

/* ── Alan yardımcıları ── */
const gorunur = (a, v) => !a.gizle || !a.gizle(v);
const secenek = (a, v) => typeof a.s === 'function' ? a.s(v) : (a.s || []);
const birimAl = (a, v) => typeof a.birim === 'function' ? a.birim(v) : (a.birim || '');
const adAl = (a, v) => typeof a.ad === 'function' ? a.ad(v) : (a.ad || '');
const alanBul = k => H.aktif.alanlar.find(a => a.k === k);
function satirVars(a){ const o = {}; for(const c of a.sut){ if(c.v != null) o[c.k] = String(c.v); else if(c.t === 'sec'){ const s = secenek(c, {}); o[c.k] = s.length ? String(s[0][0]) : ''; } else o[c.k] = ''; } return o; }
function varsayilan(t){
  const d = {};
  for(const a of t.alanlar){
    if(!a.k) continue;
    if(a.t === 'liste') d[a.k] = (a.ornek || []).map(r => Object.assign(satirVars(a), strObj(r)));
    else if(a.t === 'onay') d[a.k] = !!a.v;
    else if(a.v != null) d[a.k] = String(a.v);
    else if(a.t === 'sec' || a.t === 'seg'){ const s = secenek(a, {}); d[a.k] = s.length ? String(s[0][0]) : ''; }
    else d[a.k] = '';
  }
  return d;
}
function strObj(o){ const r = {}; for(const k in o) r[k] = o[k] == null ? '' : String(o[k]); return r; }
function satirBos(a, row){ return a.sut.every(c => c.t === 'sec' || c.ops || String(row[c.k] == null ? '' : row[c.k]).trim() === ''); }
function degerler(t){
  const v = {};
  for(const a of t.alanlar){
    if(!a.k) continue;
    const r = H.d[a.k];
    if(a.t === 'sayi') v[a.k] = EK.sayiOku(r);
    else if(a.t === 'liste'){
      v[a.k] = (r || []).filter(row => !satirBos(a, row)).map(row => {
        const o = {}; for(const c of a.sut){ const x = row[c.k]; o[c.k] = c.t === 'sayi' ? EK.sayiOku(x) : x; } return o; });
    }
    else v[a.k] = r;
  }
  return v;
}
function kontrol(t, v){
  const eksik = [], hatali = [];
  for(const a of t.alanlar){
    if(!a.k || !gorunur(a, v)) continue;
    if(a.t === 'sayi'){
      const x = v[a.k], ad = adAl(a, v);
      if(isNaN(x)){ if(!a.bos && String(H.d[a.k] || '').trim() === '') eksik.push(ad); else if(String(H.d[a.k] || '').trim() !== '') hatali.push({k:a.k, m:ad + ': sayı değil'}); continue; }
      if(!a.neg && x < 0) hatali.push({k:a.k, m:ad + ' negatif olamaz'});
      else if(!a.sifir && !a.neg && x === 0 && a.min == null) hatali.push({k:a.k, m:ad + ' sıfır olamaz'});
      else if(a.min != null && x < a.min) hatali.push({k:a.k, m:ad + ' en az ' + tr(a.min) + ' olmalı'});
      else if(a.max != null && x > a.max) hatali.push({k:a.k, m:ad + ' en fazla ' + tr(a.max) + ' olmalı'});
    } else if(a.t === 'liste'){
      const ham = (H.d[a.k] || []);
      let no = 0;
      for(const row of ham){
        no++;
        if(satirBos(a, row)) continue;
        for(const c of a.sut){
          if(c.t !== 'sayi' || c.bos) continue;
          const x = EK.sayiOku(row[c.k]);
          if(isNaN(x) || (!c.sifir && x <= 0) || x < 0) eksik.push(adAl(a, v) + ' ' + no + '. satır: ' + c.ad);
        }
      }
      if(a.enaz && v[a.k].length < a.enaz) eksik.push(a.enazMesaj || ('En az ' + a.enaz + ' satır: ' + adAl(a, v)));
    }
  }
  return {eksik, hatali};
}

/* ── Form çizimi ── */
function alanHtml(a, v){
  const tam = a.tam || ['seg','liste','baslik','onay','html'].includes(a.t) ? ' tam' : '';
  const ad = adAl(a, v);
  const etk = ad ? `<label>${ad}${a.ipucu ? `<i>${a.ipucu}</i>` : ''}</label>` : '';
  const not = a.not ? `<div class="ipucu">${typeof a.not === 'function' ? a.not(v) : a.not}</div>` : '';
  const val = H.d[a.k];
  switch(a.t){
    case 'baslik': return `<div class="ek-araba">${ad}</div>`;
    case 'html': return `<div class="tam">${typeof a.html === 'function' ? a.html(v) : a.html}</div>`;
    case 'sayi': {
      const b = birimAl(a, v);
      return `<div class="fi${tam}" data-alan="${a.k}">${etk}<div class="ek-giris${b ? ' bvar' : ''}"><input type="text" inputmode="decimal" autocomplete="off" data-k="${a.k}" value="${esc(val)}" placeholder="${esc(a.ph == null ? '' : a.ph)}" aria-label="${esc(ad)}">${b ? `<span class="birim">${b}</span>` : ''}</div>${not}</div>`;
    }
    case 'metin': return `<div class="fi${tam}" data-alan="${a.k}">${etk}<div class="ek-giris"><input type="text" data-k="${a.k}" value="${esc(val)}" placeholder="${esc(a.ph || '')}" style="font-family:var(--fu)"></div>${not}</div>`;
    case 'sec': {
      const s = secenek(a, v);
      if(!s.some(o => String(o[0]) === String(val)) && s.length){ H.d[a.k] = String(s[0][0]); }
      const cur = H.d[a.k];
      return `<div class="fi${tam}" data-alan="${a.k}">${etk}<div class="ek-giris sec"><select data-k="${a.k}" aria-label="${esc(ad)}">${s.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(cur) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>${not}</div>`;
    }
    case 'seg': {
      const s = secenek(a, v);
      if(!s.some(o => String(o[0]) === String(val)) && s.length){ H.d[a.k] = String(s[0][0]); }
      const cur = H.d[a.k];
      return `<div class="fi tam" data-alan="${a.k}">${etk}<div class="ek-seg" role="group">${s.map(o => `<button type="button" data-seg="${a.k}" data-val="${esc(o[0])}" class="${String(o[0]) === String(cur) ? 'aktif' : ''}">${o[1]}</button>`).join('')}</div>${not}</div>`;
    }
    case 'onay': return `<div class="fi tam" data-alan="${a.k}"><label class="ek-onay${val ? ' aktif' : ''}"><input type="checkbox" data-k="${a.k}"${val ? ' checked' : ''}><span>${ad}</span></label>${not}</div>`;
    case 'liste': {
      const satirlar = (H.d[a.k] || []);
      const sut = a.sut.length;
      let h = `<div class="fi tam" data-alan="${a.k}">${etk}<div class="ek-liste" style="--sut:${a.sutSayi || Math.min(sut, 4)}">`;
      satirlar.forEach((row, i) => {
        h += `<div class="ek-satir-kutu" style="--sut:${a.sutSayi || Math.min(sut, 4)}">`;
        for(const c of a.sut){
          const cls = (c.gen ? ' gen2' : '') + (c.k === 'ad' ? ' ad' : '');
          if(c.t === 'sec'){
            const s = secenek(c, v);
            h += `<div class="fi${cls}"><label>${c.ad}</label><div class="ek-giris sec"><select data-l="${a.k}" data-i="${i}" data-c="${c.k}">${s.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(row[c.k]) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div></div>`;
          } else {
            const b = c.birim || '';
            h += `<div class="fi${cls}"><label>${c.ad}</label><div class="ek-giris${b ? ' bvar' : ''}"><input type="text" ${c.t === 'sayi' ? 'inputmode="decimal"' : 'style="font-family:var(--fu)"'} autocomplete="off" data-l="${a.k}" data-i="${i}" data-c="${c.k}" value="${esc(row[c.k])}" placeholder="${esc(c.ph || '')}">${b ? `<span class="birim">${b}</span>` : ''}</div></div>`;
          }
        }
        h += `<button type="button" class="ek-satir-sil" data-sil="${a.k}" data-i="${i}" aria-label="Satırı sil">✕</button></div>`;
      });
      h += `</div><div class="ek-liste-alt"><button type="button" class="ek-ekle-btn" data-ekle="${a.k}">＋ ${a.ekle || 'Satır ekle'}</button>`;
      if(a.hazir) h += a.hazir.map((p, j) => `<button type="button" class="ek-hazir" data-hazir="${a.k}" data-j="${j}">${esc(p.ad || p[0])}</button>`).join('');
      if(satirlar.length) h += `<button type="button" class="ek-hazir" data-temizle="${a.k}" style="margin-left:auto">🗑 Listeyi boşalt</button>`;
      h += `</div>${not}</div>`;
      return h;
    }
  }
  return '';
}
function formCiz(){
  const t = H.aktif; const v = degerler(t);
  let h = '';
  for(const a of t.alanlar){ if(gorunur(a, v)) h += alanHtml(a, v); }
  $('ek-form').innerHTML = h;
}

/* ── Hesap ve sonuç ── */
function plan(){ clearTimeout(H.zaman); H.zaman = setTimeout(hesapla, 140); }
function hesapla(){
  const t = H.aktif; if(!t) return;
  EK.yaz('ekh_son_' + t.id, H.d);
  const v = degerler(t);
  const k = kontrol(t, v);
  document.querySelectorAll('#ek-form .fi.hatali').forEach(e => e.classList.remove('hatali'));
  k.hatali.forEach(x => { const e = document.querySelector(`#ek-form [data-alan="${x.k}"]`); if(e) e.classList.add('hatali'); });
  let r = null;
  if(!k.eksik.length && !k.hatali.length){
    try{ r = t.hesap(v); }catch(err){ console.error(err); r = {hata:'Hesaplanamadı: ' + err.message}; }
  }
  H.sonR = r; H.sonV = v;
  sonucCiz(r, k);
}
function tileHtml(x){
  const d = typeof x.d === 'number' ? tr(x.d, x.o) : x.d;
  return `<div class="ek-tile r-${x.r || 'mg'}"><div class="t-ad">${x.ad}</div><div class="t-d">${d}${x.b ? `<small>${x.b}</small>` : ''}</div>${x.alt ? `<div class="t-alt">${x.alt}</div>` : ''}</div>`;
}
function tabloHtml(T){
  if(!T) return '';
  const sag = new Set(T.sag || []);
  let h = `<div class="ek-tablo-w">${T.baslik ? `<div style="padding:9px 10px 0;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px">${T.baslik}</div>` : ''}<table class="ek-tablo"><thead><tr>${T.bas.map((b, i) => `<th class="${sag.has(i) ? 's' : ''}">${b}</th>`).join('')}</tr></thead><tbody>`;
  T.sat.forEach((s, j) => {
    const cls = (T.sec != null && (Array.isArray(T.sec) ? T.sec.includes(j) : T.sec === j)) ? 'sec' : (T.top && T.top.includes(j) ? 'top' : '');
    h += `<tr class="${cls}">${s.map((c, i) => `<td class="${sag.has(i) ? 's' : ''}">${c}</td>`).join('')}</tr>`;
  });
  return h + '</tbody></table></div>';
}
function sonucCiz(r, k){
  const el = $('ek-sonuc'); const serit = $('ek-ozet-serit');
  serit.classList.remove('goster');
  if(k && (k.eksik.length || k.hatali.length)){
    let h = '<div class="ek-sonuc-bos">';
    if(k.hatali.length) h += `<div class="ek-uy hata" style="text-align:left;margin-bottom:10px">${k.hatali.map(x => esc(x.m)).join('<br>')}</div>`;
    if(k.eksik.length) h += `Sonuç için şunları doldur:<br><b>${k.eksik.slice(0, 6).map(esc).join(' · ')}${k.eksik.length > 6 ? ' …' : ''}</b>`;
    el.innerHTML = h + '</div>';
    return;
  }
  if(!r){ el.innerHTML = '<div class="ek-sonuc-bos">Değerleri gir, sonuç burada anında görünür.</div>'; return; }
  if(r.hata){ el.innerHTML = `<div class="ek-uy hata">${r.hata}</div>`; return; }
  if(r.bekle){ el.innerHTML = `<div class="ek-sonuc-bos">${r.bekle}</div>`; return; }
  let h = '';
  if(r.ust) h += r.ust;
  if(r.ana && r.ana.length) h += `<div class="ek-tiles">${r.ana.map(tileHtml).join('')}</div>`;
  if(r.html) h += r.html;
  if(r.satir && r.satir.length) h += `<div class="ek-satirlar">${r.satir.filter(Boolean).map(s => `<div class="ek-kv${s[2] ? ' vurgu' : ''}"><span>${s[0]}</span><span>${s[1]}</span></div>`).join('')}</div>`;
  const uy = (r.uyari || []).filter(Boolean);
  if(uy.length) h += `<div class="ek-uyarilar">${uy.map(u => `<div class="ek-uy ${u[0]}"><span>${u[1]}</span></div>`).join('')}</div>`;
  if(r.tablo) h += tabloHtml(r.tablo);
  if(r.tablolar) r.tablolar.forEach(T => h += tabloHtml(T));
  if(r.html2) h += r.html2;
  if(r.adim && r.adim.length) h += `<details class="ek-adim"><summary>Nasıl hesaplandı?</summary><ol>${r.adim.map(a => `<li>${a}</li>`).join('')}</ol></details>`;
  if(r.not) h += `<div class="ek-not">${r.not}</div>`;
  h += '<div class="ek-eylemler">';
  (r.aktar || []).forEach((x, i) => h += `<button class="ek-btn yesil kucuk" onclick="aktar(${i})">↪ ${x.ad}</button>`);
  h += `<button class="ek-btn kucuk" onclick="sonucKopyala()">📋 Kopyala</button><button class="ek-btn kucuk" onclick="sonucWp()">💬 WhatsApp</button><button class="ek-btn kucuk" onclick="gecmiseKaydet()">⭐ Kaydet</button></div>`;
  el.innerHTML = h;
  if(r.ana && r.ana.length){
    const x = r.ana[0];
    serit.innerHTML = `<span>${x.ad}</span><b>${typeof x.d === 'number' ? tr(x.d, x.o) : x.d} ${x.b || ''}</b><span style="font-size:11px;color:var(--mg)">Sonuca git ↓</span>`;
    serit.classList.add('goster');
  }
}
function aktar(i){
  const x = H.sonR && H.sonR.aktar && H.sonR.aktar[i]; if(!x) return;
  aracAc(x.arac, x.v);
}

/* ── Metin (kopyala / paylaş) ── */
const duz = s => String(s == null ? '' : s).replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
function sonucMetni(){
  const t = H.aktif, v = H.sonV, r = H.sonR; if(!t || !r || r.hata || r.bekle) return '';
  const L = ['🔢 Gün Teknik · ' + t.ad, ''];
  for(const a of t.alanlar){
    if(!a.k || !gorunur(a, v) || a.metinYok) continue;
    const ad = duz(adAl(a, v));
    if(a.t === 'sayi'){ if(!isNaN(v[a.k])) L.push(`${ad}: ${tr(v[a.k], 4)} ${duz(birimAl(a, v))}`.trim()); }
    else if(a.t === 'sec' || a.t === 'seg'){ const o = secenek(a, v).find(o => String(o[0]) === String(v[a.k])); if(o) L.push(`${ad}: ${duz(o[1])}`); }
    else if(a.t === 'onay'){ if(v[a.k]) L.push('✓ ' + ad); }
    else if(a.t === 'metin'){ if(v[a.k]) L.push(`${ad}: ${v[a.k]}`); }
    else if(a.t === 'liste' && v[a.k].length){
      L.push(ad + ':');
      v[a.k].forEach(row => L.push(' • ' + a.sut.map(c => { const x = row[c.k]; if(c.t === 'sec'){ const o = secenek(c, v).find(o => String(o[0]) === String(x)); return o ? duz(o[1]) : ''; } return c.t === 'sayi' ? (isNaN(x) ? '' : tr(x, 3) + (c.birim ? ' ' + c.birim : '')) : (x || ''); }).filter(Boolean).join(' · ')));
    }
  }
  L.push('', '— SONUÇ —');
  (r.ana || []).forEach(x => L.push(`${duz(x.ad)}: ${duz(typeof x.d === 'number' ? tr(x.d, x.o) : x.d)} ${duz(x.b || '')}${x.alt ? ' (' + duz(x.alt) + ')' : ''}`));
  (r.satir || []).filter(Boolean).forEach(s => L.push(`${duz(s[0])}: ${duz(s[1])}`));
  (r.uyari || []).filter(Boolean).forEach(u => L.push((u[0] === 'ok' ? '✅ ' : u[0] === 'hata' ? '⛔ ' : u[0] === 'uyari' ? '⚠️ ' : '💡 ') + duz(u[1])));
  if(r.metinEk) L.push('', r.metinEk);
  return L.join('\n');
}
function sonucKopyala(){ const m = sonucMetni(); if(m) EK.kopyala(m); }
function sonucWp(){ const m = sonucMetni(); if(m) EK.whatsapp(m); }

/* ── Geçmiş ── */
function gecmiseKaydet(){
  const t = H.aktif, r = H.sonR; if(!t || !r) return;
  const L = EK.oku('ekh_gecmis', []);
  const x = r.ana && r.ana[0];
  L.unshift({id:t.id, d:JSON.parse(JSON.stringify(H.d)), ozet: x ? duz(`${x.ad}: ${typeof x.d === 'number' ? tr(x.d, x.o) : x.d} ${x.b || ''}`) : '', t:Date.now()});
  EK.yaz('ekh_gecmis', L.slice(0, 40));
  EK.toast('⭐ Geçmişe kaydedildi');
}
function gecmisAc(){
  const L = EK.oku('ekh_gecmis', []);
  let h = '';
  if(!L.length) h = '<div class="ek-sonuc-bos">Henüz kayıt yok. Bir sonucun altındaki <b>⭐ Kaydet</b> ile buraya eklenir.</div>';
  else {
    h = '<div style="display:flex;flex-direction:column;gap:8px">';
    L.forEach((x, i) => {
      const t = H.harita[x.id]; if(!t) return;

function gecmisYukle(i){ const x = EK.oku('ekh_gecmis', [])[i]; if(!x) return; EK.modalKapat(); H.bekleyenTam = x.d; aracAc(x.id); }
function gecmisSil(i){ const L = EK.oku('ekh_gecmis', []); L.splice(i, 1); EK.yaz('ekh_gecmis', L); gecmisAc(); }

/* ── Olaylar ── */
function olaylariBagla(){
  const f = $('ek-form');
  f.addEventListener('input', e => {
    const el = e.target;
    if(el.dataset.l != null){ const row = H.d[el.dataset.l][+el.dataset.i]; if(row){ row[el.dataset.c] = el.value; plan(); } return; }
    const k = el.dataset.k; if(!k) return;
    const a = alanBul(k); if(!a) return;
    if(a.t === 'sayi' || a.t === 'metin'){ H.d[k] = el.value; if(a.etki){ a.etki(H.d); } plan(); }
  });
  f.addEventListener('change', e => {
    const el = e.target;
    if(el.dataset.l != null){ const row = H.d[el.dataset.l][+el.dataset.i]; if(row){ row[el.dataset.c] = el.value; const a = alanBul(el.dataset.l); const c = a && a.sut.find(c => c.k === el.dataset.c); if(c && c.etki){ c.etki(row); formCiz(); } hesapla(); } return; }
    const k = el.dataset.k; if(!k) return;
    const a = alanBul(k); if(!a) return;
    if(a.t === 'sec'){ H.d[k] = el.value; if(a.etki) a.etki(H.d); formCiz(); hesapla(); }
    else if(a.t === 'onay'){ H.d[k] = el.checked; if(a.etki) a.etki(H.d); formCiz(); hesapla(); }
    else if(a.t === 'sayi' && a.etki){ formCiz(); }
  });
  f.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.seg){ const a = alanBul(b.dataset.seg); H.d[b.dataset.seg] = b.dataset.val; if(a && a.etki) a.etki(H.d); formCiz(); hesapla(); return; }
    if(b.dataset.ekle){ const a = alanBul(b.dataset.ekle); H.d[a.k] = H.d[a.k] || []; H.d[a.k].push(satirVars(a)); formCiz(); const ins = f.querySelectorAll(`[data-l="${a.k}"][data-i="${H.d[a.k].length - 1}"]`); if(ins[0]) ins[0].focus(); hesapla(); return; }
    if(b.dataset.sil){ H.d[b.dataset.sil].splice(+b.dataset.i, 1); formCiz(); hesapla(); return; }
    if(b.dataset.temizle){ H.d[b.dataset.temizle] = []; formCiz(); hesapla(); return; }
    if(b.dataset.hazir){ const a = alanBul(b.dataset.hazir); const p = a.hazir[+b.dataset.j]; H.d[a.k] = H.d[a.k] || []; H.d[a.k].push(Object.assign(satirVars(a), strObj(p.v || p[1]))); formCiz(); hesapla(); EK.toast('＋ ' + (p.ad || p[0])); return; }
  });
  $('ek-ozet-serit').addEventListener('click', () => $('ek-sonuc').scrollIntoView({behavior:'smooth', block:'start'}));
}

/* ── Yönlendirme ── */
function aracAc(id, on){
  const t = H.harita[id]; if(!t) return anaGoster();
  H.bekleyen = on || null;
  if(location.hash.slice(1).split('?')[0] !== id) location.hash = id;
  else aracGoster(id);
}
function aracGoster(id, sorgu){
  const t = H.harita[id]; if(!t) return anaGoster();
  H.aktif = t;
  const vars = varsayilan(t);
  let d = H.bekleyenTam || EK.oku('ekh_son_' + id, null);
  H.bekleyenTam = null;
  if(d && typeof d === 'object'){ for(const k in vars){ if(d[k] != null && typeof d[k] === typeof vars[k]) vars[k] = d[k]; } }
  const on = Object.assign({}, sorgu || {}, H.bekleyen || {}); H.bekleyen = null;
  for(const k in on){ if(k in vars && !Array.isArray(vars[k])) vars[k] = typeof vars[k] === 'boolean' ? !!on[k] : String(on[k]); }
  H.d = vars;
  const kul = EK.oku('ekh_kullanim', {}); kul[id] = (kul[id] || 0) + 1; EK.yaz('ekh_kullanim', kul);
  $('ek-top-h1').textContent = t.ad; $('ek-top-p').textContent = KATLAR.find(k => k.id === t.kat).ad;
  $('ek-geri').textContent = '←'; $('ek-geri').title = 'Araç listesine dön';
  $('ek-ana').style.display = 'none'; $('ek-arac').style.display = '';
  $('ek-arac').innerHTML = `
    <div class="ek-arac-bas k-${t.kat}"><div class="ek-arac-ikon">${t.ikon}</div><div style="min-width:0"><h2>${t.ad}</h2><p>${t.aciklama}</p></div></div>
    <div class="ek-duzen k-${t.kat}">
      <div class="ek-kart"><div class="ek-form" id="ek-form"></div>
        <div class="ek-eylemler" style="margin-top:16px"><button class="ek-btn kucuk" onclick="aracSifirla()">↺ Varsayılana dön</button></div>

      </div>
      <div class="ek-sonuc-kart" id="ek-sonuc"></div>
    </div>`;
  olaylariBagla();
  formCiz(); hesapla();
  window.scrollTo(0, 0);
  document.title = t.ad + ' · Hesap · Gün Teknik';
}
function aracSifirla(){ if(!H.aktif) return; H.d = varsayilan(H.aktif); formCiz(); hesapla(); EK.toast('↺ Varsayılan değerler'); }
function anaGoster(){
  H.aktif = null;
  $('ek-top-h1').textContent = 'Hesap Araçları'; $('ek-top-p').textContent = H.araclar.length + ' araç · Elektrik, klima, pompa, güneş, uydu';
  $('ek-geri').textContent = '⬅️'; $('ek-geri').title = 'El Kitabı';
  $('ek-arac').style.display = 'none'; $('ek-ana').style.display = '';
  $('ek-ozet-serit').classList.remove('goster');
  anaCiz();
  document.title = 'Hesap Araçları · El Kitabı · Gün Teknik';
}
function geri(){ if(H.aktif){ if(history.length > 1 && H.icGecis) history.back(); else location.hash = ''; } else location.href = 'index.html'; }
function rota(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [id, q] = h.split('?');
  const sorgu = {}; if(q) q.split('&').forEach(p => { const [a, b] = p.split('='); if(a) sorgu[a] = b == null ? '' : b; });
  if(id && H.harita[id]){ H.icGecis = true; aracGoster(id, sorgu); } else anaGoster();
}

/* ── Ana liste ── */
const norm = s => String(s).toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
function anaCiz(){
  const q = norm(H.ara.trim());
  const kul = EK.oku('ekh_kullanim', {});
  const uygun = H.araclar.filter(t => (H.kat === 'hepsi' || t.kat === H.kat) && (!q || q.split(/\s+/).every(p => norm(t.ad + ' ' + t.aciklama + ' ' + (t.etiket || []).join(' ')).includes(p))));
  let h = '';
  const kart = t => `<button class="ek-arac-kart k-${t.kat}" onclick="aracAc('${t.id}')"><div class="ek-arac-ikon">${t.ikon}</div><div style="min-width:0"><div class="ek-arac-ad">${t.ad}${t.yeni ? '<span class="ek-arac-yeni">YENİ</span>' : ''}</div><div class="ek-arac-ac">${t.aciklama}</div></div></button>`;
  if(!q && H.kat === 'hepsi'){
    const sik = H.araclar.filter(t => kul[t.id]).sort((a, b) => kul[b.id] - kul[a.id]).slice(0, 4);
    if(sik.length) h += `<div class="ek-bolum-baslik">⭐ Sık kullandıkların</div><div class="ek-arac-izgara">${sik.map(kart).join('')}</div>`;
  }
  if(q){
    h += uygun.length ? `<div class="ek-bolum-baslik">🔍 ${uygun.length} sonuç</div><div class="ek-arac-izgara">${uygun.map(kart).join('')}</div>` : `<div class="ek-sonuc-bos" style="margin-top:20px">“${esc(H.ara)}” için araç bulunamadı.</div>`;
  } else {
    for(const k of KATLAR){
      const L = uygun.filter(t => t.kat === k.id); if(!L.length) continue;
      h += `<div class="ek-bolum-baslik">${k.ikon} ${k.ad}</div><div class="ek-arac-izgara">${L.map(kart).join('')}</div>`;
    }
  }
  $('ek-liste').innerHTML = h;
  $('ek-cipler').innerHTML = [['hepsi','Tümü']].concat(KATLAR.map(k => [k.id, k.ikon + ' ' + k.ad])).map(([id, ad]) => `<button class="ek-cip${H.kat === id ? ' aktif' : ''}" onclick="H.kat='${id}';anaCiz()">${ad}</button>`).join('');
}

function baslat(){
  H.araclar.sort((a, b) => (SIRA.indexOf(a.id) + 1 || 99) - (SIRA.indexOf(b.id) + 1 || 99));

  $('ek-ara-in').addEventListener('input', e => { H.ara = e.target.value; anaCiz(); });
  window.addEventListener('hashchange', rota);
  rota();
}

      const z = arr[i]; if(z == null) return;
      const r = iz(tabO, S);
      const g = o.L ? gd({sis:o.sis, U:o.U, I:o.Ib, L:o.L, S, malz:o.malz, cos:o.cos}) : null;
      const top = g ? g.yuzde + (o.gdOnce || 0) : 0;
      const akimOk = In ? r.Iz >= In - 1e-9 : r.Iz >= o.Ib;
      const gdOk = !g || top <= o.gdSinir + 1e-9;
      const minOk = S >= (o.minS || 0);
      const ok = akimOk && gdOk && minOk;
      satir.push({S, Iz:r.Iz, Iz0:r.Iz0, kT:r.kT, kG:r.kG, g, top, akimOk, gdOk, minOk, ok});
      if(ok && !sec) sec = satir[satir.length - 1];
    });
    // Akım kapasitesine göre en küçük (bilgi)
    const sAkim = satir.find(x => x.akimOk);
    const sGd = satir.find(x => x.gdOk);
    let neden = '';
    if(sec){
      const a = sAkim ? sAkim.S : 0, g = sGd ? sGd.S : 0, m = o.minS || 0;
      if(m >= a && m >= g && sec.S === m && m > Math.max(a, g)) neden = 'uygulama alt sınırı belirledi';
      else if(g > a) neden = 'gerilim düşümü belirledi';
      else neden = 'akım taşıma kapasitesi belirledi';
    }
    return {In, sec, satir, not, yuklu, sAkim, sGd, neden};
  }
  const kesitAd = S => tr(S) + ' mm²';
  return {KESIT, IZ, YONTEM, kT, kG, RHO, LAMBDA, SIGORTA, iz, izTablo, gd, gdKesit, gdLmax, sigortaSec, egriKat, lmax, akim, cap, kabloSec, kesitAd, ara};
})();

/* ── Hızlı hesap: Ohm + güç ── */
arac({
  id:'hizli', kat:'temel', ikon:'⚡', ad:'Hızlı Hesap · Ohm ve Güç',
  aciklama:'Gerilim, akım, güç, direnç — herhangi ikisini gir, kalanlar hesaplansın.',
  etiket:['ohm','volt','amper','watt','direnç','güç','v=ir','p=ui'],
  alanlar:[
    {k:'mod', ad:'Devre türü', t:'seg', s:[['dc','DC / rezistif (ısıtıcı, akkor lamba)'],['ac','AC · cosφ ile']], v:'dc'},
    {k:'sis', ad:'Sistem', t:'seg', s:SIS2, v:'1f', gizle:v => v.mod !== 'ac'},
    {k:'cos', ad:'Güç faktörü cosφ', t:'sayi', v:1, min:0.05, max:1, gizle:v => v.mod !== 'ac', ipucu:'rezistif = 1'},
    {k:'U', ad:v => v.mod === 'ac' && v.sis === '3f' ? 'Gerilim (faz-faz)' : 'Gerilim', t:'sayi', birim:'V', bos:true, ph:'—', v:230},
    {k:'I', ad:'Akım', t:'sayi', birim:'A', bos:true, ph:'—'},
    {k:'P', ad:'Güç (aktif)', t:'sayi', birim:'W', bos:true, ph:'—', v:2000},
    {k:'R', ad:'Direnç', t:'sayi', birim:'Ω', bos:true, ph:'—', gizle:v => v.mod === 'ac'}
  ],
  bilgi:'İki değer yazman yeterli. Üç değer yazarsan ilk iki bilinen değer esas alınır ve üçüncüsü kontrol edilir.',
  hesap(v){
    const has = k => !isNaN(v[k]) && v[k] > 0;
    const adim = [];
    let U = v.U, I = v.I, P = v.P, R = v.R;
    if(v.mod === 'dc'){
      const bil = ['U','I','P','R'].filter(has);
      if(bil.length < 2) return {bekle:'Herhangi <b>iki</b> değeri gir: gerilim, akım, güç veya direnç.'};
      const ikili = bil.slice(0, 2).join('');
      const fazla = bil.slice(2);
      switch(ikili){
        case 'UI': P = U * I; R = U / I; adim.push(`P = U × I = ${fx(U)} × ${fx(I)} = ${fx(P)} W`, `R = U / I = ${fx(U)} / ${fx(I)} = ${fx(R)} Ω`); break;
        case 'UP': I = P / U; R = U * U / P; adim.push(`I = P / U = ${fx(P)} / ${fx(U)} = ${fx(I)} A`, `R = U² / P = ${fx(U)}² / ${fx(P)} = ${fx(R)} Ω`); break;
        case 'UR': I = U / R; P = U * U / R; adim.push(`I = U / R = ${fx(I)} A`, `P = U² / R = ${fx(P)} W`); break;
        case 'IP': U = P / I; R = P / (I * I); adim.push(`U = P / I = ${fx(U)} V`, `R = P / I² = ${fx(R)} Ω`); break;
        case 'IR': U = I * R; P = I * I * R; adim.push(`U = I × R = ${fx(U)} V`, `P = I² × R = ${fx(P)} W`); break;
        case 'PR': U = Math.sqrt(P * R); I = Math.sqrt(P / R); adim.push(`U = √(P × R) = ${fx(U)} V`, `I = √(P / R) = ${fx(I)} A`); break;
      }
      const uy = [];
      const hesaplanan = {U, I, P, R};
      fazla.forEach(k => { const g = v[k], h = hesaplanan[k]; if(Math.abs(g - h) / h > 0.01) uy.push(['uyari', `Girdiğin ${k} = ${fx(g)} tutarsız; ilk iki değere göre ${fx(h)} olmalı.`]); });
      return {
        ana:[{ad:'Gerilim', d:fx(U), b:'V', r:'amber'}, {ad:'Akım', d:fx(I), b:'A', r:'cy', alt:I < 1 ? fx(I * 1000) + ' mA' : ''},
             {ad:'Güç', d:P >= 1000 ? fx(P / 1000) : fx(P), b:P >= 1000 ? 'kW' : 'W', r:'mg', alt:P >= 1000 ? fx(P) + ' W' : ''}, {ad:'Direnç', d:EK.si(R, 'Ω'), r:'purple'}],
        satir:[['Günlük 1 saat çalışırsa', fx(P / 1000, 3) + ' kWh'], ['Isı (1 saatte)', fx(P * 3600 / 4186.8, 0) + ' kcal']],
        uyari:uy, adim
      };
    }
    // AC
    const k = v.sis === '3f' ? Math.sqrt(3) : 1, cos = v.cos;
    const bil = ['U','I','P'].filter(has);
    if(bil.length < 2) return {bekle:'Herhangi <b>iki</b> değeri gir: gerilim, akım veya güç.'};
    const ikili = bil.slice(0, 2).join('');
    const ks = v.sis === '3f' ? '√3 × ' : '';
    if(ikili === 'UI'){ P = k * U * I * cos; adim.push(`P = ${ks}U × I × cosφ = ${fx(P)} W`); }
    else if(ikili === 'UP'){ I = P / (k * U * cos); adim.push(`I = P / (${ks}U × cosφ) = ${fx(I)} A`); }
    else { U = P / (k * I * cos); adim.push(`U = P / (${ks}I × cosφ) = ${fx(U)} V`); }
    const S = k * U * I, Q = S * Math.sqrt(1 - cos * cos);
    adim.push(`S = ${ks}U × I = ${fx(S)} VA`, `Q = S × sinφ = ${fx(Q)} VAr`);
    const uy = [];
    if(bil.length === 3){ const h = k * U * I * cos; if(Math.abs(v.P - h) / h > 0.01) uy.push(['uyari', `Girdiğin güç tutarsız; U ve I'ya göre ${fx(h)} W olmalı.`]); }
    return {
      ana:[{ad:'Gerilim', d:fx(U), b:'V', r:'amber', alt:v.sis === '3f' ? 'faz-nötr ' + fx(U / Math.sqrt(3)) + ' V' : ''}, {ad:v.sis === '3f' ? 'Hat akımı' : 'Akım', d:fx(I), b:'A', r:'cy'},
           {ad:'Aktif güç P', d:P >= 1000 ? fx(P / 1000) : fx(P), b:P >= 1000 ? 'kW' : 'W', r:'mg'}, {ad:'Görünür güç S', d:fx(S / 1000, 3), b:'kVA', r:'purple'}],
      satir:[['Reaktif güç Q', fx(Q) + ' VAr'], ['Empedans (faz başına)', EK.si((v.sis === '3f' ? U / Math.sqrt(3) : U) / I, 'Ω')]],
      uyari:uy, adim
    };
  }
});

arac({
  id:'guc', kat:'temel', ikon:'💡', ad:'Güç Hesabı · 1Φ / 3Φ',
  aciklama:'Akımdan güç, güçten akım, güç üçgeni (P, Q, S), motor verimi dahil.',
  etiket:['kw','kva','kvar','cosfi','reaktif','görünür','trifaze','monofaze','hp','beygir'],
  alanlar:[
    {k:'mod', ad:'Ne hesaplanacak?', t:'seg', s:[['p','Akımdan güç'],['i','Güçten akım'],['ucgen','Güç üçgeni']], v:'i'},
    {k:'sis', ad:'Sistem', t:'seg', s:SIS2, v:'1f', etki:sisEtki('U')},
    {k:'U', ad:v => v.sis === '3f' ? 'Gerilim (faz-faz)' : 'Gerilim', t:'sayi', birim:'V', v:230},
    {k:'I', ad:'Akım', t:'sayi', birim:'A', v:10, gizle:v => v.mod !== 'p'},
    {k:'P', ad:'Güç', t:'sayi', birim:v => v.pb === '1' ? 'W' : v.pb === '1000' ? 'kW' : v.pb === '745.7' ? 'HP' : 'BG', v:2000, gizle:v => v.mod === 'p'},
    {k:'pb', ad:'Güç birimi', t:'sec', s:[['1','Watt (W)'],['1000','Kilowatt (kW)'],['745.7','HP (mekanik beygir)'],['735.5','BG / PS (metrik beygir)']], v:'1', gizle:v => v.mod === 'p'},
    {k:'cos', ad:'Güç faktörü cosφ', t:'sayi', v:0.9, min:0.05, max:1, ipucu:'rezistif 1 · motor ≈0,8'},
    {k:'eta', ad:'Verim η (motor için)', t:'sayi', birim:'%', bos:true, ph:'boş = %100', min:10, max:100, gizle:v => v.mod === 'ucgen', not:'Motor etiketindeki güç mil (çıkış) gücüdür; şebekeden çekilen güç = mil gücü / verim.'}
  ],
  hesap(v){
    const k = v.sis === '3f' ? Math.sqrt(3) : 1, ks = v.sis === '3f' ? '√3 × ' : '';
    const eta = isNaN(v.eta) ? 1 : v.eta / 100, cos = v.cos, sin = Math.sqrt(1 - cos * cos);
    const adim = [];
    let P, I;
    if(v.mod === 'p'){ I = v.I; P = k * v.U * I * cos; adim.push(`P = ${ks}U × I × cosφ = ${ks}${fx(v.U)} × ${fx(I)} × ${fx(cos)} = ${fx(P)} W (şebekeden)`); }
    else { P = v.P * (+v.pb) / (v.mod === 'i' ? eta : 1); if(eta < 1 && v.mod === 'i') adim.push(`Şebekeden çekilen = ${fx(v.P * (+v.pb))} W / ${fx(eta)} = ${fx(P)} W`); I = P / (k * v.U * cos); adim.push(`I = P / (${ks}U × cosφ) = ${fx(P)} / (${ks}${fx(v.U)} × ${fx(cos)}) = ${fx(I)} A`); }
    const S = P / cos, Q = S * sin;
    adim.push(`S = P / cosφ = ${fx(S)} VA`, `Q = P × tanφ = ${fx(Q)} VAr`);
    const ana = [
      {ad:v.sis === '3f' ? 'Hat akımı' : 'Akım', d:fx(I), b:'A', r:'cy', alt:v.mod === 'p' ? '' : 'Sigorta için → kablo aracına aktar'},
      {ad:'Aktif güç P', d:fx(P / 1000, 3), b:'kW', r:'mg', alt:fx(P / 745.7, 2) + ' HP'},
      {ad:'Görünür güç S', d:fx(S / 1000, 3), b:'kVA', r:'purple'},
      {ad:'Reaktif güç Q', d:fx(Q / 1000, 3), b:'kVAr', r:'amber'}
    ];
    const uy = [];
    if(v.sis === '1f' && P > 5000) uy.push(['uyari', 'Tek fazda 5 kW üstü yük: İç Tesisler Yönetmeliği md. 22 gereği 5 kW üzeri bağlantılar üç fazlı yapılmalı.']);
    if(cos < 0.85 && v.mod !== 'ucgen') uy.push(['bilgi', `cosφ ${fx(cos)} düşük; kompanzasyonla akım ${yuz((1 - cos / 0.95) * 100, 0)} kadar azalabilir.`]);
    return {ana, satir:[['tanφ', fx(sin / cos, 3)], ['φ açısı', fx(Math.acos(cos) * 180 / Math.PI, 1) + '°']], uyari:uy, adim,
      aktar:[{ad:'Kablo ve sigorta seç', arac:'kablo', v:{gir:'I', Ib:(+I.toFixed(2)), sis:v.sis, U:v.U, cos:v.cos}}]};
  }
});

    {k:'Q', ad:'Reaktif güç', t:'sayi', birim:'kVAr', v:5, gizle:v => !(v.tur === 'kq' && v.yon === 'q2c')},
    {k:'bag', ad:'Bağlantı', t:'sec', s:[['tek','Tek kondansatör (faz-nötr veya tek faz)'],['ucgen','3 kondansatör üçgen (Δ) · faz-faz'],['yildiz','3 kondansatör yıldız (Y)']], v:'tek', gizle:v => v.tur !== 'kq', tam:true, etki:d => { if(d.bag !== 'tek' && d.Uc === '230') d.Uc = '400'; else if(d.bag === 'tek' && d.Uc === '400') d.Uc = '230'; }},
    {k:'Uc', ad:v => v.bag === 'tek' ? 'Gerilim' : 'Gerilim (faz-faz)', t:'sayi', birim:'V', v:230, gizle:v => !['xc','xl','kq'].includes(v.tur)}
  ],
  hesap(v){
    const w = 2 * Math.PI * (v.f || 50);
    switch(v.tur){
      case 'wh': { const sn = v.t * v.tb, Wh = v.P * sn / 3600;

      case 'ah': { const Wh = v.V * v.Ah;
        return {ana:[{ad:'Enerji', d:fx(Wh), b:'Wh', r:'mg', alt:fx(Wh / 1000, 3) + ' kWh'}, {ad:'100 W yükte', d:fx(Wh / 100, 1), b:'saat', r:'green', alt:'kayıpsız, tam deşarj'}],
          satir:[['Kurşun-asit (%50 deşarj, %85 inverter)', fx(Wh * 0.5 * 0.85) + ' Wh kullanılabilir'], ['LiFePO4 (%90 deşarj, %92 inverter)', fx(Wh * 0.9 * 0.92) + ' Wh kullanılabilir']],
          adim:[`Wh = V × Ah = ${fx(v.V)} × ${fx(v.Ah)} = ${fx(Wh)} Wh`], not:'Gerçek süre için UPS / Akü Süresi aracını kullan (Peukert etkisi dahil).', aktar:[{ad:'UPS / akü süresi', arac:'ups', v:{Vb:v.V, Ah:v.Ah}}]}; }
      case 'verim': { const e = v.Pc / v.Pg * 100;
        return {ana:[{ad:'Verim η', d:fx(e, 1), b:'%', r:e > 100 ? 'red' : 'green'}, {ad:'Kayıp', d:fx(v.Pg - v.Pc), b:'W', r:'amber'}],
          uyari:[e > 100 ? ['hata', 'Çıkış girişten büyük olamaz.'] : null], adim:[`η = ${fx(v.Pc)} / ${fx(v.Pg)} × 100 = %${fx(e, 2)}`]}; }
      case 'joule': { const sn = v.t * v.tb, J = v.I * v.I * v.R * sn;
        return {ana:[{ad:'Isı enerjisi', d:EK.si(J, 'J'), r:'amber'}, {ad:'kcal', d:fx(J / 4186.8, 2), b:'kcal'}, {ad:'Güç', d:fx(v.I * v.I * v.R), b:'W', r:'mg'}],
          adim:[`Q = I² × R × t = ${fx(v.I)}² × ${fx(v.R)} × ${fx(sn)} s = ${fx(J)} J`]}; }
      case 'xl': { const L = v.L * v.lb, X = w * L, Ic = v.Uc / X;
        return {ana:[{ad:'X_L', d:EK.si(X, 'Ω'), r:'cy'}, {ad:`${fx(v.Uc)} V'ta akım`, d:EK.si(Ic, 'A'), r:'mg'}],
          adim:[`X_L = 2π × ${fx(v.f)} × ${EK.si(L, 'H')} = ${EK.si(X, 'Ω')}`, `I = U / X_L = ${EK.si(Ic, 'A')}`]}; }
      case 'xc': { const C = v.C * v.cb, X = 1 / (w * C), Ic = v.Uc / X, Q = v.Uc * Ic;
        return {ana:[{ad:'X_C', d:EK.si(X, 'Ω'), r:'cy'}, {ad:`${fx(v.Uc)} V'ta akım`, d:EK.si(Ic, 'A'), r:'mg'}, {ad:'Reaktif güç', d:fx(Q), b:'VAr', r:'amber'}],
          adim:[`X_C = 1 / (2π × ${fx(v.f)} × ${EK.si(C, 'F')}) = ${EK.si(X, 'Ω')}`, `Q = U² / X_C = ${fx(Q)} VAr`]}; }
      case 'rez': { const L = v.L * v.lb, C = v.C * v.cb, f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
        return {ana:[{ad:'Rezonans frekansı', d:EK.si(f0, 'Hz'), r:'purple'}], adim:[`f₀ = 1 / (2π√(${EK.si(L, 'H')} × ${EK.si(C, 'F')})) = ${EK.si(f0, 'Hz')}`]}; }
      case 'kq': {
        const U = v.Uc;

        const Uk = v.bag === 'yildiz' ? U / Math.sqrt(3) : U, adet = v.bag === 'tek' ? 1 : 3;
        if(v.yon === 'c2q'){

arac({
  id:'cevirici', kat:'temel', ikon:'🔁', ad:'Birim Çevirici',
  aciklama:'HP↔kW, BTU↔kW, bar↔psi↔mSS, °C↔°F, AWG↔mm², kVA↔A, debi ve dahası.',
  etiket:['dönüştür','çevir','hp','btu','bar','psi','awg','kva','fahrenheit','inç','galon','beygir'],
  alanlar:[
    {k:'kat', ad:'Kategori', t:'sec', tam:true, s:[['guc','Güç (W, kW, HP, BTU/h, kcal/h)'],['enerji','Enerji (kWh, J, kcal, BTU)'],['basinc','Basınç (bar, psi, mSS)'],['sicaklik','Sıcaklık (°C, °F, K)'],['uzunluk','Uzunluk (mm, inç, ft)'],['alan','Alan (m², dönüm)'],['akis','Debi (m³/h, L/dk)'],['hacim','Hacim (L, m³, galon)'],['awg','Kablo: AWG ↔ mm²'],['kva','kVA ↔ Amper ↔ kW']], v:'guc'},
    {k:'x', ad:'Değer', t:'sayi', v:1, neg:true, sifir:true, gizle:v => v.kat === 'awg'},
    {k:'b', ad:'Birim', t:'sec', s:v => v.kat === 'sicaklik' ? [['C','°C'],['F','°F'],['K','K']] : v.kat === 'kva' ? [['kva','kVA'],['a','Amper (A)'],['kw','kW']] : v.kat === 'awg' ? [['mm2','mm² kesit']] : (CEV[v.kat] ? CEV[v.kat].b.map((u, i) => [String(i), u[0]]) : []), v:'1', gizle:v => v.kat === 'awg'},
    {k:'awgYon', ad:'Yön', t:'seg', s:[['awg','AWG → mm²'],['mm','mm² → AWG']], v:'awg', gizle:v => v.kat !== 'awg'},
    {k:'awg', ad:'AWG numarası', t:'sec', s:AWG.map(a => [a, 'AWG ' + a]), v:'12', gizle:v => !(v.kat === 'awg' && v.awgYon === 'awg')},
    {k:'mm', ad:'Kesit', t:'sayi', birim:'mm²', v:2.5, gizle:v => !(v.kat === 'awg' && v.awgYon === 'mm')},
    {k:'sis', ad:'Sistem', t:'seg', s:SIS2, v:'3f', gizle:v => v.kat !== 'kva', etki:sisEtki('U')},
    {k:'U', ad:'Gerilim', t:'sayi', birim:'V', v:400, gizle:v => v.kat !== 'kva'},
    {k:'cos', ad:'cosφ', t:'sayi', v:0.8, min:0.05, max:1, gizle:v => v.kat !== 'kva'}
  ],
  hesap(v){
    if(v.kat === 'sicaklik'){
      const C = v.b === 'C' ? v.x : v.b === 'F' ? (v.x - 32) * 5 / 9 : v.x - 273.15;

      return {ana:[{ad:'Santigrat', d:fx(C, 2), b:'°C', r:'mg'}, {ad:'Fahrenheit', d:fx(C * 9 / 5 + 32, 2), b:'°F', r:'amber'}, {ad:'Kelvin', d:fx(C + 273.15, 2), b:'K', r:'cy'}]};
    }
    if(v.kat === 'awg'){
      const satir = n => { const d = awgCap(n); return [n <= 0 ? (1 - n) + '/0' : String(n), fx(d, 3) + ' mm', fx(Math.PI * d * d / 4, 3) + ' mm²']; };
      if(v.awgYon === 'awg'){
        const n = awgNo(v.awg), d = awgCap(n), S = Math.PI * d * d / 4;
        const yakin = ELK.KESIT.concat([0.5, 0.75, 1]).sort((a, b) => a - b).find(x => x >= S * 0.97);

          adim:[`d = 0,127 × 92^((36 − n)/39) = ${fx(d, 4)} mm`, `S = π × d² / 4 = ${fx(S, 4)} mm²`]};
      }
      let en = null, fark = 1e9;
      for(let n = -3; n <= 40; n++){ const S = Math.PI * awgCap(n) ** 2 / 4; const f = Math.abs(Math.log(S / v.mm)); if(f < fark){ fark = f; en = n; } }
      const ust = (() => { for(let n = 40; n >= -3; n--){ const S = Math.PI * awgCap(n) ** 2 / 4; if(S >= v.mm * 0.99) return n; } return -3; })();

        tablo:{bas:['AWG','Çap','Kesit'], sat:[en - 2, en - 1, en, en + 1, en + 2].filter(n => n >= -3 && n <= 40).map(satir), sec:2, sag:[1, 2]}};
    }
    if(v.kat === 'kva'){
      const k = v.sis === '3f' ? Math.sqrt(3) : 1;
      let S;
      if(v.b === 'kva') S = v.x * 1000; else if(v.b === 'a') S = k * v.U * v.x; else S = v.x * 1000 / v.cos;
      const I = S / (k * v.U), P = S * v.cos;
      return {ana:[{ad:'Görünür güç', d:fx(S / 1000, 3), b:'kVA', r:'purple'}, {ad:v.sis === '3f' ? 'Hat akımı' : 'Akım', d:fx(I, 2), b:'A', r:'cy'}, {ad:'Aktif güç', d:fx(P / 1000, 3), b:'kW', r:'mg'}],
        adim:[`I = S / (${v.sis === '3f' ? '√3 × ' : ''}U) = ${fx(S)} / (${v.sis === '3f' ? '√3 × ' : ''}${fx(v.U)}) = ${fx(I, 3)} A`, `P = S × cosφ = ${fx(P)} W`]};
    }
    const K = CEV[v.kat]; const u = K.b[+v.b] || K.b[0]; const taban = v.x * u[1];
    return {
      ana:[{ad:u[0], d:fx(v.x, 6), r:'mg', alt:'girilen değer'}],
      tablo:{bas:['Birim','Değer'], sat:K.b.map(b => [b[0], fx(taban / b[1], Math.abs(taban / b[1]) >= 100 ? 2 : 6)]), sec:+v.b, sag:[1]},
      not:v.kat === 'guc' ? 'Klima kapasitesinde 1 kW ≈ 3.412 BTU/h; 9.000 BTU/h ≈ 2,64 kW soğutma.' : v.kat === 'basinc' ? '1 bar ≈ 10,2 metre su sütunu (pompa basma yüksekliği).' : ''
    };
  }
});

      uyari:[rkm <= max * 1.0001 ? ['ok', 'Direnç standart sınırı içinde, kablo beyan kesitini sağlıyor.'] : hukum(oran, Sb), v.R < 0.5 ? ['uyari', 'Ölçülen direnç çok küçük; multimetre hatası büyük olabilir. Daha uzun kabloyu ölç ya da 4 uçlu (mikro-ohm) ölçüm yap.'] : null],
      adim:[`R20 = R / (1 + 0,00393 × (T − 20)) = ${fx(R20, 4)} Ω`, `R/km = ${fx(R20, 4)} / ${fx(v.L)} m × 1000 = ${fx(rkm, 3)} Ω/km`, `S_eş = 0,017241 × L / R20 = ${fx(Seq, 3)} mm²`]};
  }
});

const sigortaAd = (egri, In) => In > 125 ? `TMŞ ${In} A` : `${egri}${In}`;
const peKesit = S => S <= 16 ? S : S <= 35 ? 16 : ELK.KESIT.find(x => x >= S / 2);
function kabloTanim(S, sis, yontem, malz){
  const damar = sis === '3f' ? 5 : sis === 'dc' ? 2 : 3, al = malz === 'al';
  if(yontem === 'B1' || yontem === 'A1') return `${damar} × ${al ? 'Al ' : ''}H07V-U (NYA) ${tr(S)} mm² · tek damarlı`;
  if(S <= 16) return `${al ? 'NAYY' : 'NYM / NYY'} ${damar}×${tr(S)} mm²`;
  return sis === '3f' ? `${al ? 'NAYY' : 'NYY'} 3×${tr(S)}+${tr(peKesit(S))} mm² (+ nötr/PE düzenine göre)` : `${al ? 'NAYY' : 'NYY'} 3×${tr(S)} mm²`;
}
const DEVRE = {
  aydinlatma:{ad:'Aydınlatma', minS:1.5, egri:'B', gd:'1.5', cos:0.9, minIn:10, kar:'A'},
  priz:{ad:'Priz', minS:2.5, egri:'B', gd:'1.5', cos:0.9, minIn:16, kar:'A'},

  isitici:{ad:'Fırın, ocak, termosifon', minS:2.5, egri:'B', gd:'1.5', cos:1, minIn:16, kar:'A'},
  camasir:{ad:'Çamaşır / bulaşık', minS:2.5, egri:'B', gd:'1.5', cos:0.9, minIn:16, kar:'A'},
  motor:{ad:'Motor / pompa', minS:1.5, egri:'C', gd:'3', cos:0.8, kar:'A'},
  ev:{ad:'Elektrikli araç şarjı', minS:2.5, egri:'C', gd:'3', cos:1, kar:'B'},
  besleme:{ad:'Pano besleme / kolon', minS:4, egri:'C', gd:'1.5', cos:0.9, kar:'A'},
  genel:{ad:'Genel', minS:1.5, egri:'C', gd:'3', cos:0.9, kar:'A'}
};
const DEVRE_SEC = Object.keys(DEVRE).map(k => [k, DEVRE[k].ad]);

/* ── Kablo kesiti + sigorta ── */
arac({
  id:'kablo', kat:'tesisat', ikon:'🔌', ad:'Kablo Kesiti ve Sigorta Seçimi',
  aciklama:'Ib ≤ In ≤ Iz koordinasyonu, döşeme/sıcaklık/gruplama düzeltmesi, gerilim düşümü, kısa devre boyu.',
  etiket:['kesit','kablo','sigorta','mcb','iz','akım taşıma','nya','nym','linye','gerilim düşümü','iec 60364'],
  alanlar:[
    {k:'devre', ad:'Devre türü', t:'sec', s:DEVRE_SEC, v:'priz', tam:true, etki:d => { const x = DEVRE[d.devre]; d.egri = x.egri; d.gdTip = x.gd; d.cos = String(x.cos); }},
    {k:'gir', ad:'Bilinen', t:'seg', s:[['P','Güç biliniyor'],['I','Akım biliniyor']], v:'P'},
    {k:'sis', ad:'Sistem', t:'seg', s:SIS2, v:'1f', etki:sisEtki('U')},
    {k:'U', ad:v => v.sis === '3f' ? 'Gerilim (faz-faz)' : 'Gerilim', t:'sayi', birim:'V', v:230},
    {k:'P', ad:'Yük gücü', t:'sayi', birim:'W', v:3000, gizle:v => v.gir !== 'P'},
    {k:'Ib', ad:'Yük akımı Ib', t:'sayi', birim:'A', v:13, gizle:v => v.gir !== 'I'},
    {k:'cos', ad:'cosφ', t:'sayi', v:0.9, min:0.05, max:1},
    {k:'L', ad:'Hat uzunluğu (tek yön)', t:'sayi', birim:'m', v:25, bos:true, ph:'boş = GD hesaplanmaz'},
    {k:'egri', ad:'Sigorta eğrisi', t:'sec', s:[['B','B · 3–5×In (aydınlatma, priz, rezistif)'],['C','C · 5–10×In (motor, klima, genel)'],['D','D · 10–20×In (yüksek kalkışlı)']], v:'B', tam:true},
    {k:'gdTip', ad:'İzin verilen gerilim düşümü', t:'sec', s:GD_TIPLERI, v:'1.5', tam:true},
    {k:'gdOzel', ad:'Özel sınır', t:'sayi', birim:'%', v:3, gizle:v => v.gdTip !== 'ozel'},
    {k:'gdOnce', ad:'Önceki hatta düşüm', t:'sayi', birim:'%', bos:true, sifir:true, ph:'ana hat, ops.', ipucu:'toplama eklenir'},
    ...kabloAlanlari(),
    {k:'sebeke', ad:'Topraklama sistemi', t:'seg', s:[['tn','TN (PEN/PE şebekeden)'],['tt','TT (kendi topraklaması)']], v:'tn'}
  ],
  bilgi:'Seçim kuralı: önce sigorta In ≥ Ib, sonra kablonun düzeltilmiş akım kapasitesi Iz ≥ In ve gerilim düşümü sınır içinde olmalı. Türkiye uygulamasında aydınlatma linyesi en az 1,5 mm² (B10), priz linyesi en az 2,5 mm² (B16) kullanılır.',
  hesap(v){
    const x = DEVRE[v.devre];
    const Ib = v.gir === 'I' ? v.Ib : ELK.akim(v.P, v.sis, v.U, v.cos);
    const sinir = gdSinirSec(v);
    const In0 = ELK.sigortaSec(Ib), InS = In0 && x.minIn && In0 < x.minIn ? x.minIn : In0;
    const R = ELK.kabloSec({Ib, In:InS, sis:v.sis, U:v.U, cos:v.cos, L:isNaN(v.L) ? 0 : v.L, malz:v.malz, yal:v.yal, yontem:v.yontem, T:v.T, grup:v.grup, gdSinir:sinir, minS:x.minS, gdOnce:isNaN(v.gdOnce) ? 0 : v.gdOnce});
    if(!R.In) return {hata:`Yük akımı ${fx(Ib)} A: standart sigorta aralığını (630 A) aşıyor.`};
    if(!R.sec) return {hata:`${fx(Ib)} A için 240 mm²'ye kadar uygun kesit bulunamadı. Paralel kablo, daha kısa hat veya daha yüksek gerilim gerekir.`};
    const s = R.sec, S = s.S, In = R.In;
    const pe = peKesit(S);
    const Ia = ELK.egriKat[v.egri] * In;
    const Lm = ELK.lmax({U0:230, S, Spe:pe, malz:v.malz, Ia});
    const uy = [];
    if(R.not) uy.push(['bilgi', R.not]);
    if(s.g){ uy.push(s.top <= sinir ? ['ok', `Gerilim düşümü ${yuz(s.top)} ≤ ${yuz(sinir, 1)} sınırı.`] : ['hata', `Gerilim düşümü ${yuz(s.top)} sınırı aşıyor.`]); }
    if(!isNaN(v.L) && v.L > Lm) uy.push([v.sebeke === 'tn' ? 'uyari' : 'bilgi', v.sebeke === 'tn' ? `Hat ${fx(v.L)} m, kısa devre için en uzun ${fx(Lm, 0)} m: sigorta 0,4 s içinde açmayabilir. Kesiti büyüt, B eğrisi seç veya kaçak akım rölesi ekle.` : `TT sistemde toprak hatasını kaçak akım rölesi açar; kısa devre boyu yine de ${fx(Lm, 0)} m (faz-nötr) için geçerli.`]);
    if(v.devre === 'priz' && In > 16) uy.push(['uyari', 'Priz (Schuko) en çok 16 A’dir; 16 A üstü yükü ayrı linyeye veya sabit bağlantıya al.']);
    if(v.devre === 'aydinlatma' && In > 10) uy.push(['bilgi', 'Aydınlatmada genelde B10 + 1,5 mm² kullanılır; yük fazlaysa linyeyi böl.']);
    if(v.sis === '1f' && Ib * v.U * v.cos > 5000) uy.push(['uyari', 'Tek fazda 5 kW üstü: İç Tesisler Yön. md. 22 gereği üç faz önerilir.']);
    if(v.malz === 'al' && S < 16) uy.push(['uyari', 'Alüminyum iletken iç tesisatta 16 mm² altında kullanılmaz; bakır seç.']);
    if(In > 63) uy.push(['bilgi', '63 A üstü için kompakt şalter (TMŞ) veya 80–125 A MCB serisi; ayarlı termik ile Iz’ye göre ayarla.']);
    const tabloSat = R.satir.filter(r => r.S <= Math.max(S * 4, 6)).slice(0, 8).map(r => [tr(r.S) + ' mm²', fx(r.Iz, 1) + ' A', r.g ? yuz(r.top) : '—', r.ok ? '<span class="y">✓ uygun</span>' : `<span class="k">${!r.minOk ? 'alt sınır' : !r.akimOk ? 'akım ✗' : 'GD ✗'}</span>`]);
    return {
      ana:[
        {ad:'Sigorta', d:sigortaAd(v.egri, In), r:'amber', alt:In <= 63 ? (v.sis === '3f' ? '3 kutuplu MCB' : '1 kutuplu MCB (+N)') : ''},
        {ad:'Kablo kesiti', d:tr(S), b:'mm²', r:'mg', alt:R.neden},
        s.g ? {ad:'Gerilim düşümü', d:yuz(s.top), r:s.top <= sinir ? 'green' : 'red', alt:fx(s.g.dU, 2) + ' V'} : {ad:'Yük akımı', d:fx(Ib), b:'A', r:'cy'}
      ],
      satir:[
        ['Yük akımı Ib', fx(Ib) + ' A'],
        ['Kablo kapasitesi Iz', `${fx(s.Iz0)} × ${fx(s.kT, 3)} (sıcaklık) × ${fx(s.kG, 3)} (grup) = <b>${fx(s.Iz, 1)} A</b>`],
        ['Koşul Ib ≤ In ≤ Iz', `${fx(Ib)} ≤ ${In} ≤ ${fx(s.Iz, 1)} ✓`, true],
        ['Önerilen kablo', kabloTanim(S, v.sis, v.yontem, v.malz)],
        ['Koruma iletkeni (PE)', tr(pe) + ' mm²'],
        ['Kısa devre için en uzun hat', fx(Lm, 0) + ` m (${v.egri} eğrisi, Ia = ${fx(Ia)} A)`],
        ['Som iletken çapı', fx(ELK.cap(S), 2) + ' mm']
      ],
      uyari:uy,
      tablo:{baslik:'Kesit karşılaştırması', bas:['Kesit','Iz (düzeltilmiş)','GD','Durum'], sat:tabloSat, sec:tabloSat.findIndex(r => r[0] === tr(S) + ' mm²'), sag:[1, 2]},
      adim:[
        `Ib = ${v.gir === 'I' ? 'girilen' : `P / (${v.sis === '3f' ? '√3·' : ''}U·cosφ)`} = ${fx(Ib, 3)} A`,
        `In = Ib'den büyük ilk standart değer = ${In} A`,
        `Iz = Iz₀ × kT × kG ≥ In → ${tr(S)} mm²: ${fx(s.Iz0)} × ${fx(s.kT, 3)} × ${fx(s.kG, 3)} = ${fx(s.Iz, 1)} A`,
        s.g ? `ΔU = b·(ρ·L/S·cosφ + λ·L·sinφ)·Ib = ${s.g.b}·(${s.g.rho}·${fx(v.L)}/${tr(S)}·${fx(s.g.cos, 2)} + 0,08e-3·${fx(v.L)}·${fx(s.g.sin, 2)})·${fx(Ib, 2)} = ${fx(s.g.u, 3)} V → ${yuz(s.g.yuzde)}` : 'Hat uzunluğu girilmedi; gerilim düşümü hesaplanmadı.',
        `Lmax = 0,8·U0·S / (ρ·(1+m)·Ia) = 0,8·230·${tr(S)} / (${ELK.RHO[v.malz]}·(1+${fx(S / pe, 2)})·${fx(Ia)}) = ${fx(Lm, 1)} m`
      ],
      aktar:[{ad:'Kısa devre kontrolü', arac:'kisadevre', v:{egri:v.egri, In, S, malz:v.malz, L:isNaN(v.L) ? 20 : v.L}}, {ad:'Kaçak akım rölesi seç', arac:'kacak', v:{In}}]
    };
  }
});

const KESIT_GD = [0.5, 0.75, 1].concat(ELK.KESIT);
arac({
  id:'gd', kat:'tesisat', ikon:'📉', ad:'Gerilim Düşümü',
  aciklama:'Mevcut kablo için düşüm, uçtaki gerilim, sınıra göre en uzun hat ve gereken kesit. DC (12/24 V) dahil.',
  etiket:['gerilim düşümü','voltaj düşümü','hat boyu','dc','12v','24v','iç tesisler md 57'],
  alanlar:[
    {k:'sis', ad:'Sistem', t:'seg', s:SIS3, v:'1f', etki:sisEtki('U')},
    {k:'U', ad:v => v.sis === '3f' ? 'Gerilim (faz-faz)' : 'Nominal gerilim', t:'sayi', birim:'V', v:230},
    {k:'gir', ad:'Bilinen', t:'seg', s:[['I','Akım'],['P','Güç']], v:'I'},
    {k:'I', ad:'Akım', t:'sayi', birim:'A', v:16, gizle:v => v.gir !== 'I'},
    {k:'P', ad:'Güç', t:'sayi', birim:'W', v:3500, gizle:v => v.gir !== 'P'},
    {k:'cos', ad:'cosφ', t:'sayi', v:0.9, min:0.05, max:1, gizle:v => v.sis === 'dc'},
    {k:'L', ad:'Hat uzunluğu (tek yön)', t:'sayi', birim:'m', v:40},
    {k:'S', ad:'Kablo kesiti', t:'sec', s:KESIT_GD.map(s => [String(s), tr(s) + ' mm²']), v:'2.5'},
    {k:'malz', ad:'İletken', t:'seg', s:[['cu','Bakır'],['al','Alüminyum']], v:'cu'},
    {k:'gdTip', ad:'Sınır', t:'sec', s:GD_TIPLERI.concat([['dc3','%3 · DC / güneş ve akü hatları']]), v:'1.5', tam:true},
    {k:'gdOzel', ad:'Özel sınır', t:'sayi', birim:'%', v:3, gizle:v => v.gdTip !== 'ozel'},
    {k:'gdOnce', ad:'Önceki hattaki düşüm', t:'sayi', birim:'%', bos:true, sifir:true, ph:'opsiyonel'}
  ],
  bilgi:'Elektrik İç Tesisleri Yönetmeliği md. 57: yapı bağlantı kutusundan tüketiciye kadar aydınlatma ve priz devrelerinde %1,5, motor devrelerinde %3; kendi trafosu olan tesislerde trafo ile bağlantı kutusu arasında %5. Hesap, çalışma sıcaklığındaki direnç (Cu 0,0225 Ω·mm²/m) ve 0,08 mΩ/m reaktans ile yapılır (IEC 60364-5-52 Ek G).',
  hesap(v){
    const sinir = v.gdTip === 'dc3' ? 3 : gdSinirSec(v);
    const cos = v.sis === 'dc' ? 1 : v.cos;
    const I = v.gir === 'I' ? v.I : ELK.akim(v.P, v.sis, v.U, cos);
    const S = +v.S, once = isNaN(v.gdOnce) ? 0 : v.gdOnce;
    const o = {sis:v.sis, U:v.U, I, L:v.L, S, malz:v.malz, cos};
    const g = ELK.gd(o);
    const top = g.yuzde + once;
    const Lmax = ELK.gdLmax(o, Math.max(0, sinir - once));
    const Sgerek = ELK.gdKesit(o, Math.max(0.0001, sinir - once));
    const Sstd = KESIT_GD.find(x => x >= Sgerek);
    const Uc = v.sis === '3f' ? v.U - g.dU : v.U - g.u;
    const kayipW = (v.sis === '3f' ? 3 : 2) * I * I * ELK.RHO[v.malz] * v.L / S;
    return {
      ana:[
        {ad:'Gerilim düşümü', d:yuz(top), r:top <= sinir ? 'green' : 'red', alt:`${fx(v.sis === '3f' ? g.dU : g.u, 2)} V${once ? ' · önceki %' + tr(once) + ' dahil' : ''}`},
        {ad:'Uçtaki gerilim', d:fx(Uc, 1), b:'V', r:'cy'},
        {ad:`%${tr(sinir)} için en uzun hat`, d:fx(Lmax, 0), b:'m', r:'amber'},
        {ad:'Gereken kesit', d:Sstd ? tr(Sstd) : '>240', b:'mm²', r:'mg', alt:'hesap: ' + fx(Sgerek, 2) + ' mm²'}
      ],
      satir:[['Akım', fx(I, 2) + ' A'], ['Hattaki ısı kaybı', fx(kayipW, 1) + ' W'], v.sis === '3f' ? ['Faz-nötr düşüm', fx(g.u, 2) + ' V'] : null],
      uyari:[top <= sinir ? ['ok', `${yuz(top)} ≤ %${tr(sinir)} sınır içinde.`] : ['hata', `${yuz(top)} > %${tr(sinir)}: en az ${Sstd ? tr(Sstd) : '240+'} mm² kullan veya hattı ${fx(Lmax, 0)} m'ye indir.`],
        v.sis === 'dc' && v.U <= 24 ? ['bilgi', 'Düşük DC gerilimde kesit hızla büyür; akü ile inverter arasını mümkün olduğunca kısa tut.'] : null],
      adim:[`u = b·(ρ·L/S·cosφ + λ·L·sinφ)·I · b = ${g.b}${v.sis === '3f' ? ' (üç faz, faz-nötr)' : ''}`,
        `u = ${g.b}·(${g.rho}·${fx(v.L)}/${tr(S)}·${fx(g.cos, 2)}${v.sis === 'dc' ? '' : ` + 0,00008·${fx(v.L)}·${fx(g.sin, 2)}`})·${fx(I, 3)} = ${fx(g.u, 3)} V`,
        `% = u / U0 × 100 = ${fx(g.u, 3)} / ${fx(g.U0, 1)} × 100 = ${yuz(g.yuzde, 3)}`]
    };
  }
});

/* ── Kısa devre / döngü empedansı ── */
arac({
  id:'kisadevre', kat:'tesisat', ikon:'🛡️', ad:'Kısa Devre ve Hat Boyu Kontrolü', yeni:true,
  aciklama:'“Bu kesit bu sigortayla en fazla kaç metre?” Döngü empedansı Zs, kısa devre akımı, TT için RA × IΔn.',
  etiket:['kısa devre','döngü empedansı','zs','ze','lmax','hat boyu','açma','tt','tn','ra','topraklama'],
  alanlar:[
    {k:'sebeke', ad:'Topraklama sistemi', t:'seg', s:[['tn','TN-C-S / TN-S'],['tt','TT']], v:'tn'},
    {k:'egri', ad:'Sigorta eğrisi', t:'seg', s:[['B','B (5×In)'],['C','C (10×In)'],['D','D (20×In)']], v:'B'},
    {k:'In', ad:'Sigorta', t:'sec', s:ELK.SIGORTA.slice(2, 12).map(x => [String(x), x + ' A']), v:'16'},
    {k:'S', ad:'Faz kesiti', t:'sec', s:ELK.KESIT.slice(0, 10).map(s => [String(s), tr(s) + ' mm²']), v:'2.5'},
    {k:'Spe', ad:'PE kesiti', t:'sec', s:[['ayni','Faz ile aynı']].concat(ELK.KESIT.slice(0, 8).map(s => [String(s), tr(s) + ' mm²'])), v:'ayni'},
    {k:'malz', ad:'İletken', t:'seg', s:[['cu','Bakır'],['al','Alüminyum']], v:'cu'},
    {k:'L', ad:'Hat uzunluğu', t:'sayi', birim:'m', v:30},
    {k:'Ze', ad:'Ölçülen Ze (dış döngü)', t:'sayi', birim:'Ω', bos:true, ph:'ops. ölçüm', ipucu:'pano girişinde'},
    {k:'IdN', ad:'Kaçak akım rölesi', t:'sec', s:[['0.03','30 mA'],['0.1','100 mA'],['0.3','300 mA'],['0.5','500 mA']], v:'0.03', gizle:v => v.sebeke !== 'tt'},
    {k:'RA', ad:'Topraklama direnci RA', t:'sayi', birim:'Ω', bos:true, ph:'ölçülen', gizle:v => v.sebeke !== 'tt'}
  ],
  bilgi:'TN sistemde faz-PE kısa devresinde sigorta 0,4 saniyede (32 A’e kadar priz devreleri) açmalı: Zs × Ia ≤ U0. Ze bilinmiyorsa geleneksel yöntem kullanılır (kaynakta gerilimin %80’i kaldığı kabulü). TT’de koruma kaçak akım rölesiyle sağlanır: RA × IΔn ≤ 50 V.',
  hesap(v){
    const In = +v.In, S = +v.S, Spe = v.Spe === 'ayni' ? S : +v.Spe, Ia = ELK.egriKat[v.egri] * In, U0 = 230;
    const rho = ELK.RHO[v.malz];
    const Lm = ELK.lmax({U0, S, Spe, malz:v.malz, Ia});
    const R12 = rho * v.L * (1 / S + 1 / Spe);
    const ana = [{ad:'En uzun hat (geleneksel)', d:fx(Lm, 0), b:'m', r:v.L <= Lm ? 'green' : 'red', alt:`${v.egri}${In} · ${tr(S)}/${tr(Spe)} mm²`}];
    const satir = [['Açma akımı Ia', `${ELK.egriKat[v.egri]} × ${In} = ${fx(Ia)} A`], ['Hat direnci R1+R2', fx(R12, 3) + ' Ω'], ['İzin verilen Zs (en çok)', fx(U0 / Ia, 3) + ' Ω']];
    const uy = [];
    if(!isNaN(v.Ze)){
      const Zs = v.Ze + R12, Ik = U0 / Zs, Ik0 = U0 / v.Ze;
      ana.push({ad:'Döngü empedansı Zs', d:fx(Zs, 3), b:'Ω', r:Zs <= U0 / Ia ? 'green' : 'red'}, {ad:'Hat sonunda Ik', d:fx(Ik, 0), b:'A', r:'amber'});
      satir.push(['Pano girişinde Ik', fx(Ik0, 0) + ' A → sigorta kesme kapasitesi en az ' + (Ik0 <= 4500 ? '4,5 kA' : Ik0 <= 6000 ? '6 kA' : Ik0 <= 10000 ? '10 kA' : '15 kA+')]);
      uy.push(Zs <= U0 / Ia ? ['ok', `Zs = ${fx(Zs, 3)} Ω ≤ ${fx(U0 / Ia, 3)} Ω: sigorta hızlı açar.`] : ['hata', `Zs = ${fx(Zs, 3)} Ω > ${fx(U0 / Ia, 3)} Ω: sigorta zamanında açmaz. Kesiti büyüt, B eğrisine geç veya 30 mA KAR ekle.`]);

function fazDagit(satirlar, sis){ // satirlar: [{ad, P, faz}] → {L:[p1,p2,p3], atama:[]}
  const L = [0, 0, 0], at = [];
  if(sis !== '3f'){ satirlar.forEach(s => { L[0] += s.P; at.push('L1'); }); return {L, at}; }
  const sira = satirlar.map((s, i) => [s, i]).sort((a, b) => b[0].P - a[0].P);
  const atama = new Array(satirlar.length);
  sira.forEach(([s, i]) => {
    if(s.faz === '3f'){ L[0] += s.P / 3; L[1] += s.P / 3; L[2] += s.P / 3; atama[i] = 'L1-L2-L3'; return; }
    if(['L1','L2','L3'].includes(s.faz)){ const j = +s.faz[1] - 1; L[j] += s.P; atama[i] = s.faz; return; }
    const j = L.indexOf(Math.min(...L)); L[j] += s.P; atama[i] = 'L' + (j + 1);
  });
  return {L, at:atama};
}

  ],
  bilgi:'Ortalama aydınlık yöntemi: N = E × A / (Φ × UF × MF). UF (kullanım faktörü) oda indeksine göre açık renkli oda için tablodan alınır; spot ve dar açılı armatürlerde sonuç kabadır. Hedef lüks değerleri EN 12464-1 ve yaygın konut uygulamalarına dayanır.',

const KADEME = [1, 2.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 40, 50];
arac({
  id:'kompanzasyon', kat:'tesisat', ikon:'📊', ad:'Kompanzasyon (Reaktif Güç)', yeni:true,
  aciklama:'Hedef cosφ için gereken kVAr, kademe önerisi ve faturadaki reaktif oranlarının ceza sınırı kontrolü.',
  etiket:['kompanzasyon','reaktif','kvar','cosfi','kondansatör','ceza','endüktif','kapasitif','röle'],
  alanlar:[
    {k:'mod', ad:'Veri', t:'seg', s:[['cos','Güç ve cosφ ile'],['fatura','Faturadaki enerjiler ile']], v:'cos'},
    {k:'P', ad:'Aktif güç (yük)', t:'sayi', birim:'kW', v:30, gizle:v => v.mod !== 'cos'},
    {k:'cos1', ad:'Mevcut cosφ', t:'sayi', v:0.78, min:0.1, max:1, gizle:v => v.mod !== 'cos'},
    {k:'Ea', ad:'Aktif enerji', t:'sayi', birim:'kWh', v:6000, gizle:v => v.mod !== 'fatura'},
    {k:'Ei', ad:'Endüktif reaktif', t:'sayi', birim:'kVArh', v:2100, sifir:true, gizle:v => v.mod !== 'fatura'},
    {k:'Ec', ad:'Kapasitif reaktif', t:'sayi', birim:'kVArh', v:150, sifir:true, gizle:v => v.mod !== 'fatura'},
    {k:'saat', ad:'Dönemdeki çalışma süresi', t:'sayi', birim:'saat', v:240, gizle:v => v.mod !== 'fatura', ipucu:'ortalama kW için'},
    {k:'cos2', ad:'Hedef cosφ', t:'sayi', v:0.98, min:0.8, max:1},
    {k:'guc', ad:'Kurulu güç', t:'seg', s:[['k','50 kVA altı'],['b','50 kVA ve üstü']], v:'k'}
  ],
  bilgi:'Reaktif bedel konut, aydınlatma, tek fazlı ve 15 kW’a kadar abonelere uygulanmaz. Kurulu gücü 50 kVA altı abonelerde endüktif/aktif %33, kapasitif/aktif %20; 50 kVA ve üstünde %20 ve %15 aşılırsa ücretlenir (dağıtım şirketi uygulaması; güncel tarifeyi kontrol et).',
  hesap(v){
    const lim = v.guc === 'k' ? {i:33, c:20} : {i:20, c:15};
    let P, cos1, uy = [], ust = [];
    if(v.mod === 'fatura'){
      P = v.Ea / v.saat; const ri = v.Ei / v.Ea * 100, rc = v.Ec / v.Ea * 100;
      cos1 = Math.cos(Math.atan(v.Ei / v.Ea));
      ust.push(['Endüktif / aktif', `%${tr(ri, 1)} (sınır %${lim.i})`, ri > lim.i], ['Kapasitif / aktif', `%${tr(rc, 1)} (sınır %${lim.c})`, rc > lim.c]);
      uy.push(ri > lim.i ? ['hata', `Endüktif oran %${tr(ri, 1)} > %${lim.i}: reaktif bedel öder. Kondansatör gücünü artır, röle ve kademeleri kontrol et.`] : ['ok', `Endüktif oran sınır içinde (%${tr(ri, 1)}).`]);
      uy.push(rc > lim.c ? ['hata', `Kapasitif oran %${tr(rc, 1)} > %${lim.c}: aşırı kompanzasyon. Küçük kademe ekle, sabit kondansatörleri azalt, şönt reaktör düşün.`] : ['ok', `Kapasitif oran sınır içinde (%${tr(rc, 1)}).`]);
    } else { P = v.P; cos1 = v.cos1; }
    const t1 = Math.tan(Math.acos(cos1)), t2 = Math.tan(Math.acos(v.cos2));
    const Qc = P * (t1 - t2);
    if(Qc <= 0) return {ana:[{ad:'Mevcut cosφ', d:fx(cos1, 3), r:'green'}], satir:ust, uyari:uy.concat([['ok', 'Mevcut güç faktörü hedefin üzerinde; ek kondansatör gerekmez.']])};
    // Kademe önerisi: 1-1-2-2-4 oranlı (en küçük adım ≈ Qc/10)
    const adim0 = KADEME.find(x => x >= Qc / 10) || 50;
    const plan = [1, 1, 2, 2, 4, 4, 8].map(m => m * adim0);
    let top = 0; const kademe = [];
    for(const q of plan){ if(top >= Qc * 1.1) break; const qq = KADEME.find(x => x >= q) || q; kademe.push(qq); top += qq; }
    const I1 = P * 1000 / (Math.sqrt(3) * 400 * cos1), I2 = P * 1000 / (Math.sqrt(3) * 400 * v.cos2);
    return {
      ana:[{ad:'Gereken kondansatör', d:fx(Qc, 1), b:'kVAr', r:'amber'}, {ad:'Önerilen pano', d:fx(top, 1), b:'kVAr', r:'mg', alt:kademe.length + ' kademe: ' + kademe.map(x => tr(x)).join(' + ')}, {ad:'Akım azalması', d:fx((1 - I2 / I1) * 100, 0), b:'%', r:'green', alt:`${fx(I1, 0)} A → ${fx(I2, 0)} A`}],
      satir:ust.concat([['Ortalama aktif güç', fx(P, 1) + ' kW'], ['cosφ', `${fx(cos1, 3)} → ${fx(v.cos2, 2)}`], ['Kademe sigortası (en büyük)', `${ELK.sigortaSec(Math.max(...kademe) * 1000 / (Math.sqrt(3) * 400) * 1.5)} A (I_c × 1,5)`]]),
      uyari:uy.concat([['bilgi', 'Harmonik yüklü tesislerde (sürücü, UPS, LED) kondansatörleri detuned (%7 reaktörlü) seç; aksi halde rezonans ve kondansatör patlaması görülür.']]),
      adim:[`Qc = P × (tanφ1 − tanφ2) = ${fx(P, 2)} × (${fx(t1, 3)} − ${fx(t2, 3)}) = ${fx(Qc, 2)} kVAr`]
    };
  }
});

    {k:'lin', ad:'Linyeler', t:'liste', ekle:'Linye ekle', sutSayi:5, enaz:1, enazMesaj:'En az bir linye ekle',
      sut:[{k:'ad', ad:'Linye', t:'metin', ph:'adı'}, {k:'tur', ad:'Tür', t:'sec', s:DEVRE_SEC.filter(x => x[0] !== 'besleme')}, {k:'w', ad:'Güç', t:'sayi', birim:'W'}, {k:'faz', ad:'Faz', t:'sec', s:[['1f','1 faz'],['3f','3 faz']]}, {k:'L', ad:'Uzunluk', t:'sayi', birim:'m'}],
      ornek:[{ad:'Aydınlatma 1', tur:'aydinlatma', w:500, L:16}, {ad:'Aydınlatma 2', tur:'aydinlatma', w:400, L:20}, {ad:'Priz salon', tur:'priz', w:2000, L:18}, {ad:'Priz mutfak', tur:'priz', w:3000, L:12},
        {ad:'Çamaşır makinesi', tur:'camasir', w:2200, L:10}, {ad:'Klima salon', tur:'klima', w:2300, L:15}, {ad:'Termosifon', tur:'isitici', w:2000, L:8}],
      hazir:[{ad:'💡 Aydınlatma', v:{ad:'Aydınlatma', tur:'aydinlatma', w:400, L:15}}, {ad:'🔌 Priz', v:{ad:'Priz', tur:'priz', w:2000, L:15}}, {ad:'❄️ Klima', v:{ad:'Klima', tur:'klima', w:1700, L:15}},
        {ad:'🍳 Fırın', v:{ad:'Fırın', tur:'isitici', w:3000, L:10}}, {ad:'🔥 Ocak 3F', v:{ad:'Ocak', tur:'isitici', w:7000, faz:'3f', L:10}}, {ad:'💧 Hidrofor', v:{ad:'Hidrofor', tur:'motor', w:1100, L:20}}, {ad:'🚗 Şarj', v:{ad:'Araç şarjı', tur:'ev', w:7400, L:20}}]}
  ],
  metinYok:false,
  bilgi:'Tüm linyeler bakır PVC, aynı döşeme yöntemiyle hesaplanır. Gerilim düşümü sınırı (md. 57) ana hat + linye toplamına uygulanır: aydınlatma/priz %1,5, motor/klima %3. Malzeme listesindeki kablo boyları %10 fire + 2 m pano payı içerir.',
  hesap(v){
    const U = v.sis === '3f' ? 400 : 230, Uf = 230;
    const rows = v.lin.map((r, i) => Object.assign({}, r, {ad:r.ad || ('Linye ' + (i + 1)), sis:(r.faz === '3f' && v.sis === '3f') ? '3f' : '1f'}));
    const uy = [];
    if(v.lin.some(r => r.faz === '3f') && v.sis === '1f') uy.push(['uyari', 'Tek fazlı beslemede 3 fazlı linye olamaz; bu linyeler tek faz hesaplandı.']);
    // Eşzamanlılık ve ana hat
    let Pk = 0, Q = 0;
    rows.forEach(r => { const x = DEVRE[r.tur]; Pk += r.w; Q += r.w * Math.tan(Math.acos(x.cos)); });
    const cosO = Pk / Math.sqrt(Pk * Pk + Q * Q);
    const Pe = esZaman(Pk, v.tesis, v.ek);
    const Ie = Pe / ((v.sis === '3f' ? Math.sqrt(3) : 1) * U * cosO);
    const ana = ELK.kabloSec({Ib:Ie, In:anaSigorta(Ie), sis:v.sis, U, cos:cosO, L:v.Lana, malz:'cu', yal:'pvc', yontem:'B2', T:v.T, grup:1, gdSinir:v.anaPay, minS:v.sis === '3f' ? 6 : 10});
    if(!ana.In || !ana.sec) return {hata:'Ana besleme için uygun kesit bulunamadı (çok yüksek güç veya uzun hat).'};
    const anaGD = ana.sec.g ? ana.sec.g.yuzde : 0;
    if(v.sis === '1f' && Pk > 5000) uy.push(['uyari', `Kurulu güç ${fx(Pk / 1000, 1)} kW > 5 kW: üç fazlı bağlantı gerekir (md. 22).`]);
    // Linyeler
    const sonuc = [];
    rows.forEach(r => {
      const x = DEVRE[r.tur], Ur = r.sis === '3f' ? U : Uf;
      const Ib = ELK.akim(r.w, r.sis, Ur, x.cos);
      const In0 = ELK.sigortaSec(Ib), In = In0 && x.minIn && In0 < x.minIn ? x.minIn : In0;
      const R = ELK.kabloSec({Ib, In, sis:r.sis, U:Ur, cos:x.cos, L:r.L, malz:'cu', yal:'pvc', yontem:v.yontem, T:v.T, grup:v.grup, gdSinir:+x.gd, minS:x.minS, gdOnce:anaGD});
      const s = R.sec;
      const o = {r, x, Ib, In:R.In, s, ok:!!s};
      if(s){
        const pe = peKesit(s.S), Lm = ELK.lmax({U0:230, S:s.S, Spe:pe, malz:'cu', Ia:ELK.egriKat[x.egri] * R.In});
        o.Lm = Lm; o.pe = pe;
        if(r.L > Lm && v.sebeke === 'tn') uy.push(['uyari', `${esc(r.ad)}: ${fx(r.L)} m hat, ${x.egri}${R.In} için kısa devre sınırı ${fx(Lm, 0)} m. KAR şart / kesit büyüt.`]);
      } else uy.push(['hata', `${esc(r.ad)}: uygun kesit bulunamadı (güç veya boy fazla).`]);
      if(r.tur === 'priz' && R.In > 16) uy.push(['uyari', `${esc(r.ad)}: priz linyesi 16 A’i aşıyor; linyeyi böl.`]);
      sonuc.push(o);
    });
    // Faz dağılımı
    const fd = fazDagit(sonuc.map(o => ({ad:o.r.ad, P:o.r.w, faz:o.r.sis === '3f' ? '3f' : 'oto'})), v.sis);
    // Malzeme listesi
    const sig = {}, kab = {}, kar = {};
    const ekle = (o, k, n) => { o[k] = (o[k] || 0) + n; };
    const tekDamar = v.yontem === 'B1' || v.yontem === 'A1';
    sonuc.forEach(o => {
      if(!o.s) return;
      ekle(sig, `${o.x.egri}${o.In} · ${o.r.sis === '3f' ? '3P' : '1P'}`, 1);
      const Lt = o.r.L * 1.1 + 2, dam = o.r.sis === '3f' ? 5 : 3;
      if(tekDamar) ekle(kab, `H07V-U (NYA) ${tr(o.s.S)} mm²`, Lt * dam);
      else ekle(kab, `NYM ${dam}×${tr(o.s.S)} mm²`, Lt);
      ekle(kar, `${o.r.sis === '3f' ? '4P' : '2P'} 40 A 30 mA Tip ${o.x.kar}`, 1);
    });
    const anaDam = v.sis === '3f' ? 5 : 3;
    ekle(kab, `NYM/NYY ${anaDam}×${tr(ana.sec.S)} mm² (ana hat)`, v.Lana * 1.1 + 2);
    const karSat = Object.keys(kar).sort().map(t => [`Kaçak akım rölesi ${t}`, Math.ceil(kar[t] / (t.startsWith('4P') ? 1 : 3)) + ' adet', `${kar[t]} linye${t.startsWith('4P') ? '' : ' (en çok 3 linye/röle)'}`]);
    if(v.sis === '3f') karSat.push(['Ana giriş KAR 4P 300 mA S (seçici)', '1 adet', 'yangın + seçicilik']);
    const malzeme = [[`Ana şalter ${v.sis === '3f' ? '3P' : '1P+N'} C${ana.In}`, '1 adet', 'eşzamanlı akım ' + fx(Ie, 1) + ' A']]
      .concat(Object.keys(sig).sort().map(k => ['MCB ' + k, sig[k] + ' adet', '']))
      .concat(karSat)
      .concat(Object.keys(kab).map(k => [k, fx(Math.ceil(kab[k]), 0) + ' m', '']));
    const modul = Object.keys(sig).reduce((a, k) => a + sig[k] * (k.endsWith('3P') ? 3 : 1), 0) + (v.sis === '3f' ? 3 : 2) + karSat.reduce((a, s) => a + parseInt(s[1]) * (/4P/.test(s[0]) ? 4 : 2), 0);
    malzeme.push(['Pano (sıva altı/üstü)', Math.ceil(modul * 1.25 / 12) * 12 + ' modül', `${modul} modül dolu + %25 yedek`]);
    const ok = sonuc.filter(o => o.ok).length;
    const linTab = sonuc.map((o, i) => [esc(o.r.ad), fx(o.r.w) + ' W', fx(o.Ib, 1) + ' A', o.s ? `${o.x.egri}${o.In}` : '—', o.s ? tr(o.s.S) + ' mm²' : '—',
      o.s && o.s.g ? `<span class="${o.s.top > +o.x.gd ? 'k' : 'y'}">${yuz(o.s.top)}</span>` : '—', fd.at[i] || 'L1', 'Tip ' + o.x.kar]);
    const res = {
      ust:v.ad ? `<div style="font-size:12px;color:var(--text3);margin-bottom:8px">📋 ${esc(v.ad)}</div>` : '',
      ana:[{ad:'Kurulu güç', d:fx(Pk / 1000, 2), b:'kW', r:'purple'}, {ad:'Eşzamanlı', d:fx(Pe / 1000, 2), b:'kW', r:'mg', alt:fx(Ie, 1) + ' A'}, {ad:'Ana şalter', d:'C' + ana.In, r:'amber', alt:v.sis === '3f' ? '3 kutup' : '1 kutup + N'}, {ad:'Ana hat', d:tr(ana.sec.S), b:'mm²', r:'cy', alt:`GD ${yuz(anaGD)} · ${fx(v.Lana)} m`}],
      uyari:[ok === sonuc.length && !uy.some(u => u[0] !== 'bilgi') ? ['ok', 'Tüm linyeler sigorta, kesit, gerilim düşümü ve kısa devre koşullarını sağlıyor.'] : null].concat(uy),
      tablolar:[
        {baslik:'Linyeler', bas:['Linye','Güç','Ib','Sigorta','Kesit','GD (toplam)','Faz','KAR'], sat:linTab, sag:[1, 2]},
        v.sis === '3f' ? {baslik:'Faz yükleri (kurulu)', bas:['Faz','Güç','Akım'], sat:fd.L.map((p, j) => ['L' + (j + 1), fx(p) + ' W', fx(p / (Uf * cosO), 1) + ' A']), sag:[1, 2]} : null,
        {baslik:'Malzeme listesi', bas:['Malzeme','Miktar','Not'], sat:malzeme}
      ].filter(Boolean)
    };
    res.metinEk = '— LİNYELER —\n' + sonuc.map((o, i) => `${o.r.ad}: ${fx(o.r.w)} W · ${o.s ? `${o.x.egri}${o.In} · ${tr(o.s.S)} mm² · GD ${o.s.g ? yuz(o.s.top) : '—'}` : 'kesit yok'} · ${fd.at[i] || 'L1'}`).join('\n') +
      '\n\n— MALZEME —\n' + malzeme.map(m => `${duz(m[0])}: ${m[1]}`).join('\n');
    return res;
  }
});

const JEN_TUR = {
  r:{ad:'Rezistif (ısıtıcı, ütü, termosifon)', k:1, cos:1}, l:{ad:'LED aydınlatma', k:1, cos:0.9}, e:{ad:'Elektronik (TV, PC, modem, kamera)', k:1, cos:0.9},
  b:{ad:'Buzdolabı / derin dondurucu', k:3, cos:0.8}, k:{ad:'Klima (on/off)', k:3, cos:0.85}, ki:{ad:'Klima (inverter)', k:1.2, cos:0.95},
  h:{ad:'Hidrofor / santrifüj pompa', k:4, cos:0.8}, d:{ad:'Dalgıç pompa (direkt yol verme)', k:6, cos:0.8}, m:{ad:'Motor (direkt yol verme)', k:6, cos:0.8},
  y:{ad:'Motor (yıldız-üçgen)', k:2.5, cos:0.8}, s:{ad:'Motor (sürücü / soft starter)', k:1.5, cos:0.9}, c:{ad:'Hava kompresörü', k:5, cos:0.8}, w:{ad:'Kaynak makinesi (inverter)', k:1.5, cos:0.7}
};
const JEN_1F = [1, 2, 2.8, 3.5, 5, 6.5, 7.5, 9, 11, 13.5];
const JEN_3F = [9, 12, 16, 20, 25, 30, 40, 50, 66, 80, 100, 135, 165, 200, 250, 300, 400, 500, 630, 800, 1000];
arac({
  id:'jenerator', kat:'kaynak', ikon:'⛽', ad:'Jeneratör Seçimi', yeni:true,
  aciklama:'Kalkış akımları, eşzamanlılık, sıcaklık ve rakım düşümü, faz dengesi, yakıt tüketimi ve çıkış kablosu.',
  etiket:['jeneratör','generator','kva','dizel','benzinli','ats','kalkış akımı','yakıt','yedek güç','elektrik kesintisi'],
  alanlar:[
    {k:'tip', ad:'Jeneratör', t:'seg', s:[['1f','Tek faz (230 V)'],['3f','Üç faz (400 V)']], v:'1f'},
    {k:'yakit', ad:'Yakıt', t:'seg', s:[['benzin','Benzinli'],['dizel','Dizel']], v:'dizel'},
    {k:'yuk', ad:'Beslenecek yükler', t:'liste', ekle:'Yük ekle', sutSayi:5, enaz:1, enazMesaj:'En az bir yük ekle',
      sut:[{k:'ad', ad:'Cihaz', t:'metin', ph:'adı'}, {k:'w', ad:'Güç', t:'sayi', birim:'W'}, {k:'adet', ad:'Adet', t:'sayi', v:1}, {k:'tur', ad:'Tür (kalkış)', t:'sec', s:Object.keys(JEN_TUR).map(k => [k, `${JEN_TUR[k].ad} ×${tr(JEN_TUR[k].k)}`])}, {k:'faz', ad:'Faz', t:'sec', s:[['oto','Oto'],['L1','L1'],['L2','L2'],['L3','L3'],['3f','3 faz']]}],
      ornek:[{ad:'Buzdolabı', w:150, adet:1, tur:'b'}, {ad:'Aydınlatma', w:200, adet:1, tur:'l'}, {ad:'TV + modem', w:200, adet:1, tur:'e'}, {ad:'Hidrofor', w:750, adet:1, tur:'h'}, {ad:'Klima 12k inverter', w:1100, adet:1, tur:'ki'}],
      hazir:[{ad:'🧊 Buzdolabı', v:{ad:'Buzdolabı', w:150, tur:'b'}}, {ad:'💧 Hidrofor', v:{ad:'Hidrofor', w:750, tur:'h'}}, {ad:'🕳 Dalgıç pompa', v:{ad:'Dalgıç pompa', w:1500, tur:'d'}}, {ad:'❄️ Klima', v:{ad:'Klima 12k', w:1100, tur:'k'}}, {ad:'🚿 Termosifon', v:{ad:'Termosifon', w:2000, tur:'r'}}, {ad:'💻 Elektronik', v:{ad:'Bilgisayar', w:300, tur:'e'}}, {ad:'🔩 Kompresör', v:{ad:'Kompresör', w:2200, tur:'c'}}]},
    {k:'es', ad:'Eşzamanlı çalışma', t:'sayi', birim:'%', v:100, min:10, max:100, ipucu:'hepsi aynı anda = 100'},
    {k:'tol', ad:'Kalkışta kabul edilen gerilim çökmesi', t:'sec', s:[['1','Hassas · ≈%15 (elektronik ağırlıklı)'],['1.5','Normal · ≈%25'],['2','Esnek · ≈%35 (yalnız motor/ısıtıcı)']], v:'1.5', tam:true},
    {k:'yuklenme', ad:'Hedef sürekli yükleme', t:'sayi', birim:'%', v:80, min:40, max:100},
    {k:'T', ad:'Ortam sıcaklığı', t:'sayi', birim:'°C', v:40, neg:true, ipucu:'yaz Muğla'},
    {k:'H', ad:'Rakım', t:'sayi', birim:'m', v:50, sifir:true},
    {k:'depo', ad:'Yakıt deposu', t:'sayi', birim:'L', bos:true, ph:'ops.'},
    {k:'L', ad:'Jeneratör → pano kablosu', t:'sayi', birim:'m', bos:true, ph:'ops.'}
  ],
  bilgi:'Hesap: çalışma gücü + en büyük motorun kalkış fazlası (tek tek yol verildiği kabulü). Sıcaklık 25°C üstü her 5°C için ≈%2,5, rakım 1000 m üstü her 100 m için ≈%1 güç düşümü alınır. Kesin seçim için üretici kalkış (kVA) eğrisine bak. Jeneratör mutlaka komütatör veya ATS ile bağlanmalı; şebekeye geri besleme hat ekiplerini öldürebilir.',
  hesap(v){
    const tipK = v.tip === '3f';
    const es = v.es / 100;
    const sat = v.yuk.map((r, i) => { const t = JEN_TUR[r.tur] || JEN_TUR.r; const adet = isNaN(r.adet) ? 1 : r.adet; const kva1 = r.w / t.cos / 1000; return {ad:r.ad || ('Yük ' + (i + 1)), t, adet, P:r.w * adet, kva:kva1 * adet, kva1, ek:(t.k - 1) * kva1, faz:r.faz}; });
    if(!tipK && sat.some(x => x.faz === '3f')) return {hata:'Listede 3 fazlı yük var: üç fazlı jeneratör seç.'};
    const Pc = sat.reduce((a, x) => a + x.P, 0) * es / 1000;
    const Sc = sat.reduce((a, x) => a + x.kva, 0) * es;
    const enB = sat.reduce((m, x) => x.ek > m.ek ? x : m, {ek:0, ad:'—'});
    const tepe = Sc + enB.ek;
    const dT = Math.max(0, v.T - 25) / 5 * 0.025, dH = Math.max(0, v.H - 1000) / 100 * 0.01;
    const kD = (1 - dT) * (1 - dH);
    let gerek = Math.max(Sc / (v.yuklenme / 100), tepe / +v.tol) / kD;
    let fazBilgi = null;
    if(tipK){
      const fd = fazDagit(sat.map(x => ({ad:x.ad, P:x.kva * es * 1000, faz:x.faz})), '3f');
      const enFaz = Math.max(...fd.L) / 1000;
      const fazGerek = 3 * enFaz / (v.yuklenme / 100) / kD;
      if(fazGerek > gerek) gerek = fazGerek;
      fazBilgi = {fd, enFaz};
    }
    const liste = tipK ? JEN_3F : JEN_1F;
    let secim = liste.find(x => x >= gerek - 1e-9);
    const uy = [];
    if(!secim){ secim = null; uy.push(['hata', `${fx(gerek, 1)} kVA tek fazlı jeneratör aralığını aşıyor: üç fazlı dizel seç.`]); }
    const kW = secim ? secim * 0.8 : gerek * 0.8;
    const lf = Math.min(1, Pc / kW);
    const lh = v.yakit === 'dizel' ? kW * (0.06 + 0.24 * lf) : kW * (0.12 + 0.38 * lf);
    const U = tipK ? 400 : 230, Ir = (secim || gerek) * 1000 / (tipK ? Math.sqrt(3) * U : U);
    if(v.yakit === 'benzin' && (secim || gerek) > 9) uy.push(['bilgi', '9 kVA üstünde dizel jeneratör daha ekonomik ve uzun ömürlüdür.']);
    if(sat.some(x => x.t === JEN_TUR.e) && (secim || gerek) <= 5) uy.push(['bilgi', 'Elektronik yükler için inverter jeneratör veya AVR’li model seç; basit karbüratörlü jeneratörde gerilim/frekans dalgalanır.']);
    if(lf < 0.3) uy.push(['uyari', `Yükleme %${tr(lf * 100, 0)}: dizel uzun süre düşük yükte çalışırsa kurum yapar (wet stacking). Daha küçük jeneratör veya yük bankası düşün.`]);
    if(dT > 0 || dH > 0) uy.push(['bilgi', `Ortam/rakım nedeniyle güç ${yuz((1 - kD) * 100, 1)} düşürüldü.`]);
    uy.push(['uyari', 'Bağlantı mutlaka komütatör (1-0-2) veya ATS ile yapılmalı; nötr ve topraklama jeneratörde ayrıca düzenlenmeli.']);
    let kab = null;
    if(!isNaN(v.L)){
      const R = ELK.kabloSec({Ib:Ir, sis:tipK ? '3f' : '1f', U, cos:0.8, L:v.L, malz:'cu', yal:'pvc', yontem:'C', T:Math.max(30, v.T), grup:1, gdSinir:3, minS:2.5});
      if(R.sec) kab = [`Çıkış kablosu (${fx(v.L)} m)`, `${kabloTanim(R.sec.S, tipK ? '3f' : '1f', 'C', 'cu')} · ${R.sec.g ? yuz(R.sec.g.yuzde) : ''}`];
    }
    return {
      ana:[
        {ad:'Önerilen jeneratör', d:secim ? fx(secim, 1) : '—', b:'kVA', r:'mg', alt:`hesap: ${fx(gerek, 2)} kVA · ${tipK ? '3 faz' : '1 faz'} ${v.yakit === 'dizel' ? 'dizel' : 'benzinli'}`},
        {ad:'Çalışma yükü', d:fx(Pc, 2), b:'kW', r:'cy', alt:fx(Sc, 2) + ' kVA'},
        {ad:'Kalkış anı tepe', d:fx(tepe, 2), b:'kVA', r:'amber', alt:'en büyük: ' + esc(enB.ad)},
        {ad:'Yakıt', d:fx(lh, 2), b:'L/saat', r:'green', alt:!isNaN(v.depo) ? `depo ≈ ${fx(v.depo / lh, 1)} saat` : `%${tr(lf * 100, 0)} yükte`}
      ],
      satir:[['Anma akımı', fx(Ir, 1) + ' A'], ['Çıkış sigortası', 'C' + (ELK.sigortaSec(Ir) || '—')], kab, fazBilgi ? ['En yüklü faz', fx(fazBilgi.enFaz, 2) + ' kVA (jeneratörün 1/3’ünü aşmamalı)'] : null, ['Güç düşüm katsayısı', fx(kD, 3)]],
      uyari:uy,
      tablo:{baslik:'Yükler', bas:['Cihaz','Çalışma','Kalkış (bir adet)'].concat(fazBilgi ? ['Faz'] : []), sat:sat.map((x, i) => [esc(x.ad) + (x.adet > 1 ? ' ×' + fx(x.adet, 0) : ''), fx(x.kva, 2) + ' kVA', fx(x.kva1 * x.t.k, 2) + ' kVA'].concat(fazBilgi ? [fazBilgi.fd.at[i]] : [])), sag:[1, 2]},
      adim:[`Çalışma S = Σ(P / cosφ) × eşzamanlılık = ${fx(Sc, 3)} kVA`, `Tepe = çalışma + en büyük kalkış fazlası (${esc(enB.ad)}: +${fx(enB.ek, 2)}) = ${fx(tepe, 3)} kVA`, `Gerekli = max(${fx(Sc, 2)} / ${fx(v.yuklenme / 100, 2)} ; ${fx(tepe, 2)} / ${v.tol}) / ${fx(kD, 3)} = ${fx(gerek, 2)} kVA`, `Yakıt ≈ ${v.yakit === 'dizel' ? 'kW × (0,06 + 0,24 × yük oranı)' : 'kW × (0,12 + 0,38 × yük oranı)'} = ${fx(lh, 2)} L/saat`]
    };
  }
});

arac({
  id:'ups', kat:'kaynak', ikon:'🔋', ad:'UPS ve Akü Süresi', yeni:true,
  aciklama:'Bu akü bu yükü kaç saat taşır, ya da istenen süre için kaç Ah gerekir? Peukert etkisi ve deşarj derinliği dahil.',
  etiket:['ups','akü','batarya','süre','ah','peukert','kesintisiz güç','inverter','lifepo4','agm','jel'],
  alanlar:[

    {k:'tip', ad:'Akü tipi', t:'seg', s:[['pb','Kurşun-asit / AGM / jel'],['li','LiFePO4']], v:'pb'},

    {k:'eta', ad:'İnverter verimi', t:'sayi', birim:'%', v:88, min:50, max:99},
    {k:'yas', ad:'Yaşlanma payı (%80 kapasite kabul et)', t:'onay', v:true}
  ],
  bilgi:'Kurşun-asit akünün kapasitesi akım arttıkça düşer (Peukert, k≈1,15); 7–9 Ah UPS aküleri yüksek yükte etiket değerinin yarısını bile veremez. LiFePO4’te bu etki çok küçüktür. Kurşun-asidi her gün %50’nin altına indirmek ömrünü ciddi kısaltır.',
  hesap(v){
    const pb = v.tip === 'pb', k = pb ? 1.15 : 1.03, H = 20;
    const dod = pb ? (v.kul === 'acil' ? 0.8 : 0.5) : (v.kul === 'acil' ? 0.95 : 0.85);
    const f = v.yas ? 0.8 : 1, eta = v.eta / 100;

    if(v.mod === 'sure'){
      const C = v.Ah * v.par;

      if(pb && cr > 0.25) uy.push(['uyari', `Deşarj hızı ${fx(cr, 2)}C yüksek; kurşun-asitte kapasite belirgin düşer ve akü ısınır.`]);
      return {
        ana:[{ad:'Çalışma süresi', d:t >= 1 ? `${Math.floor(t)} sa ${Math.round((t % 1) * 60)} dk` : `${Math.round(t * 60)} dk`, r:'green', alt:`%${tr(dod * 100, 0)} deşarja kadar${v.yas ? ', yaşlanma payıyla' : ''}`}, {ad:'Akü akımı', d:fx(I, 1), b:'A', r:'cy', alt:fx(cr, 2) + 'C'}, {ad:'Akü bankası', d:fx(Vdc) + ' V · ' + fx(C), b:'Ah', r:'mg', alt:fx(Vdc * C / 1000, 2) + ' kWh'}],
        satir:[['Peukert katsayısı', fx(k, 2)], ['Toplam blok', `${fx(v.seri * v.par, 0)} adet (${fx(v.seri, 0)} seri × ${fx(v.par, 0)} paralel)`], ['Tavsiye şarj akımı', `${fx(C * (pb ? 0.1 : 0.3), 0)} A (${pb ? '0,1C' : '0,3C'})`]],
        uyari:uy, adim:[`I = P / (V × η) = ${fx(v.P)} / (${fx(Vdc)} × ${fx(eta, 2)}) = ${fx(I, 2)} A`, `t = H × (C / (I × H))^k = 20 × (${fx(C)} / (${fx(I, 2)} × 20))^${k} = ${fx(tTam, 2)} sa (tam deşarj)`, `Kullanılabilir = ${fx(tTam, 2)} × ${fx(dod, 2)} (deşarj) × ${fx(f, 1)} = ${fx(t, 2)} sa`]
      };
    }
    const C = I * H * Math.pow(v.t / (H * dod * f), 1 / k);
    const par = Math.ceil(C / v.Ah - 1e-9);
    return {
      ana:[{ad:'Gereken kapasite', d:fx(C, 0), b:'Ah', r:'mg', alt:`${fx(Vdc)} V sistemde`}, {ad:'Blok sayısı', d:fx(v.seri * par, 0), b:'adet', r:'amber', alt:`${fx(v.seri, 0)} seri × ${par} paralel · ${fx(v.Vb)} V ${fx(v.Ah)} Ah`}, {ad:'Enerji', d:fx(Vdc * v.Ah * par / 1000, 2), b:'kWh', r:'cy'}],
      uyari:uy.concat(par > 4 ? [['bilgi', '4’ten fazla paralel dizi akımı dengesiz paylaştırır; daha büyük Ah’lı blok seç.']] : []),
      adim:[`C = I × H × (t / (H × DoD × f))^(1/k) = ${fx(I, 2)} × 20 × (${fx(v.t)} / (20 × ${fx(dod, 2)} × ${fx(f, 1)}))^(1/${k}) = ${fx(C, 1)} Ah`]
    };
  }
});
