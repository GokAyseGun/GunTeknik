<style>
.ix-h{--kr:var(--amber);--kr-lt:var(--amber-lt);--kr-md:var(--amber-md);}
.ix-s{--kr:var(--mg);--kr-lt:var(--mg-lt);--kr-md:var(--mg-md);}
.ix-t{--kr:var(--cy);--kr-lt:var(--cy-lt);--kr-md:var(--cy-md);}
.ix-z{--kr:var(--purple);--kr-lt:var(--purple-lt);--kr-md:var(--purple-md);}
/* Karşılama */
.ix-hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:18px 16px 14px;margin-bottom:14px;animation:ekIn .4s var(--ease) both;}
.ix-hero::before{content:'';position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--mg-lt),transparent 70%);pointer-events:none;}
.ix-hero h2{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.1;}
.ix-hero p{font-size:12.5px;color:var(--text2);margin-top:4px;max-width:520px;}
.ix-rozetler{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;}
.ix-rozet{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);}
.ix-rozet.iyi{color:var(--green);background:var(--green-lt);border-color:var(--green-md);}
.ix-rozet.bekle{color:var(--amber);background:var(--amber-lt);border-color:var(--amber-md);}
.ix-rozet.kotu{color:var(--red);background:var(--red-lt);border-color:var(--red-md);}
.ix-rozet button{font-size:11px;font-weight:700;color:inherit;text-decoration:underline;padding:0 0 0 4px;}
/* Bölüm kartları */
.ix-bolumler{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;}
.ix-bolum{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:15px 15px 13px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);animation:ekIn .4s var(--ease) both;}
.ix-bolum::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kr);}
.ix-bolum:hover{transform:translateY(-2px);border-color:var(--kr-md);box-shadow:var(--shadow-sm);}
.ix-bolum:active{transform:scale(.98);}
.ix-bolum .ust{display:flex;align-items:center;gap:12px;}
.ix-bolum .ikon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--kr-lt);border:1px solid var(--kr-md);flex-shrink:0;}
.ix-bolum h3{font-size:17px;font-weight:700;letter-spacing:-.4px;}
.ix-bolum .sayi{font-family:var(--fm);font-size:12px;color:var(--kr);font-weight:700;}
.ix-bolum .ac{font-size:12px;color:var(--text3);line-height:1.45;}
.ix-bolum .ok{position:absolute;right:14px;top:16px;color:var(--text3);font-size:15px;}
/* Kartlar ve arama sonuçları */
.ix-kart{position:relative;padding-right:46px;}
.ix-kart .ek-arac-ac{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ix-kart .ek-fav-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;font-size:15px;}
.ix-kart .ek-fav-btn:active{transform:translateY(-50%) scale(.88);}
.ix-tur{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--kr-lt);color:var(--kr);margin-right:6px;vertical-align:1px;}
.ix-kart mark,.ix-terim mark{background:var(--amber-lt);color:inherit;border-radius:3px;padding:0 1px;}
.ix-grup-bas{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;}
.ix-grup-bas::after{content:'';flex:1;height:1px;background:var(--border);}
.ix-daha{margin-top:8px;}
.ix-terim{display:block;padding:11px 13px;border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:var(--r-md);background:var(--surface);transition:border-color .25s var(--ease);}
.ix-terim:hover{border-color:var(--purple-md);border-left-color:var(--purple);}
.ix-terim b{font-size:13.5px;}
.ix-terim span{display:block;font-size:11.5px;color:var(--text3);margin-top:2px;line-height:1.4;}
.ix-bos{padding:18px 14px;border:1px dashed var(--border2);border-radius:var(--r-md);color:var(--text3);font-size:12.5px;text-align:center;}
.ix-ipucu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.ix-alt{margin-top:26px;text-align:center;font-size:11px;color:var(--text3);line-height:1.6;}
</style>

 (alt) ve C (ortak) sondalarla depo doldurma veya kuyu kuru çalışma koruması. Mod seçiciyle iki uygulamayı da dene.","seviye rölesi sıvı seviye rölesi elektrot sonda h l c depo doldurma kuyu kuru çalışma dalgıç pompa flotörsüz",1],["termistor_role","PTC Termistör Motor Koruma Rölesi","🌡️","role","Motor sargısına gömülü PTC sensör aşırı ısınmayı doğrudan ölçer. Fan tıkanması, sık kalkış, yüksek ortam sıcaklığında termiğin göremediğini görür.","termistör rölesi ptc rölesi motor sıcaklık koruma t1 t2 sargı sensörü frekans sürücülü motor fail safe",1]]},"t":{"kat":[["temel","Temel Elektrik","⚡"],["ac","Alternatif Akım","〰️"],["ucfaz","Üç Fazlı Sistemler","🔺"],["tesisat","Tesisat Hesap Teorisi","📐"],["guvenlik","Güvenlik","🦺"],["koruma","Koruma Cihazları","🛡️"],["topraklama","Topraklama","🌍"],["makine","Makineler","⚙️"],["aydinlatma","Aydınlatma","💡"],["elektronik","Elektronik ve Akü","🔋"],["gunes","Güneş Enerjisi","☀️"],["klima","Klima ve Soğutma","❄️"],["pompa","Pompa ve Su","💧"],["zayif","Zayıf Akım ve Haberleşme","📡"],["olcum","Ölçme","📏"],["mevzuat","Yönetmelik ve Standartlar","📜"]],"L":[["elektrik_nedir","Elektrik Nedir?","⚛️","temel","Atom, elektron, iletken ve yalıtkan: her şeyin başladığı yer.","elektron atom iletken yalıtkan yarı iletken elektrik yükü coulomb",1],["gerilim","Gerilim (Volt)","🔋","temel","Elektronları iten basınç: iki nokta arasındaki potansiyel farkı.","gerilim voltaj volt potansiyel farkı 230 v 400 v u",1],["akim","Akım (Amper)","⚡","temel","Kablodan saniyede geçen elektrik yükü miktarı.","akım amper a ma akım yönü yük akımı",1],["direnc","Direnç ve Özdirenç","〰️","temel","Akıma karşı koyma. Kablo uzadıkça ve inceldikçe direnç artar.","direnç ohm özdirenç rho kablo direnci iletkenlik sıcaklık katsayısı",1],["ohm","Ohm Kanunu","📐","temel","U = I × R: gerilim, akım ve direncin temel ilişkisi.","ohm kanunu u=ir v=ir temel formül akım hesabı",1],["guc_enerji","Güç (Watt)","💪","temel","Saniyede yapılan iş: cihazın ne kadar “güçlü” olduğu.","güç watt kw beygir hp p=ui verim",1],["enerji_fatura","Enerji (kWh) ve Fatura Hesabı","🧾","temel","Güç × süre = enerji. Faturada ödenen kilovatsaattir.","kwh kilovatsaat enerji fatura tüketim sayaç joule",1],["seri_paralel","Seri ve Paralel Bağlantı","🔗","temel","Evdeki her şey paraleldir; anahtar ve sigorta ise seri.","seri paralel eşdeğer direnç seri bağlantı paralel bağlantı",1],["kirchhoff","Kirchhoff Kanunları","🔄","temel","Düğüme giren akım çıkan akıma eşittir; kapalı çevrede gerilimlerin toplamı sıfırdır.","kirchhoff düğüm çevre kak kgk akım kanunu gerilim kanunu",2],["joule","Joule Isınması (I²R)","🌡️","temel","Akım iki katına çıkarsa ısı dört katına çıkar. Kablo ve klemens yangınlarının fiziği.","joule ısınma i2r kablo kaybı temas direnci yangın",1],["dc_ac","Doğru Akım (DC) ve Alternatif Akım (AC)","🔀","temel","Akü DC verir, şebeke AC. Farkları ve neden şebekede AC kullanıldığı.","dc ac doğru akım alternatif akım 50 hz sinüs",1],["kisa_devre","Kısa Devre, Açık Devre, Kaçak","💥","temel","Üç temel arıza: akım yolunun kısalması, kopması ve kaçması.","kısa devre açık devre kaçak arıza toprak kaçağı kopukluk",1],["manyetizma","Elektromanyetizma ve Endüksiyon","🧲","temel","Akım manyetik alan yaratır; değişen manyetik alan gerilim üretir. Motor, trafo, röle bu ikiliyle çalışır.","manyetik alan elektromıknatıs endüksiyon faraday lenz fleming sağ el kuralı sol el kuralı",2],["sinus_rms","Sinüs, Frekans ve Efektif (RMS) Değer","〰️","ac","Şebeke 230 V derken efektif değer kastedilir; tepe değer 325 V’tur.","sinüs frekans periyot 50 hz efektif değer rms tepe değer 325 v",1],["faz_farki","Faz Farkı (Akım ile Gerilim Arasındaki Kayma)","🔁","ac","Motor ve bobinde akım gerilimden geride, kondansatörde ileridedir.","faz farkı faz açısı fi φ endüktif kapasitif omik geride ileride",2],["bobin","Bobin, Endüktans ve Endüktif Reaktans","🌀","ac","Bobin akımdaki değişime karşı koyar; frekans arttıkça daha çok zorlar.","bobin endüktans henry reaktans xl şok bobini balast endüktif",2],["kondansator","Kondansatör, Kapasitans ve Kapasitif Reaktans","🔋","ac","Kondansatör yük depolar; AC’de akım geçirir, DC’yi keser.","kondansatör kapasitans farad mikrofarad µf xc kapasitif motor kondansatörü",2],["empedans","Empedans (Z)","🧮","ac","AC’de direnç ve reaktansın birleşik etkisi: akımı sınırlayan toplam “engel”.","empedans z reaktans direnç döngü empedansı vektör",3],["guc_turleri","Aktif, Reaktif ve Görünür Güç","📊","ac","W, VAr ve VA: neden jeneratör kVA, motor kW ile anılır?","aktif güç reaktif güç görünür güç kw kvar kva güç üçgeni",2],["cosfi","Güç Faktörü (cos φ) ve Kompanzasyon","⚖️","ac","Düşük cos φ = gereksiz akım, ısınan kablo, reaktif ceza. Çözüm: kondansatör.","kompanzasyon cosfi güç faktörü reaktif ceza kondansatör reaktif güç rölesi kvar",2],["harmonik","Harmonikler","📈","ac","Elektronik yükler sinüsü bozar: nötr ısınır, KAR ve kompanzasyon şaşırır.","harmonik thd 3. harmonik nötr ısınması bozuk sinüs smps led sürücü",3],["rezonans","Rezonans","🎵","ac","Bobin ve kondansatör belli bir frekansta birbirini tamamlar; akım veya gerilim aşırı büyür.","rezonans rezonans frekansı lc devresi kompanzasyon rezonansı detuned",3],["neden_3faz","Neden Üç Faz?","🔺","ucfaz","Aynı bakırla daha çok güç, motorlar için döner alan, sürekli güç akışı.","üç faz trifaze 3 faz l1 l2 l3 monofaze neden üç faz",1],["faz_hat","Faz ve Hat Gerilimi (230 / 400 V, √3)","📏","ucfaz","Faz–nötr 230 V, faz–faz 400 V. Aradaki çarpan √3 ≈ 1,73.","230 400 √3 kök 3 faz gerilimi hat gerilimi fazlar arası 1.73",1],["yildiz_ucgen_iliski","Yıldız (Y) ve Üçgen (Δ) Bağlantı","⭐","ucfaz","Yıldızda sargıya 230 V, üçgende 400 V düşer. Akım ilişkileri ve motor bağlantısı.","yıldız üçgen y delta δ motor bağlantısı sargı gerilimi hat akımı",2],["uc_faz_guc","Üç Fazlı Güç ve Akım Hesabı","🧮","ucfaz","P = √3 × U × I × cos φ. Üç faz motorun akımını sahada hızlıca bulmak.","üç faz güç trifaze akım √3 kw başına amper motor akımı 400 v akım",1],["dengesiz_yuk","Dengesiz Yük ve Nötr Akımı","⚖️","ucfaz","Fazlar eşit yüklenmezse nötrden akım geçer. Daireler fazlara dengeli dağıtılmalı.","dengesiz yük nötr akımı faz dengesi yük dağıtımı asimetri",2],["notr_kopmasi","Nötr Kopması — Evde 400 V Tehlikesi","✂️","ucfaz","Üç fazlı beslemede nötr koparsa az yüklü fazdaki cihazlar yanar. Arızanın mantığı ve belirtileri.","nötr kopması nötr kaçağı 400 v cihaz yanması yüksek gerilim yıldız noktası kayması",2],["faz_sirasi_teori","Faz Sırası ve Döner Alan","🔁","ucfaz","L1-L2-L3 sırası motorun dönüş yönünü belirler; iki faz yer değiştirince yön döner.","faz sırası döner alan sağ dönüş motor yönü faz sırası rölesi",2],["kablo_kapasite","Kablo Akım Taşıma Kapasitesi","📏","tesisat","Bir kablo ne kadar akım taşır? Döşeme şekli, sıcaklık ve yan yana kablo sayısı belirler.","akım taşıma iz kablo kesiti düzeltme katsayısı gruplama ortam sıcaklığı kesit tablosu mm2 amper",1],["gerilim_dusumu","Gerilim Düşümü","📉","tesisat","Uzun ve ince kabloda gerilim kaybolur. Sınır: aydınlatma/priz %1,5, motor %3.","gerilim düşümü %1,5 %3 uzun hat kesit hesabı k=56",2],["dongu_empedansi","Kısa Devre Akımı ve Döngü Empedansı (Zs)","🔁","tesisat","Arıza anında sigortanın 0,4 saniyede atması için hat empedansı yeterince küçük olmalı.","döngü empedansı zs kısa devre akımı 0,4 s açma süresi otomatik kesme tn sistemi",3],["sigorta_kosulu","Sigorta–Kablo Uyumu (I<sub>b</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub>)","🧷","tesisat","Sigorta kabloyu korur, cihazı değil. Yük akımı, sigorta ve kablo kapasitesi arasındaki altın kural.","ib in iz sigorta seçimi kablo koruma 1,45 aşırı yük koruması",2],["selektivite","Seçicilik (Selektivite)","🪜","tesisat","Arızada sadece arızalı devrenin sigortası atmalı, ana şalter değil.","selektivite seçicilik kademelendirme ana şalter s tipi kar ardışık koruma",3],["esz_talep","Kurulu Güç, Eşzamanlılık ve Talep Gücü","🏢","tesisat","Evdeki her cihaz aynı anda çalışmaz. Ana sigorta ve kolon hattı talep gücüne göre seçilir.","eşzamanlılık talep gücü kurulu güç %60 %40 8 kw apartman hesabı ['h','s','t'].forEach(t => { const K = {}; IDX[t].kat.forEach(k => K[k[0]] = k);
  IDX[t].L.forEach(x => { const o = {t, id:x[0], ad:x[1], ikon:x[2], kat:x[3], ac:x[4], katAd:(K[x[3]] || [])[1] || ''};

const vurgula = (metin, P) => { let h = esc(metin); if(!P.length) return h;
  const nm = nrm(metin); const isaret = new Array(metin.length).fill(false);
  P.forEach(p => { let i = nm.indexOf(p); while(i >= 0 && p){ for(let j = i; j < i + p.length && j < metin.length; j++) isaret[j] = true; i = nm.indexOf(p, i + p.length); } });
  if(nm.length !== metin.length) return h;
  let out = '', ac = false; for(let i = 0; i < metin.length; i++){ if(isaret[i] && !ac){ out += '<mark>'; ac = true; } if(!isaret[i] && ac){ out += '</mark>'; ac = false; } out += esc(metin[i]); } return out + (ac ? '</mark>' : ''); };
const kart = (o, P) => `<a class="ek-arac-kart ix-kart ix-${o.t}" href="${href(o)}"><div class="ek-arac-ikon">${o.ikon}</div><div style="min-width:0"><div class="ek-arac-ad">${vurgula(o.ad, P || [])}</div><div class="ek-arac-ac"><span class="ix-tur">${TUR_AD[o.t]}</span>${esc(o.katAd)}${o.ac ? ' · ' + esc(o.ac) : ''}</div></div>${EK.favBtn(o.t, o.id)}</a>`;
const terimKart = (s, P) => `<a class="ix-terim" href="teori.html#${encodeURIComponent('sozluk:' + s.ad)}"><b>${vurgula(s.ad, P)}</b><span>${esc(s.ac)}</span></a>`;
const grupBas = (ikon, ad, n) => `<div class="ix-grup-bas">${ikon} ${ad}${n != null ? ' · ' + n : ''}</div>`;

/* ── Arama ── */
const ACIK = {};
function puan(o, P, tam){ let p = 0;
  for(const w of P){ const a = o.nAd.includes(w), e = o.nEt.includes(w), c = o.nAc.includes(w); if(!a && !e && !c) return 0; p += a ? 6 : e ? 3 : 1; }
  if(o.nAd.startsWith(tam)) p += 8; else if(o.nAd.includes(tam)) p += 4; return p; }
function ara(q){
  const tam = nrm(q.trim()), P = tam.split(/\s+/).filter(Boolean);
  const G = {h:[], s:[], t:[]};
  LISTE.forEach(o => { const p = puan(o, P, tam); if(p) G[o.t].push([p, o]); });
  Object.values(G).forEach(L => L.sort((a, b) => b[0] - a[0]));
  const Z = TERIM.map(s => { let p = 0; for(const w of P){ if(s.nAd.includes(w)) p += 5; else if(s.nAc.includes(w)) p += 1; else return [0, s]; } if(s.nAd.startsWith(tam)) p += 6; return [p, s]; }).filter(x => x[0]).sort((a, b) => b[0] - a[0]);
  const toplam = G.h.length + G.s.length + G.t.length + Z.length;
  if(!toplam) return `<div class="ix-bos" style="margin-top:16px">“${esc(q)}” için sonuç yok. Farklı bir kelime dene: <b>kablo</b>, <b>röle</b>, <b>klima</b>, <b>topraklama</b>…</div>`;
  let h = `<div class="ek-bolum-baslik">🔍 ${toplam} sonuç</div>`;
  const grup = (k, ikon, ad, L, ciz) => { if(!L.length) return; const n = ACIK[k] ? L.length : Math.min(L.length, 5);
    h += grupBas(ikon, ad, L.length) + `<div class="ek-arac-izgara">${L.slice(0, n).map(x => ciz(x[1])).join('')}</div>` + (L.length > n ? `<div class="ix-daha"><button class="ek-btn kucuk" onclick="ACIK['${k}']=1;ciz()">+ ${L.length - n} sonuç daha</button></div>` : ''); };
  grup('h', '🔢', 'Hesap', G.h, o => kart(o, P)); grup('s', '📐', 'Şemalar', G.s, o => kart(o, P)); grup('t', '📘', 'Teori konuları', G.t, o => kart(o, P)); grup('z', '📖', 'Sözlük', Z, s => terimKart(s, P));
  return h;
}

/* ── Ana görünüm ── */
function bolumler(){
  const testCoz = IDX.t.kat.filter(k => EK.oku('ekt_test_' + k[0], 0) > 0).length;
  const B = [
    ['h', '🔢', 'Hesap', `${IDX.h.L.length} araç`, 'Kablo kesiti, gerilim düşümü, KAR, motor, klima BTU, pompa, güneş, uydu…'],
    ['s', '📐', 'Şemalar', `${IDX.s.L.length} şema · ${IDX.s.L.filter(x => x[6]).length} canlı`, 'Dokunarak çalışan devreler, arıza bulma, kontaktör ve röle bağlantıları.'],
    ['t', '📘', 'Teori', `${IDX.t.L.length} konu · ${IDX.t.test} test · ${IDX.t.soz.length} terim`, 'Temelden ileriye anlatım, canlı çizimler, testler ve sözlük.' + (testCoz ? ` ${testCoz}/${IDX.t.test} test çözüldü.` : '')]];
  return `<div class="ix-bolumler">${B.map(([t, ikon, ad, sayi, ac], i) => `<a class="ix-bolum ix-${t}" href="${SAYFA[t]}" style="animation-delay:${i * 60}ms"><div class="ust"><div class="ikon">${ikon}</div><div><h3>${ad}</h3><div class="sayi">${sayi}</div></div></div><div class="ac">${ac}</div><span class="ok">›</span></a>`).join('')}</div>`;
}
function anaCiz(){
  let h = bolumler();
  const F = EK.favListe().map(f => OGE[f.t + ':' + f.id]).filter(Boolean);
  h += grupBas('⭐', 'Favoriler', F.length || null) + (F.length ? `<div class="ek-arac-izgara">${F.map(o => kart(o)).join('')}</div>` : `<div class="ix-bos">Henüz favorin yok. Bir hesap, şema veya teori konusunda <b>☆</b> yıldızına dokun; burada toplanır.</div>`);
  let S = EK.oku('ekh_son_liste', []).map(x => OGE[x.t + ':' + x.id]).filter(Boolean), baslik = 'Son baktıkların';
  if(!S.length){ const hk = EK.oku('ekh_kullanim', {}), sk = EK.oku('ekh_sema_kul', {});
    S = Object.keys(hk).map(id => [hk[id], OGE['h:' + id]]).concat(Object.keys(sk).map(id => [sk[id], OGE['s:' + id]])).filter(x => x[1]).sort((a, b) => b[0] - a[0]).map(x => x[1]); baslik = 'Sık kullandıkların'; }
  if(S.length) h += grupBas('🕘', baslik) + `<div class="ek-arac-izgara">${S.slice(0, 6).map(o => kart(o)).join('')}</div>`;
  const Y = YENI.map(([t, id]) => OGE[t + ':' + id]).filter(Boolean);
  if(Y.length) h += grupBas('🆕', 'Yeni eklenenler') + `<div class="ek-arac-izgara">${Y.map(o => kart(o)).join('')}</div>`;
  h += grupBas('💡', 'Hızlı arama') + `<div class="ix-ipucu">${['kablo kesiti','kaçak akım','kontaktör','yıldız üçgen','kompresör','topraklama','inverter','uydu'].map(k => `<button class="ek-cip" onclick="hizli('${k}')">${k}</button>`).join('')}</div>`;
  return h;
}
function hizli(k){ $('ix-ara').value = k; ciz(); $('ix-ara').focus(); }
function ciz(){ const q = $('ix-ara').value; $('ix-govde').innerHTML = q.trim() ? ara(q) : anaCiz(); }
EK.favDegisti = () => { if(!$('ix-ara').value.trim()) ciz(); };

/* ── Çevrimdışı durumu ── */
const DOSYA = ['index.html','hesap.html','semalar.html','teori.html','ortak.css','ortak.js'];
async function cdKontrol(){
  const k = $('ix-rozet'); const ag = navigator.onLine ? '<span class="ix-rozet">🌐 çevrimiçi</span>' : '<span class="ix-rozet bekle">📡 şu an internet yok</span>';
  if(!('caches' in window) || !/^https?:$/.test(location.protocol)){ k.innerHTML = ag; return; }
  let n = 0; for(const d of DOSYA){ try{ if(await caches.match(new URL(d, location.href).href)) n++; }catch(e){} }
  const hazir = n === DOSYA.length;
  k.innerHTML = (hazir ? '<span class="ix-rozet iyi">✅ Çevrimdışı hazır · internetsiz açılır</span>' : `<span class="ix-rozet bekle">⏳ Çevrimdışı için indiriliyor ${n}/${DOSYA.length}<button onclick="cdIndir()">şimdi indir</button></span>`) + ag;
}
async function cdIndir(){
  EK.toast('⏳ El Kitabı indiriliyor…');
  try{ const ad = (await caches.keys()).find(x => x.startsWith('gunteknik-'));
    await Promise.all(DOSYA.map(async d => { const u = new URL(d, location.href).href; const r = await fetch(u, {cache:'reload'}); if(r.ok && ad){ const c = await caches.open(ad); await c.put(u, r.clone()); } }));
  }catch(e){ EK.toast('İndirilemedi: internet bağlantısını kontrol et'); }
  setTimeout(cdKontrol, 600);
}
window.addEventListener('online', cdKontrol); window.addEventListener('offline', cdKontrol);
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.addEventListener('controllerchange', () => setTimeout(cdKontrol, 1500)); }catch(e){} }

/* ── Başlat ── */
EK.navCiz('index'); EK.temaUygula(EK.temaAl());
$('ix-alt-baslik').textContent = `${IDX.h.L.length} hesap · ${IDX.s.L.length} şema · ${IDX.t.L.length} konu`;
let zt; $('ix-ara').addEventListener('input', () => { clearTimeout(zt); Object.keys(ACIK).forEach(k => delete ACIK[k]); zt = setTimeout(ciz, 90); });
$('ix-ara').addEventListener('keydown', e => { if(e.key === 'Enter'){ const a = $('ix-govde').querySelector('a.ek-arac-kart, a.ix-terim'); if(a) location.href = a.getAttribute('href'); } });
window.addEventListener('pageshow', () => ciz());
ciz(); cdKontrol(); setTimeout(cdKontrol, 4000);
</script>
