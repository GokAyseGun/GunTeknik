<style>
:root{--tel-hale:rgba(255,255,255,.16);--c-l1:#B8682E;--c-l2:#1b1b1b;--c-l3:#9a9a9a;--c-n:#2F7BFF;--c-pe:#2EA043;--c-pe2:#F2C200;--c-ls:#1b1b1b;--c-lv:#7d7d7d;--c-k:#E53935;--c-dp:#E53935;--c-dn:#1E40AF;--c-s:#A855F7;--c-z:#14B8A6;--c-z2:#F472B6;--c-ak:#FFE082;--sv-bg:#0b0b0b;}

.tel.t-Ls{stroke:var(--c-ls);} .tel.t-Lv{stroke:var(--c-lv);} .tel.t-K{stroke:var(--c-k);} .tel.t-D\+{stroke:var(--c-dp);} .tel.t-D-{stroke:var(--c-dn);} .tel.t-S{stroke:var(--c-s);} .tel.t-Z{stroke:var(--c-z);} .tel.t-Z2{stroke:var(--c-z2);}

.tel-g.sec .tel{stroke-width:5.5;}

.sv-src{stroke:var(--surface);stroke-width:2;} .sv-src.p-l1{fill:var(--c-l1);} .sv-src.p-l2{fill:#555;} .sv-src.p-l3{fill:var(--c-l3);} .sv-src.p-n{fill:var(--c-n);} .sv-src.p-pe{fill:var(--c-pe);} .sv-src.p-arti{fill:var(--c-dp);} .sv-src.p-eksi{fill:var(--c-dn);} .sv-src.p-sinyal{fill:var(--c-s);}

.sv-pervane{fill:var(--text2);}
.sv-don{animation:svDon .8s linear infinite;} .sv-don-ters{animation:svDon .8s linear infinite reverse;} .sv-don-yavas{animation:svDon 2.6s linear infinite;}
@keyframes svDon{to{transform:rotate(360deg);}}
.sv-bobin{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-bobin.aktif{fill:var(--purple-lt);stroke:var(--purple);} .sv-bobin.isiniyor{fill:var(--amber-lt);stroke:var(--amber);animation:svYanip .5s linear infinite;} .sv-bobin.yanik{fill:var(--red-lt);stroke:var(--red);} .sv-led-k{fill:var(--surface2);stroke:var(--border2);} .sv-led-k.on{fill:var(--red);stroke:var(--red);} .sv-led-y.on{fill:var(--green);stroke:var(--green);} .sv-grafik{fill:none;stroke:var(--purple);stroke-width:2;} .sv-grafik-z{fill:none;stroke:var(--border2);stroke-width:1;stroke-dasharray:2 3;} .sv-sonda{stroke:var(--text2);stroke-width:2.5;}
.sv-mcb{fill:var(--surface2);stroke:var(--text2);stroke-width:1.5;} .sv-mcb.acik{stroke:var(--red);}
.sv-kol{fill:var(--text3);} .sv-kol.on{fill:var(--green);}
.sv-test{fill:var(--amber-lt);stroke:var(--amber);stroke-width:1.5;}
.sv-ariza-btn{fill:var(--surface);stroke:var(--border2);stroke-width:1.2;} .sv-ariza-btn.aktif{fill:var(--amber-lt);stroke:var(--amber);}
.sv-kirmizi{fill:var(--red);font-weight:700;} .sv-yesil{fill:var(--green);}
.sv-not{fill:var(--amber);font-weight:700;animation:svNot .6s ease-in-out infinite alternate;}

.sv-titre{animation:svTitre .12s linear infinite alternate;} @keyframes svTitre{from{transform:rotate(-8deg);}to{transform:rotate(8deg);}}
.sv-zil{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-zil.aktif{fill:var(--amber-lt);stroke:var(--amber);}
.sv-priz{fill:var(--surface);stroke:var(--text2);stroke-width:2;} .sv-priz.cee{fill:#1565C0;fill-opacity:.25;}
.sv-delik{fill:var(--text2);} .sv-pe-kl{fill:var(--c-pe);}
.sv-fis{fill:var(--surface2);stroke:var(--text2);stroke-width:1.5;} .sv-fis.aktif{stroke:var(--green);}
.sv-insan{fill:none;stroke:var(--text);stroke-width:2.5;} .sv-insan-c{stroke:var(--text);stroke-width:2.5;stroke-linecap:round;} .sv-insan.carp,.sv-insan-c.carp{stroke:var(--red);animation:svYanip .25s steps(2) infinite;}
.sv-govde{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-govde.canli{stroke:var(--red);animation:svYanip .5s steps(2) infinite;}
.sv-ekran{fill:#08150e;stroke:#1d4d31;stroke-width:1;} .sv-mono{font-family:'JetBrains Mono',monospace;fill:#3ddc84;}
.sv-depo{fill:none;stroke:var(--text2);stroke-width:2;} .sv-su{fill:rgba(0,150,255,.38);} .sv-flotor{fill:var(--amber);}
.sv-ibre{stroke:var(--red);stroke-width:2.5;stroke-linecap:round;}
.sv-panel{fill:#0d2a4a;stroke:#4a7dbd;stroke-width:1.5;} .sv-panel-c{stroke:#4a7dbd;stroke-width:1;}
.sv-soc{fill:rgba(0,200,100,.35);} .sv-soc.dusuk{fill:rgba(255,23,68,.35);}:where([data-tema="zarif"]) .sv-soc.dusuk{fill:rgba(224,93,93,.35);}:where([data-tema="chill"]) .sv-soc.dusuk{fill:rgba(181,83,63,.35);}
.sv-simsek{stroke:#FFD600;stroke-width:3;fill:none;stroke-linejoin:round;}
.sv-dalga{stroke:var(--cy);stroke-width:2;fill:none;}
.sv-pir{fill:var(--surface);stroke:var(--text2);stroke-width:1.5;}
.sv-led{fill:var(--green);}
.sv-buyuk{font-size:18px;font-weight:800;fill:var(--mg);}
.sv-buton.yesil{fill:var(--green);} .sv-buton.kirmizi{fill:var(--red);} .sv-buton{fill:var(--text3);}
.sv-goz{fill:var(--surface);stroke:var(--text3);stroke-width:2;} .sv-goz.aktif{fill:#FF7043;stroke:#E64A19;} .sv-goz.asiri{fill:var(--red);animation:svYanip .3s steps(2) infinite;}
.sv-bolge{fill:var(--text3);fill-opacity:.05;stroke:var(--border2);stroke-dasharray:5 4;}
.sv-bolge-y{font-size:9.5px;fill:var(--text3);font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.sv-ozel-kutu{fill:var(--surface2);stroke:var(--border2);stroke-width:1.5;}

.sv-ozel-sec{fill:var(--mg-lt);stroke:var(--mg);stroke-width:2;}

<script>
/* ============================================================
   ŞEMA ELEMAN KÜTÜPHANESİ
   Her tip: uclar(e) → {ad:[x,y]}, baglar(e,R) → [[a,b]], kaynaklar(e,R) → [[uç, potansiyel]],
   yukler(e,R) → [{a,b,ad,gizli,kacak,kosul}], guncelle(e,R) → değişti mi, tik(e,R,dt) → değişti mi,
   aktif(e) → kontak sürücü durumu, ciz(e,R) → svg, tikla(e,b,R), bas/birak (anlık buton)
   ============================================================ */
const ET = {};
const SVG_ESC = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yz = (x, y, t, o) => `<text x="${x}" y="${y}" class="sv-y${o && o.c ? ' ' + o.c : ''}"${o && o.a ? ` text-anchor="${o.a}"` : ' text-anchor="middle"'}${o && o.s ? ` font-size="${o.s}"` : ''}>${SVG_ESC(t)}</text>`;
const nok = (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" class="sv-uc"/>`;
const tikG = (e, ic, b) => `<g class="tik" data-e="${e.id}"${b ? ` data-b="${b}"` : ''}>${ic}</g>`;
const DOK = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent"/>`;
const enMi = (R, e, ad) => R.yukEn[e.id + (ad ? '#' + ad : '')];
/* Kontak sürücüsünün durumu */
function surucuAktif(R, id, tip, k2){
  const s = R.el[id]; if(!s) return false;
  const f = (k2 && ET[s.tip].aktif2) || ET[s.tip].aktif; const a = f ? f(s, R) : !!s.st.en;
  if(tip === 'tno' || tip === 'tnc'){ const g = s.st.tamam; return tip === 'tno' ? g : !g; }
  return a;
}

/* ── Kaynak / bağlantı noktaları ── */
ET.src = {
  uclar:e => ({o:[e.x, e.y]}),
  kaynaklar:e => [['o', e.o.p]],
  ciz:(e, R) => {
    const p = e.o.p, ad = e.o.ad || p.replace(/^[a-z0-9]+:/, ''), y = e.o.yon || 'sol';
    const tx = y === 'sol' ? e.x - 10 : y === 'sag' ? e.x + 10 : e.x, ty = y === 'ust' ? e.y - 10 : y === 'alt' ? e.y + 17 : e.y + 4;
    return `<circle cx="${e.x}" cy="${e.y}" r="5" class="sv-src p-${potSinif(p)}"/>` + yz(tx, ty, ad, {a:y === 'sol' ? 'end' : y === 'sag' ? 'start' : 'middle', c:'sv-src-y'});
  }
};
ET.j = { uclar:e => ({o:[e.x, e.y]}), ciz:e => e.o.gizli ? '' : `<circle cx="${e.x}" cy="${e.y}" r="3.4" class="sv-j"/>` };
ET.bara = {
  uclar:e => { const o = {}; (e.o.tap || [0, e.o.uz]).forEach((t, i) => { o['t' + i] = e.o.dik ? [e.x, e.y + t] : [e.x + t, e.y]; }); return o; },
  baglar:e => (e.o.tap || [0, e.o.uz]).slice(1).map((t, i) => ['t' + i, 't' + (i + 1)]),
  ciz:(e, R) => { const L = e.o.uz; const [x2, y2] = e.o.dik ? [e.x, e.y + L] : [e.x + L, e.y];
    const pot = R.potNet(e.id + '.t0'), p = anaPot(pot), cls = p ? 'p-' + potSinif(p) + (kisaMi(pot) ? ' kisa' : '') : 'olu';
    return `<line x1="${e.x}" y1="${e.y}" x2="${x2}" y2="${y2}" class="sv-bara-hale"/><line x1="${e.x}" y1="${e.y}" x2="${x2}" y2="${y2}" class="sv-bara ${cls}"/>` + (e.o.tap || []).slice(1, -1).map(t => `<circle cx="${e.o.dik ? e.x : e.x + t}" cy="${e.o.dik ? e.y + t : e.y}" r="3.4" class="sv-j"/>`).join('') + (e.o.ad ? yz(e.o.dik ? e.x : e.x - 6, e.o.dik ? e.y - 8 : e.y + 4, e.o.ad, {a:e.o.dik ? 'middle' : 'end', c:'sv-k'}) : ''); }
};

/* ── Anahtarlar ── */
ET.sw = {
  uclar:e => e.o.dik ? {a:[e.x, e.y], b:[e.x, e.y + 44]} : {a:[e.x, e.y], b:[e.x + 44, e.y]},
  baglar:e => e.st.on ? [['a','b']] : [],
  tikla:e => { e.st.on = !e.st.on; },
  ilk:e => ({on:!!e.o.on}),
  ciz:e => {
    const d = e.o.dik, on = e.st.on;
    const bx = d ? (on ? e.x : e.x - 22) : (on ? e.x + 44 : e.x + 38), by = d ? (on ? e.y + 44 : e.y + 38) : (on ? e.y : e.y - 22);

  baglar:e => e.st.ilet ? [['a','k']] : [],
  ciz:e => { const t = e.o.tur || 'diyot', x = e.x, y = e.y; let g = nok(x, y - 18) + nok(x, y + 18);
    if(t === 'diyot'){ const f = e.o.ters ? -1 : 1; g += `<line x1="${x}" y1="${y - 18}" x2="${x}" y2="${y + 18}" class="sv-c"/><path d="M${x - 7} ${y + 6 * f} L${x + 7} ${y + 6 * f} L${x} ${y - 5 * f} Z" class="sv-c" style="fill:var(--surface)"/><line x1="${x - 8}" y1="${y - 6 * f}" x2="${x + 8}" y2="${y - 6 * f}" class="sv-c"/>`; }
    else if(t === 'rc') g += `<line x1="${x}" y1="${y - 18}" x2="${x}" y2="${y - 13}" class="sv-c"/><rect x="${x - 5}" y="${y - 13}" width="10" height="12" class="sv-c" style="fill:var(--surface)"/><line x1="${x}" y1="${y - 1}" x2="${x}" y2="${y + 5}" class="sv-c"/><line x1="${x - 8}" y1="${y + 5}" x2="${x + 8}" y2="${y + 5}" class="sv-c"/><line x1="${x - 8}" y1="${y + 10}" x2="${x + 8}" y2="${y + 10}" class="sv-c"/><line x1="${x}" y1="${y + 10}" x2="${x}" y2="${y + 18}" class="sv-c"/>`;
    else g += `<line x1="${x}" y1="${y - 18}" x2="${x}" y2="${y - 10}" class="sv-c"/><rect x="${x - 6}" y="${y - 10}" width="12" height="20" class="sv-c" style="fill:var(--surface)"/><path d="M${x - 9} ${y + 9} L${x + 6} ${y - 9} h4" class="sv-c" fill="none"/><line x1="${x}" y1="${y + 10}" x2="${x}" y2="${y + 18}" class="sv-c"/>`;
    const ad = e.o.ad || {diyot:'söndürme diyodu', rc:'RC söndürücü', varistor:'varistör'}[t];
    return g + yz(x + 12, y - 2, ad, {a:'start', s:9, c:'sv-k'}) + yz(x + 12, y + 10, e.st.ilet ? 'TERS! kısa devre' : t === 'diyot' ? (e.o.ters ? 'katot (çizgi) −’de!' : 'katot (çizgi) +’da') : 'polaritesiz', {a:'start', s:8.5, c:e.st.ilet ? 'sv-kirmizi' : ''});
  }
};

/* Kaynak seçici: dokununca bobine giden gerilim değişir */
const KSEC = {
  '230ac':{ad:'230 V AC', alt:'L – N', p:['L1','N']},
  '400ac':{ad:'400 V AC', alt:'L1 – L2', p:['L1','L2']},
  '24ac':{ad:'24 V AC', alt:'kumanda trafosu', p:['ks24:a','ks24:b'], d:['ks24', 24]},
  '24dc':{ad:'24 V DC', alt:'adaptör / PLC', p:['kd24:+','kd24:-'], d:['kd24', 24]},
  '48dc':{ad:'48 V DC', alt:'adaptör', p:['kd48:+','kd48:-'], d:['kd48', 48]},
  '12dc':{ad:'12 V DC', alt:'akü', p:['kd12:+','kd12:-'], d:['kd12', 12]}
};
ET.ksec = {
  uclar:e => ({X1:[e.x + 60, e.y - 12], X2:[e.x + 60, e.y + 12]}),
  ilk:e => ({i:e.o.i || 0}),
  liste:e => e.o.liste || ['230ac','400ac','24ac','24dc','12dc'],
  sec:e => KSEC[ET.ksec.liste(e)[e.st.i]],
  kaynaklar:e => { const s = ET.ksec.sec(e); return [['X1', s.p[0]], ['X2', s.p[1]]]; },
  domV:e => { const s = ET.ksec.sec(e); return s.d ? [s.d] : []; },
  tikla:e => { e.st.i = (e.st.i + 1) % ET.ksec.liste(e).length; },
  ciz:e => { const s = ET.ksec.sec(e), dc = s.p[0].endsWith('+');
    return tikG(e, `<rect x="${e.x - 52}" y="${e.y - 26}" width="104" height="52" rx="8" class="sv-ozel-sec"/>` + yz(e.x, e.y - 4, '⚡ ' + s.ad, {s:12, c:'sv-k'}) + yz(e.x, e.y + 13, s.alt + ' · değiştir 👆', {s:8.5})) +
      `<line x1="${e.x + 52}" y1="${e.y - 12}" x2="${e.x + 60}" y2="${e.y - 12}" class="sv-c"/><line x1="${e.x + 52}" y1="${e.y + 12}" x2="${e.x + 60}" y2="${e.y + 12}" class="sv-c"/>` +
      yz(e.x + 64, e.y - 16, dc ? '+' : '~', {a:'start', s:10}) + yz(e.x + 64, e.y + 24, dc ? '−' : '~', {a:'start', s:10}) + yz(e.x, e.y - 32, e.o.ad || 'Kaynak', {c:'sv-k'});
  }
};

/* Çok fonksiyonlu zaman rölesi: A1-A2 besleme, B1 kontrol girişi, çıkış(lar) ayrı kontak elemanlarıyla */
const ZR_MOD = {E:'Çekmede gecikmeli', R:'Düşmede gecikmeli', Wu:'Tek darbe (çekince)', Bl:'Flaşör', YD:'Yıldız-üçgen'};
const ZR_ACIK = {E:'enerji gelince t sonra çıkış kapanır, enerji gidince hemen açılır', R:'B1 gelince çıkış hemen kapanır; B1 gidince t kadar daha kapalı kalır', Wu:'enerji gelince çıkış hemen kapanır, t sonra açılır', Bl:'çıkış t1 kapalı / t2 açık sürekli tekrar eder', YD:'önce Y çıkışı (17-18) t süre, kısa ölü zaman, sonra Δ çıkışı (17-28)'};
ET.zr2 = {
  uclar:e => { const u = {A1:[e.x - 34, e.y - 36], A2:[e.x + 34, e.y - 36]}; if(e.o.b1) u.B1 = [e.x, e.y - 36]; return u; },
  yukler:e => [{a:'A1', b:'A2', ad:e.o.ad || e.id, gizli:1}],
  ilk:e => ({mi:0, si:0, t:0, cik:false, cik2:false, en:false, b1:false, faz:0, gec:[], gt:0}),
  mod:e => e.o.modlar ? e.o.modlar[e.st.mi] : (e.o.mod || 'E'),
  sure:e => e.o.sureler ? e.o.sureler[e.st.si] : (e.o.sure || 3),
  basla:e => { const m = ET.zr2.mod(e); e.st.t = 0; e.st.faz = 0; e.st.cik2 = false; e.st.cik = m === 'Wu' || m === 'Bl' || m === 'YD' || (m === 'R' && e.st.b1); },
  guncelle:(e, R) => {
    const en = !!R.yukEn[e.id], b1 = !!e.o.b1 && (R.potNet(e.id + '.B1') || []).some(p => ['faz','arti','sek'].includes(potTip(p)));
    let d = false;
    if(b1 !== e.st.b1){ e.st.b1 = b1; d = true; if(e.st.en && ET.zr2.mod(e) === 'R'){ if(b1){ e.st.cik = true; e.st.faz = 0; e.st.t = 0; } else if(e.st.cik){ e.st.faz = 1; e.st.t = 0; } } }
    if(en !== e.st.en){ e.st.en = en; d = true; if(en) ET.zr2.basla(e); else { e.st.cik = false; e.st.cik2 = false; e.st.t = 0; e.st.faz = 0; } }
    return d; },
  tik:(e, R, dt) => {
    let d = false; const m = ET.zr2.mod(e), T = ET.zr2.sure(e);
    if(e.st.en){
      if(m === 'E' && !e.st.cik){ e.st.t += dt; if(e.st.t >= T) e.st.cik = true; d = true; }
      else if(m === 'Wu' && e.st.cik){ e.st.t += dt; if(e.st.t >= T) e.st.cik = false; d = true; }
      else if(m === 'Bl'){ e.st.t += dt; if(e.st.t >= (e.st.cik ? T : (e.o.sure2 || T))){ e.st.cik = !e.st.cik; e.st.t = 0; } d = true; }
      else if(m === 'YD' && e.st.faz < 2){ e.st.t += dt; if(e.st.faz === 0 && e.st.t >= T){ e.st.cik = false; e.st.faz = 1; e.st.t = 0; } else if(e.st.faz === 1 && e.st.t >= (e.o.olu || 0.4)){ e.st.cik2 = true; e.st.faz = 2; } d = true; }
      else if(m === 'R' && e.st.faz === 1 && e.st.cik){ e.st.t += dt; if(e.st.t >= T){ e.st.cik = false; e.st.faz = 0; } d = true; }
    }
    if(e.o.grafik){ e.st.gt += dt; if(e.st.gt >= 0.2){ e.st.gt = 0; e.st.gec.push([e.st.en ? 1 : 0, e.st.b1 ? 1 : 0, e.st.cik ? 1 : 0]); if(e.st.gec.length > 60) e.st.gec.shift(); d = true; } }
    return d; },
  aktif:e => e.st.cik, aktif2:e => e.st.cik2,
  tikla:(e, b) => { if(b === 'mod' && e.o.modlar) e.st.mi = (e.st.mi + 1) % e.o.modlar.length; else if(b === 'sure' && e.o.sureler) e.st.si = (e.st.si + 1) % e.o.sureler.length; else return;
    if(e.st.en) ET.zr2.basla(e); else { e.st.cik = false; e.st.cik2 = false; } e.st.gec = []; },
  kalan:e => { const m = ET.zr2.mod(e), T = ET.zr2.sure(e);
    if(!e.st.en) return 'enerjisiz';
    if(m === 'E') return e.st.cik ? 'süre doldu → çıkış KAPALI' : 'sayıyor ' + vYaz(Math.max(0, T - e.st.t).toFixed(1)) + ' sn';
    if(m === 'Wu') return e.st.cik ? 'çıkış kapalı, ' + vYaz(Math.max(0, T - e.st.t).toFixed(1)) + ' sn kaldı' : 'darbe bitti → çıkış açık';
    if(m === 'Bl') return e.st.cik ? 'çıkış KAPALI (yanıyor)' : 'çıkış açık (sönük)';
    if(m === 'YD') return e.st.faz === 0 ? 'YILDIZ · ' + vYaz(Math.max(0, T - e.st.t).toFixed(1)) + ' sn' : e.st.faz === 1 ? 'ölü zaman (ikisi de açık)' : 'ÜÇGEN';
    return e.st.b1 ? 'B1 var → çıkış KAPALI' : e.st.cik ? 'B1 gitti, ' + vYaz(Math.max(0, T - e.st.t).toFixed(1)) + ' sn sonra açılacak' : 'beklemede (B1 yok)'; },
  durum:(e) => { const m = ET.zr2.mod(e); return [{ikon:'⏱️', ad:(e.o.ad || e.id) + ' · ' + ZR_MOD[m] + ' · t = ' + vYaz(ET.zr2.sure(e)) + ' sn' + (m === 'Bl' && e.o.sure2 ? ' / ' + vYaz(e.o.sure2) + ' sn' : ''), durum:ET.zr2.kalan(e), on:e.st.cik || e.st.cik2}]; },
  ciz:e => { const m = ET.zr2.mod(e), x = e.x, y = e.y;
    let g = `<rect x="${x - 50}" y="${y - 28}" width="100" height="58" rx="8" class="sv-yuk${e.st.en ? ' aktif' : ''}"/>`;
    [['A1', -34], ['A2', 34]].concat(e.o.b1 ? [['B1', 0]] : []).forEach(([t, dx]) => { g += `<line x1="${x + dx}" y1="${y - 36}" x2="${x + dx}" y2="${y - 28}" class="sv-c"/>` + yz(x + dx, y - 18, t, {s:8.5}); });
    g += yz(x, y - 3, '⏱ ' + m + ' · ' + vYaz(ET.zr2.sure(e)) + ' sn', {s:10.5, c:'sv-k'}) + yz(x, y + 12, ET.zr2.kalan(e).slice(0, 26), {s:7.8});
    g += `<circle cx="${x - 40}" cy="${y + 22}" r="3.5" class="sv-led-k sv-led-y${e.st.en ? ' on' : ''}"/>` + yz(x - 33, y + 25, 'U', {a:'start', s:7.5});
    g += `<circle cx="${x + 24}" cy="${y + 22}" r="3.5" class="sv-led-k${e.st.cik ? ' on' : ''}"/>` + yz(x + 31, y + 25, m === 'YD' ? 'Y' : 'R', {a:'start', s:7.5});
    if(m === 'YD') g += `<circle cx="${x + 4}" cy="${y + 22}" r="3.5" class="sv-led-k${e.st.cik2 ? ' on' : ''}"/>` + yz(x + 11, y + 25, 'Δ', {a:'start', s:7.5});
    let bx = x - 50;
    if(e.o.modlar){ g += tikG(e, `<rect x="${bx}" y="${y + 36}" width="62" height="18" rx="5" class="sv-ariza-btn"/>` + yz(bx + 31, y + 49, 'mod: ' + m + ' 👆', {s:9}), 'mod'); bx += 66; }
    if(e.o.sureler) g += tikG(e, `<rect x="${bx}" y="${y + 36}" width="56" height="18" rx="5" class="sv-ariza-btn"/>` + yz(bx + 28, y + 49, 't: ' + vYaz(ET.zr2.sure(e)) + ' sn 👆', {s:9}), 'sure');
    g += yz(x - 50, y + (e.o.modlar || e.o.sureler ? 68 : 46), e.o.ad || e.id, {a:'start', c:'sv-k'});
    if(e.o.grafik){ const gx = x + (e.o.gx || 60), gw = 150, sat = [['besleme A1-A2', 0]].concat(e.o.b1 ? [['B1 kontrol', 1]] : []).concat([['çıkış (R)', 2]]);
      sat.forEach(([ad, k], i) => { const yy = y - 2 + i * 22, P = e.st.gec.map((s, j) => `${gx + j * gw / 60},${yy - s[k] * 12}`);
        g += `<line x1="${gx}" y1="${yy}" x2="${gx + gw}" y2="${yy}" class="sv-grafik-z"/>` + (P.length > 1 ? `<polyline points="${P.join(' ')}" class="sv-grafik"/>` : '') + yz(gx + gw + 4, yy, ad, {a:'start', s:8}); });
      g += yz(gx, y + sat.length * 22 + 8, '← son 12 sn', {a:'start', s:7.5}); }
    return g; }
};

/* Mandallı (kilitli) röle / kontaktör: SET bobini (A1) kapatır, RESET bobini (A3) açar; enerji gidince konum korunur */
ET.mand = {
  uclar:e => ({A1:[e.x - 24, e.y - 22], A3:[e.x + 24, e.y - 22], A2:[e.x, e.y + 30]}),
  yukler:e => [{a:'A1', b:'A2', gizli:1, ad:'set'}, {a:'A3', b:'A2', gizli:1, ad:'reset'}],
  ilk:e => ({k:!!e.o.k, s:false, r:false}),
  guncelle:(e, R) => { const s = !!R.yukEn[e.id + '#set'], r = !!R.yukEn[e.id + '#reset']; let d = s !== e.st.s || r !== e.st.r; e.st.s = s; e.st.r = r;
    if(s && !r && !e.st.k){ e.st.k = true; d = true; } if(r && !s && e.st.k){ e.st.k = false; d = true; } return d; },
  aktif:e => e.st.k,
  durum:e => [{ikon:'🔒', ad:(e.o.ad || e.id) + ' (mandallı)', durum:(e.st.k ? 'KAPALI konumda kilitli' : 'AÇIK konumda kilitli') + (e.st.s ? ' · SET bobini darbe alıyor' : e.st.r ? ' · RESET bobini darbe alıyor' : ' · bobinler enerjisiz, konum korunuyor'), on:e.st.k}],
  ciz:e => { const x = e.x, y = e.y;
    let g = [[-24, e.st.s, 'SET'], [24, e.st.r, 'RESET']].map(([dx, a, ad]) => `<line x1="${x + dx}" y1="${y - 22}" x2="${x + dx}" y2="${y - 8}" class="sv-c"/><rect x="${x + dx - 14}" y="${y - 8}" width="28" height="16" rx="3" class="sv-bobin${a ? ' aktif' : ''}"/><line x1="${x + dx}" y1="${y + 8}" x2="${x + dx}" y2="${y + 18}" class="sv-c"/>` + yz(x + dx, y + 4, ad[0], {s:8})).join('');
    g += `<line x1="${x - 24}" y1="${y + 18}" x2="${x + 24}" y2="${y + 18}" class="sv-c"/><line x1="${x}" y1="${y + 18}" x2="${x}" y2="${y + 30}" class="sv-c"/>`;
    return g + yz(x - 28, y - 24, 'A1 (SET)', {a:'end', s:8.5}) + yz(x + 28, y - 24, 'A3 (RESET)', {a:'start', s:8.5}) + yz(x + 6, y + 30, 'A2', {a:'start', s:8.5}) + yz(x + 44, y - 2, e.o.ad || e.id, {a:'start', c:'sv-k'}) + yz(x + 44, y + 11, 'konum: ' + (e.st.k ? 'KAPALI 🔒' : 'AÇIK 🔒'), {a:'start', s:9});
  }
};

/* Soketli / ray tipi röleler: pin numaraları gerçek soket numaralarıdır */
const ROLE_TUR = {
  mk2:{ad:'8 pin (MK2P) · 2 C/O', bob:['2','7'], kut:[['1','3','4'],['8','6','5']]},
  mk3:{ad:'11 pin (MK3P) · 3 C/O', bob:['2','10'], kut:[['1','3','4'],['6','7','5'],['11','9','8']]},
  my4:{ad:'14 pin (MY4) · 4 C/O', bob:['13','14'], kut:[['9','5','1'],['10','6','2'],['11','7','3'],['12','8','4']]},
  oto:{ad:'oto rölesi · 5 pin', bob:['86','85'], kut:[['30','87','87a']]},
  ince:{ad:'ince ray rölesi · 1 C/O', bob:['A1','A2'], kut:[['11','14','12']]}
};
ET.role = {
  tur:e => ROLE_TUR[e.o.tur || 'mk2'],
  poz:e => { const T = ET.role.tur(e), P = {}; P[T.bob[e.o.terb ? 1 : 0]] = [e.x, e.y]; P[T.bob[e.o.terb ? 0 : 1]] = [e.x, e.y + 84];
    T.kut.forEach(([c, no, nc], i) => { const x = e.x + 60 + i * 58; P[c] = [x, e.y]; P[nc] = [x - 14, e.y + 84]; P[no] = [x + 14, e.y + 84]; }); return P; },
  uclar:e => ET.role.poz(e),
  yukler:e => { const T = ET.role.tur(e); return [{a:T.bob[0], b:T.bob[1], ad:e.o.ad || e.id, gizli:1}]; },
  ilk:() => ({isi:0, yan:false}),
  guncelle:(e, R) => { const T = ET.role.tur(e), y = anmaCek(e, R, T.bob[0], T.bob[1], null, e.o.polar); if(y !== !!e.st.en){ e.st.en = y; return true; } return false; },
  tik:(e, R, dt) => anmaTik(e, dt),
  baglar:e => ET.role.tur(e).kut.map(([c, no, nc]) => [c, e.st.en ? no : nc]),
  aktif:e => !!e.st.en,
  tikla:e => { if(e.st.yan){ e.st.yan = false; e.st.isi = 0; } },
  durum:e => { if(e.o.gizli) return []; const T = ET.role.tur(e), d = anmaDurum(e, (e.o.ad || e.id) + ' · ' + T.ad);
    if(d.on) d.durum += ' — kapalı kontaklar: ' + T.kut.map(k => k[0] + '-' + k[1]).join(', ');
    else if(!d.kotu) d.durum = 'bırakık — kapalı kontaklar: ' + T.kut.map(k => k[0] + '-' + k[2]).join(', ');
    return [d]; },
  ciz:e => { const T = ET.role.tur(e), P = ET.role.poz(e), n = T.kut.length, x0 = e.x, y0 = e.y, x1 = e.x + 60 + (n - 1) * 58 + 26, an = bobAnma(e), dc = an && an.akim === 'dc';
    const en = !!e.st.en, cls = e.st.yan ? ' yanik' : e.st.isi > 0 ? ' isiniyor' : en ? ' aktif' : '';
    let g = `<rect x="${x0 - 24}" y="${y0 + 8}" width="${x1 - x0 + 24}" height="68" rx="8" class="sv-yuk${en ? ' aktif' : ''}" style="fill-opacity:.55"/>`;
    g += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 + 30}" class="sv-c"/><line x1="${x0}" y1="${y0 + 54}" x2="${x0}" y2="${y0 + 84}" class="sv-c"/><rect x="${x0 - 9}" y="${y0 + 30}" width="18" height="24" rx="3" class="sv-bobin${cls}"/>`;
    if(e.st.yan) g += `<path d="M${x0 - 8} ${y0 + 33} l16 18 M${x0 + 8} ${y0 + 33} l-16 18" class="sv-c" style="stroke:var(--red)"/>`;
    T.kut.forEach(([c, no, nc], i) => { const x = x0 + 60 + i * 58;
      g += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + 30}" class="sv-c"/><line x1="${x - 14}" y1="${y0 + 84}" x2="${x - 14}" y2="${y0 + 56}" class="sv-c"/><line x1="${x + 14}" y1="${y0 + 84}" x2="${x + 14}" y2="${y0 + 56}" class="sv-c"/><line x1="${x - 14}" y1="${y0 + 56}" x2="${x - 9}" y2="${y0 + 56}" class="sv-c"/><line x1="${x}" y1="${y0 + 30}" x2="${en ? x + 14 : x - 10}" y2="${y0 + 56}" class="sv-bicak kapali"/>` +
        yz(x + 5, y0 + 21, c, {a:'start', s:9, c:'sv-k'}) + yz(x - 18, y0 + 72, nc, {a:'end', s:8.5}) + yz(x + 18, y0 + 72, no, {a:'start', s:8.5}); });
    g += `<line x1="${x0 + 9}" y1="${y0 + 42}" x2="${x0 + 60 + (n - 1) * 58 + 4}" y2="${y0 + 42}" class="sv-mek"/>`;
    const b0 = e.o.terb ? T.bob[1] : T.bob[0], b1 = e.o.terb ? T.bob[0] : T.bob[1], pz = e.o.terb ? [' −', ' +'] : [' +', ' −'];
    g += yz(x0 - 5, y0 + 21, b0 + (dc ? pz[0] : ''), {a:'end', s:9, c:'sv-k'}) + yz(x0 - 5, y0 + 72, b1 + (dc ? pz[1] : ''), {a:'end', s:9, c:'sv-k'});
    g += Object.values(P).map(([x, y]) => nok(x, y)).join('');
    if(e.o.led) g += `<circle cx="${x0 + 24}" cy="${y0 + 20}" r="4" class="sv-led-k${en ? ' on' : ''}"/>` + yz(x0 + 24, y0 + 34, 'LED', {s:6.5});
    if(e.st.yan) g = tikG(e, DOK(x0 - 24, y0 + 8, x1 - x0 + 24, 68) + g);
    return g + yz(x1 + 8, y0 + 32, e.o.ad || e.id, {a:'start', c:'sv-k'}) + yz(x1 + 8, y0 + 45, T.ad, {a:'start', s:8.5}) + (an ? yz(x1 + 8, y0 + 57, 'bobin ' + anmaYazi(an), {a:'start', s:8.5, c:e.st.yan || e.st.isi > 0 ? 'sv-kirmizi' : ''}) : '') + (e.st.yan ? yz(x1 + 8, y0 + 69, 'YANDI · yenisini tak 👆', {a:'start', s:8.5, c:'sv-kirmizi'}) : '');

/* ── Kompresör ve marş elemanları ── */
/* S ucundan R ucuna giden yollar: direkt iletken, daimi (run) kondansatör, kalkış (start) kondansatörü */
function kompYol(R, k){
  const kom = {}; const ek = (a, b, t) => { (kom[a] = kom[a] || []).push([b, t]); (kom[b] = kom[b] || []).push([a, t]); };
  R.teller.forEach(w => ek(w.a, w.b, 'tel'));
  (R.ic || []).forEach(([a, b]) => { const el = R.el[a.slice(0, a.indexOf('.'))]; const kt = el && ET[el.tip].kapTip ? ET[el.tip].kapTip(el) : null; ek(a, b, kt || 'tel'); });
  const ulas = izin => { const h = k.id + '.R', g = new Set([k.id + '.S']), q = [k.id + '.S']; while(q.length){ const n = q.shift(); if(n === h) return true; (kom[n] || []).forEach(([m, t]) => { if(izin.includes(t) && !g.has(m)){ g.add(m); q.push(m); } }); } return false; };
  return {direkt:ulas(['tel']), run:ulas(['tel','run']), start:ulas(['tel','start'])};
}
/* Hermetik kompresör: C ortak, S yardımcı (start), R ana (run) sargı; dahili klixon */
ET.komp = {
  uclar:e => ({C:[e.x, e.y - 46], S:[e.x - 30, e.y + 42], R:[e.x + 30, e.y + 42]}),
  yukler:e => e.st.klx ? [] : [{a:'C', b:'R', gizli:1, ad:'run'}, {a:'C', b:'S', gizli:1, ad:'start'}],
  ilk:() => ({hiz:0, zor:0, klx:false, sogu:0, sw:0, denge:0, d:'dur', neden:'', yol:{}, sg:false}),
  guc:(e, R) => !e.st.klx && !!R.yukEn[e.id + '#run'],
  guncelle:(e, R) => { e.st.yol = kompYol(R, e); e.st.sg = !!R.yukEn[e.id + '#start']; return false; },
  tik:(e, R, dt) => {
    const s = e.st, g = ET.komp.guc(e, R), Y = s.yol || {}, iz = () => [s.d, s.klx, Math.round(s.hiz * 10), Math.ceil(s.sogu), Math.ceil(s.zor * 2), Math.ceil(s.denge), Math.ceil(s.sw * 2)].join();
    const s0 = iz();
    if(s.klx){ s.sogu -= dt; s.hiz = Math.max(0, s.hiz - dt * 1.5); s.d = 'termik'; if(s.sogu <= 0){ s.klx = false; s.zor = 0; s.sw = 0; s.d = 'dur'; } s.denge = Math.max(0, s.denge - dt); }
    else if(!g){ if(s.d === 'calis' && e.o.denge) s.denge = e.o.denge; else s.denge = Math.max(0, s.denge - dt); s.hiz = Math.max(0, s.hiz - dt * 1.5); s.zor = 0; s.sw = 0; s.d = 'dur'; }
    else {
      const yard = s.sg && (Y.direkt || Y.run || Y.start), zorlu = s.denge > 0 && !(Y.start && s.sg);
      if(s.hiz < 0.8){
        if(yard && !zorlu){ s.hiz += dt * 1.6; s.d = 'kalkis'; }
        else { s.d = 'zorlan'; s.zor += dt; s.neden = !yard ? 'start sargısı devreye girmiyor (marş elemanı açık: PTC sıcak, röle/kondansatör arızalı)' : 'basınç dengelenmedi, kalkış momenti yetmiyor'; if(s.zor >= 3){ s.klx = true; s.sogu = e.o.sogu || 6; s.hiz = 0; } }
      } else {
        s.hiz = 1; s.d = 'calis'; s.zor = 0;
        if(s.sg && (Y.direkt || Y.start)){ s.sw += dt; s.neden = Y.start && !Y.direkt ? 'kalkış kondansatörü devrede kaldı' : 'yardımcı (start) sargı devrede kaldı'; if(s.sw >= 4){ s.klx = true; s.sogu = e.o.sogu || 6; s.hiz = 0; } }
        else s.sw = Math.max(0, s.sw - dt);
      }
      s.denge = Math.max(0, s.denge - dt);
    }

}

  });

    bara('BS', p0 + 40, 310, [p0 + 40].concat(ds), {}), bara('BK', p0 + 60, 325, [p0 + 60, p0 + 110].concat(ds.map(x => x + 20)), {})];
  const t = [['L.o','F1.a1','L'], ['F1.b1','PS.p1','L',[[70,192],[40,192]]], ['N.o','PS.p2','N'], ['PS.s1','BP.t0','D+',[[120,228]]], ['PS.s2','BM.t0','D-',[[110,252]],'wm'],

   ŞEMALAR — H. UYDU, ANTEN, AĞ, KAMERA, FİBER  (özel çizimler)

/* Ortak çizim yardımcıları */
const ob = (x, y, w, h, ad, alt, b, cls) => (b ? `<g class="tik" data-b="${b}">` : '') + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="${cls || 'sv-ozel-kutu'}"/>` +
  `<text x="${x + w / 2}" y="${y + (alt ? h / 2 - 2 : h / 2 + 4)}" class="sv-y sv-k" text-anchor="middle" font-size="10.5" pointer-events="none">${SVG_ESC(ad)}</text>` +
  (alt ? `<text x="${x + w / 2}" y="${y + h / 2 + 12}" class="sv-y" text-anchor="middle" font-size="9" pointer-events="none">${SVG_ESC(alt)}</text>` : '') + (b ? '</g>' : '');
const oh = (pts, renk, o) => { o = o || {}; const d = 'M' + pts.map(p => p.join(' ')).join(' L');
  return `<path d="${d}" fill="none" stroke="${renk}" stroke-width="${o.g || 4}" stroke-linejoin="round" stroke-linecap="round"${o.kesik ? ' stroke-dasharray="6 6"' : ''}${o.op ? ` opacity="${o.op}"` : ''}/>` + (o.akim ? `<path d="${d}" class="tel-akim"/>` : ''); };
const obtn = (x, y, w, ad, b, aktif) => `<g class="tik" data-b="${b}"><rect x="${x}" y="${y}" width="${w}" height="26" rx="7" class="sv-ariza-btn${aktif ? ' aktif' : ''}"/><text x="${x + w / 2}" y="${y + 17}" class="sv-y" text-anchor="middle" font-size="9.5" pointer-events="none">${SVG_ESC(ad)}</text></g>`;
const obar = (x, y, w, oran, iyi) => `<rect x="${x}" y="${y}" width="${w}" height="10" rx="5" class="sv-ozel-kutu"/><rect x="${x}" y="${y}" width="${Math.max(0, Math.min(1, oran)) * w}" height="10" rx="5" fill="${iyi ? 'var(--green)' : 'var(--red)'}"/>`;
const KOAKS = '#9aa4ad', FIBER = '#F2C200', UTP = '#4F8DFF';
const canak = (x, y) => `<path d="M${x} ${y - 46} Q${x + 34} ${y} ${x} ${y + 46}" fill="none" stroke="var(--text2)" stroke-width="5"/><line x1="${x + 6}" y1="${y + 40}" x2="${x + 6}" y2="${y + 70}" stroke="var(--text3)" stroke-width="4"/>`;
const lnbCiz = (x, y, ad) => `<rect x="${x}" y="${y - 10}" width="34" height="20" rx="5" class="sv-ozel-aktif"/>` + sy(x + 17, y + 4, ad || 'LNB', {s:8.5});
const TP = [['10,962 GHz Yatay', 'H', 0], ['11,096 GHz Dikey', 'V', 0], ['11,794 GHz Yatay', 'H', 1], ['12,380 GHz Dikey', 'V', 1]];
const msGir = t => (TP[t][1] === 'H' ? 2 : 0) + TP[t][2];
const tpAciklama = i => { const t = TP[i]; return `${t[1] === 'H' ? '18 V (yatay)' : '13 V (dikey)'} + ${t[2] ? '22 kHz (üst bant)' : '0 kHz (alt bant)'}`; };

/* H2 — Twin LNB */
sema({id:'lnb_twin', kat:'uydu', ikon:'👯', ad:'Twin LNB · İki Bağımsız Alıcı', ozet:'Twin LNB’nin her çıkışı ayrı alıcıya gider; iki TV farklı kanalları bağımsız izler. Tek çıkışı bölmek çalışmaz.', etiket:['twin lnb','çift çıkışlı lnb','iki alıcı','splitter','bölücü','uydu iki tv'],
  w:660, h:360, minw:520,
  ozel:{ilk:() => ({a:0, b:3, bol:false}),
    tikla:(st, b) => { if(b === 'a') st.a = (st.a + 1) % 4; if(b === 'b') st.b = (st.b + 1) % 4; if(b === 'bol') st.bol = !st.bol; },
    ciz:st => { const sonuc = twinSonuc(st);
      let h = canak(60, 150) + `<rect x="84" y="134" width="40" height="34" rx="5" class="sv-ozel-aktif"/>` + sy(104, 155, st.bol ? 'LNB' : 'Twin', {s:8.5});
      if(!st.bol){ h += oh([[124, 142], [260, 142], [260, 100], [380, 100]], KOAKS, {g:5, akim:sonuc[0]}) + oh([[124, 160], [260, 160], [260, 240], [380, 240]], KOAKS, {g:5, akim:sonuc[1]}); }
      else { h += oh([[124, 150], [230, 150]], KOAKS, {g:5, akim:true}) + `<rect x="230" y="134" width="46" height="32" rx="5" class="sv-ozel-sec"/>` + sy(253, 154, 'bölücü', {s:8.5}) + oh([[276, 142], [300, 142], [300, 100], [380, 100]], KOAKS, {g:5, akim:sonuc[0]}) + oh([[276, 160], [300, 160], [300, 240], [380, 240]], KOAKS, {g:5, akim:sonuc[1]}); }
      h += ob(380, 72, 150, 56, 'Alıcı 1', sonuc[0] ? TP[st.a][0] : 'GÖRÜNTÜ YOK', 'a', sonuc[0] ? 'sv-ozel-aktif' : 'sv-ozel-kutu') + ob(380, 212, 150, 56, 'Alıcı 2', sonuc[1] ? TP[st.b][0] : 'GÖRÜNTÜ YOK', 'b', sonuc[1] ? 'sv-ozel-aktif' : 'sv-ozel-kutu');
      h += sy(455, 144, 'kanal değiştir 👆', {s:9}) + sy(455, 284, 'kanal değiştir 👆', {s:9});
      h += obtn(20, 310, 260, st.bol ? '✕ Tek çıkış + bölücü (yanlış)' : '✓ Twin LNB (doğru)', 'bol', st.bol);
      return h; },
    durum:st => { const s = twinSonuc(st), L = [];
      if(st.bol){ const V = TP[st.a][1] === 'H' || TP[st.b][1] === 'H' ? 'yatay (18 V baskın)' : 'dikey', B = TP[st.a][2] || TP[st.b][2] ? 'üst bant (22 kHz)' : 'alt bant';
        L.push({ikon:'⚠️', ad:'Tek LNB', durum:`İki alıcı aynı LNB’ye farklı komut gönderiyor. LNB şu an ${V}, ${B} durumunda; bu ayarı istemeyen alıcıda görüntü gider.`, kotu:true}); }
      [st.a, st.b].forEach((t, i) => L.push({ikon:'📺', ad:'Alıcı ' + (i + 1), durum:s[i] ? `izliyor · ${tpAciklama(t)}` : 'istediği polarite/bant yok — görüntü gelmiyor', on:s[i], kotu:!s[i]}));
      return L; }},
  bilgi:{
    nasil:'<p>Universal LNB tek bir anda yalnız <b>bir</b> polarite ve banda ayarlanabilir. İki alıcı farklı polarite/bant isterse tek LNB çıkışından ikisine birden hizmet edilemez. <b>Twin LNB</b>’de iki bağımsız çıkış vardır; her alıcı kendi çıkışını yönetir. 4 TV için <b>quad</b> LNB, daha fazlası için <b>quattro LNB + multiswitch</b> kullanılır.</p>',
    damar:[['Her çıkış → bir alıcı','ayrı RG6 hat']],
    malzeme:['Twin (2), quad (4) veya octo (8) LNB','Her alıcı için ayrı kablo'],
    adim:['Her odaya LNB’den ayrı kablo çek.','Boşta kalan LNB çıkışlarını kapakla kapat.'],
    hata:['Uydu hattını anten bölücüsüyle bölmek: kanallar yarım çalışır.'],
    test:['İki alıcıda farklı polarite/banttaki kanalları aynı anda aç.'],
    hesap:['uydu'], ilgili:['lnb_tek','multiswitch']

});
function twinSonuc(st){
  if(!st.bol) return [true, true];
  const V = TP[st.a][1] === 'H' || TP[st.b][1] === 'H' ? 'H' : 'V', B = TP[st.a][2] || TP[st.b][2] ? 1 : 0;
  return [st.a, st.b].map(t => TP[t][1] === V && TP[t][2] === B);
}

function fibHesap(st){ const p = 3 - 17 - st.km * 0.35 - 4 * 0.4 - 3 * 0.1 - (st.buk ? 12 : 0) - (st.kir ? 4 : 0); return {p, ok:p >= -27 && p <= -8}; }

function mmOku(m, t){

  if(m === 'A') return canli || dc ? ['KISA DEVRE!', 'Akım modunda prob gerilime değdi: ölçü aletinin sigortası atar, kalitesiz alette patlama/ark olur. Akım SERİ ölçülür; pratikte pens ampermetre kullan.', 'kotu'] : ['0.00 A', 'Bu devrede akım yok. Akım ölçmek için devreyi açıp aleti seri bağlamak gerekir.', ''];

    if(t === 'sigS') return [m === 'BIP' ? '🔊 0.2 Ω' : '0.2 Ω', 'Süreklilik var: sigorta sağlam.', 'on']; return ['O.L', t === 'sigA' ? 'Sonsuz direnç: sigorta atık (kopuk).' : 'Sonsuz direnç: kablo kopuk. Uçları değiştirerek yerini daralt.', 'kotu']; }
  if(m === 'VAC'){ if(t === 'LN') return ['230.4 V', 'Normal şebeke gerilimi (207–253 V arası kabul edilir).', 'on']; if(t === 'LPE') return ['229.8 V', 'Faz–toprak ≈ faz–nötr: topraklama bağlı.', 'on']; if(t === 'NPE') return ['0.8 V', 'Nötr–toprak arası birkaç volttan az olmalı. Yüksekse nötr bağlantısı zayıf veya yük dengesiz.', 'on'];
    if(dc) return ['0.0 V', 'Yanlış mod: akü DC’dir, V⎓ seç.', 'kotu']; return ['0.0 V', 'Enerjisiz parça.', '']; }
  if(m === 'VDC'){ if(dc) return ['12.72 V', 'Tam dolu kurşun-asit akü ≈ 12,7 V; 12,0 V altı boş sayılır.', 'on']; if(canli) return ['≈ 0 V', 'Yanlış mod: şebeke AC’dir, V~ seç. (Bazı aletler AC’de DC modunda anlamsız değer gösterir.)', 'kotu']; return ['0.00 V', 'Enerjisiz parça.', '']; }
}
