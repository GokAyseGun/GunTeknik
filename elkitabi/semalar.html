<style>
:root{--tel-hale:rgba(255,255,255,.16);--c-l1:#B8682E;--c-l2:#1b1b1b;--c-l3:#9a9a9a;--c-n:#2F7BFF;--c-pe:#2EA043;--c-pe2:#F2C200;--c-ls:#1b1b1b;--c-lv:#7d7d7d;--c-k:#E53935;--c-dp:#E53935;--c-dn:#1E40AF;--c-s:#A855F7;--c-z:#14B8A6;--c-z2:#F472B6;--c-ak:#FFE082;--sv-bg:#0b0b0b;}
[data-tema="acik"]{--tel-hale:rgba(0,0,0,.10);--c-ak:#FF8F00;--sv-bg:#fbfbfe;}
.sm-k-aydinlatma{--kr:var(--amber);--kr-lt:var(--amber-lt);--kr-md:var(--amber-md);}
.sm-k-priz,.sm-k-pano{--kr:var(--mg);--kr-lt:var(--mg-lt);--kr-md:var(--mg-md);}
.sm-k-topraklama,.sm-k-gunes{--kr:var(--green);--kr-lt:var(--green-lt);--kr-md:var(--green-md);}
.sm-k-diafon,.sm-k-uydu{--kr:var(--purple);--kr-lt:var(--purple-lt);--kr-md:var(--purple-md);}
.sm-k-motor,.sm-k-klima{--kr:var(--cy);--kr-lt:var(--cy-lt);--kr-md:var(--cy-md);}
.sm-k-olcum,.sm-k-sembol{--kr:var(--text2);--kr-lt:var(--surface2);--kr-md:var(--border2);}
.sm-etk{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:6px;background:var(--green-lt);color:var(--green);margin-left:6px;vertical-align:2px;}
.sm-sahne{padding:12px;}
.sm-arac-cubuk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.sm-arac-cubuk .ek-btn.birincil{color:#fff;}
.sm-ariza-sec{flex:1;min-width:180px;max-width:340px;}
.sm-ariza-sec select{padding:8px 30px 8px 10px;font-size:12.5px;}
.sm-ipucu-satir{font-size:11.5px;color:var(--text3);margin:0 2px 8px;}
.sm-svg-w{background:var(--sv-bg);border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;}
.sm-svg-w.tam{position:fixed;inset:0;z-index:2000;border-radius:0;display:flex;align-items:center;}
.sm-svg-w:fullscreen{display:flex;align-items:center;background:var(--sv-bg);}
#sm-svg{width:100%;}
.sv{display:block;width:100%;height:auto;font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;}
.sm-durum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.sm-chip{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);}
.sm-chip b{color:var(--text);font-weight:600;}
.sm-chip.on{border-color:var(--green-md);background:var(--green-lt);}

.sm-kalem-sonuc,.sm-ariza-bilgi{font-size:12.5px;padding:9px 12px;border-radius:var(--r-sm);margin-bottom:8px;line-height:1.5;}
.sm-kalem-sonuc{background:var(--cy-lt);border:1px solid var(--cy-md);}
.sm-ariza-bilgi{background:var(--amber-lt);border:1px solid var(--amber-md);}

.sm-lejant{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:10.5px;color:var(--text3);}
.sm-lejant span{display:inline-flex;align-items:center;gap:5px;}
.lj{display:inline-block;width:20px;height:4px;border-radius:2px;}
.lj.t-L{background:var(--c-l1);} .lj.t-L2{background:var(--c-l2);outline:1px solid #777;} .lj.t-L3{background:var(--c-l3);} .lj.t-N{background:var(--c-n);} .lj.t-PE{background:repeating-linear-gradient(90deg,var(--c-pe) 0 5px,var(--c-pe2) 5px 10px);} .lj.t-Ls{background:var(--c-ls);outline:1px dashed #777;} .lj.t-K{background:var(--c-k);} .lj.akim{background:repeating-linear-gradient(90deg,var(--c-ak) 0 4px,transparent 4px 9px);}
.sm-bilgi{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
.sm-bolum{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);}
.sm-bolum summary{padding:13px 16px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;}
.sm-bolum summary::after{content:'▾';color:var(--text3);}

/* SVG elemanları */
.sv-y{fill:var(--text2);font-size:11px;}
.sv-k{fill:var(--text);font-weight:600;}
.sv-c{stroke:var(--text2);stroke-width:2;fill:none;stroke-linecap:round;}
.sv-uc{fill:var(--text2);}
.sv-bicak{stroke:var(--text);stroke-width:3;stroke-linecap:round;transition:all .15s;}
.sv-bicak.kapali{stroke:var(--green);}
.sv-mek{stroke:var(--text3);stroke-width:1.5;stroke-dasharray:3 3;}
.sv-ipucu{fill:var(--mg-lt);stroke:var(--mg-md);stroke-width:1.5;animation:svNabiz 2.4s ease-in-out infinite;}
.sv-ipucu.basili{fill:var(--mg-md);}
.sv-ipucu.hata{fill:var(--red-lt);stroke:var(--red);}
@keyframes svNabiz{0%,100%{opacity:.55;}50%{opacity:1;}}
.tik{cursor:pointer;}
.tik:hover .sv-ipucu{stroke-width:3;opacity:1;}
.tik:active{opacity:.8;}
.tel{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s;}
.tel-hale{fill:none;stroke:var(--tel-hale);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;}
.tel.t-L,.tel.t-L1{stroke:var(--c-l1);} .tel.t-L2{stroke:var(--c-l2);} .tel.t-L3{stroke:var(--c-l3);} .tel.t-N{stroke:var(--c-n);} .tel.t-PE{stroke:var(--c-pe);}
.tel.t-Ls{stroke:var(--c-ls);} .tel.t-Lv{stroke:var(--c-lv);} .tel.t-K{stroke:var(--c-k);} .tel.t-D\+{stroke:var(--c-dp);} .tel.t-D-{stroke:var(--c-dn);} .tel.t-S{stroke:var(--c-s);} .tel.t-Z{stroke:var(--c-z);} .tel.t-Z2{stroke:var(--c-z2);}
.tel-pe-serit{fill:none;stroke:var(--c-pe2);stroke-width:3.2;stroke-dasharray:6 6;stroke-linecap:butt;}
.tel.olu,.tel-pe-serit.olu{opacity:.38;}
.tel.kisa{stroke:var(--red) !important;animation:svYanip .4s steps(2) infinite;}
.tel.ariza{stroke-dasharray:8 5;}
@keyframes svYanip{50%{opacity:.3;}}
.tel-akim{fill:none;stroke:var(--c-ak);stroke-width:1.8;stroke-dasharray:3 11;stroke-linecap:round;animation:svAkim .7s linear infinite;pointer-events:none;}
@keyframes svAkim{to{stroke-dashoffset:-14;}}
.tel-dokun{fill:none;stroke:transparent;stroke-width:16;pointer-events:none;}
.kalem .tel-dokun{pointer-events:stroke;cursor:crosshair;}
.kalem .tik{pointer-events:none;}
.tel-g.sec .tel{stroke-width:5.5;}
.tel-g.sec .tel-hale{stroke:var(--cy);stroke-width:10;opacity:.5;}
.sv-src{stroke:var(--surface);stroke-width:2;} .sv-src.p-l1{fill:var(--c-l1);} .sv-src.p-l2{fill:#555;} .sv-src.p-l3{fill:var(--c-l3);} .sv-src.p-n{fill:var(--c-n);} .sv-src.p-pe{fill:var(--c-pe);} .sv-src.p-arti{fill:var(--c-dp);} .sv-src.p-eksi{fill:var(--c-dn);} .sv-src.p-sinyal{fill:var(--c-s);}
.sv-src-y{fill:var(--text);font-weight:700;font-size:11px;}
.sv-j{fill:var(--text);}
.sv-bara-hale{stroke:var(--tel-hale);stroke-width:8;stroke-linecap:round;}
.sv-bara{stroke:var(--text3);stroke-width:4.5;stroke-linecap:round;} .sv-bara.olu{opacity:.35;}
.sv-bara.p-l1{stroke:var(--c-l1);} .sv-bara.p-l2{stroke:var(--c-l2);} .sv-bara.p-l3{stroke:var(--c-l3);} .sv-bara.p-n{stroke:var(--c-n);} .sv-bara.p-pe{stroke:var(--c-pe);} .sv-bara.p-arti{stroke:var(--c-dp);} .sv-bara.p-eksi{stroke:var(--c-dn);} .sv-bara.p-sinyal{stroke:var(--c-s);} .sv-bara.kisa{stroke:var(--red);}
.sv-lamba{fill:var(--surface);stroke:var(--text2);stroke-width:2;}
.sv-lamba.yanik{fill:#FFD54F;stroke:#FFB300;}
.sv-isik{fill:#FFD54F;filter:url(#parla);}
.sv-neon{fill:var(--surface2);stroke:var(--text3);stroke-width:1.5;} .sv-neon.aktif{fill:#FF7043;stroke:#FF5722;}
.sv-yuk{fill:var(--surface2);stroke:var(--border2);stroke-width:1.5;transition:all .2s;}
.sv-yuk.aktif{stroke:var(--green);fill:var(--green-lt);}
.sv-motor{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-motor.aktif{stroke:var(--green);} .sv-motor.kotu{stroke:var(--red);}
.sv-pervane{fill:var(--text2);}
.sv-don{animation:svDon .8s linear infinite;} .sv-don-ters{animation:svDon .8s linear infinite reverse;} .sv-don-yavas{animation:svDon 2.6s linear infinite;}
@keyframes svDon{to{transform:rotate(360deg);}}
.sv-bobin{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-bobin.aktif{fill:var(--purple-lt);stroke:var(--purple);}
.sv-mcb{fill:var(--surface2);stroke:var(--text2);stroke-width:1.5;} .sv-mcb.acik{stroke:var(--red);}
.sv-kol{fill:var(--text3);} .sv-kol.on{fill:var(--green);}
.sv-test{fill:var(--amber-lt);stroke:var(--amber);stroke-width:1.5;}
.sv-ariza-btn{fill:var(--surface);stroke:var(--border2);stroke-width:1.2;} .sv-ariza-btn.aktif{fill:var(--amber-lt);stroke:var(--amber);}
.sv-kirmizi{fill:var(--red);font-weight:700;} .sv-yesil{fill:var(--green);}
.sv-not{fill:var(--amber);font-weight:700;animation:svNot .6s ease-in-out infinite alternate;}
@keyframes svNot{to{transform:translateY(-4px);}}
.sv-titre{animation:svTitre .12s linear infinite alternate;} @keyframes svTitre{from{transform:rotate(-8deg);}to{transform:rotate(8deg);}}
.sv-zil{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-zil.aktif{fill:var(--amber-lt);stroke:var(--amber);}
.sv-priz{fill:var(--surface);stroke:var(--text2);stroke-width:2;} .sv-priz.cee{fill:#1565C0;fill-opacity:.25;}
.sv-delik{fill:var(--text2);} .sv-pe-kl{fill:var(--c-pe);}
.sv-fis{fill:var(--surface2);stroke:var(--text2);stroke-width:1.5;} .sv-fis.aktif{stroke:var(--green);}
.sv-insan{fill:none;stroke:var(--text);stroke-width:2.5;} .sv-insan-c{stroke:var(--text);stroke-width:2.5;stroke-linecap:round;} .sv-insan.carp,.sv-insan-c.carp{stroke:var(--red);animation:svYanip .25s steps(2) infinite;}
.sv-govde{fill:var(--surface2);stroke:var(--text2);stroke-width:2;} .sv-govde.canli{stroke:var(--red);animation:svYanip .5s steps(2) infinite;}
.sv-ekran{fill:#08150e;stroke:#1d4d31;stroke-width:1;} .sv-mono{font-family:'JetBrains Mono',monospace;fill:#3ddc84;}
.sv-depo{fill:none;stroke:var(--text2);stroke-width:2;} .sv-su{fill:rgba(0,150,255,.38);} .sv-flotor{fill:var(--amber);}
.sv-ibre{stroke:var(--red);stroke-width:2.5;stroke-linecap:round;}
.sv-panel{fill:#0d2a4a;stroke:#4a7dbd;stroke-width:1.5;} .sv-panel-c{stroke:#4a7dbd;stroke-width:1;}
.sv-soc{fill:rgba(0,200,100,.35);} .sv-soc.dusuk{fill:rgba(255,23,68,.35);}
.sv-simsek{stroke:#FFD600;stroke-width:3;fill:none;stroke-linejoin:round;}
.sv-dalga{stroke:var(--cy);stroke-width:2;fill:none;}
.sv-pir{fill:var(--surface);stroke:var(--text2);stroke-width:1.5;}
.sv-led{fill:var(--green);}
.sv-buyuk{font-size:18px;font-weight:800;fill:var(--mg);}
.sv-buton.yesil{fill:var(--green);} .sv-buton.kirmizi{fill:var(--red);} .sv-buton{fill:var(--text3);}
.sv-goz{fill:var(--surface);stroke:var(--text3);stroke-width:2;} .sv-goz.aktif{fill:#FF7043;stroke:#E64A19;} .sv-goz.asiri{fill:var(--red);animation:svYanip .3s steps(2) infinite;}
.sv-bolge{fill:var(--text3);fill-opacity:.05;stroke:var(--border2);stroke-dasharray:5 4;}
.sv-bolge-y{font-size:9.5px;fill:var(--text3);font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.sv-ozel-kutu{fill:var(--surface2);stroke:var(--border2);stroke-width:1.5;}
.sv-ozel-aktif{fill:var(--green-lt);stroke:var(--green);stroke-width:2;}
.sv-ozel-sec{fill:var(--mg-lt);stroke:var(--mg);stroke-width:2;}
.sv-yol{fill:none;stroke:var(--green);stroke-width:3.5;stroke-dasharray:6 6;animation:svAkim .6s linear infinite;}
.sv-yol-pasif{fill:none;stroke:var(--text3);stroke-width:2;opacity:.45;}
</style>

<body>
<header class="ek-top">
  <button class="ek-ikon-btn" id="ek-geri" onclick="geri()" title="Geri" aria-label="Geri">⬅️</button>
  <div class="ek-top-baslik"><h1 id="ek-top-h1">Şemalar</h1><p id="ek-top-p"></p></div>
  <button class="ek-ikon-btn" id="ek-tema-btn" onclick="EK.temaDegistir()" title="Tema" aria-label="Tema">☀️</button>
</header>
<main class="ek-icerik">
  <section id="sm-liste-v">
    <div class="ek-ara"><input id="sm-ara" type="search" placeholder="Ara: vavien, diafon, yıldız üçgen, multiswitch, KAR…" autocomplete="off" aria-label="Şema ara"></div>
    <div class="ek-cipler" id="sm-cipler"></div>
    <div id="sm-liste"></div>
  </section>
  <section id="sm-detay" style="display:none"></section>
</main>
<nav class="ek-nav" id="ek-nav"></nav>
<script>
/* ============================================================
   ŞEMA ELEMAN KÜTÜPHANESİ
   Her tip: uclar(e) → {ad:[x,y]}, baglar(e,R) → [[a,b]], kaynaklar(e,R) → [[uç, potansiyel]],
   yukler(e,R) → [{a,b,ad,gizli,kacak,kosul}], guncelle(e,R) → değişti mi, tik(e,R,dt) → değişti mi,
   aktif(e) → kontak sürücü durumu, ciz(e,R) → svg, tikla(e,b,R), bas/birak (anlık buton)
   ============================================================ */
const ET = {};
const SVG_ESC = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yz = (x, y, t, o) => `<text x="${x}" y="${y}" class="sv-y${o && o.c ? ' ' + o.c : ''}"${o && o.a ? ` text-anchor="${o.a}"` : ' text-anchor="middle"'}${o && o.s ? ` font-size="${o.s}"` : ''}>${SVG_ESC(t)}</text>`;
const nok = (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" class="sv-uc"/>`;
const tikG = (e, ic, b) => `<g class="tik" data-e="${e.id}"${b ? ` data-b="${b}"` : ''}>${ic}</g>`;
const DOK = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent"/>`;
const enMi = (R, e, ad) => R.yukEn[e.id + (ad ? '#' + ad : '')];
/* Kontak sürücüsünün durumu */
function surucuAktif(R, id, tip){
  const s = R.el[id]; if(!s) return false;
  const f = ET[s.tip].aktif; const a = f ? f(s, R) : !!s.st.en;
  if(tip === 'tno' || tip === 'tnc'){ const g = s.st.tamam; return tip === 'tno' ? g : !g; }
  return a;
}

/* ── Kaynak / bağlantı noktaları ── */
ET.src = {
  uclar:e => ({o:[e.x, e.y]}),
  kaynaklar:e => [['o', e.o.p]],
  ciz:(e, R) => {
    const p = e.o.p, ad = e.o.ad || p.replace(/^[a-z0-9]+:/, ''), y = e.o.yon || 'sol';
    const tx = y === 'sol' ? e.x - 10 : y === 'sag' ? e.x + 10 : e.x, ty = y === 'ust' ? e.y - 10 : y === 'alt' ? e.y + 17 : e.y + 4;
    return `<circle cx="${e.x}" cy="${e.y}" r="5" class="sv-src p-${potSinif(p)}"/>` + yz(tx, ty, ad, {a:y === 'sol' ? 'end' : y === 'sag' ? 'start' : 'middle', c:'sv-src-y'});
  }
};
ET.j = { uclar:e => ({o:[e.x, e.y]}), ciz:e => e.o.gizli ? '' : `<circle cx="${e.x}" cy="${e.y}" r="3.4" class="sv-j"/>` };
ET.bara = {
  uclar:e => { const o = {}; (e.o.tap || [0, e.o.uz]).forEach((t, i) => { o['t' + i] = e.o.dik ? [e.x, e.y + t] : [e.x + t, e.y]; }); return o; },
  baglar:e => (e.o.tap || [0, e.o.uz]).slice(1).map((t, i) => ['t' + i, 't' + (i + 1)]),
  ciz:(e, R) => { const L = e.o.uz; const [x2, y2] = e.o.dik ? [e.x, e.y + L] : [e.x + L, e.y];
    const pot = R.potNet(e.id + '.t0'), p = anaPot(pot), cls = p ? 'p-' + potSinif(p) + (kisaMi(pot) ? ' kisa' : '') : 'olu';
    return `<line x1="${e.x}" y1="${e.y}" x2="${x2}" y2="${y2}" class="sv-bara-hale"/><line x1="${e.x}" y1="${e.y}" x2="${x2}" y2="${y2}" class="sv-bara ${cls}"/>` + (e.o.tap || []).slice(1, -1).map(t => `<circle cx="${e.o.dik ? e.x : e.x + t}" cy="${e.o.dik ? e.y + t : e.y}" r="3.4" class="sv-j"/>`).join('') + (e.o.ad ? yz(e.o.dik ? e.x : e.x - 6, e.o.dik ? e.y - 8 : e.y + 4, e.o.ad, {a:e.o.dik ? 'middle' : 'end', c:'sv-k'}) : ''); }
};

/* ── Anahtarlar ── */
ET.sw = {
  uclar:e => e.o.dik ? {a:[e.x, e.y], b:[e.x, e.y + 44]} : {a:[e.x, e.y], b:[e.x + 44, e.y]},
  baglar:e => e.st.on ? [['a','b']] : [],
  tikla:e => { e.st.on = !e.st.on; },
  ilk:e => ({on:!!e.o.on}),
  ciz:e => {
    const d = e.o.dik, on = e.st.on;
    const bx = d ? (on ? e.x : e.x - 22) : (on ? e.x + 44 : e.x + 38), by = d ? (on ? e.y + 44 : e.y + 38) : (on ? e.y : e.y - 22);
    const g = nok(e.x, e.y) + nok(...(d ? [e.x, e.y + 44] : [e.x + 44, e.y])) + `<line x1="${e.x}" y1="${e.y}" x2="${bx}" y2="${by}" class="sv-bicak${on ? ' kapali' : ''}"/>`;
    const lb = e.o.ad ? yz(d ? e.x + 12 : e.x + 22, d ? e.y + 26 : e.y + 18, e.o.ad, {a:d ? 'start' : 'middle'}) : '';
    return tikG(e, (d ? DOK(e.x - 26, e.y - 4, 44, 52) : DOK(e.x - 4, e.y - 26, 52, 44)) + g + `<circle cx="${d ? e.x - 4 : e.x + 22}" cy="${d ? e.y + 22 : e.y - 6}" r="15" class="sv-ipucu"/>`) + lb;
  }
};
ET.sw2 = { // çift kutuplu (L+N) anahtar / ayırıcı
  uclar:e => ({a1:[e.x, e.y], b1:[e.x, e.y + 44], a2:[e.x + 26, e.y], b2:[e.x + 26, e.y + 44]}),
  baglar:e => e.st.on ? [['a1','b1'],['a2','b2']] : [],

  ciz:e => tikG(e, `<rect x="${e.x - 30}" y="${e.y - 22}" width="60" height="44" rx="8" class="sv-yuk${e.st.istek ? ' aktif' : ''}"/>` + yz(e.x, e.y - 4, e.st.istek ? '19°C 🥶' : '22°C 😊', {s:10.5}) + yz(e.x, e.y + 12, '📶 verici', {s:8.5})) + yz(e.x, e.y - 28, e.o.ad || 'Kablosuz termostat', {c:'sv-k'}) + (e.st.istek ? `<path d="M${e.x + 34} ${e.y - 10} q8 10 0 20 M${e.x + 40} ${e.y - 16} q12 16 0 32" class="sv-dalga"/>` : '')
};
ET.rfal = { // kablosuz alıcı: L,N besleme; C-NO kontak

      [['L', -24, -30], ['N', -8, -30], ['C', 8, 30], ['NO', 24, 30]].map(([t, dx, dy]) => `<line x1="${e.x + dx}" y1="${e.y + dy}" x2="${e.x + dx}" y2="${e.y + dy * 22 / 30}" class="sv-c"/>` + yz(e.x + dx, e.y + (dy < 0 ? -34 : 42), t, {s:8.5})).join(''); }
};
/* Klima iç / dış ünite */
ET.kic = {
  uclar:e => ({L:[e.x - 40, e.y + 30], N:[e.x - 20, e.y + 30], PE:[e.x, e.y + 30], '1':[e.x + 20, e.y + 30], '2':[e.x + 40, e.y + 30], S:[e.x + 60, e.y + 30]}),
  ilk:() => ({acik:false}),
  baglar:() => [['L','1'],['N','2']],
  yukler:e => [{a:'L', b:'N', ad:'İç ünite', gizli:1}],
  kaynaklar:(e, R) => R.yukEnOnce[e.id] && e.st.acik ? [['S', e.id + ':sig']] : [],
  tikla:e => { e.st.acik = !e.st.acik; },
  ciz:(e, R) => `<rect x="${e.x - 56}" y="${e.y - 24}" width="132" height="46" rx="10" class="sv-yuk${R.yukEn[e.id] && e.st.acik ? ' aktif' : ''}"/>` + yz(e.x + 10, e.y - 6, '❄️ İç ünite', {s:10.5}) +
    tikG(e, `<rect x="${e.x - 30}" y="${e.y + 2}" width="80" height="16" rx="5" class="sv-ariza-btn${e.st.acik ? ' aktif' : ''}"/>` + yz(e.x + 10, e.y + 14, e.st.acik ? '📱 kumanda: AÇIK' : '📱 kumanda: AÇ', {s:8.5})) +
    [['L', -40], ['N', -20], ['⏚', 0], ['1', 20], ['2', 40], ['S', 60]].map(([t, dx]) => `<line x1="${e.x + dx}" y1="${e.y + 22}" x2="${e.x + dx}" y2="${e.y + 30}" class="sv-c"/>` + yz(e.x + dx, e.y + 42, t, {s:8.5})).join('')
};
ET.kdis = {
  uclar:e => ({'1':[e.x - 30, e.y - 34], '2':[e.x - 10, e.y - 34], S:[e.x + 10, e.y - 34], PE:[e.x + 30, e.y - 34]}),
  yukler:e => [{a:'1', b:'2', ad:'Dış ünite', gizli:1}],
  calis:(e, R) => !!R.yukEn[e.id] && (R.potNet(e.id + '.S') || []).some(p => /:sig$/.test(p)),
  durum:(e, R) => [{ikon:'🌀', ad:'Dış ünite (kompresör)', durum:ET.kdis.calis(e, R) ? 'çalışıyor' : R.yukEn[e.id] ? 'beklemede (sinyal yok)' : 'enerjisiz', on:ET.kdis.calis(e, R)}],
  ciz:(e, R) => { const c = ET.kdis.calis(e, R);
    return `<rect x="${e.x - 46}" y="${e.y - 26}" width="92" height="56" rx="6" class="sv-yuk${c ? ' aktif' : ''}"/><circle cx="${e.x - 12}" cy="${e.y + 2}" r="18" class="sv-c" fill="none"/><g class="${c ? 'sv-don' : ''}" style="transform-origin:${e.x - 12}px ${e.y + 2}px"><path d="M${e.x - 12} ${e.y - 12} L${e.x - 8} ${e.y + 2} L${e.x - 12} ${e.y + 16} L${e.x - 16} ${e.y + 2} Z" class="sv-pervane"/></g>` + yz(e.x + 22, e.y + 6, 'Dış', {s:10}) +
      [['1', -30], ['2', -10], ['S', 10], ['⏚', 30]].map(([t, dx]) => `<line x1="${e.x + dx}" y1="${e.y - 34}" x2="${e.x + dx}" y2="${e.y - 26}" class="sv-c"/>` + yz(e.x + dx, e.y - 38, t, {s:8.5})).join(''); }
};

/* ── Frekans sürücüsü ── */
ET.vfd = {
  uclar:e => ({L:[e.x - 30, e.y - 34], N:[e.x - 10, e.y - 34], PE:[e.x + 10, e.y - 34], U:[e.x - 20, e.y + 34], V:[e.x, e.y + 34], W:[e.x + 20, e.y + 34]}),
  ilk:() => ({run:false, hz:50, ters:false}),
  yukler:e => [{a:'L', b:'N', ad:'Sürücü', gizli:1}],
  kaynaklar:(e, R) => R.yukEnOnce[e.id] && e.st.run ? (e.st.ters ? [['U','vfd:L1'],['V','vfd:L3'],['W','vfd:L2']] : [['U','vfd:L1'],['V','vfd:L2'],['W','vfd:L3']]) : [],
  tikla:(e, b) => { if(b === 'run') e.st.run = !e.st.run; else if(b === 'hz') e.st.hz = e.st.hz >= 50 ? 20 : e.st.hz + 15; else if(b === 'yon') e.st.ters = !e.st.ters; },
  ciz:(e, R) => { const g = R.yukEn[e.id];
    return `<rect x="${e.x - 48}" y="${e.y - 26}" width="96" height="52" rx="6" class="sv-yuk${g && e.st.run ? ' aktif' : ''}"/><rect x="${e.x - 40}" y="${e.y - 20}" width="44" height="16" rx="3" class="sv-ekran"/>` + yz(e.x - 18, e.y - 8, g ? (e.st.run ? e.st.hz + ' Hz' : 'STOP') : '—', {s:9, c:'sv-mono'}) +
      tikG(e, `<rect x="${e.x + 8}" y="${e.y - 20}" width="34" height="16" rx="4" class="sv-ariza-btn${e.st.run ? ' aktif' : ''}"/>` + yz(e.x + 25, e.y - 8, e.st.run ? 'STOP' : 'RUN', {s:8.5}), 'run') +
      tikG(e, `<rect x="${e.x - 40}" y="${e.y + 2}" width="36" height="16" rx="4" class="sv-ariza-btn"/>` + yz(e.x - 22, e.y + 14, 'Hz ±', {s:8.5}), 'hz') +
      tikG(e, `<rect x="${e.x + 2}" y="${e.y + 2}" width="40" height="16" rx="4" class="sv-ariza-btn"/>` + yz(e.x + 22, e.y + 14, e.st.ters ? 'geri ↺' : 'ileri ↻', {s:8.5}), 'yon') +
      [['L', -30, -34], ['N', -10, -34], ['⏚', 10, -34], ['U', -20, 34], ['V', 0, 34], ['W', 20, 34]].map(([t, dx, dy]) => `<line x1="${e.x + dx}" y1="${e.y + dy}" x2="${e.x + dx}" y2="${e.y + dy * 26 / 34}" class="sv-c"/>` + yz(e.x + dx + 7, e.y + dy - (dy > 0 ? 2 : -10), t, {s:8.5})).join('') + yz(e.x + 56, e.y + 4, e.o.ad || 'Frekans sürücüsü', {a:'start', c:'sv-k'}); }
};

/* ── Güneş / akü ── */
ET.panel = {
  uclar:e => ({'+':[e.x + 18, e.y + 32], '-':[e.x - 18, e.y + 32]}),
  ilk:() => ({gunes:true}), tikla:e => { e.st.gunes = !e.st.gunes; },
  kaynaklar:e => e.st.gunes ? [['+','pv:+'], ['-','pv:-']] : [],
  ciz:e => { let g = `<rect x="${e.x - 40}" y="${e.y - 22}" width="80" height="46" rx="3" class="sv-panel"/>`;
    for(let i = 1; i < 4; i++) g += `<line x1="${e.x - 40 + i * 20}" y1="${e.y - 22}" x2="${e.x - 40 + i * 20}" y2="${e.y + 24}" class="sv-panel-c"/>`;
    g += `<line x1="${e.x - 40}" y1="${e.y + 1}" x2="${e.x + 40}" y2="${e.y + 1}" class="sv-panel-c"/>` + `<line x1="${e.x + 18}" y1="${e.y + 24}" x2="${e.x + 18}" y2="${e.y + 32}" class="sv-c"/><line x1="${e.x - 18}" y1="${e.y + 24}" x2="${e.x - 18}" y2="${e.y + 32}" class="sv-c"/>`;
    return tikG(e, g + yz(e.x + 52, e.y - 8, e.st.gunes ? '☀️' : '☁️', {s:16, a:'start'})) + yz(e.x, e.y - 28, (e.o.ad || 'Panel') + (e.st.gunes ? ' · üretiyor' : ' · bulutlu/gece'), {c:'sv-k'}) + yz(e.x + 24, e.y + 30, '+', {s:10, a:'start'}) + yz(e.x - 24, e.y + 30, '−', {s:10, a:'end'}); }
};
ET.aku = {
  uclar:e => ({'+':[e.x + 18, e.y - 26], '-':[e.x - 18, e.y - 26]}),
  ilk:e => ({soc:e.o.soc || 60}),
  kaynaklar:e => e.st.soc > 3 ? [['+', (e.o.d || 'dc') + ':+'], ['-', (e.o.d || 'dc') + ':-']] : [],
  tik:(e, R, dt) => { const s0 = e.st.soc; const m = e.o.mppt && R.el[e.o.mppt]; if(m && m.st.sarj) e.st.soc += 3 * dt; const i = e.o.inv && R.el[e.o.inv]; if(i && i.st.yuklu) e.st.soc -= 2 * dt; e.st.soc = Math.max(0, Math.min(100, e.st.soc)); return Math.floor(s0) !== Math.floor(e.st.soc); },
  ciz:e => `<rect x="${e.x - 34}" y="${e.y - 18}" width="68" height="40" rx="4" class="sv-yuk"/><rect x="${e.x - 30}" y="${e.y - 14}" width="${60 * e.st.soc / 100}" height="32" rx="2" class="sv-soc${e.st.soc < 25 ? ' dusuk' : ''}"/>` + yz(e.x, e.y + 7, '🔋 %' + Math.round(e.st.soc), {s:10.5}) +
    `<rect x="${e.x + 13}" y="${e.y - 24}" width="10" height="6" class="sv-c"/><rect x="${e.x - 23}" y="${e.y - 24}" width="10" height="6" class="sv-c"/>` + yz(e.x + 30, e.y - 24, '+', {s:10}) + yz(e.x - 30, e.y - 24, '−', {s:10}) + yz(e.x, e.y + 36, e.o.ad || 'Akü', {c:'sv-k'})
};
ET.mppt = {
  uclar:e => ({'PV+':[e.x - 10, e.y - 30], 'PV-':[e.x - 30, e.y - 30], 'B+':[e.x + 30, e.y + 30], 'B-':[e.x + 10, e.y + 30]}),
  ilk:() => ({sarj:false}),
  guncelle:(e, R) => { const pv = (R.potNet(e.id + '.PV+') || []).includes('pv:+') && (R.potNet(e.id + '.PV-') || []).includes('pv:-');
    const b = (R.potNet(e.id + '.B+') || []).some(p => /:\+$/.test(p)); const s = pv && b; if(s !== e.st.sarj){ e.st.sarj = s; return true; } return false; },
  ciz:e => `<rect x="${e.x - 44}" y="${e.y - 22}" width="88" height="44" rx="6" class="sv-yuk${e.st.sarj ? ' aktif' : ''}"/>` + yz(e.x, e.y - 2, 'MPPT', {s:10.5, c:'sv-k'}) + yz(e.x, e.y + 12, e.st.sarj ? '⚡ şarj ediyor' : 'şarj yok', {s:9}) +
    [['PV+', -10, -30], ['PV−', -30, -30], ['B+', 30, 30], ['B−', 10, 30]].map(([t, dx, dy]) => `<line x1="${e.x + dx}" y1="${e.y + dy}" x2="${e.x + dx}" y2="${e.y + dy * 22 / 30}" class="sv-c"/>` + yz(e.x + dx, e.y + (dy < 0 ? -34 : 42), t, {s:8.5})).join('')
};
ET.inv = { // off-grid / hibrit inverter
  uclar:e => ({'DC+':[e.x + 10, e.y - 30], 'DC-':[e.x - 10, e.y - 30], Lg:[e.x - 40, e.y + 30], Ng:[e.x - 24, e.y + 30], L:[e.x + 24, e.y + 30], N:[e.x + 40, e.y + 30]}),
  ilk:() => ({on:true, yuklu:false}),
  dcVar:(e, R) => (R.potNet(e.id + '.DC+') || []).some(p => /:\+$/.test(p)) && (R.potNet(e.id + '.DC-') || []).some(p => /:-$/.test(p)),
  sebekeVar:(e, R) => (R.potNet(e.id + '.Lg') || []).some(p => /^L\d?$/.test(p)),
  baglar:(e, R) => e.o.hibrit && e.st.on && ET.inv.sebekeVar(e, R) ? [['Lg','L'],['Ng','N']] : [],
  kaynaklar:(e, R) => e.st.on && ET.inv.dcVar(e, R) && !(e.o.hibrit && ET.inv.sebekeVar(e, R)) ? [['L','inv:L'], ['N','inv:N']] : [],
  guncelle:(e, R) => { const y = e.st.on && ET.inv.dcVar(e, R) && !(e.o.hibrit && ET.inv.sebekeVar(e, R)) && R.akimUc[e.id + '.L']; if(!!y !== e.st.yuklu){ e.st.yuklu = !!y; return true; } return false; },
  tikla:e => { e.st.on = !e.st.on; },
  durum:(e, R) => { const s = ET.inv.sebekeVar(e, R), dc = ET.inv.dcVar(e, R), m = !e.st.on ? 'kapalı' : e.o.hibrit && s ? 'şebeke var — yükler şebekeden, akü şarjda' : dc ? 'aküden besliyor' : 'DC yok (akü boş/kopuk) — çıkış yok'; return [{ikon:'🔌', ad:e.o.ad || 'İnverter', durum:m, on:e.st.on && (dc || (e.o.hibrit && s)), kotu:e.st.on && !dc && !(e.o.hibrit && s)}]; },
  ciz:(e, R) => { const s = ET.inv.sebekeVar(e, R), dc = ET.inv.dcVar(e, R); const mod = !e.st.on ? 'kapalı' : e.o.hibrit && s ? 'şebeke geçiş' : dc ? 'aküden besliyor' : 'DC yok';
    return tikG(e, `<rect x="${e.x - 50}" y="${e.y - 22}" width="100" height="44" rx="6" class="sv-yuk${e.st.on && (dc || s) ? ' aktif' : ''}"/>` + yz(e.x, e.y - 3, (e.o.ad || 'İnverter') + (e.st.on ? '' : ' ⏻'), {s:10.5, c:'sv-k'}) + yz(e.x, e.y + 12, mod, {s:9})) +
      [['DC+', 10, -30], ['DC−', -10, -30]].concat(e.o.hibrit ? [['Lg', -40, 30], ['Ng', -24, 30]] : []).concat([['L', 24, 30], ['N', 40, 30]]).map(([t, dx, dy]) => `<line x1="${e.x + dx}" y1="${e.y + dy}" x2="${e.x + dx}" y2="${e.y + dy * 22 / 30}" class="sv-c"/>` + yz(e.x + dx, e.y + (dy < 0 ? -34 : 42), t, {s:8})).join(''); }
};
ET.ong = { // şebeke bağlı inverter (ada çalışma koruması)
  uclar:e => ({'DC+':[e.x + 10, e.y - 30], 'DC-':[e.x - 10, e.y - 30], L:[e.x - 10, e.y + 30], N:[e.x + 10, e.y + 30]}),
  uret:(e, R) => (R.potNet(e.id + '.DC+') || []).includes('pv:+') && (R.potNet(e.id + '.L') || []).some(p => /^L\d?$/.test(p)) && (R.potNet(e.id + '.N') || []).includes('N'),
  durum:(e, R) => { const pv = (R.potNet(e.id + '.DC+') || []).includes('pv:+'), s = (R.potNet(e.id + '.L') || []).some(p => /^L\d?$/.test(p)); return [{ikon:'🔆', ad:'On-grid inverter', durum:ET.ong.uret(e, R) ? 'şebekeye enerji veriyor' : pv && !s ? 'ŞEBEKE YOK — güvenlik için durdu' : 'üretim yok', on:ET.ong.uret(e, R), kotu:pv && !s}]; },
  ciz:(e, R) => { const u = ET.ong.uret(e, R);
    return `<rect x="${e.x - 46}" y="${e.y - 22}" width="92" height="44" rx="6" class="sv-yuk${u ? ' aktif' : ''}"/>` + yz(e.x, e.y - 3, 'On-grid inverter', {s:10, c:'sv-k'}) + yz(e.x, e.y + 12, u ? '→ şebekeye' : 'bekliyor', {s:9}) +
      [['DC+', 10, -30], ['DC−', -10, -30], ['L', -10, 30], ['N', 10, 30]].map(([t, dx, dy]) => `<line x1="${e.x + dx}" y1="${e.y + dy}" x2="${e.x + dx}" y2="${e.y + dy * 22 / 30}" class="sv-c"/>` + yz(e.x + dx, e.y + (dy < 0 ? -34 : 42), t, {s:8})).join(''); }
};

/* ── Diafon (4+n analog) ── */
ET.dpanel = {
  uclar:e => { const n = e.o.n || 1, x0 = e.x - (n + 3) * 10, L = ['+','-','S','K'].concat(Array.from({length:n}, (_, i) => 'c' + (i + 1))), o = {}; L.forEach((t, i) => o[t] = [x0 + i * 20, e.y + 50]); return o; },
  ilk:() => ({p:0, pt:0}),
  guc:(e, R) => (R.potNet(e.id + '.+') || []).some(p => /:\+$/.test(p)) && (R.potNet(e.id + '.-') || []).some(p => /:-$/.test(p)),
  baglar:e => e.st.p ? [['+', 'c' + e.st.p]] : [],
  kaynaklar:(e, R) => ET.dpanel.guc(e, R) ? [['S', 'ses:' + e.id]] : [],
  bas:(e, b) => { if(/^b\d+$/.test(b)){ e.st.p = +b.slice(1); e.st.pt = 0; } }, birak:e => { e.st.p = 0; },
  tikla:(e, b) => { if(/^b\d+$/.test(b)){ e.st.p = +b.slice(1); e.st.pt = 1.2; } },
  tik:(e, R, dt) => { if(e.st.pt > 0){ e.st.pt -= dt; if(e.st.pt <= 0){ e.st.p = 0; return true; } } return false; },
  ciz:(e, R) => { const n = e.o.n || 1, h = 40 + n * 20, w = Math.max(104, (n + 4) * 20 + 4); let g = `<rect x="${e.x - w / 2}" y="${e.y - h + 40}" width="${w}" height="${h}" rx="8" class="sv-yuk${ET.dpanel.guc(e, R) ? ' aktif' : ''}"/>` + yz(e.x, e.y - h + 56, (e.o.kamera ? '📷 ' : '🔊 ') + (e.o.ad || 'Zil paneli'), {s:9.5, c:'sv-k'});
    for(let i = 1; i <= n; i++){ const by = e.y - h + 56 + i * 20; g += tikG(e, `<rect x="${e.x - 38}" y="${by - 10}" width="76" height="16" rx="4" class="sv-ariza-btn${e.st.p === i ? ' aktif' : ''}"/>` + yz(e.x, by + 2, '🔘 Daire ' + i, {s:8.5}), 'b' + i); }
    const u = ET.dpanel.uclar(e);
    return g + Object.keys(u).map(t => `<line x1="${u[t][0]}" y1="${u[t][1]}" x2="${u[t][0]}" y2="${e.y + 40}" class="sv-c"/>` + yz(u[t][0], e.y + 62, t === '+' ? '+' : t === '-' ? '−' : t, {s:8.5})).join(''); }
};
ET.daire = {
  uclar:e => ({'+':[e.x - 40, e.y + 40], '-':[e.x - 20, e.y + 40], S:[e.x, e.y + 40], K:[e.x + 20, e.y + 40], c:[e.x + 40, e.y + 40]}),
  ilk:() => ({ahize:false, k:false, kt:0}),
  yukler:e => [{a:'c', b:'-', ad:(e.o.ad || 'Daire') + ' zili', ikon:'🔔', durum:['çalıyor','sessiz']}],
  baglar:e => e.st.k ? [['+','K']] : [],
  bas:(e, b) => { if(b === 'k'){ e.st.k = true; e.st.kt = 0; } }, birak:e => { e.st.k = false; },
  tikla:(e, b) => { if(b === 'ahize') e.st.ahize = !e.st.ahize; else if(b === 'k'){ e.st.k = true; e.st.kt = 1.5; } },
  tik:(e, R, dt) => { if(e.st.kt > 0){ e.st.kt -= dt; if(e.st.kt <= 0){ e.st.k = false; return true; } } return false; },
  konus:(e, R) => e.st.ahize && (R.potNet(e.id + '.S') || []).some(p => /^ses:/.test(p)),
  durum:(e, R) => [{ikon:'🔔', ad:(e.o.ad || 'Daire') + ' zili', durum:R.yukEn[e.id] ? 'çalıyor' : 'sessiz', on:!!R.yukEn[e.id]}, {ikon:'📞', ad:(e.o.ad || 'Daire') + ' ahize', durum:ET.daire.konus(e, R) ? 'kapıyla konuşuyor' : e.st.ahize ? 'kalktı (ses hattı yok)' : 'yerinde', on:ET.daire.konus(e, R)}],

'use strict';

/* ── Potansiyel yardımcıları ── */
const potAd = p => p.includes(':') ? p.slice(p.lastIndexOf(':') + 1) : p;
const potDom = p => /^(PE|TE)$/.test(p) ? '*' : p.includes(':') ? p.slice(0, p.lastIndexOf(':')) : 'ag';
function potTip(p){
  if(!p) return '';
  const a = potAd(p);
  if(a === 'N') return 'notr';
  if(a === 'PE' || a === 'TE') return 'pe';
  if(/^L\d?$/.test(a)) return 'faz';
  if(a === '+') return 'arti';
  if(a === '-') return 'eksi';
  if(a === 'a' || a === 'b') return 'sek';
  return 'sinyal';
}
const TOPRAK_REF = new Set(['ag','jen','inv','vfd']);
function potSinif(p){ const a = potAd(p), d = potDom(p); if(a === 'PE' || a === 'TE') return 'pe'; if(a === 'N') return 'n'; if(a === 'L2') return 'l2'; if(a === 'L3') return 'l3'; if(/^L/.test(a)) return 'l1'; if(a === '+') return 'arti'; if(a === '-') return 'eksi'; if(d === 'ag') return 'l1'; return 'sinyal'; }
const ONCELIK = {faz:5, sek:4, arti:4, eksi:4, notr:2, pe:1, sinyal:3};
function anaPot(L){ if(!L || !L.length) return null; return L.slice().sort((a, b) => (ONCELIK[potTip(b)] || 0) - (ONCELIK[potTip(a)] || 0))[0]; }
function kisaMi(L){
  if(!L || L.length < 2) return false;
  for(let i = 0; i < L.length; i++) for(let j = i + 1; j < L.length; j++){
    const a = L[i], b = L[j], ta = potTip(a), tb = potTip(b), da = potDom(a), db = potDom(b);
    if((ta === 'faz' && tb === 'faz') || (ta === 'sek' && tb === 'sek') || ((ta === 'arti' && tb === 'eksi') || (ta === 'eksi' && tb === 'arti')) && da === db) return true;
    if(ta === 'faz' && tb === 'notr' || ta === 'notr' && tb === 'faz') return true;
    if((ta === 'faz' && b === 'PE' && TOPRAK_REF.has(da)) || (tb === 'faz' && a === 'PE' && TOPRAK_REF.has(db))) return true;
  }
  return false;
}
const ttKacak = L => L && L.includes('TE') && L.some(p => potTip(p) === 'faz');
function gerilim(R, A, B){
  const pa = anaPot(A), pb = anaPot(B);
  if(!pa || !pb || pa === pb) return 0;
  const ta = potTip(pa), tb = potTip(pb), da = potDom(pa), db = potDom(pb);
  if(da === '*' || db === '*'){ const [f, d] = da === '*' ? [tb, db] : [ta, da]; return f === 'faz' && TOPRAK_REF.has(d) ? 230 : 0; }
  if(da !== db) return 0;
  if(ta === 'faz' && tb === 'faz') return 400;
  if((ta === 'faz' && tb === 'notr') || (tb === 'faz' && ta === 'notr')) return 230;
  if(ta === 'sek' && tb === 'sek') return R.domV[da] || 12;
  if((ta === 'arti' && tb === 'eksi') || (ta === 'eksi' && tb === 'arti')) return R.domV[da] || 12;
  return 0;
}

/* ── Çalışma zamanı ── */
function kur(d, arizaId){
  const R = {d, el:{}, liste:[], teller:[], yukEn:{}, yukEnOnce:{}, domV:{}, glob:{cagri:0, cagriT:0, kapi:0, konus:0}, akimTel:new Set(), akimUc:{}, kisa:false, mesaj:[]};
  const ar = arizaId && d.ariza ? d.ariza.find(a => a.id === arizaId) : null;
  (d.e || []).forEach(x => {
    const [tip, id, X, Y, o] = x; if(!ET[tip]) { console.warn('tip yok', tip); return; }
    const e = {tip, id, x:X, y:Y, o:Object.assign({}, o || {}), st:{}};
    if(ar && ar.o && ar.o[id]) Object.assign(e.o, ar.o[id]);
    e.st = ET[tip].ilk ? ET[tip].ilk(e) : {};
    if(ar && ar.st && ar.st[id]) Object.assign(e.st, ar.st[id]);
    if(R.el[id]) console.warn('çift id', d.id, id);
    R.el[id] = e; R.liste.push(e);
  });
  let tl = (d.t || []).map((t, i) => ({a:t[0], b:t[1], r:t[2] || 'L', rota:t[3], id:t[4] || ('w' + i)}));
  if(ar){
    if(ar.kop) tl = tl.filter(w => !ar.kop.includes(w.id));
    if(ar.ekle) tl = tl.concat(ar.ekle.map((t, i) => ({a:t[0], b:t[1], r:t[2] || 'L', rota:t[3], id:'x' + i, ariza:true})));
    if(ar.degis) tl.forEach(w => { const c = ar.degis[w.id]; if(c) Object.assign(w, c); });
  }
  R.teller = tl;
  R.toprak = d.toprak || 'PE';
  R.pot = {}; R.net = k => k; R.potNet = () => [];
  coz(R);
  return R;
}
function ucPoz(R, k){
  const i = k.indexOf('.'), id = k.slice(0, i), t = k.slice(i + 1), e = R.el[id];
  if(!e){ console.warn('eleman yok', k); return [0, 0]; }
  const u = ET[e.tip].uclar(e); if(!u[t]){ console.warn('uç yok', k); return [e.x, e.y]; }
  return u[t];
}
function coz(R){
  for(let dis = 0; dis < 8; dis++){
    let ic;
    for(ic = 0; ic < 16; ic++){
      const P = {};
      const bul = k => { while(P[k] !== undefined && P[k] !== k){ P[k] = P[P[k]] === undefined ? P[k] : P[P[k]]; k = P[k]; } return k; };
      const bir = (a, b) => { if(P[a] === undefined) P[a] = a; if(P[b] === undefined) P[b] = b; const ra = bul(a), rb = bul(b); if(ra !== rb) P[ra] = rb; };
      R.liste.forEach(e => { const u = ET[e.tip].uclar(e); Object.keys(u).forEach(t => { const k = e.id + '.' + t; if(P[k] === undefined) P[k] = k; }); });
      R.teller.forEach(w => bir(w.a, w.b));
      R.ic = [];
      R.liste.forEach(e => { const f = ET[e.tip].baglar; if(f) f(e, R).forEach(([a, b]) => { bir(e.id + '.' + a, e.id + '.' + b); R.ic.push([e.id + '.' + a, e.id + '.' + b]); }); });
      R.net = k => P[k] === undefined ? k : bul(k);
      const pot = {}; R.kaynakUc = [];
      R.domV = {};
      R.liste.forEach(e => { const f = ET[e.tip].kaynaklar; if(f) f(e, R).forEach(([t, p]) => { const r = R.net(e.id + '.' + t); (pot[r] = pot[r] || new Set()).add(p); R.kaynakUc.push([e.id + '.' + t, p]); }); if(e.tip === 'trafo') R.domV[e.id] = e.o.v || 12; });
      R.pot = pot;
      R.potNet = k => { const s = pot[R.net(k)]; return s ? [...s] : []; };
      const yuk = {};
      R.yukListe = [];
      R.liste.forEach(e => { const f = ET[e.tip].yukler; if(!f) return; f(e, R).forEach(y => {
        const key = e.id + (y.gizli && y.ad && f(e, R).length > 1 ? '#' + y.ad : '');
        const A = R.potNet(e.id + '.' + y.a), B = y.b === 'TOPRAK' ? [R.toprak] : R.potNet(e.id + '.' + y.b);
        let V = y.kosul ? y.kosul(A, B) : gerilim(R, A, B);
        if(V) yuk[key] = {V, e, y};
        R.yukListe.push({key, e, y});
      }); });
      R.yukEn = yuk;
      let degis = false;
      R.liste.forEach(e => { const f = ET[e.tip].guncelle; if(f && f(e, R)) degis = true; });
      const once = JSON.stringify(Object.keys(R.yukEnOnce).sort()), simdi = JSON.stringify(Object.keys(yuk).sort());
      R.yukEnOnce = Object.assign({}, yuk);
      if(once !== simdi) degis = true;
      if(!degis) break;
    }
    // Koruma
    let atti = false;
    R.kisa = false;
    const kisaNet = Object.keys(R.pot).filter(r => kisaMi([...R.pot[r]]));
    if(kisaNet.length){
      const aday = R.liste.filter(e => ET[e.tip].koruma && e.st.on && Object.keys(ET[e.tip].uclar(e)).some(t => kisaNet.includes(R.net(e.id + '.' + t))));
      if(aday.length){
        const pe = kisaNet.some(r => [...R.pot[r]].includes('PE'));
        let sec = (pe ? aday.filter(e => ET[e.tip].koruma === 'kar') : []);
        if(!sec.length) sec = aday;
        const k = sec.sort((a, b) => (b.o.kademe || 1) - (a.o.kademe || 1))[0];
        k.st.on = false; k.st.atti = ET[k.tip].koruma === 'kar' ? 'kacak' : true; atti = true;
        R.mesaj.push((ET[k.tip].koruma === 'kar' ? '⚡ Kaçak/toprak kısa devresi: ' : '⚡ Kısa devre: ') + (k.o.ad || k.id) + ' attı.');
      } else R.kisa = true;
    }
    if(!atti){
      R.liste.filter(e => e.tip === 'kar' && e.st.on).forEach(k => {
        if(atti) return;
        const n = k.o.n || 2, faz = []; for(let i = 1; i < n; i++) faz.push(R.net(k.id + '.b' + i));
        const nN = R.net(k.id + '.b' + n);
        let kacak = faz.some(f => ttKacak(R.pot[f] ? [...R.pot[f]] : [])) || (R.pot[nN] ? [...R.pot[nN]] : []).some(p => p === 'PE' || p === 'TE');
        Object.values(R.yukEn).forEach(({e, y}) => {
          const a = R.net(e.id + '.' + y.a), b = y.b === 'TOPRAK' ? '__toprak' : R.net(e.id + '.' + y.b);

        });
        if(kacak){ k.st.on = false; k.st.atti = 'kacak'; atti = true; R.mesaj.push('⚡ ' + (k.o.ad || 'KAR') + ' kaçak akım algıladı ve attı (' + (k.o.mA || 30) + ' mA).'); }

}
/* Enerjili yüklerden kaynaklara en kısa yol: akım geçen teller */
function akimYolu(R){
  const kom = {};
  const ekle = (a, b, w) => { (kom[a] = kom[a] || []).push([b, w]); (kom[b] = kom[b] || []).push([a, w]); };
  R.teller.forEach(w => ekle(w.a, w.b, w.id));
  (R.ic || []).forEach(([a, b]) => ekle(a, b, null));
  const kay = {}; R.kaynakUc.forEach(([k, p]) => { (kay[p] = kay[p] || []).push(k); });
  R.akimTel = new Set(); R.akimUc = {};
  const yol = (bas, hedefPot) => {
    const hedef = new Set(kay[hedefPot] || []); if(!hedef.size) return;
    const once = {[bas]:null}, q = [bas]; let bulundu = null;
    while(q.length){ const n = q.shift(); if(hedef.has(n)){ bulundu = n; break; } (kom[n] || []).forEach(([m, w]) => { if(!(m in once)){ once[m] = [n, w]; q.push(m); } }); }
    let n = bulundu; while(n && once[n]){ const [p, w] = once[n]; if(w) R.akimTel.add(w); R.akimUc[n] = true; n = p; } if(bulundu) R.akimUc[bas] = true;
  };
  Object.values(R.yukEn).forEach(({e, y}) => {
    [y.a, y.b].forEach(t => { if(t === 'TOPRAK') return; const k = e.id + '.' + t; const p = anaPot(R.potNet(k)); if(p) yol(k, p); });
  });
}

/* ── Çizim ── */
function telNoktalar(R, w){
  const a = ucPoz(R, w.a), b = ucPoz(R, w.b);
  let P = [a];
  if(Array.isArray(w.rota)) P = P.concat(w.rota);
  else if(a[0] !== b[0] && a[1] !== b[1]) P.push(w.rota === 'vh' ? [a[0], b[1]] : [b[0], a[1]]);
  P.push(b);
  return P;
}
function svgCiz(R){
  const d = R.d;
  let h = `<svg viewBox="0 0 ${d.w || 720} ${d.h || 400}" xmlns="http://www.w3.org/2000/svg" class="sv" style="min-width:${Math.min(d.w || 720, d.minw || 600)}px">`;
  h += `<defs><filter id="parla" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  (d.bolge || []).forEach(b => { h += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="10" class="sv-bolge"/>` + (b[4] ? `<text x="${b[0] + 10}" y="${b[5] === 'alt' ? b[1] + b[3] - 8 : b[1] + 16}" class="sv-bolge-y">${SVG_ESC(b[4])}</text>` : ''); });
  (d.yazi || []).forEach(y => { h += yz(y[0], y[1], y[2], y[3] || {}); });
  // Teller
  R.teller.forEach(w => {
    const P = telNoktalar(R, w).map(p => p.join(',')).join(' ');
    const net = R.net(w.a), pot = R.pot[net] ? [...R.pot[net]] : [];
    const kisa = kisaMi(pot), akim = R.akimTel.has(w.id);
    const cls = `tel t-${w.r}${pot.length ? '' : ' olu'}${kisa ? ' kisa' : ''}${w.ariza ? ' ariza' : ''}`;
    h += `<g class="tel-g" data-net="${SVG_ESC(net)}" data-w="${w.id}"><polyline points="${P}" class="tel-hale"/><polyline points="${P}" class="${cls}"/>` + (w.r === 'PE' ? `<polyline points="${P}" class="tel-pe-serit${pot.length ? '' : ' olu'}"/>` : '') + (akim ? `<polyline points="${P}" class="tel-akim"/>` : '') + `<polyline points="${P}" class="tel-dokun"/></g>`;
  });
  R.liste.forEach(e => { h += `<g class="el el-${e.tip}">` + ET[e.tip].ciz(e, R) + '</g>'; });
  return h + '</svg>';
}
function durumlar(R){
  const L = [];
  R.liste.forEach(e => {
    const t = ET[e.tip];
    if(t.durum){ t.durum(e, R).forEach(x => L.push(x)); return; }
    if(!t.yukler) return;
    t.yukler(e, R).forEach(y => { if(y.gizli) return; const en = R.yukEn[e.id]; L.push({ikon:y.ikon || '⚙️', ad:y.ad, durum:en ? y.durum[0] + (en.V > 300 && e.tip !== 'yuk' ? ' (400 V!)' : '') : y.durum[1], on:!!en, kotu:y.kacak && !!en}); });
  });
  R.liste.filter(e => ET[e.tip].koruma && e.st.atti).forEach(e => L.unshift({ikon:'⚡', ad:e.o.ad || e.id, durum:e.st.atti === 'test' ? 'test ile attı' : e.st.atti === 'kacak' ? 'KAÇAKTAN ATTI' : 'ATTI', kotu:true}));
  if(R.kisa) L.unshift({ikon:'💥', ad:'Kısa devre', durum:'koruma yok, hat yanar!', kotu:true});
  return L;
}

/* ── Arayüz ── */
function semaCiz(){
  const d = SM.aktif, R = SM.R;
  if(d.ozel){ $s('sm-svg').innerHTML = `<svg viewBox="0 0 ${d.w || 720} ${d.h || 400}" xmlns="http://www.w3.org/2000/svg" class="sv" style="min-width:${Math.min(d.w || 720, d.minw || 600)}px">${d.ozel.ciz(SM.ost)}</svg>`; const ds = d.ozel.durum ? d.ozel.durum(SM.ost) : []; $s('sm-durum').innerHTML = ds.map(chip).join(''); return; }
  $s('sm-svg').innerHTML = svgCiz(R);
  $s('sm-durum').innerHTML = durumlar(R).map(chip).join('') + (R.mesaj.length ? `<div class="sm-mesaj">${R.mesaj.slice(-2).map(SVG_ESC).join('<br>')}</div>` : '');
}
const chip = x => `<span class="sm-chip${x.on ? ' on' : ''}${x.kotu ? ' kotu' : ''}">${x.ikon || ''} <b>${SVG_ESC(x.ad)}</b> ${SVG_ESC(x.durum)}</span>`;
function yeniden(){ if(!SM.aktif || SM.aktif.ozel) return; SM.R.mesaj = []; coz(SM.R); semaCiz(); }
function svgOlaylar(){
  const kutu = $s('sm-svg');
  const hedef = ev => ev.target.closest('.tik');
  kutu.addEventListener('pointerdown', ev => {
    if(SM.kalem){ return; }
    const g = hedef(ev); if(!g) return;
    if(SM.aktif.ozel){ return; }
    const e = SM.R.el[g.dataset.e]; if(!e) return; const T = ET[e.tip];
    if(T.bas && (g.dataset.b === 'basili' || /^b\d+$/.test(g.dataset.b || '') || g.dataset.b === 'k')){ T.bas(e, g.dataset.b, SM.R); SM.basili = e; SM.basZaman = Date.now(); yeniden(); ev.preventDefault(); }
  });
  window.addEventListener('pointerup', () => {
    if(SM.basili){ const e = SM.basili; SM.basili = null; const T = ET[e.tip]; if(Date.now() - SM.basZaman < 250){ /* kısa dokunuş: darbe süresi kadar basılı kalsın */ if(e.tip === 'btn'){ e.st.pt = 0.8; } else if(e.tip === 'dpanel'){ e.st.pt = 1.2; } else if(e.tip === 'daire'){ e.st.kt = 1.5; } } else T.birak(e, SM.R); yeniden(); }
  });
  kutu.addEventListener('click', ev => {
    if(SM.kalem){ kalemOlc(ev); return; }
    const g = hedef(ev); if(!g) return;

/* Ortak çizim yardımcıları */
const ob = (x, y, w, h, ad, alt, b, cls) => (b ? `<g class="tik" data-b="${b}">` : '') + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="${cls || 'sv-ozel-kutu'}"/>` +
  `<text x="${x + w / 2}" y="${y + (alt ? h / 2 - 2 : h / 2 + 4)}" class="sv-y sv-k" text-anchor="middle" font-size="10.5" pointer-events="none">${SVG_ESC(ad)}</text>` +
  (alt ? `<text x="${x + w / 2}" y="${y + h / 2 + 12}" class="sv-y" text-anchor="middle" font-size="9" pointer-events="none">${SVG_ESC(alt)}</text>` : '') + (b ? '</g>' : '');
const oh = (pts, renk, o) => { o = o || {}; const d = 'M' + pts.map(p => p.join(' ')).join(' L');
  return `<path d="${d}" fill="none" stroke="${renk}" stroke-width="${o.g || 4}" stroke-linejoin="round" stroke-linecap="round"${o.kesik ? ' stroke-dasharray="6 6"' : ''}${o.op ? ` opacity="${o.op}"` : ''}/>` + (o.akim ? `<path d="${d}" class="tel-akim"/>` : ''); };
const obtn = (x, y, w, ad, b, aktif) => `<g class="tik" data-b="${b}"><rect x="${x}" y="${y}" width="${w}" height="26" rx="7" class="sv-ariza-btn${aktif ? ' aktif' : ''}"/><text x="${x + w / 2}" y="${y + 17}" class="sv-y" text-anchor="middle" font-size="9.5" pointer-events="none">${SVG_ESC(ad)}</text></g>`;
const obar = (x, y, w, oran, iyi) => `<rect x="${x}" y="${y}" width="${w}" height="10" rx="5" class="sv-ozel-kutu"/><rect x="${x}" y="${y}" width="${Math.max(0, Math.min(1, oran)) * w}" height="10" rx="5" fill="${iyi ? 'var(--green)' : 'var(--red)'}"/>`;
const KOAKS = '#9aa4ad', FIBER = '#F2C200', UTP = '#4F8DFF';
const canak = (x, y) => `<path d="M${x} ${y - 46} Q${x + 34} ${y} ${x} ${y + 46}" fill="none" stroke="var(--text2)" stroke-width="5"/><line x1="${x + 6}" y1="${y + 40}" x2="${x + 6}" y2="${y + 70}" stroke="var(--text3)" stroke-width="4"/>`;
const lnbCiz = (x, y, ad) => `<rect x="${x}" y="${y - 10}" width="34" height="20" rx="5" class="sv-ozel-aktif"/>` + sy(x + 17, y + 4, ad || 'LNB', {s:8.5});
const TP = [['10,962 GHz Yatay', 'H', 0], ['11,096 GHz Dikey', 'V', 0], ['11,794 GHz Yatay', 'H', 1], ['12,380 GHz Dikey', 'V', 1]];
const msGir = t => (TP[t][1] === 'H' ? 2 : 0) + TP[t][2];
const tpAciklama = i => { const t = TP[i]; return `${t[1] === 'H' ? '18 V (yatay)' : '13 V (dikey)'} + ${t[2] ? '22 kHz (üst bant)' : '0 kHz (alt bant)'}`; };

sema({id:'lnb_twin', kat:'uydu', ikon:'👯', ad:'Twin LNB · İki Bağımsız Alıcı', ozet:'Twin LNB’nin her çıkışı ayrı alıcıya gider; iki TV farklı kanalları bağımsız izler. Tek çıkışı bölmek çalışmaz.', etiket:['twin lnb','çift çıkışlı lnb','iki alıcı','splitter','bölücü','uydu iki tv'],
  w:660, h:360, minw:520,
  ozel:{ilk:() => ({a:0, b:3, bol:false}),
    tikla:(st, b) => { if(b === 'a') st.a = (st.a + 1) % 4; if(b === 'b') st.b = (st.b + 1) % 4; if(b === 'bol') st.bol = !st.bol; },
    ciz:st => { const sonuc = twinSonuc(st);
      let h = canak(60, 150) + `<rect x="84" y="134" width="40" height="34" rx="5" class="sv-ozel-aktif"/>` + sy(104, 155, st.bol ? 'LNB' : 'Twin', {s:8.5});
      if(!st.bol){ h += oh([[124, 142], [260, 142], [260, 100], [380, 100]], KOAKS, {g:5, akim:sonuc[0]}) + oh([[124, 160], [260, 160], [260, 240], [380, 240]], KOAKS, {g:5, akim:sonuc[1]}); }
      else { h += oh([[124, 150], [230, 150]], KOAKS, {g:5, akim:true}) + `<rect x="230" y="134" width="46" height="32" rx="5" class="sv-ozel-sec"/>` + sy(253, 154, 'bölücü', {s:8.5}) + oh([[276, 142], [300, 142], [300, 100], [380, 100]], KOAKS, {g:5, akim:sonuc[0]}) + oh([[276, 160], [300, 160], [300, 240], [380, 240]], KOAKS, {g:5, akim:sonuc[1]}); }
      h += ob(380, 72, 150, 56, 'Alıcı 1', sonuc[0] ? TP[st.a][0] : 'GÖRÜNTÜ YOK', 'a', sonuc[0] ? 'sv-ozel-aktif' : 'sv-ozel-kutu') + ob(380, 212, 150, 56, 'Alıcı 2', sonuc[1] ? TP[st.b][0] : 'GÖRÜNTÜ YOK', 'b', sonuc[1] ? 'sv-ozel-aktif' : 'sv-ozel-kutu');
      h += sy(455, 144, 'kanal değiştir 👆', {s:9}) + sy(455, 284, 'kanal değiştir 👆', {s:9});
      h += obtn(20, 310, 260, st.bol ? '✕ Tek çıkış + bölücü (yanlış)' : '✓ Twin LNB (doğru)', 'bol', st.bol);
      return h; },
    durum:st => { const s = twinSonuc(st), L = [];
      if(st.bol){ const V = TP[st.a][1] === 'H' || TP[st.b][1] === 'H' ? 'yatay (18 V baskın)' : 'dikey', B = TP[st.a][2] || TP[st.b][2] ? 'üst bant (22 kHz)' : 'alt bant';
        L.push({ikon:'⚠️', ad:'Tek LNB', durum:`İki alıcı aynı LNB’ye farklı komut gönderiyor. LNB şu an ${V}, ${B} durumunda; bu ayarı istemeyen alıcıda görüntü gider.`, kotu:true}); }
      [st.a, st.b].forEach((t, i) => L.push({ikon:'📺', ad:'Alıcı ' + (i + 1), durum:s[i] ? `izliyor · ${tpAciklama(t)}` : 'istediği polarite/bant yok — görüntü gelmiyor', on:s[i], kotu:!s[i]}));
      return L; }},
  bilgi:{
    nasil:'<p>Universal LNB tek bir anda yalnız <b>bir</b> polarite ve banda ayarlanabilir. İki alıcı farklı polarite/bant isterse tek LNB çıkışından ikisine birden hizmet edilemez. <b>Twin LNB</b>’de iki bağımsız çıkış vardır; her alıcı kendi çıkışını yönetir. 4 TV için <b>quad</b> LNB, daha fazlası için <b>quattro LNB + multiswitch</b> kullanılır.</p>',
    damar:[['Her çıkış → bir alıcı','ayrı RG6 hat']],
    malzeme:['Twin (2), quad (4) veya octo (8) LNB','Her alıcı için ayrı kablo'],
    adim:['Her odaya LNB’den ayrı kablo çek.','Boşta kalan LNB çıkışlarını kapakla kapat.'],
    hata:['Uydu hattını anten bölücüsüyle bölmek: kanallar yarım çalışır.'],
    test:['İki alıcıda farklı polarite/banttaki kanalları aynı anda aç.'],
    hesap:['uydu'], ilgili:['lnb_tek','multiswitch']
  }
});
function twinSonuc(st){
  if(!st.bol) return [true, true];
  const V = TP[st.a][1] === 'H' || TP[st.b][1] === 'H' ? 'H' : 'V', B = TP[st.a][2] || TP[st.b][2] ? 1 : 0;
  return [st.a, st.b].map(t => TP[t][1] === V && TP[t][2] === B);
}

/* H6 — Anten yükselteci ve dağıtım */
sema({id:'anten_amp', kat:'uydu', ikon:'📶', ad:'Karasal Anten · Yükselteç ve Bölücü', ozet:'Sinyal anten → yükselteç → bölücü → kablo → TV yolunda kazanç ve kayıplarla değişir. Hedef: TV girişinde 50–75 dBµV.', etiket:['anten yükselteci','amplifikatör','bölücü','splitter','dbµv','karasal sinyal','anten dağıtım'],
  w:680, h:360, minw:540,
  ozel:{ilk:() => ({amp:true, k:20, bol:4, uz:30}),
    tikla:(st, b) => { if(b === 'amp') st.amp = !st.amp; if(b === 'k') st.k = st.k === 10 ? 20 : st.k === 20 ? 30 : 10; if(b === 'bol') st.bol = st.bol === 2 ? 4 : st.bol === 4 ? 8 : 2; if(b === 'uz') st.uz = st.uz === 15 ? 30 : st.uz === 30 ? 60 : 15; },
    ciz:st => { const r = antenHesap(st);
      let h = `<path d="M30 80 L90 80 M40 64 V96 M52 58 V102 M64 54 V106 M76 58 V102" stroke="var(--text2)" stroke-width="3"/>` + sy(60, 124, `Anten ${r.a} dBµV`, {s:9});
      h += oh([[90, 80], [150, 80], [150, 160], [180, 160]], '#8a6', {g:4, akim:true});
      h += ob(180, 135, 110, 50, st.amp ? `Yükselteç +${st.k} dB` : 'Yükselteç yok', '', 'amp', st.amp ? 'sv-ozel-aktif' : 'sv-ozel-kutu');
      h += oh([[290, 160], [340, 160]], '#8a6', {g:4, akim:true}) + ob(340, 135, 90, 50, `${st.bol}’li bölücü`, `−${r.bk} dB`, 'bol', 'sv-ozel-sec');
      for(let i = 0; i < Math.min(st.bol, 4); i++){ const y = 70 + i * 60; h += oh([[430, 160], [470, 160], [470, y + 18], [540, y + 18]], '#8a6', {g:2.5}) + ob(540, y, 110, 36, '📺 TV ' + (i + 1), Math.round(r.tv) + ' dBµV', null, r.ok ? 'sv-ozel-aktif' : 'sv-ozel-kutu'); }
      h += sy(600, 296, `${st.uz} m kablo: −${r.ck.toFixed(1).replace('.', ',')} dB`, {s:9});
      h += obtn(20, 300, 140, `Kazanç: ${st.k} dB`, 'k') + obtn(170, 300, 110, `Kablo: ${st.uz} m`, 'uz') + obtn(290, 300, 110, `Bölücü: ${st.bol}’li`, 'bol') + obtn(410, 300, 110, st.amp ? 'Yükselteç: var' : 'Yükselteç: yok', 'amp', !st.amp);
      return h; },

    damar:[['Her TV’ye','ayrı RG6 hat (yıldız)']],
    malzeme:['Anten yükselteci (hat besleme adaptörlü)','Bölücü (splitter) — kullanılmayan çıkışlara 75 Ω sonlandırıcı','RG6 kablo, F konnektör'],

function antenHesap(st){ const a = 50, bk = {2:4, 4:8, 8:12}[st.bol], ck = st.uz * 0.18, tv = a + (st.amp ? st.k : 0) - bk - ck; return {a, bk, ck, tv, ok:tv >= 50 && tv <= 80}; }

const AG_BILGI = {ont:'Operatörün hattını (fiber/VDSL) Ethernet’e çevirir. Genelde router ile birleşik gelir.', rt:'Ev ağını (192.168.1.x) yönetir, IP dağıtır (DHCP), internete çıkış yapar.', sw:'Kablolu cihazları çoğaltır. PoE switch kamera ve AP’ye kablodan elektrik verir.', pc:'Kablolu bağlantı: en kararlı ve hızlı.', ap:'Uzak odalarda Wi-Fi kapsaması için; PoE ile beslenir.', cam:'PoE ile tek kablodan hem veri hem enerji alır.', tv:'Kablolu bağlanırsa 4K akış daha kararlıdır.', tel:'Router’ın Wi-Fi’sine bağlı.'};
sema({id:'ag_topoloji', kat:'uydu', ikon:'🕸️', ad:'Ev / Ofis Ağ Topolojisi', ozet:'ONT → router → switch → cihazlar. Bir kabloyu çıkar: hangi cihazların bağlantısı gider?', etiket:['ağ','network','router','switch','poe','modem','ethernet','yıldız topoloji'],

  ozel:{ilk:() => ({sec:'rt', kop:{}}),

        h += oh(pts, id === 'tel' ? 'var(--cy)' : UTP, {g:3, kesik:kop || id === 'tel', akim:on[id] && id !== 'tel', op:kop ? 0.4 : 1});
        if(id !== 'tel'){ const mx = (pts[2][0] + pts[3][0]) / 2; h += `<g class="tik" data-b="k:${id}"><circle cx="${mx}" cy="${y + 20}" r="8" class="sv-ariza-btn${kop ? ' aktif' : ''}"/><text x="${mx}" y="${y + 23}" class="sv-y" text-anchor="middle" font-size="8">${kop ? '✕' : '⇄'}</text></g>`; } });
      AG.forEach(([id, ad, , x, y]) => { h += ob(x, y, 140, 40, ad, on[id] ? 'çevrimiçi' : 'BAĞLANTI YOK', id, st.sec === id ? 'sv-ozel-sec' : on[id] ? 'sv-ozel-aktif' : 'sv-ozel-kutu'); });

  bilgi:{
    nasil:'<p>Ev ve küçük ofis ağları <b>yıldız topolojidir</b>: her cihaz kendi kablosuyla switch’e bağlanır. Bir kablo arızası yalnız o cihazı etkiler; switch veya router arızası ise altındaki her şeyi keser. Kablolu bağlantılar Wi-Fi’ye göre daha hızlı ve kararlıdır.</p>',

function agOnline(st){ const on = {}; const bak = id => { if(on[id] != null) return on[id]; const a = AG.find(x => x[0] === id); return on[id] = !a[2] ? true : (!st.kop[id] && bak(a[2])); }; AG.forEach(a => bak(a[0])); return on; }

sema({id:'kamera', kat:'uydu', ikon:'📹', ad:'IP Kamera Sistemi · PoE Bütçesi', ozet:'Kameralar PoE’li NVR’dan tek kabloyla beslenir. Gece IR açılınca güç artar: bütçe aşılırsa kameralar yeniden başlar.', etiket:['ip kamera','nvr','poe','güvenlik kamerası','poe bütçesi','cctv','gece görüş'],
  w:680, h:380, minw:540,
  ozel:{ilk:() => ({n:6, gece:false, butce:60, uzun:false}),
    tikla:(st, b) => { if(b === 'n') st.n = st.n >= 8 ? 2 : st.n + 2; if(b === 'gece') st.gece = !st.gece; if(b === 'b') st.butce = st.butce === 60 ? 120 : 60; if(b === 'uzun') st.uzun = !st.uzun; },

      let h = ob(260, 150, 150, 70, `NVR 8 port PoE`, `bütçe ${st.butce} W`, 'b', 'sv-ozel-sec');
      for(let i = 0; i < 8; i++){ const sag = i >= 4, x = sag ? 520 : 40, y = 30 + (i % 4) * 80, var_ = i < st.n, calis = var_ && i < r.calisan && !(st.uzun && i === 0);
        if(!var_) continue;
        const k = i % 4 < 2 ? i % 4 : 3 - i % 4, vx = sag ? 440 + k * 12 : 230 - k * 12; h += oh([[sag ? 410 : 260, 165 + (i % 4) * 12], [vx, 165 + (i % 4) * 12], [vx, y + 22], [sag ? 520 : 160, y + 22]], UTP, {g:3, akim:calis, kesik:st.uzun && i === 0});
        h += ob(x, y, 120, 44, `📹 Kamera ${i + 1}`, calis ? `${r.w} W · kayıt ✓` : 'YENİDEN BAŞLIYOR', null, calis ? 'sv-ozel-aktif' : 'sv-ozel-kutu'); }
      h += sy(335, 240, 'PoE kullanımı', {s:9}) + obar(270, 248, 130, r.top / st.butce, r.top <= st.butce) + sy(335, 274, `${r.top} W / ${st.butce} W`, {s:9.5, c:'sv-k'});
      h += obtn(200, 20, 130, `Kamera sayısı: ${st.n}`, 'n') + obtn(340, 20, 130, st.gece ? '🌙 Gece (IR açık)' : '☀️ Gündüz', 'gece', st.gece) + obtn(240, 320, 200, st.uzun ? '✕ Kamera 1 hattı 130 m' : 'Kamera 1 hattı 60 m', 'uzun', st.uzun);
      return h; },
    durum:st => { const r = kamHesap(st); return [{ikon:'⚡', ad:'PoE bütçesi', durum:`${r.top} W kullanılıyor / ${st.butce} W` + (r.top > st.butce ? ' — AŞILDI: son bağlanan kameralar enerji alamıyor.' : ' — yeterli'), on:r.top <= st.butce, kotu:r.top > st.butce}].concat(st.uzun ? [{ikon:'📏', ad:'Kamera 1', durum:'Cat6’da 100 m sınırı aşıldı: görüntü kopar, PoE yetmez. PoE uzatıcı veya ara switch kullan.', kotu:true}] : []); }},
  bilgi:{
    nasil:'<p><b>PoE</b> (Power over Ethernet) kameraya veri kablosundan 48–57 V DC verir. Her port için standart sınır vardır (802.3af ≈ 15,4 W, 802.3at ≈ 30 W) ama NVR/switch’in <b>toplam PoE bütçesi</b> de sınırlıdır. Gece kızılötesi (IR) LED’ler açılınca kamera tüketimi belirgin artar: bütçe gündüze göre değil geceye göre hesaplanır.</p>',
    damar:[['NVR/switch → kamera','Cat6 (≤ 100 m), dış mekânda UV dayanımlı'], ['NVR','230 V, tercihen UPS’li']],
    malzeme:['PoE NVR veya NVR + PoE switch','IP kameralar','Dış mekân Cat6, buat ve su yalıtımlı bağlantı kutusu','UPS (kesintide kayıt devam etsin)'],
    adim:['Kamera başına gece tüketimini (datasheet “max”) topla, %20 pay bırak.','Kablo uçlarını su almayacak buatta sonlandır.','NVR’ı ve PoE switch’i UPS’e bağla.'],
    hata:['Bütçeyi gündüz tüketimine göre hesaplamak.','100 m’den uzun hat.','Dış mekânda iç tip kablo.'],
    test:['Gece tüm kameralar açıkken NVR PoE ekranında toplam gücü kontrol et.'],
    hesap:['ag','ups'], ilgili:['ag_topoloji','rj45']
  }
});
function kamHesap(st){ const w = st.gece ? 9 : 5; let top = 0, calisan = 0; for(let i = 0; i < st.n; i++){ if(top + w <= st.butce){ top += w; calisan++; } else { top += w; } } return {w, top:st.n * w, calisan}; }

/* H10 — Fiber (FTTH) ve ONT */
sema({id:'fiber_ont', kat:'uydu', ikon:'💡', ad:'Fiber İnternet (FTTH) · Kayıp Bütçesi', ozet:'Santralden gelen ışık, bölücü, ek ve konnektörlerde zayıflar. ONT’ye ulaşan güç −8 ile −27 dBm arasında olmalı.', etiket:['fiber','ftth','ont','gpon','dbm','fiber kayıp','bükülme','konnektör'],
  w:700, h:340, minw:560,
  ozel:{ilk:() => ({km:3, buk:false, kir:false}),
    tikla:(st, b) => { if(b === 'km') st.km = st.km === 1 ? 3 : st.km === 3 ? 8 : st.km === 8 ? 15 : 1; if(b === 'buk') st.buk = !st.buk; if(b === 'kir') st.kir = !st.kir; },
    ciz:st => { const r = fibHesap(st);
      let h = ob(20, 120, 100, 50, 'Santral (OLT)', '+3 dBm', null, 'sv-ozel-kutu') + oh([[120, 145], [190, 145]], FIBER, {g:3, akim:true}) + ob(190, 120, 90, 50, 'Bölücü 1:32', '−17 dB', null, 'sv-ozel-kutu');

      h += `<g class="tik" data-b="buk"><path d="M360 145 ${st.buk ? 'q20 -40 40 0' : 'L400 145'}" fill="none" stroke="${FIBER}" stroke-width="3"/><rect x="355" y="100" width="50" height="60" fill="transparent"/></g>` + sy(380, 180, st.buk ? 'BÜKÜLME ✕' : 'bina girişi', {s:9, c:st.buk ? 'sv-kirmizi' : ''});
      h += oh([[400, 145], [470, 145]], FIBER, {g:3, akim:r.p > -28}) + `<g class="tik" data-b="kir"><circle cx="470" cy="145" r="9" class="sv-ariza-btn${st.kir ? ' aktif' : ''}"/></g>` + sy(472, 128, st.kir ? 'kirli konnektör' : 'SC/APC', {s:9, a:'end', c:st.kir ? 'sv-kirmizi' : ''});
      h += ob(480, 115, 100, 60, 'ONT', r.p > -28 ? 'PON ● yeşil' : 'LOS ● KIRMIZI', null, r.ok ? 'sv-ozel-aktif' : 'sv-ozel-kutu') + oh([[580, 145], [620, 145]], UTP, {g:3, akim:r.p > -28}) + ob(620, 125, 64, 40, 'Router', '', null);
      h += sy(350, 230, `Alınan güç: ${r.p.toFixed(1).replace('.', ',')} dBm`, {s:12, c:'sv-k'}) + obar(250, 240, 200, (r.p + 32) / 26, r.ok) + sy(350, 266, '−27 dBm altı: kopma · −8 üstü: aşırı', {s:9});
      h += obtn(20, 290, 140, `Mesafe: ${st.km} km`, 'km') + obtn(170, 290, 170, st.buk ? '✕ Keskin bükülme var' : 'Bükülme yok', 'buk', st.buk) + obtn(350, 290, 190, st.kir ? '✕ Konnektör kirli' : 'Konnektör temiz', 'kir', st.kir);
      return h; },
    durum:st => { const r = fibHesap(st); return [{ikon:'💡', ad:'ONT', durum:`${r.p.toFixed(1).replace('.', ',')} dBm — ` + (r.ok ? (r.p < -24 ? 'çalışır ama sınırda' : 'iyi') : 'LOS: bağlantı yok/kopuk. Bükülme ve konnektörleri kontrol et.'), on:r.ok, kotu:!r.ok}]; }},
  bilgi:{
    nasil:'<p>FTTH’de santraldeki OLT ışık gönderir; pasif bölücüler sinyali onlarca aboneye dağıtır. Işık gücü <b>dBm</b> ile ölçülür ve kayıplar toplanır: fiber ≈ 0,35 dB/km (1310 nm), her konnektör ≈ 0,3–0,5 dB, her füzyon ek ≈ 0,1 dB, 1:32 bölücü ≈ 17 dB. Keskin bükülme ve kirli konnektör birkaç dB kaybettirerek hattı koparabilir.</p>',
    damar:[['Bina girişi → daire','tek modlu fiber (G.657 bükülmeye dayanıklı) drop kablo']],
    malzeme:['Fiber sonlandırma kutusu','SC/APC konnektörlü patch kablo','Optik güç ölçer, konnektör temizleme kalemi'],
    adim:['Fiberi en az 3 cm yarıçaptan keskin bükme.','Konnektörü takmadan önce temizle; kapakları açık bırakma.','ONT’deki güç değerini kurulumda kaydet.'],
    hata:['Kelepçeyle fiberi sıkıştırmak.','Gözle lazere bakmak (görünmez ışın).','APC (yeşil) ile UPC (mavi) konnektörü karıştırmak.'],
    test:['Optik güç ölçerle ONT girişinde dBm ölçümü.'],
    hesap:['fiber'], ilgili:['ag_topoloji']
  }

function fibHesap(st){ const p = 3 - 17 - st.km * 0.35 - 4 * 0.4 - 3 * 0.1 - (st.buk ? 12 : 0) - (st.kir ? 4 : 0); return {p, ok:p >= -27 && p <= -8}; }

/* J1 — Multimetre */
const MM_MOD = [['VAC', 'V~'], ['VDC', 'V⎓'], ['OHM', 'Ω'], ['BIP', '🔊'], ['A', 'A']];
const MM_HEDEF = [['LN', 'Priz L–N', 1], ['LPE', 'Priz L–⏚', 1], ['NPE', 'Priz N–⏚', 1], ['aku', 'Akü 12 V', 2], ['sigS', 'Sigorta (sökülü, sağlam)', 0], ['sigA', 'Sigorta (sökülü, atık)', 0], ['kab', 'Kablo damarı (kopuk)', 0]];
function mmOku(m, t){
  const H = MM_HEDEF.find(x => x[0] === t), canli = H[2] === 1, dc = H[2] === 2;
  if(m === 'A') return canli || dc ? ['KISA DEVRE!', 'Akım modunda prob gerilime değdi: ölçü aletinin sigortası atar, kalitesiz alette patlama/ark olur. Akım SERİ ölçülür; pratikte pens ampermetre kullan.', 'kotu'] : ['0.00 A', 'Bu devrede akım yok. Akım ölçmek için devreyi açıp aleti seri bağlamak gerekir.', ''];
  if(m === 'OHM' || m === 'BIP'){ if(canli) return ['⚠ — — —', 'Enerjili devrede direnç/süreklilik ölçülmez! Okuma anlamsızdır, alet zarar görebilir. Önce enerjiyi kes.', 'kotu']; if(dc) return ['hatalı', 'Akü gibi gerilim kaynağında direnç ölçülmez.', 'kotu'];
    if(t === 'sigS') return [m === 'BIP' ? '🔊 0.2 Ω' : '0.2 Ω', 'Süreklilik var: sigorta sağlam.', 'on']; return ['O.L', t === 'sigA' ? 'Sonsuz direnç: sigorta atık (kopuk).' : 'Sonsuz direnç: kablo kopuk. Uçları değiştirerek yerini daralt.', 'kotu']; }
  if(m === 'VAC'){ if(t === 'LN') return ['230.4 V', 'Normal şebeke gerilimi (207–253 V arası kabul edilir).', 'on']; if(t === 'LPE') return ['229.8 V', 'Faz–toprak ≈ faz–nötr: topraklama bağlı.', 'on']; if(t === 'NPE') return ['0.8 V', 'Nötr–toprak arası birkaç volttan az olmalı. Yüksekse nötr bağlantısı zayıf veya yük dengesiz.', 'on'];
    if(dc) return ['0.0 V', 'Yanlış mod: akü DC’dir, V⎓ seç.', 'kotu']; return ['0.0 V', 'Enerjisiz parça.', '']; }
  if(m === 'VDC'){ if(dc) return ['12.72 V', 'Tam dolu kurşun-asit akü ≈ 12,7 V; 12,0 V altı boş sayılır.', 'on']; if(canli) return ['≈ 0 V', 'Yanlış mod: şebeke AC’dir, V~ seç. (Bazı aletler AC’de DC modunda anlamsız değer gösterir.)', 'kotu']; return ['0.00 V', 'Enerjisiz parça.', '']; }
}

/* J3 — İzolasyon (megger) */
sema({id:'megger', kat:'olcum', ikon:'🧪', ad:'İzolasyon Direnci Ölçümü (Megger)', ozet:'500 V DC ile kablo damarları arası ve toprağa göre izolasyon ölçülür. Enerjisiz ve cihazlar sökülmüşken yapılır.', etiket:['megger','izolasyon','yalıtım direnci','500 v test','mω','nem'],
  w:640, h:380, minw:520,
  ozel:{ilk:() => ({ara:'LPE', nem:false, cihaz:false, test:false}),
    tikla:(st, b) => { if(!b) return; if(b.startsWith('a:')){ st.ara = b.slice(2); st.test = false; } if(b === 'nem'){ st.nem = !st.nem; st.test = false; } if(b === 'cihaz'){ st.cihaz = !st.cihaz; st.test = false; } if(b === 'test') st.test = true; },
    ciz:st => { const r = megOku(st);
      let h = oh([[300, 120], [600, 120]], 'var(--c-l1)', {g:6}) + oh([[300, 150], [600, 150]], 'var(--c-n)', {g:6}) + oh([[300, 180], [600, 180]], 'var(--c-pe)', {g:6}) + oh([[300, 180], [600, 180]], 'var(--c-pe2)', {g:6, kesik:true});
      h += sy(612, 124, 'L', {a:'start'}) + sy(612, 154, 'N', {a:'start'}) + sy(612, 184, 'PE', {a:'start'}) + (st.nem ? sy(450, 104, '💧 nemli buat / ezik kablo', {s:9.5, c:'sv-kirmizi'}) : '') + (st.cihaz ? ob(470, 200, 130, 40, '🧺 cihaz bağlı!', '', null, 'sv-ozel-sec') : '');
      h += `<rect x="40" y="90" width="180" height="200" rx="16" fill="#C62828"/><rect x="60" y="110" width="140" height="50" rx="6" class="sv-ekran"/><text x="130" y="142" class="sv-y sv-mono" text-anchor="middle" font-size="16">${st.test ? SVG_ESC(r[0]) : '---'}</text>` + sy(130, 186, 'İzolasyon test cihazı', {s:9.5}) + sy(130, 202, '500 V DC', {s:9.5});
      h += `<g class="tik" data-b="test"><circle cx="130" cy="245" r="24" class="sv-ozel-aktif"/><text x="130" y="249" class="sv-y sv-k" text-anchor="middle" font-size="10">TEST</text></g>`;
      const Y = {L:120, N:150, PE:180}, [a, b] = st.ara === 'LPE' ? ['L', 'PE'] : st.ara === 'NPE' ? ['N', 'PE'] : ['L', 'N'];
      h += oh([[220, 140], [260, 140], [260, Y[a]], [330, Y[a]]], 'var(--red)', {g:3}) + oh([[220, 240], [280, 240], [280, Y[b]], [360, Y[b]]], '#111', {g:3}) + `<circle cx="330" cy="${Y[a]}" r="5" fill="var(--red)"/><circle cx="360" cy="${Y[b]}" r="5" fill="#111" stroke="#888"/>`;
      h += obtn(20, 320, 100, 'L – PE', 'a:LPE', st.ara === 'LPE') + obtn(130, 320, 100, 'N – PE', 'a:NPE', st.ara === 'NPE') + obtn(240, 320, 100, 'L – N', 'a:LN', st.ara === 'LN') + obtn(360, 320, 120, st.nem ? '💧 nem var' : 'kablo kuru', 'nem', st.nem) + obtn(490, 320, 130, st.cihaz ? 'cihaz bağlı' : 'cihazlar sökülü', 'cihaz', st.cihaz);
      return h; },
    durum:st => { const r = megOku(st); return st.test ? [{ikon:'🧪', ad:'Sonuç: ' + r[0], durum:r[1], on:r[2], kotu:!r[2]}] : [{ikon:'🧪', ad:'Hazır', durum:'Ölçülecek iki noktayı seç ve TEST’e bas. Devre enerjisiz olmalı!'}]; }},
  bilgi:{
    nasil:'<p>İzolasyon ölçer kablo damarları arasına (ve toprağa göre) yüksek DC gerilim (konut tesisatında <b>500 V</b>) uygular ve sızan çok küçük akımdan direnci hesaplar. Yeni tesisatta yüzlerce MΩ okunur; yönetmeliğe göre en az <b>1 MΩ</b> (500 V testte) olmalıdır. Nem, ezik kablo, sıcaktan bozulmuş izolasyon değeri düşürür.</p>',
    malzeme:['İzolasyon test cihazı (megger) 250/500/1000 V'],
    adim:['Ana şalteri kapat, kilitle, enerji olmadığını ölç.','Lambaları, elektronik cihazları, parafudrları ve KAR’ın elektronik kısmını devreden ayır.','L–PE, N–PE, L–N ölç; sonuçları kaydet.','Testten sonra kabloyu deşarj et (cihaz otomatik yapar).'],
    hata:['Elektronik cihaz bağlıyken test: cihaz zarar görür, okuma da yanlış düşük çıkar.','Enerjili devrede test.'],
    test:['Değer düşükse linyeyi parçalara ayırarak (buat buat) arızalı bölümü bul.'],
    ilgili:['multimetre','toprak_olcum','pano_1f']
  }
});
function megOku(st){
  if(st.cihaz) return [st.ara === 'LN' ? '0.08 MΩ' : '45 MΩ', st.ara === 'LN' ? 'L–N arasında bağlı cihaz direnç gibi görünüyor: sonuç yanıltıcı ve 500 V cihaza zarar verebilir. Cihazları sök.' : 'Bağlı cihaz yüzünden değer yanıltıcı olabilir; cihaz da test geriliminden zarar görebilir.', false];
  if(st.nem && st.ara !== 'LN') return ['0.3 MΩ', '1 MΩ altında: izolasyon zayıf! Nemli buat/ezik kablo ara. Bu hatta KAR sık atar.', false];
  if(st.nem) return ['0.6 MΩ', 'Damarlar arası izolasyon zayıf: kablo hasarlı/nemli.', false];
  return ['>500 MΩ', 'Mükemmel: yeni tesisat değeri (en az 1 MΩ gerekir).', true];
}

      h += oh([[280, 120], [280, 160], [ex, 160], [ex, 200]], 'var(--c-pe)', {g:3}) + oh([[340, 120], [340, 175], [px, 175], [px, 200]], '#4F8DFF', {g:3}) + oh([[400, 120], [400, 150], [cx, 150], [cx, 200]], 'var(--red)', {g:3});

  bilgi:{
    nasil:'<p>Ölçer, E (topraklayıcı) ile C (akım kazığı) arasına akım verir ve E ile P (gerilim kazığı) arasındaki gerilimi ölçer. P, iki kazığın etki alanlarının dışında olmalıdır; homojen toprakta bu nokta E–C mesafesinin <b>%62</b>’sidir. Doğrulamak için P’yi biraz ileri-geri alırsın: değer pek değişmiyorsa ölçüm doğrudur.</p><p>Topraklayıcıyı ölçerken muayene kutusundaki bağlantı <b>sökülür</b> (yalnız kazık ölçülsün).</p>',

  }

function toprakOku(st){ const R0 = st.kazik === 2 ? 28 : 48; return st.p === 62 ? R0 : st.p > 62 ? R0 * 1.45 : R0 * 0.62; }
