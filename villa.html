<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gün Elektrik & Klima</title>
<style>
  html,body{margin:0;height:100%;background:#EEF1F5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#16181D;}
  #rapor{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#EEF1F5;}
  .kutu{max-width:420px;margin:18vh auto 0;padding:28px 24px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.08);text-align:center;}
  .kutu b{display:block;font-size:17px;margin-bottom:6px;}
  .kutu p{margin:0;font-size:14px;color:#5E6573;line-height:1.5;}
  .bant{height:6px;background:linear-gradient(90deg,#E8197A 0 50%,#00E5FF 50% 100%);border-radius:16px 16px 0 0;margin:-28px -24px 22px;}
</style>
</head>
<body>
<div class="kutu" id="durum"><div class="bant"></div><b>Yükleniyor…</b><p>Lütfen bekleyin.</p></div>
<iframe id="rapor" sandbox title="Rapor"></iframe>
<script>
// Bu sayfa yalnız iki iş yapar:
// 1) ?rapor=TOKEN → müşteriye gönderilen villa/otel raporunu gösterir (veritabanından yalnız o token'a ait tek rapor okunur).
// 2) Diğer her durumda ERP'deki Villa & Otel sayfasına yönlendirir.
(function(){
  var p=new URLSearchParams(location.search);var token=p.get('rapor');
  if(!token){location.replace('index.html?sayfa=villa');return;}
  var SB_URL='https://zfflnrerdevnflchscqe.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZmxucmVyZGV2bmZsY2hzY3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzQ3MjUsImV4cCI6MjA5NjQxMDcyNX0.uby8MidaKpnsceel5E_zTJm3LTYwoMrbKUryr5ZszcI';
  var en=(navigator.language||'').slice(0,2)!=='tr';
  function hata(){var d=document.getElementById('durum');d.innerHTML='<div class="bant"></div><b>'+(en?'Report not available':'Rapor bulunamadı')+'</b><p>'+(en?'This link may have expired or been removed. Please contact us for a new report.':'Bu bağlantının süresi dolmuş ya da kaldırılmış olabilir. Yeni rapor için bizimle iletişime geçin.')+'</p>';}
  fetch(SB_URL+'/rest/v1/rpc/villa_rapor_getir',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){var x=Array.isArray(d)?d[0]:null;if(!x||!x.icerik){hata();return;}
      var f=document.getElementById('rapor');f.srcdoc=x.icerik;f.style.display='block';document.getElementById('durum').style.display='none';
      var m=/<title>([^<]*)<\/title>/i.exec(x.icerik);if(m)document.title=m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
      if(x.dil)document.documentElement.lang=x.dil;})
    .catch(hata);
})();
</script>
